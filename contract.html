<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030912">
<title>DONWAY — 계약서 작성</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#030912;--bg2:#060f1f;--bg3:#0a1628;--blue:#0066ff;--cyan:#00d4ff;--green:#00ff88;--red:#ef4444;--yellow:#f59e0b;--gray:#5a7299;--white:#e8f4ff;--border:rgba(0,212,255,.12);--border2:rgba(0,102,255,.18)}
body{background:var(--bg);color:var(--white);font-family:-apple-system,'Malgun Gothic',sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px 100px}
.topbar{background:rgba(3,9,18,.97);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.logo{font-size:14px;font-weight:900;letter-spacing:3px;color:var(--white)}.logo span{color:var(--cyan)}
.tabs{display:flex;background:rgba(6,15,31,.8);border-bottom:1px solid var(--border);max-width:560px;margin:0 auto}
.tab{flex:1;padding:12px 0;border:none;background:transparent;color:var(--gray);font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}

/* Step cards */
.step{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:10px}
.step-title{font-size:10px;font-weight:800;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.step-title::before{content:'';width:12px;height:1.5px;background:var(--cyan);flex-shrink:0}

/* Type selector */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-btn{background:var(--bg3);border:1.5px solid var(--border2);border-radius:12px;padding:14px 8px;cursor:pointer;color:var(--gray);text-align:center;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.type-btn.on{border-color:var(--cyan);background:rgba(0,212,255,.1);color:var(--white)}
.type-icon{font-size:22px;line-height:1}
.type-name{font-size:13px;font-weight:800}
.type-desc{font-size:9px;color:var(--gray);line-height:1.4;text-align:center}
.type-btn.on .type-desc{color:rgba(0,212,255,.7)}

/* Sub-type chips */
.sub-chips{display:flex;gap:6px;margin-top:10px}
.sub-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--gray);font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
.sub-chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.08)}

/* Form fields */
.fg{margin-bottom:10px}
.fg:last-child{margin-bottom:0}
.fl{font-size:10px;font-weight:700;color:var(--gray);display:block;margin-bottom:5px;letter-spacing:.5px}
.fi{width:100%;padding:11px 13px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:10px;color:var(--white);font-size:13px;font-weight:600;outline:none;transition:.2s;-webkit-appearance:none}
.fi:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;font-weight:400;font-size:12px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Driver preview */
.drv-preview{margin-top:8px;padding:10px 13px;background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.15);border-radius:8px;font-size:12px;display:flex;align-items:center;gap:10px}
.drv-pname{font-weight:800;color:var(--white)}
.drv-pphone{color:var(--gray)}

/* Actions */
.action-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.btn-sign{width:100%;padding:15px;background:linear-gradient(135deg,#059669,#10b981);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.5px;transition:.2s}
.btn-sign:disabled{opacity:.5;cursor:not-allowed}
.btn-sign:not(:disabled):active{transform:scale(.98)}
.btn-print{width:100%;padding:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:12px;color:var(--bg);font-size:13px;font-weight:900;cursor:pointer;transition:.2s}
.btn-save{width:100%;padding:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--gray);font-size:11px;font-weight:700;cursor:pointer}
#esign-info{background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.2);border-radius:10px;padding:12px 14px;font-size:11px;color:var(--white);line-height:1.8;margin-bottom:8px;display:none}

/* Contract list */
.ctrc-card{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;margin-bottom:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
.ctrc-card:hover{border-color:rgba(0,212,255,.25)}
.ctrc-icon{font-size:26px;flex-shrink:0}
.ctrc-title{font-size:14px;font-weight:800}
.ctrc-sub{font-size:10px;color:var(--gray);margin-top:3px;line-height:1.7}
.ctrc-badge{padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;margin-left:auto;flex-shrink:0;white-space:nowrap}
.cb-active{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.2)}
.cb-end{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.cb-temp{background:rgba(245,158,11,.1);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}

/* Toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);color:var(--white);padding:10px 20px;border-radius:99px;font-size:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9999;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:14px;height:14px;border:2px solid rgba(0,212,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}

/* Bottom nav */
.bottombar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:rgba(6,15,31,.97);border-top:1px solid var(--border);display:flex;padding:8px 0;z-index:100}
.bot-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border:none;background:transparent;cursor:pointer;color:var(--gray);text-decoration:none}
.bot-btn.on{color:var(--cyan)}
.bot-icon{font-size:20px}.bot-lbl{font-size:9px;font-weight:700;letter-spacing:.5px}
</style>
</head>
<body>
<div id="toast"></div>

<div class="topbar">
  <div class="logo"><span>D</span>ONWAY 계약서</div>
  <button onclick="location.href='/portal'" style="padding:6px 11px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:8px;color:var(--cyan);font-size:11px;font-weight:700;cursor:pointer">🗂 보관함</button>
</div>
<div class="tabs">
  <button class="tab on" id="t-write" onclick="switchTab('write')">✏️ 계약 작성</button>
  <button class="tab" id="t-list" onclick="switchTab('list')">📋 계약 목록</button>
</div>

<div class="wrap">

<!-- ──────────── 작성 탭 ──────────── -->
<div id="tab-write">

  <!-- ① 계약 유형 -->
  <div class="step">
    <div class="step-title">① 계약 유형</div>
    <div class="type-grid">
      <button class="type-btn on" data-type="courier" onclick="setCType('courier',this)">
        <span class="type-icon">🏷</span>
        <span class="type-name">위·수탁</span>
        <span class="type-desc">택배기사<br>위수탁 계약</span>
      </button>
      <button class="type-btn" data-type="quickflex" onclick="setCType('quickflex',this)">
        <span class="type-icon">⚡</span>
        <span class="type-name">퀵플렉스</span>
        <span class="type-desc">쿠팡<br>QuickFlex</span>
      </button>
      <button class="type-btn" data-type="regular" onclick="setCType('regular',this)">
        <span class="type-icon">👔</span>
        <span class="type-name">근로계약</span>
        <span class="type-desc">일반·단시간<br>기간제</span>
      </button>
    </div>
    <!-- 근로계약 세분류 -->
    <div id="labor-subtype" style="display:none">
      <div class="sub-chips">
        <button class="sub-chip on" onclick="setSubType('regular',this)">일반근로</button>
        <button class="sub-chip" onclick="setSubType('parttime',this)">단시간</button>
        <button class="sub-chip" onclick="setSubType('fixed',this)">기간제</button>
      </div>
    </div>
  </div>

  <!-- ② 기사 정보 -->
  <div class="step">
    <div class="step-title">② 기사 정보</div>
    <div class="fg">
      <label class="fl">등록된 기사 선택 (자동 입력)</label>
      <select class="fi" id="drv-select" onchange="fillDriver()">
        <option value="">— 기사 선택 —</option>
      </select>
    </div>
    <div id="drv-preview" class="drv-preview" style="display:none">
      <span class="drv-pname" id="drv-pname"></span>
      <span class="drv-pphone" id="drv-pphone"></span>
    </div>
    <div class="row2" style="margin-top:10px">
      <div class="fg"><label class="fl">성명 *</label><input class="fi" id="c-name" placeholder="홍길동"></div>
      <div class="fg"><label class="fl">전화번호 *</label><input class="fi" id="c-phone" placeholder="010-0000-0000" type="tel"></div>
    </div>
  </div>

  <!-- ③ 계약 조건 -->
  <div class="step">
    <div class="step-title">③ 계약 조건</div>

    <!-- 계약 시작일 (공통) -->
    <div class="fg">
      <label class="fl">계약 시작일 *</label>
      <input class="fi" id="c-start" type="date">
    </div>

    <!-- 임금 형태 — 근로계약만 표시 -->
    <div id="paytype-row" style="display:none" class="fg">
      <label class="fl">임금 형태</label>
      <select class="fi" id="c-paytype">
        <option value="시급">시급</option>
        <option value="건당">건당</option>
        <option value="일급">일급</option>
        <option value="월급">월급</option>
      </select>
    </div>

    <!-- 단가/임금 + 구역/장소 (공통, 라벨만 변경) -->
    <div class="row2">
      <div class="fg"><label class="fl" id="pay-label">건당 단가 (원) *</label><input class="fi" id="c-pay" type="number" placeholder="880" style="font-family:monospace"></div>
      <div class="fg"><label class="fl" id="loc-label">담당 구역</label><input class="fi" id="c-loc" placeholder="해운대구 우동"></div>
    </div>

    <!-- 차량번호 — 위수탁/퀵플렉스만 -->
    <div id="vehicle-row" class="fg">
      <label class="fl">차량번호</label>
      <input class="fi" id="c-vehicle" placeholder="부산12가3456" style="font-family:monospace">
    </div>

    <!-- 계약 종료일 — 근로계약만 -->
    <div id="end-row" style="display:none" class="fg">
      <label class="fl">계약 종료일</label>
      <input class="fi" id="c-end" type="date">
    </div>

    <!-- 퀵플렉스 추가 필드 -->
    <div id="qf-extra-fields" style="display:none">
      <div class="row2">
        <div class="fg"><label class="fl">캠프명</label><input class="fi" id="c-camp" placeholder="부산1캠프"></div>
        <div class="fg"><label class="fl">라우트</label><input class="fi" id="c-route" placeholder="A-001" style="font-family:monospace"></div>
      </div>
      <div class="fg"><label class="fl">종사 자격증 번호</label><input class="fi" id="c-license-no" placeholder="제2026-00000호" style="font-family:monospace"></div>
    </div>

    <!-- 특약 (공통) -->
    <div class="fg" style="margin-top:2px">
      <label class="fl">특약 사항 <span style="font-weight:400;opacity:.5">(선택)</span></label>
      <textarea class="fi" id="c-special" rows="2" placeholder="예) 계약기간 중 일방적 해지 시 위약금 없음"></textarea>
    </div>
  </div>

  <!-- 액션 버튼 -->
  <div class="action-wrap">
    <button class="btn-sign" id="esign-btn" onclick="requestEsign()">📱 SMS 서명 요청</button>
    <button class="btn-print" onclick="printContract()">🖨 계약서 출력</button>
    <button class="btn-save" onclick="saveContract()">☁ 저장만</button>
  </div>
  <div id="esign-info"></div>

</div>

<!-- ──────────── 목록 탭 ──────────── -->
<div id="tab-list" style="display:none">
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button onclick="loadList()" style="padding:7px 14px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:8px;color:var(--cyan);font-size:11px;font-weight:700;cursor:pointer">🔄 새로고침</button>
  </div>
  <div id="contract-list">
    <div style="text-align:center;padding:32px;color:var(--gray)"><span class="spin"></span></div>
  </div>
</div>

</div><!-- /wrap -->

<div class="bottombar">
  <button class="bot-btn on"><span class="bot-icon">📝</span><span class="bot-lbl">계약서</span></button>
  <a href="/drivers" class="bot-btn"><span class="bot-icon">👥</span><span class="bot-lbl">직원관리</span></a>
  <a href="/portal" class="bot-btn"><span class="bot-icon">🗂</span><span class="bot-lbl">문서보관함</span></a>
  <a href="/dashboard" class="bot-btn"><span class="bot-icon">📊</span><span class="bot-lbl">대시보드</span></a>
</div>

<!-- 숨김 필드: _buildData / requestEsign 호환용 -->
<input type="hidden" id="c-birth">
<input type="hidden" id="c-addr">
<input type="hidden" id="c-job">
<input type="hidden" id="c-hours" value="8시간">
<input type="hidden" id="c-days" value="월~금">
<input type="hidden" id="c-break" value="60분">
<input type="hidden" id="c-payday" value="매월 25일">
<input type="hidden" id="c-paymethod" value="계좌이체">
<input type="hidden" id="c-payaccount">
<input type="hidden" id="c-agency-name" value="엠비티아이(유)">
<input type="hidden" id="c-agency-rep" value="김형우">
<input type="hidden" id="c-agency-bizno" value="373-86-02536">
<input type="hidden" id="c-agency-phone" value="051-711-3103">
<input type="hidden" id="c-agency-addr" value="부산시 수영구 수영로 668, 607호">
<input type="hidden" id="c-agency-account" value="하나은행 270-910019-24204 (유)엠비티아이">
<input type="hidden" id="c-return-fee" value="">
<input type="hidden" id="c-sort-work" value="미수행">
<input type="hidden" id="c-end-hidden">

<script>
var _db=null, _ctype='courier', _drivers=[], _curUid=null;
var CTYPE_LABEL={regular:'👔 근로계약',parttime:'⏰ 단시간 근로',fixed:'📅 기간제',dispatch:'🚚 위탁계약',courier:'🏷 위수탁',quickflex:'⚡ 퀵플렉스'};

(function init(){
  if(typeof firebase==='undefined'){setTimeout(init,300);return;}
  try{
    var app;try{app=firebase.app('ctrc');}catch(e){
      app=firebase.initializeApp({
        apiKey:'AIzaSyDQmEFfLczgCuPQidunbBXqaHWgs39VMg0',
        authDomain:'mbti-logistics.firebaseapp.com',
        projectId:'mbti-logistics',
        storageBucket:'mbti-logistics.firebasestorage.app',
        messagingSenderId:'40761160761',
        appId:'1:40761160761:web:20545b610f03f534e949e8'
      },'ctrc');
    }
    _db=app.firestore();
    var _authDone=false;
    app.auth().onAuthStateChanged(function(user){
      if(user){
        _authDone=true;
        _curUid=user.uid;
        loadDrivers();
      } else if(!_authDone){
        setTimeout(function(){
          if(!app.auth().currentUser) window.location.href='/settle';
        },1000);
      }
    });
  }catch(e){console.warn(e);}
})();

document.addEventListener('DOMContentLoaded',function(){
  var today=new Date().toISOString().slice(0,10);
  var si=document.getElementById('c-start');if(si)si.value=today;
  // 위수탁 기본 선택
  setCType('courier');
});

function switchTab(t){
  ['write','list'].forEach(function(x){
    document.getElementById('tab-'+x).style.display=x===t?'block':'none';
    document.getElementById('t-'+x).classList.toggle('on',x===t);
  });
  if(t==='list')loadList();
}

function setCType(type, clickedBtn){
  _ctype=type;
  var isLabor=(type==='regular'||type==='parttime'||type==='fixed');
  var isCourier=(type==='courier');
  var isQF=(type==='quickflex');
  var mainType=isLabor?'regular':type;

  // 타입 버튼 하이라이트
  document.querySelectorAll('.type-btn').forEach(function(btn){
    btn.classList.toggle('on', btn.dataset.type===mainType);
  });
  // 근로계약 세분류 표시
  var subDiv=document.getElementById('labor-subtype');
  if(subDiv)subDiv.style.display=isLabor?'block':'none';

  // 필드 표시 제어
  var vr=document.getElementById('vehicle-row');
  var qfe=document.getElementById('qf-extra-fields');
  var ptr=document.getElementById('paytype-row');
  var er=document.getElementById('end-row');

  if(vr)vr.style.display=(isCourier||isQF)?'block':'none';
  if(qfe)qfe.style.display=isQF?'block':'none';
  if(ptr)ptr.style.display=isLabor?'block':'none';
  if(er)er.style.display=isLabor?'block':'none';

  // 라벨 변경
  var payLabel=document.getElementById('pay-label');
  var locLabel=document.getElementById('loc-label');
  if(payLabel)payLabel.textContent=isLabor?'금액 (원) *':'건당 단가 (원) *';
  if(locLabel)locLabel.textContent=isLabor?'근무 장소':(isQF?'거점(캠프)':'담당 구역');

  // 단가 placeholder 변경
  var payInput=document.getElementById('c-pay');
  if(payInput)payInput.placeholder=isLabor?'10030':'880';
  var locInput=document.getElementById('c-loc');
  if(locInput)locInput.placeholder=isLabor?'부산 본사':'해운대구 우동';
}

function setSubType(type, el){
  _ctype=type;
  document.querySelectorAll('.sub-chip').forEach(function(c){c.classList.remove('on');});
  if(el)el.classList.add('on');
}

// 목록에서 불러올 때 호환성 유지
function setCTypeById(type){
  var mainType = (type==='parttime'||type==='fixed')?'regular':type;
  _ctype=type||'regular';
  document.querySelectorAll('.type-btn').forEach(function(btn){
    btn.classList.toggle('on', btn.dataset.type===mainType);
  });
  setCType(type);
}

function loadDrivers(){
  if(!_db)return;
  _db.collection('drivers').orderBy('name').limit(200).get().then(function(s){
    _drivers=s.docs.map(function(d){return Object.assign({docId:d.id},d.data());});
    var sel=document.getElementById('drv-select');
    _drivers.forEach(function(d){
      var o=document.createElement('option');
      o.value=d.docId;
      o.textContent=(d.name||'')+(d.camp||d.loc?' ('+( d.camp||d.loc)+')':'');
      sel.appendChild(o);
    });
  }).catch(function(){});
}

function fillDriver(){
  var id=(document.getElementById('drv-select')||{}).value;
  if(!id){
    var prev=document.getElementById('drv-preview');
    if(prev)prev.style.display='none';
    return;
  }
  var d=_drivers.find(function(x){return x.docId===id;});
  if(!d)return;
  var fmtPhone=function(p){return(p||'').replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');};
  setVal('c-name',d.name||'');
  setVal('c-phone',fmtPhone(d.phone||''));
  setVal('c-loc',d.camp||d.loc||'');
  setVal('c-vehicle',d.vehicle||'');

  var pname=document.getElementById('drv-pname');
  var pphone=document.getElementById('drv-pphone');

function setVal(id,v){var e=document.getElementById(id);if(e){if(e.tagName==='INPUT'||e.tagName==='TEXTAREA'){if(!e.value)e.value=v||'';}}}
function getVal(id){return(document.getElementById(id)||{value:''}).value||'';}
function getCheck(id){return(document.getElementById(id)||{checked:false}).checked;}

function _buildData(){
  return{
    ctype:_ctype, ctypeLabel:CTYPE_LABEL[_ctype]||'',
    name:getVal('c-name'), birth:getVal('c-birth'),
    addr:getVal('c-addr'), phone:getVal('c-phone'),
    startDate:getVal('c-start'), endDate:getVal('c-end'),
    loc:getVal('c-loc'), job:getVal('c-job'),
    hours:getVal('c-hours')||'8시간', days:getVal('c-days')||'월~금', breakTime:getVal('c-break')||'60분',
    payType:getVal('c-paytype')||'건당', pay:getVal('c-pay'),
    payDay:getVal('c-payday')||'매월 25일', payMethod:getVal('c-paymethod')||'계좌이체',
    payAccount:getVal('c-payaccount'),
    ins4:false, insEmp:true, insAcc:true, insHealth:false, insPension:false,
    special:getVal('c-special'),
    createdAt:new Date().toISOString()
  };
}

function saveContract(){
  var d=_buildData();
  if(!d.name){toast('근로자 성명을 입력하세요','err');return;}
  if(!d.startDate){toast('계약 시작일을 입력하세요','err');return;}
  if(!_db){toast('연결 오류','err');return;}
  _db.collection('contracts').add(Object.assign(d,{
    type:'contract',status:'유효',
    docNo:'C-'+Date.now().toString().slice(-6),
    dealerId:_curUid||''
  })).then(function(){toast('✅ 계약서 저장 완료','ok');})
    .catch(function(e){toast('❌ '+e.message,'err');});
}

function printContract(){
  if(_ctype==='courier'){_printCourier();return;}
  if(_ctype==='quickflex'){_printQuickflex();return;}
  _printLabor();
}

  if(!_db)return;
  _db.collection('contracts').where('dealerId','==',_curUid||'').orderBy('createdAt','desc').limit(100).get()
    .then(function(s){
      if(s.empty){el.innerHTML='<div style="text-align:center;padding:32px;color:var(--gray)">📭 저장된 계약서 없음</div>';return;}
      el.innerHTML=s.docs.map(function(d){
        var r=Object.assign({id:d.id},d.data());
        var status=r.status||'유효';
        var bCls=status==='유효'?'cb-active':status==='만료'?'cb-end':'cb-temp';
        var isExpired=r.endDate&&new Date(r.endDate)<new Date();
        if(isExpired&&status==='유효')bCls='cb-end';
        var icon=r.ctype==='courier'?'🏷':r.ctype==='quickflex'?'⚡':r.ctype==='dispatch'?'🚚':r.ctype==='fixed'?'📅':r.ctype==='parttime'?'⏰':'👔';
        return '<div class="ctrc-card" onclick="reprinkContract(\''+esc(r.id)+'\')">'
          +'<div class="ctrc-icon">'+icon+'</div>'
          +'<div style="flex:1;min-width:0">'
          +'<div class="ctrc-title">'+esc(r.name||'')+'</div>'
          +'<div class="ctrc-sub">'+esc(r.ctypeLabel||r.ctype||'')+' · '+esc(r.loc||'')+' · '+esc(r.startDate||'')+'</div></div>'
          +'<span class="ctrc-badge '+bCls+'">'+(isExpired&&status==='유효'?'만료됨':status)+'</span>'
          +'</div>';
      }).join('');
    }).catch(function(e){el.innerHTML='<div style="padding:16px;color:var(--gray)">오류: '+esc(e.message)+'</div>';});
}

function reprinkContract(id){
  if(!_db)return;
  _db.collection('contracts').doc(id).get().then(function(d){
    if(!d.exists)return;
    var r=d.data();
    setCTypeById(r.ctype||'regular');
    var map={name:'c-name',birth:'c-birth',addr:'c-addr',phone:'c-phone',startDate:'c-start',endDate:'c-end',loc:'c-loc',job:'c-job',hours:'c-hours',days:'c-days',breakTime:'c-break',pay:'c-pay',payDay:'c-payday',payMethod:'c-paymethod',payAccount:'c-payaccount',special:'c-special',vehicle:'c-vehicle',camp:'c-camp',route:'c-route',licenseNo:'c-license-no'};
    Object.keys(map).forEach(function(k){var el=document.getElementById(map[k]);if(el)el.value=r[k]||'';});
    if(r.payType){var pt=document.getElementById('c-paytype');if(pt)pt.value=r.payType;}
    switchTab('write');
    toast('✅ 계약서 불러오기 완료','ok');
  });
}

// ── 전자서명 요청 ──
function requestEsign(){
  var d=_buildData();
  if(!d.name){toast('기사 성명을 입력하세요','err');return;}
  if(!d.phone){toast('전화번호를 입력하세요 (OTP SMS 발송됩니다)','err');return;}
  if(!d.startDate){toast('계약 시작일을 입력하세요','err');return;}
  if(!d.pay){toast('단가/임금을 입력하세요','err');return;}
  var btn=document.getElementById('esign-btn');
  btn.disabled=true;btn.textContent='발송 중...';
  fetch('/api/contract/otp',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      ctype:_ctype,name:d.name,phone:d.phone,
      startDate:d.startDate,endDate:d.endDate||'',
      loc:d.loc||'',pay:d.pay,payDay:d.payDay||'',payType:d.payType||'건당',
      vehicle:getVal('c-vehicle'),special:d.special||'',
      agencyName:getVal('c-agency-name'),
      agencyRep:getVal('c-agency-rep'),
      agencyBizno:getVal('c-agency-bizno'),
      agencyPhone:getVal('c-agency-phone'),
      agencyAddr:getVal('c-agency-addr'),
      agencyAccount:getVal('c-agency-account'),
      camp:getVal('c-camp'),route:getVal('c-route'),
      returnFee:getVal('c-return-fee'),
      licenseNo:getVal('c-license-no'),
      sortWork:getVal('c-sort-work')||'미수행'
    })
  })
    .then(function(r){return r.json();})
    .then(function(data){
      btn.disabled=false;btn.textContent='📱 SMS 서명 요청';
      if(data.ok){
        toast('✅ OTP SMS 발송 → '+d.phone,'ok');
        var info=document.getElementById('esign-info');
        if(info){
          info.style.display='block';
          info.innerHTML='<strong style="color:var(--green)">전자서명 링크 발송 완료</strong><br>'
            +'계약 ID: <span style="font-family:monospace;color:var(--cyan)">'+esc(data.contractId||'')+'</span><br>'
            +'<a href="'+esc(data.signUrl||'')+'" target="_blank" style="color:var(--cyan)">서명 링크 열기</a>';
        }
      } else {
        toast('❌ '+(data.error||'발송 실패'),'err');
      }
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='📱 SMS 서명 요청';
      toast('❌ '+e.message,'err');
    });
}

function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='show'+(type?' '+type:'');clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},3500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
