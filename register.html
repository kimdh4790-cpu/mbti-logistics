<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>회사 등록 · MBTICO</title>
<link rel="icon" type="image/png" sizes="192x192" href="/mbti-icon-192.png?v=4">
<link rel="apple-touch-icon" sizes="192x192" href="/mbti-icon-192.png?v=4">
<link rel="manifest" href="/mbtico-manifest.json">
<meta name="theme-color" content="#08101f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MBTICO">
<link rel="preconnect" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#08101f;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:24px;font-weight:900;color:#c9a84c;letter-spacing:-0.5px}
.logo p{font-size:13px;color:#64748b;margin-top:6px}
.card{background:#0d1b3e;border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:28px}
.card h2{font-size:16px;font-weight:700;margin-bottom:22px;text-align:center;color:#e2e8f0}
.field{margin-bottom:16px}
.field label{font-size:12px;color:#94a3b8;display:block;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 16px;background:#132035;border:1px solid rgba(201,168,76,.15);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.field input:focus{border-color:#c9a84c}
.field input::placeholder{color:#3d5070}
.divider{border:none;border-top:1px solid rgba(255,255,255,.06);margin:20px 0}
.svc-label{font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:10px}
.svc-cards{display:flex;flex-direction:column;gap:8px}
.svc-card{padding:14px 16px;background:#132035;border:1.5px solid rgba(255,255,255,.07);border-radius:12px;cursor:pointer;transition:.2s;user-select:none}
.svc-card:hover{border-color:rgba(201,168,76,.3)}
.svc-card.on{border-color:#c9a84c;background:rgba(201,168,76,.07)}
.svc-card-top{display:flex;align-items:center;gap:10px}
.svc-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);flex-shrink:0;transition:.2s}
.svc-card.on .svc-dot{border-color:#c9a84c;background:#c9a84c}
.svc-title{font-size:14px;font-weight:700;color:#e2e8f0}
.svc-desc{font-size:12px;color:#64748b;margin-top:4px;margin-left:26px}
.client-list{margin-top:12px;display:none;flex-direction:column;gap:6px}
.client-list.show{display:flex}
.client-chip{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#0d1b3e;border:1.5px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;transition:.2s;user-select:none}
.client-chip:hover{border-color:rgba(201,168,76,.3)}
.client-chip.on{border-color:#c9a84c;background:rgba(201,168,76,.07)}
.chip-check{width:16px;height:16px;border-radius:4px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;transition:.2s;display:flex;align-items:center;justify-content:center}
.client-chip.on .chip-check{border-color:#c9a84c;background:#c9a84c}
.chip-check svg{display:none}
.client-chip.on .chip-check svg{display:block}
.chip-info{flex:1}
.chip-name{font-size:13px;font-weight:700;color:#e2e8f0}
.chip-desc{font-size:11px;color:#64748b;margin-top:2px}
.chip-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;flex-shrink:0}
.chip-badge.ready{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.chip-badge.new{background:rgba(201,168,76,.1);color:#c9a84c;border:1px solid rgba(201,168,76,.2)}
.clients-loading{font-size:12px;color:#3d5070;text-align:center;padding:14px}
.btn{width:100%;padding:15px;background:#c9a84c;color:#08101f;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-top:20px;font-family:inherit;transition:.2s}
.btn:hover{background:#d4b86a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#f87171;margin-bottom:14px;display:none;line-height:1.5}
.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#4ade80;margin-bottom:14px;display:none;line-height:1.5;white-space:pre-wrap}
.login-link{text-align:center;font-size:13px;color:#64748b;margin-top:18px}
.login-link a{color:#c9a84c;text-decoration:none}
.copy-btn{width:100%;padding:11px;background:#132035;color:#c9a84c;border:1px solid rgba(201,168,76,.3);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <h1>MBTICO</h1>
    <p>기업 전용 배송 자동화 플랫폼</p>
  </div>

  <div class="card">
    <h2>회사 등록</h2>

    <div id="err-box" class="err"></div>
    <div id="ok-box" class="ok"></div>

    <div class="field">
      <label>회사명 (상호) *</label>
      <input id="r-company" type="text" placeholder="예: ○○물류, ○○유통" autocomplete="organization">
    </div>
    <div class="field">
      <label>이메일 (로그인 ID) *</label>
      <input id="r-email" type="email" placeholder="company@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>비밀번호 * (8자 이상)</label>
      <input id="r-pw" type="password" placeholder="비밀번호 입력" autocomplete="new-password">
    </div>
    <div class="field">
      <label>비밀번호 확인 *</label>
      <input id="r-pw2" type="password" placeholder="비밀번호 재입력" autocomplete="new-password">
    </div>
    <div class="field">
      <label>연락처</label>
      <input id="r-phone" type="tel" placeholder="010-0000-0000" autocomplete="tel">
    </div>

    <hr class="divider">

    <div class="svc-label">서비스 유형 *</div>
    <div class="svc-cards">
      <div class="svc-card" id="svc-new" onclick="_selSvc('new')">
        <div class="svc-card-top">
          <div class="svc-dot"></div>
          <div class="svc-title">신규 앱 제작 요청</div>
        </div>
        <div class="svc-desc">MBTICO 팀이 맞춤형 배송 시스템을 새로 구축합니다</div>
      </div>
      <div class="svc-card" id="svc-exist" onclick="_selSvc('exist')">
        <div class="svc-card-top">
          <div class="svc-dot"></div>
          <div class="svc-title">기존 배송처 선택</div>
        </div>
        <div class="svc-desc">이미 운영 중인 배송처를 선택해 즉시 사용합니다</div>
        <div class="client-list" id="client-list">
          <div class="clients-loading" id="clients-loading">배송처 목록 불러오는 중...</div>
        </div>
      </div>
    </div>

    <button id="reg-btn" class="btn" onclick="_doRegister()">등록 신청</button>
  </div>

  <div class="login-link">이미 계정이 있으신가요? <a href="https://mbtico.kr/mbtico_hub">로그인</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDQmEFfLczgCuPQidunbBXqaHWgs39VMg0",
  authDomain:"mbti-logistics.firebaseapp.com",
  projectId:"mbti-logistics",
  storageBucket:"mbti-logistics.firebasestorage.app",
  messagingSenderId:"40761160761",
  appId:"1:40761160761:web:20545b610f03f534e949e8"
});
var _db=firebase.firestore();
_db.settings({experimentalAutoDetectLongPolling:true,merge:true});
var _auth=firebase.auth();

var _svcType='';
var _selClients=[];
var _availClients=[];

function _showErr(msg){var e=document.getElementById('err-box');e.textContent=msg;e.style.display='block';document.getElementById('ok-box').style.display='none';}
function _showOk(msg){var e=document.getElementById('ok-box');e.textContent=msg;e.style.display='block';document.getElementById('err-box').style.display='none';}
function _hide(){document.getElementById('err-box').style.display='none';document.getElementById('ok-box').style.display='none';}

function _selSvc(type){
  _svcType=type;
  document.getElementById('svc-new').classList.toggle('on', type==='new');
  document.getElementById('svc-exist').classList.toggle('on', type==='exist');
  var list=document.getElementById('client-list');
  if(type==='exist'){
    list.classList.add('show');
    if(!_availClients.length) _loadClients();
  } else {
    list.classList.remove('show');
  }
}

async function _loadClients(){
  try{
    var r=await fetch('/api/available-clients');
    var d=await r.json();
    _availClients=d.clients||[];
  }catch(e){ _availClients=[]; }
  _renderClients();
}

function _renderClients(){
  var list=document.getElementById('client-list');
  document.getElementById('clients-loading').style.display='none';
  if(!_availClients.length){
    var el=document.createElement('div');
    el.className='clients-loading';
    el.textContent='등록된 배송처가 없습니다';
    list.appendChild(el);
    return;
  }
  _availClients.forEach(function(c){
    var chip=document.createElement('div');
    chip.className='client-chip';
    chip.dataset.id=c.id;
    chip.innerHTML=
      '<div class="chip-check"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><polyline points="1 4 4 7 9 1" stroke="#08101f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
      '<div class="chip-info"><div class="chip-name">'+_esc(c.name)+'</div><div class="chip-desc">'+_esc(c.desc||'')+'</div></div>'+
      '<span class="chip-badge ready">즉시 사용</span>';
    chip.addEventListener('click',function(){
      var id=this.dataset.id;
      var idx=_selClients.indexOf(id);
      if(idx>=0){_selClients.splice(idx,1);this.classList.remove('on');}
      else{_selClients.push(id);this.classList.add('on');}
    });
    list.appendChild(chip);
  });
}

function _esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function _doRegister(){
  _hide();
  var company=document.getElementById('r-company').value.trim();
  var email=document.getElementById('r-email').value.trim().toLowerCase();
  var pw=document.getElementById('r-pw').value;
  var pw2=document.getElementById('r-pw2').value;
  var phone=document.getElementById('r-phone').value.trim();

  if(!company||!email||!pw){_showErr('회사명, 이메일, 비밀번호는 필수입니다');return;}
  if(pw.length<8){_showErr('비밀번호는 8자 이상이어야 합니다');return;}
  if(pw!==pw2){_showErr('비밀번호가 일치하지 않습니다');return;}
  if(!_svcType){_showErr('서비스 유형을 선택해 주세요');return;}
  if(_svcType==='exist'&&!_selClients.length){_showErr('배송처를 하나 이상 선택해 주세요');return;}

  var btn=document.getElementById('reg-btn');
  btn.disabled=true;btn.textContent='등록 중...';

  var now=new Date();
  var trialEnd=new Date(now.getTime()+1*24*60*60*1000);
  var companyCode=Math.random().toString(36).slice(2,8).toUpperCase();
  var companySlug=company.replace(/[^a-zA-Z0-9가-힣\-_]/g,'').slice(0,20);
  var emailPrefix=email.split('@')[0].replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
  var baseSlug=companySlug||emailPrefix||'co';

  _auth.createUserWithEmailAndPassword(email,pw)
  .then(function(cred){
    var uid=cred.user.uid;
    var companyDoc={
      companyName:company,name:company,email:email,phone:phone,
      plan:'trial',services:['mbtico'],industry:'',
      companyCode:companyCode,
      slug:baseSlug,
      svcType:_svcType,
      selectedClients:_svcType==='exist'?_selClients:[],
      trialStart:now.toISOString().slice(0,10),
      trialEnd:trialEnd.toISOString().slice(0,10),
      trialUsed:true,trialEndISO:trialEnd.toISOString(),
      subscriptions:{mbtico:{active:true,plan:'trial',expiry:trialEnd.toISOString().slice(0,10),expiryISO:trialEnd.toISOString(),modules:['scan','label','checkin','emergency','delivery','app']}},
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      uid:uid,dealerId:uid,
      settlePaid:false,inventoryPaid:false,qrPaid:false,kioskPaid:false,
      registeredFrom:'register.html',
      appUrl:'https://mbtico.kr/hub'
    };
    var batch=_db.batch();
    batch.set(_db.collection('companies').doc(uid),companyDoc);
    batch.set(_db.collection('users').doc(uid),{uid:uid,email:email,name:company,companyName:company,role:'dealer',dealerId:uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    return batch.commit().then(function(){
      var _adminPw=Math.random().toString(36).slice(2,8).toUpperCase();
      return _db.collection('companies').doc(uid).collection('settings').doc('adminInfo').set({
        userId:emailPrefix||uid.slice(0,8),pwPlain:_adminPw,
        name:company,email:email,dealerId:uid,
        createdAt:new Date().toISOString()
      }).then(function(){return uid;});
    });
  })
  .then(function(uid){
    fetch('/sa/notify-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'신규 회사 등록 ('+(_svcType==='new'?'신규제작':'기존:'+_selClients.join(','))+')',body:company+' · '+email,type:'join'})}).catch(function(){});
    var slug2=baseSlug;
    var tok;
    return _auth.currentUser.getIdToken()
    .then(function(t){
      tok=t;
      return fetch('/api/company-slug',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({uid:uid,slug:slug2,companyName:company})});
    })
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok)throw new Error('회사 슬러그 등록 실패: '+(d.error||''));
      if(_svcType==='exist'&&_selClients.length){
        var jobs=_selClients.map(function(cid){
          var meta=_availClients.find(function(a){return a.id===cid;})||{};
          return fetch('/api/add-client',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({clientSlug:cid,clientName:meta.name||cid,zones:meta.zones||[]})})
            .then(function(r){return r.json();})
            .then(function(d){if(!d.ok)throw new Error('배송처 추가 실패 ('+cid+'): '+(d.error||''));});
        });
        return Promise.all(jobs);
      }
    })
    .then(function(){
      var lines=['등록 완료!',''];
      if(_svcType==='new'){
        lines.push('신규 앱 제작 요청이 접수되었습니다.');
        lines.push('담당자가 확인 후 연락드립니다.');
        lines.push('');
        lines.push('고객사 관리: https://mbtico.kr/clients');
      } else {
        lines.push('선택하신 배송처로 즉시 사용 가능합니다.');
        lines.push('');
        _selClients.forEach(function(cid){
          lines.push('· '+cid+' 기사 가입 링크:');
          lines.push('  https://mbtico.kr/'+slug2+'/'+cid);
        });
        lines.push('');
        lines.push('고객사 추가/관리: https://mbtico.kr/clients');
      }
      _showOk(lines.join('\n'));
      var okBox=document.getElementById('ok-box');
      var copyBtn=document.createElement('button');
      copyBtn.className='copy-btn';
      copyBtn.textContent='관리 페이지 주소 복사';
      copyBtn.onclick=function(){navigator.clipboard.writeText('https://mbtico.kr/clients').then(function(){copyBtn.textContent='복사됨!';});};
      okBox.appendChild(copyBtn);
      btn.textContent='등록 완료';
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='등록 신청';
      _showErr('설정 중 오류: '+e.message);
    });
  })
  .catch(function(e){
    btn.disabled=false;btn.textContent='등록 신청';
    if(e.code==='auth/email-already-in-use'){
      var errBox=document.getElementById('err-box');
      errBox.innerHTML='이미 가입된 이메일입니다.<br>'+
        '<span style="font-size:12px;color:#94a3b8;line-height:1.6">기존 계정의 비밀번호를 입력하면 회사 정보가 추가됩니다.</span><br><br>'+
        '<input id="r-exist-pw" type="password" placeholder="기존 계정 비밀번호" autocomplete="current-password" '+
        'style="width:100%;padding:11px 13px;background:#132035;border:1px solid rgba(201,168,76,.3);border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;font-family:inherit;margin-bottom:10px;display:block">'+
        '<button onclick="_loginAndRegister()" style="width:100%;padding:11px 16px;background:#c9a84c;color:#08101f;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit">기존 계정으로 이어서 등록</button>';
      errBox.style.display='block';
      document.getElementById('ok-box').style.display='none';
      setTimeout(function(){var el=document.getElementById('r-exist-pw');if(el)el.focus();},100);
    }
    else if(e.code==='auth/weak-password'){_showErr('비밀번호가 너무 간단합니다.');}
    else{_showErr('오류: '+e.message);}
  });
}

function _loginAndRegister(){
  var company=document.getElementById('r-company').value.trim();
  var email=document.getElementById('r-email').value.trim().toLowerCase();
  var existPwEl=document.getElementById('r-exist-pw');
  var pw=existPwEl&&existPwEl.value?existPwEl.value:document.getElementById('r-pw').value;
  var phone=document.getElementById('r-phone').value.trim();
  var companySlug2=company.replace(/[^a-zA-Z0-9가-힣\-_]/g,'').slice(0,20);
  var emailPrefix2=email.split('@')[0].replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
  var baseSlug2=companySlug2||emailPrefix2||'co';
  var btn=document.getElementById('reg-btn');
  btn.disabled=true;btn.textContent='로그인 중...';
  _hide();
  _auth.signInWithEmailAndPassword(email,pw)
  .then(function(cred){
    var uid=cred.user.uid;
    var now=new Date();
    var trialEnd=new Date(now.getTime()+1*24*60*60*1000);
    var companyCode=Math.random().toString(36).slice(2,8).toUpperCase();
    var companyDoc={
      companyName:company,name:company,email:email,phone:phone,
      plan:'trial',services:['mbtico'],industry:'',
      companyCode:companyCode,
      slug:baseSlug2,
      svcType:_svcType,
      selectedClients:_svcType==='exist'?_selClients:[],
      trialStart:now.toISOString().slice(0,10),
      trialEnd:trialEnd.toISOString().slice(0,10),
      trialUsed:true,trialEndISO:trialEnd.toISOString(),
      subscriptions:{mbtico:{active:true,plan:'trial',expiry:trialEnd.toISOString().slice(0,10),expiryISO:trialEnd.toISOString(),modules:['scan','label','checkin','emergency','delivery','app']}},
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      uid:uid,dealerId:uid,
      settlePaid:false,inventoryPaid:false,qrPaid:false,kioskPaid:false,
      registeredFrom:'register.html',
      appUrl:'https://mbtico.kr/hub'
    };
    var batch=_db.batch();
    batch.set(_db.collection('companies').doc(uid),companyDoc,{merge:true});
    batch.set(_db.collection('users').doc(uid),{uid:uid,email:email,name:company,companyName:company,role:'dealer',dealerId:uid},{merge:true});
    return batch.commit().then(function(){return uid;});
  })
  .then(function(uid){
    var slug2=baseSlug2;
    var tok;
    return _auth.currentUser.getIdToken()
    .then(function(t){
      tok=t;
      return fetch('/api/company-slug',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({uid:uid,slug:slug2,companyName:company})});
    })
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok)throw new Error('회사 슬러그 등록 실패: '+(d.error||''));
      if(_svcType==='exist'&&_selClients.length){
        return Promise.all(_selClients.map(function(cid){
          var meta=_availClients.find(function(a){return a.id===cid;})||{};
          return fetch('/api/add-client',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({clientSlug:cid,clientName:meta.name||cid,zones:meta.zones||[]})})
            .then(function(r){return r.json();})
            .then(function(d){if(!d.ok)throw new Error('배송처 추가 실패 ('+cid+'): '+(d.error||''));});
        }));
      }
    })
    .then(function(){
      fetch('/sa/notify-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'회사 등록 (기존계정)',body:company+' · '+email,type:'join'})}).catch(function(){});
      var lines=['등록 완료!',''];
      if(_svcType==='new'){
        lines.push('신규 앱 제작 요청이 접수되었습니다.');
        lines.push('고객사 관리: https://mbtico.kr/clients');
      } else {
        lines.push('선택하신 배송처가 즉시 사용 가능합니다.');lines.push('');
        _selClients.forEach(function(cid){
          lines.push('· '+cid+': https://mbtico.kr/'+slug2+'/'+cid);
        });
        lines.push('');lines.push('고객사 관리: https://mbtico.kr/clients');
      }
      _showOk(lines.join('\n'));
      var okBox=document.getElementById('ok-box');
      var copyBtn=document.createElement('button');
      copyBtn.className='copy-btn';copyBtn.textContent='관리 페이지 주소 복사';
      copyBtn.onclick=function(){navigator.clipboard.writeText('https://mbtico.kr/clients').then(function(){copyBtn.textContent='복사됨!';});};
      okBox.appendChild(copyBtn);
      btn.textContent='등록 완료';
    });
  })
  .catch(function(e){
    btn.disabled=false;btn.textContent='등록 신청';
    if(e.code==='auth/invalid-login-credentials'||e.code==='auth/wrong-password'){
      _showErr('비밀번호가 틀렸습니다. 기존 계정의 비밀번호를 다시 확인해주세요.');
    } else if(e.code){
      _showErr('로그인 실패: '+e.message);
    } else {
      _showErr(e.message||'등록 중 오류가 발생했습니다.');
    }
  });
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName!=='BUTTON')_doRegister();});
</script>
</body>
</html>
