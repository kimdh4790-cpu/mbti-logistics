<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>회사 등록 · MBTICO</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#08101f;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:24px;font-weight:900;color:#c9a84c;letter-spacing:-0.5px}
.logo p{font-size:13px;color:#64748b;margin-top:6px}
.card{background:#0d1b3e;border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:28px}
.card h2{font-size:16px;font-weight:700;margin-bottom:22px;text-align:center;color:#e2e8f0}
.field{margin-bottom:16px}
.field label{font-size:12px;color:#94a3b8;display:block;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 16px;background:#132035;border:1px solid rgba(201,168,76,.15);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.field input:focus{border-color:#c9a84c}
.field input::placeholder{color:#3d5070}
.btn{width:100%;padding:15px;background:#c9a84c;color:#08101f;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;font-family:inherit;transition:.2s}
.btn:hover{background:#d4b86a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#f87171;margin-bottom:14px;display:none;line-height:1.5}
.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#4ade80;margin-bottom:14px;display:none;line-height:1.5;white-space:pre-wrap}
.login-link{text-align:center;font-size:13px;color:#64748b;margin-top:18px}
.login-link a{color:#c9a84c;text-decoration:none}
.copy-btn{width:100%;padding:11px;background:#132035;color:#c9a84c;border:1px solid rgba(201,168,76,.3);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <h1>MBTICO</h1>
    <p>기업 전용 업무 자동화 플랫폼</p>
  </div>

  <div class="card">
    <h2>회사 등록</h2>

    <div id="err-box" class="err"></div>
    <div id="ok-box" class="ok"></div>

    <div class="field">
      <label>회사명 (상호) *</label>
      <input id="r-company" type="text" placeholder="예: ○○물류, ○○유통" autocomplete="organization">
    </div>
    <div class="field">
      <label>이메일 (로그인 ID) *</label>
      <input id="r-email" type="email" placeholder="company@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>비밀번호 * (8자 이상)</label>
      <input id="r-pw" type="password" placeholder="비밀번호 입력" autocomplete="new-password">
    </div>
    <div class="field">
      <label>비밀번호 확인 *</label>
      <input id="r-pw2" type="password" placeholder="비밀번호 재입력" autocomplete="new-password">
    </div>
    <div class="field">
      <label>연락처</label>
      <input id="r-phone" type="tel" placeholder="010-0000-0000" autocomplete="tel">
    </div>

    <button id="reg-btn" class="btn" onclick="_doRegister()">등록 신청</button>
  </div>

  <div class="login-link">이미 계정이 있으신가요? <a href="https://donway.ai.kr/settle">로그인</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDQmEFfLczgCuPQidunbBXqaHWgs39VMg0",
  authDomain: "mbti-logistics.firebaseapp.com",
  projectId: "mbti-logistics",
  storageBucket: "mbti-logistics.firebasestorage.app",
  messagingSenderId: "40761160761",
  appId: "1:40761160761:web:20545b610f03f534e949e8"
});
var _db = firebase.firestore();
_db.settings({experimentalAutoDetectLongPolling:true,merge:true});
var _auth = firebase.auth();

function _showErr(msg){var e=document.getElementById('err-box');e.textContent=msg;e.style.display='block';document.getElementById('ok-box').style.display='none';}
function _showOk(msg){var e=document.getElementById('ok-box');e.textContent=msg;e.style.display='block';document.getElementById('err-box').style.display='none';}
function _hide(){document.getElementById('err-box').style.display='none';document.getElementById('ok-box').style.display='none';}

function _doRegister(){
  _hide();
  var company = document.getElementById('r-company').value.trim();
  var email   = document.getElementById('r-email').value.trim().toLowerCase();
  var pw      = document.getElementById('r-pw').value;
  var pw2     = document.getElementById('r-pw2').value;
  var phone   = document.getElementById('r-phone').value.trim();

  if(!company||!email||!pw){_showErr('회사명, 이메일, 비밀번호는 필수입니다');return;}
  if(pw.length<8){_showErr('비밀번호는 8자 이상이어야 합니다');return;}
  if(pw!==pw2){_showErr('비밀번호가 일치하지 않습니다');return;}

  var btn=document.getElementById('reg-btn');
  btn.disabled=true;btn.textContent='등록 중...';

  var now=new Date();
  var trialEnd=new Date(now.getTime()+1*24*60*60*1000);
  var companyCode=Math.random().toString(36).slice(2,8).toUpperCase();
  var emailPrefix=email.split('@')[0].replace(/[^a-zA-Z0-9]/g,'').toLowerCase();

  _auth.createUserWithEmailAndPassword(email,pw)
  .then(function(cred){
      var uid=cred.user.uid;
      var companyDoc={
        companyName:company,name:company,email:email,phone:phone,
        plan:'trial',services:['mbtico'],industry:'',
        companyCode:companyCode,
        slug:emailPrefix||uid.slice(0,8),
        trialStart:now.toISOString().slice(0,10),
        trialEnd:trialEnd.toISOString().slice(0,10),
        trialUsed:true,trialEndISO:trialEnd.toISOString(),
        subscriptions:{mbtico:{active:true,plan:'trial',expiry:trialEnd.toISOString().slice(0,10),expiryISO:trialEnd.toISOString(),modules:['scan','label','checkin','emergency','delivery','app']}},
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        uid:uid,dealerId:uid,
        settlePaid:false,inventoryPaid:false,qrPaid:false,kioskPaid:false,
        registeredFrom:'register.html',
        driverJoinUrl:'https://mbtico.kr/driver-join?did='+uid,
        appUrl:'https://mbtico.kr/hub'
      };
      var batch=_db.batch();
      batch.set(_db.collection('companies').doc(uid),companyDoc);
      batch.set(_db.collection('users').doc(uid),{uid:uid,email:email,name:company,companyName:company,role:'dealer',dealerId:uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      return batch.commit().then(function(){
        var _adminPw=Math.random().toString(36).slice(2,8).toUpperCase();
        window._regAdminPw=_adminPw;
        window._regUid=uid;
        return _db.collection('companies').doc(uid).collection('settings').doc('adminInfo').set({
          userId:emailPrefix||uid.slice(0,8),pwPlain:_adminPw,
          name:company,email:email,dealerId:uid,
          createdAt:new Date().toISOString()
        }).then(function(){return uid;});
      });
    })
    .then(function(uid){
      fetch('/sa/notify-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'신규 회사 등록',body:company+' · '+email,type:'join'})}).catch(function(){});
      var driverUrl='https://mbtico.kr/driver-join?did='+uid;
      _showOk('등록 완료!\n\n기사 가입 링크 (기사분들에게 공유):\n'+driverUrl+'\n\n담당자 확인 후 서비스가 활성화됩니다.');
      var okBox=document.getElementById('ok-box');
      var copyBtn=document.createElement('button');
      copyBtn.className='copy-btn';
      copyBtn.textContent='기사 가입 링크 복사';
      copyBtn.onclick=function(){navigator.clipboard.writeText(driverUrl).then(function(){copyBtn.textContent='복사됨!';});};
      okBox.appendChild(copyBtn);
      btn.textContent='등록 완료';
    })
  .catch(function(e){
    btn.disabled=false;btn.textContent='등록 신청';
    if(e.code==='auth/email-already-in-use'){_showErr('이미 가입된 이메일입니다.');}
    else if(e.code==='auth/weak-password'){_showErr('비밀번호가 너무 간단합니다.');}
    else{_showErr('오류: '+e.message);}
  });
}

document.addEventListener('keydown',function(e){if(e.key==='Enter')_doRegister();});
</script>
</body>
</html>
