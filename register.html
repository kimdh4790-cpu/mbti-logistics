<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>배송앱 등록 · MBTICO</title>
<link rel="icon" type="image/png" sizes="192x192" href="/mbti-icon-192.png?v=4">
<link rel="apple-touch-icon" sizes="192x192" href="/mbti-icon-192.png?v=4">
<link rel="manifest" href="/mbtico-manifest.json">
<meta name="theme-color" content="#08101f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#08101f;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:26px;font-weight:900;color:#c9a84c;margin-bottom:4px}
.logo p{font-size:12px;color:#64748b}
.card{background:#0d1b3e;border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:28px}
.section-title{font-size:11px;color:#64748b;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;margin-top:22px}
.section-title:first-child{margin-top:0}
.field{margin-bottom:14px}
.field label{font-size:12px;color:#94a3b8;display:block;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 16px;background:#132035;border:1px solid rgba(201,168,76,.15);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.field input:focus{border-color:#c9a84c}
.field input::placeholder{color:#3d5070}
.slug-preview{font-size:11px;color:#64748b;margin-top:5px;min-height:16px}
.slug-preview b{color:#c9a84c}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;padding:12px 14px;background:#132035;border:1px solid rgba(201,168,76,.15);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;font-family:inherit;transition:.2s}
.add-row input:focus{border-color:#c9a84c}
.add-row input::placeholder{color:#3d5070}
.add-row button{padding:0 16px;background:#c9a84c;color:#08101f;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.client-chips{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chip{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:8px;font-size:13px}
.chip-name{font-weight:700;color:#e2e8f0}
.chip-link{font-size:11px;color:#c9a84c;margin-top:2px}
.chip-del{background:transparent;border:none;color:#475569;cursor:pointer;font-size:16px;padding:0 4px;line-height:1;flex-shrink:0}
.chip-del:hover{color:#f87171}
.empty-hint{font-size:12px;color:#3d5070;padding:12px 0;text-align:center}
.divider{border:none;border-top:1px solid rgba(255,255,255,.06);margin:22px 0}
.btn{width:100%;padding:15px;background:#c9a84c;color:#08101f;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{background:#d4b86a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#f87171;margin-bottom:14px;display:none;line-height:1.5}
.ok{background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:24px;margin-bottom:14px;display:none}
.link-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;margin-bottom:20px}
.link-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#132035;border:1px solid rgba(201,168,76,.2);border-radius:10px}
.link-item-name{font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:2px}
.link-item-url{font-size:11px;color:#c9a84c;word-break:break-all}
.copy-btn{padding:6px 12px;background:transparent;border:1px solid rgba(201,168,76,.3);border-radius:7px;color:#c9a84c;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;margin-left:10px}
.login-link{text-align:center;font-size:13px;color:#64748b;margin-top:16px}
.login-link a{color:#c9a84c;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>MBTICO 배송앱</h1>
    <p>회사 등록 · 기사 가입 링크 생성</p>
  </div>

  <div class="card">
    <div id="err-box" class="err"></div>
    <div id="ok-box" class="ok" style="display:none"></div>

    <div id="form-area">
      <div class="section-title">회사 정보</div>

      <div class="field">
        <label>회사명 * (한글/영문)</label>
        <input id="r-company" type="text" placeholder="예: 엠비티아이물류" autocomplete="organization">
      </div>
      <div class="field">
        <label>링크명 * (영문·숫자만, 소문자 권장)</label>
        <input id="r-slug" type="text" placeholder="예: mbti" autocomplete="off" maxlength="20" oninput="_previewSlug()" style="text-transform:lowercase">
        <div class="slug-preview" id="slug-preview">링크명 입력 시 미리보기</div>
      </div>
      <div class="field">
        <label>이메일 (로그인 ID) *</label>
        <input id="r-email" type="email" placeholder="company@email.com" autocomplete="email">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>비밀번호 * (8자 이상)</label>
        <input id="r-pw" type="password" placeholder="비밀번호 입력" autocomplete="new-password">
      </div>
      <div class="field">
        <input id="r-pw2" type="password" placeholder="비밀번호 재입력" autocomplete="new-password" style="margin-top:8px">
      </div>

      <div class="divider"></div>

      <div class="section-title">배송처 추가 (기사 가입 링크 자동 생성)</div>
      <div class="add-row">
        <input id="client-input" type="text" placeholder="배송처명 입력 (예: 롯데백화점)" autocomplete="off" maxlength="30" onkeydown="if(event.key==='Enter'){event.preventDefault();_addClient();}">
        <button onclick="_addClient()">추가</button>
      </div>
      <div id="client-chips" class="client-chips">
        <div class="empty-hint" id="empty-hint">배송처를 추가하세요</div>
      </div>

      <div class="divider"></div>

      <button id="reg-btn" class="btn" onclick="_doRegister()">등록하기</button>
    </div>
  </div>

  <div class="login-link">이미 계정 있으신가요? <a href="/clients">배송처 관리 로그인</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDQmEFfLczgCuPQidunbBXqaHWgs39VMg0",
  authDomain:"mbti-logistics.firebaseapp.com",
  projectId:"mbti-logistics",
  storageBucket:"mbti-logistics.firebasestorage.app",
  messagingSenderId:"40761160761",
  appId:"1:40761160761:web:20545b610f03f534e949e8"
});
var _db=firebase.firestore();
_db.settings({experimentalAutoDetectLongPolling:true,merge:true});
var _auth=firebase.auth();

var _clients=[]; // [{name, slug}]

function _toSlug(str){return str.replace(/[^a-zA-Z0-9\-_]/g,'').toLowerCase().slice(0,20);}
function _toClientSlug(str){return str.replace(/[^a-zA-Z0-9가-힣\-_]/g,'').slice(0,30);}

function _previewSlug(){
  var raw=document.getElementById('r-slug').value;
  var slug=_toSlug(raw);
  var el=document.getElementById('slug-preview');
  if(slug){
    el.innerHTML='회사 링크: <b>mbtico.kr/'+slug+'</b>';
    _renderChips();
  } else {
    el.textContent='영문·숫자만 입력 가능합니다 (예: mbti)';
  }
}

function _addClient(){
  var inp=document.getElementById('client-input');
  var name=inp.value.trim();
  if(!name) return;
  var slug=_toClientSlug(name);
  if(!slug){inp.value='';return;}
  if(_clients.find(function(c){return c.slug===slug;})){
    inp.value='';return;
  }
  _clients.push({name:name,slug:slug});
  inp.value='';
  _renderChips();
}

function _removeClient(slug){
  _clients=_clients.filter(function(c){return c.slug!==slug;});
  _renderChips();
}

function _renderChips(){
  var raw=document.getElementById('r-slug').value;
  var coSlug=_toSlug(raw)||'회사';
  var container=document.getElementById('client-chips');
  var hint=document.getElementById('empty-hint');
  if(!_clients.length){
    if(hint) hint.style.display='block';
    var existing=container.querySelectorAll('.chip');
    existing.forEach(function(el){el.remove();});
    return;
  }
  if(hint) hint.style.display='none';
  var existing=container.querySelectorAll('.chip');
  existing.forEach(function(el){el.remove();});
  _clients.forEach(function(c){
    var div=document.createElement('div');
    div.className='chip';
    div.innerHTML='<div><div class="chip-name">'+_esc(c.name)+'</div>'+
      '<div class="chip-link">mbtico.kr/'+coSlug+'/'+_esc(c.slug)+'</div></div>'+
      '<button class="chip-del" onclick="_removeClient(\''+_esc(c.slug)+'\')">×</button>';
    container.appendChild(div);
  });
}

function _esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function _showErr(msg){
  var e=document.getElementById('err-box');
  e.textContent=msg;e.style.display='block';
  document.getElementById('ok-box').style.display='none';
}

async function _doRegister(){
  var company=document.getElementById('r-company').value.trim();
  var email=document.getElementById('r-email').value.trim().toLowerCase();
  var pw=document.getElementById('r-pw').value;
  var pw2=document.getElementById('r-pw2').value;
  document.getElementById('err-box').style.display='none';

  if(!company||!email||!pw){_showErr('회사명, 이메일, 비밀번호는 필수입니다');return;}
  if(pw.length<8){_showErr('비밀번호는 8자 이상이어야 합니다');return;}
  if(pw!==pw2){_showErr('비밀번호가 일치하지 않습니다');return;}

  var btn=document.getElementById('reg-btn');
  btn.disabled=true;btn.textContent='등록 중...';

  var rawSlug=document.getElementById('r-slug').value;
  var baseSlug=_toSlug(rawSlug)||
               email.split('@')[0].replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'co';
  if(!_toSlug(rawSlug)){_showErr('링크명(영문)을 입력해 주세요');btn.disabled=false;btn.textContent='등록하기';return;}

  try{
    var cred=await _auth.createUserWithEmailAndPassword(email,pw);
    var uid=cred.user.uid;
    var now=new Date();
    var trialEnd=new Date(now.getTime()+1*24*60*60*1000);

    var batch=_db.batch();
    batch.set(_db.collection('companies').doc(uid),{
      companyName:company,name:company,email:email,slug:baseSlug,
      plan:'trial',services:['mbtico'],
      subscriptions:{mbtico:{active:true,plan:'trial',expiry:trialEnd.toISOString().slice(0,10)}},
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      uid:uid,dealerId:uid,
      platform:'mbtico',registeredFrom:'register.html',
      appUrl:'https://mbtico.kr/hub'
    });
    batch.set(_db.collection('users').doc(uid),{
      uid:uid,email:email,name:company,companyName:company,
      role:'dealer',dealerId:uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();

    var tok=await _auth.currentUser.getIdToken();

    // 회사 슬러그 등록
    var r=await fetch('/api/company-slug',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
      body:JSON.stringify({uid:uid,slug:baseSlug,companyName:company})
    });
    var d=await r.json();
    if(!d.ok) throw new Error('슬러그 등록 실패: '+(d.error||''));

    // 배송처 일괄 등록
    var addedClients=[];
    for(var i=0;i<_clients.length;i++){
      var c=_clients[i];
      try{
        var cr=await fetch('/api/add-client',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
          body:JSON.stringify({clientSlug:c.slug,clientName:c.name})
        });
        var cd=await cr.json();
        if(cd.ok) addedClients.push(c);
      }catch(e2){}
    }

    fetch('/sa/notify-admin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:'신규 회사 등록',body:company+' · '+email+' (배송처 '+addedClients.length+'개)',type:'join'})}).catch(function(){});

    // 성공 화면
    var linksHtml='';
    if(addedClients.length){
      linksHtml='<div style="font-size:11px;color:#64748b;font-weight:700;margin-bottom:8px;letter-spacing:.05em">기사 가입 링크 (공유용)</div>'+
        '<div class="link-list">'+
        addedClients.map(function(c){
          var url='https://mbtico.kr/'+baseSlug+'/'+c.slug;
          return '<div class="link-item">'+
            '<div><div class="link-item-name">'+_esc(c.name)+'</div>'+
            '<div class="link-item-url">'+url+'</div></div>'+
            '<button class="copy-btn" data-url="'+url+'">복사</button>'+
            '</div>';
        }).join('')+
        '</div>';
    } else {
      linksHtml='<div style="font-size:12px;color:#64748b;margin-top:8px">/clients에서 배송처를 추가하면 링크가 생성됩니다</div>';
    }

    document.getElementById('form-area').style.display='none';
    document.getElementById('ok-box').innerHTML=
      '<div style="text-align:center;margin-bottom:16px">'+
      '<div style="font-size:36px;margin-bottom:10px">✅</div>'+
      '<div style="font-size:18px;font-weight:800;color:#c9a84c;margin-bottom:6px">등록 완료!</div>'+
      '<div style="font-size:12px;color:#94a3b8;margin-bottom:2px">회사 링크</div>'+
      '<div style="font-size:15px;font-weight:800;color:#e2e8f0;margin-bottom:2px">mbtico.kr/'+baseSlug+'</div>'+
      '</div>'+
      linksHtml+
      '<button onclick="location.href=\'/clients\'" style="width:100%;padding:13px;background:#c9a84c;color:#08101f;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:16px">배송처 관리 · 링크 추가</button>';
    document.getElementById('ok-box').style.display='block';

    document.getElementById('ok-box').querySelectorAll('.copy-btn').forEach(function(b){
      b.addEventListener('click',function(){
        var url=this.dataset.url;
        navigator.clipboard.writeText(url).then(function(){
          b.textContent='복사됨!';setTimeout(function(){b.textContent='복사';},1500);
        });
      });
    });

    btn.textContent='등록 완료';

  }catch(e){
    btn.disabled=false;btn.textContent='등록하기';
    if(e.code==='auth/email-already-in-use'){
      _showErr('이미 가입된 이메일입니다. 아래 "배송처 관리 로그인"을 이용해 주세요.');
    }else if(e.code==='auth/weak-password'){
      _showErr('비밀번호가 너무 간단합니다. 8자 이상 영문+숫자 조합을 사용하세요.');
    }else if(e.code==='auth/invalid-email'){
      _showErr('올바른 이메일 형식이 아닙니다.');
    }else{
      _showErr(e.message||'등록 중 오류가 발생했습니다.');
    }
  }
}
</script>
</body>
</html>
