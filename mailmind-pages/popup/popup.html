<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailMind</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 300px; font-family: 'Google Sans', Arial, sans-serif; background: #fff; color: #202124; }
    .header { background: #e91e8c; color: #fff; padding: 16px; display: flex; align-items: center; gap: 8px; }
    .header-logo { font-size: 18px; font-weight: 700; }
    .header-sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    .login-section { padding: 24px 16px; text-align: center; }
    .login-desc { font-size: 13px; color: #5f6368; margin-bottom: 20px; line-height: 1.6; }
    .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px 16px; border: 1px solid #dadce0; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 500; color: #3c4043; cursor: pointer; }
    .btn-google:hover { background: #f8f9fa; }
    .btn-google img { width: 18px; height: 18px; }
    .user-section { padding: 16px; display: none; }
    .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f1f3f4; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #fce4ec; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #e91e8c; font-weight: 600; }
    .user-name { font-size: 14px; font-weight: 500; }
    .user-email { font-size: 12px; color: #5f6368; }
    .plan-card { background: #f8f9fa; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .plan-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
    .plan-badge.free  { background: #f1f3f4; color: #5f6368; }
    .plan-badge.basic { background: #e8f0fe; color: #1a73e8; }
    .plan-badge.pro   { background: #e6f4ea; color: #137333; }
    .usage-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
    .usage-label { color: #5f6368; }
    .usage-value { font-weight: 500; }
    .usage-bar { height: 4px; background: #e8eaed; border-radius: 2px; margin-bottom: 4px; }
    .usage-fill { height: 100%; border-radius: 2px; background: #e91e8c; transition: width 0.3s; }
    .usage-fill.warning { background: #f29900; }
    .usage-fill.danger  { background: #c5221f; }
    .btn-upgrade { display: block; width: 100%; padding: 9px; background: #e91e8c; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 10px; }
    .btn-upgrade:hover { background: #c2185b; }
    .btn-upgrade.pro { background: #137333; }
    .btn-logout { width: 100%; padding: 7px; background: none; border: 1px solid #dadce0; border-radius: 8px; font-size: 12px; color: #5f6368; cursor: pointer; }
    .btn-logout:hover { background: #f8f9fa; }
    .settings-section { margin-bottom: 12px; }
    .settings-label { font-size: 11px; font-weight: 600; color: #5f6368; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .settings-textarea { width: 100%; padding: 7px 9px; border: 1px solid #dadce0; border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 54px; color: #202124; }
    .settings-textarea:focus { outline: none; border-color: #e91e8c; }
    .btn-save-settings { width: 100%; padding: 7px; background: #e91e8c; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
    .btn-save-settings:hover { background: #c2185b; }
    .save-ok { font-size: 11px; color: #137333; text-align: center; margin-bottom: 6px; display: none; }
    .btn-dashboard { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 7px; background: none; border: 1px solid #e91e8c; border-radius: 8px; font-size: 12px; font-weight: 500; color: #e91e8c; cursor: pointer; text-decoration: none; margin-bottom: 8px; }
    .btn-dashboard:hover { background: #fce4ec; }
    .footer { padding: 10px 16px; border-top: 1px solid #f1f3f4; display: flex; justify-content: space-between; }
    .footer a { font-size: 11px; color: #5f6368; text-decoration: none; }
    .loading { padding: 40px 16px; text-align: center; color: #5f6368; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-logo">✦ MailMind</div>
      <div class="header-sub">AI Email Reply Assistant</div>
    </div>
  </div>
  <div id="loading" class="loading">Loading...</div>
  <div id="login-section" class="login-section" style="display:none">
    <p class="login-desc">Sign in to start generating<br>AI email replies instantly!</p>
    <button class="btn-google" id="btn-google-login">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Sign in with Google
    </button>
  </div>
  <div id="user-section" class="user-section">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">?</div>
      <div>
        <div class="user-name" id="user-name">-</div>
        <div class="user-email" id="user-email">-</div>
      </div>
    </div>
    <div class="plan-card">
      <div id="plan-badge" class="plan-badge free">Starter</div>
      <div class="usage-row">
        <span class="usage-label">Replies remaining this month</span>
        <span class="usage-value" id="monthly-text">-</span>
      </div>
      <div class="usage-bar">
        <div class="usage-fill" id="monthly-bar" style="width:0%"></div>
      </div>
    </div>
    <div id="upgrade-section"></div>
    <div class="settings-section">
      <div class="settings-label">Business Card (auto-added to signature)</div>
      <textarea class="settings-textarea" id="biz-card-input" placeholder="Name, title, company, phone, etc.&#10;e.g. John Kim | CEO | MBTIC Inc. | +82-10-1234-5678" rows="3"></textarea>
    </div>
    <div id="save-ok" class="save-ok">✅ Saved</div>
    <button class="btn-save-settings" id="btn-save-settings">Save Settings</button>
    <a class="btn-dashboard" href="https://mailmind-api.yongcha.app/dashboard" target="_blank">⚙️ Settings / Dashboard</a>
    <button class="btn-logout" id="btn-logout">Sign out</button>
  </div>
  <div class="footer">
    <a href="https://mailmind.yongcha.app" target="_blank">Home</a>
    <a href="https://mailmind.yongcha.app/privacy.html" target="_blank">Privacy</a>
    <a href="mailto:hello@mailmind.yongcha.app">Contact</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
