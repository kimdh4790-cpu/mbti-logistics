// 카카오 지오코딩
// ═══════════════════════════════════════
async function _kakaoGeocode(address){
  address = _cleanAddr(address);
  if(!address) return null;

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STEP 0a: 캐시 조회 (localStorage 90일)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  var _cached = _geoCacheGet(address);
  if(_cached){
    _geoResultBanner('📍 캐시 | '+_cached.lat.toFixed(5)+', '+_cached.lng.toFixed(5));
    console.log('[GEO_CACHE_HIT]', _geoCacheKey(address), _cached);
    return {lat:_cached.lat, lng:_cached.lng, src:'cache'};
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STEP 0b: 저장된 같은 동 배송에서 재사용
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  var _reuse = _geoFromStoredDeliveries(address);
  if(_reuse){
    _geoResultBanner('📍 동일주소 재사용 | '+_reuse.lat.toFixed(5)+', '+_reuse.lng.toFixed(5));
    _geoCacheSet(address, _reuse);
    console.log('[GEO_REUSE]', _geoCacheKey(address), _reuse);
    return _reuse;
  }


  // ── API 키 로드 ──
  var kKey = window._cachedKakaoApiKey || (localStorage.getItem('mbti_kakao_api_key')||'').trim();
  var gKey = window._googleApiKey      || (localStorage.getItem('mbti_google_api_key')||'').trim();
  if(!kKey || !gKey){
    try{
      var _snap = await _db.collection('settings').doc('claude_config').get();
      if(_snap.exists){
        var _d = _snap.data();
        if(window._fsCacheStore) window._fsCacheStore['settings/claude_config']={ts:Date.now(),data:_d};
        if(!kKey){ kKey=(_d.kakaoApiKey||'').trim(); if(kKey){window._cachedKakaoApiKey=kKey;localStorage.setItem('mbti_kakao_api_key',kKey);} }
        if(!gKey){ gKey=(_d.googleApiKey||_d.googleMapsApiKey||'').trim(); if(gKey){window._googleApiKey=gKey;localStorage.setItem('mbti_google_api_key',gKey);} }
      }
    }catch(e){}
  }

  var addrFull = _addBusanPrefix(address);
  var aptM  = address.match(/([가-힣A-Za-z\d]+(?:임대아파트|공공아파트|영구임대|아파트|오피스텔|빌라|맨션|주공|LH|SH))/);
  if(!aptM) aptM = address.match(/([가-힣]{2,}아파트)/);
  if(!aptM) aptM = address.match(/([가-힣]{3,}(?:임대|주공))/);
  var dongM = address.match(/([A-Za-z가-힣]?\d+)\s*동(?![아네은])/);
  var guM   = address.match(/([가-힣]+구)/);
  var guStr = guM ? guM[1]+' ' : '';

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STEP 1-PRIORITY 강화 — 다중 쿼리 + 별칭 + 동 매칭 점수
  //   카카오맵 실측 검증: "도로명 + 동번호" 패턴이 가장 강력
  //   예: "모라로110번길121, 106동" → 모라주공1단지 106동 정확 매칭
  //   별칭: "영구임대" → 카카오는 "주공N단지"로 등록된 경우 많음
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if(kKey && (aptM || dongM)){
    // 도로명+번지 추출 (예: "모라로110번길 121")
    var roadOnly = (addrFull||'').match(/([가-힣A-Za-z\d]+(?:로|길|번길)\s*\d+(?:-\d+)?)/);
    var roadStr = roadOnly ? roadOnly[1].replace(/\s+/g,' ') : '';
    var dongStr = dongM ? dongM[1]+'동' : '';
    var aptStr  = aptM ? aptM[1] : '';
    // 행정동 추출 (예: "모라동", "개금동") — OCR에 명시되면 검증용
    var legalDongM = (addrFull||'').match(/([가-힣]+동\d?)(?=\s|$|[^가-힣\d])/);
    var legalDongStr = '';
    if(legalDongM){
      var ld = legalDongM[1];
      // 동번호(106동, 408동)와 행정동(모라동, 학장동) 구분 — 행정동은 보통 한글로 시작
      if(ld.length >= 3 && !/^\d+동/.test(ld) && ld !== dongStr) legalDongStr = ld.replace(/\d$/,'');
    }
    var guStrTrim = guStr.trim(); // "사상구" 같은 행정구

    // 별칭 변환 강화 — "영구임대" → 주공N단지/LH/임대주택 등 다양화
    var aptAliases = [aptStr];
    if(aptStr && /영구임대/.test(aptStr)){
      var base = aptStr.replace(/(영구임대|임대)?(아파트)?$/,'').replace(/주공/,'');
      if(base){
        for(var sd=1; sd<=4; sd++){
          aptAliases.push(base+'주공'+sd+'단지');
          aptAliases.push(base+'주공'+sd+'단지아파트');
          aptAliases.push(base+'주공아파트 '+sd+'단지');
          aptAliases.push(base+'LH'+sd+'단지');
        }
        aptAliases.push(base+'주공');
        aptAliases.push(base+'주공아파트');
        aptAliases.push(base+'임대주택');
        aptAliases.push(base);
      }
    }
    if(aptStr && /임대아파트$/.test(aptStr) && !/영구임대/.test(aptStr)){
      aptAliases.push(aptStr.replace(/임대아파트$/,'주공'));
      aptAliases.push(aptStr.replace(/임대아파트$/,''));
    }
    // 중복 제거
    aptAliases = aptAliases.filter(function(v,i,a){ return v && a.indexOf(v)===i; });
    console.log('[KW_APT_ALIASES]', aptAliases);

    // 번길 OCR 자리 누락 자동 보정 변형 생성
    //   "19번길" → ["19번길", "192번길", "190번길", "191번길", "193번길", ...]
    //   "23번길" → ["23번길", "234번길", "230번길", "231번길", ...]
    //   카카오 OCR이 마지막 자리를 자주 누락 → 2자리를 3자리로 확장 시도
    function _roadVariants(road){
      if(!road) return [road];
      var v = [road];
      // "모라19번길" 같이 "로" 없는 2자리 번길 → "모라로192번길" 등 3자리 확장
      if(!/로\s*\d/.test(road)){
        var m3 = road.match(/([가-힣]{2,})(\d{2})(번길.*)/);
        if(m3){
          var n3 = parseInt(m3[2], 10);
          [2,0,1,3,4,5,6,7,8,9].forEach(function(d){
            v.push(m3[1]+'로'+(n3*10+d)+m3[3]);
          });
        }
      }
      // 2자리 번길 → 3자리 변형 (×10 + 0~9)
      var m2 = road.match(/(.*로\s*)(\d{2})(번길.*)/);
      if(m2){
        var n = parseInt(m2[2],10);
        [2,0,1,3,4,5,6,7,8,9].forEach(function(d){
          v.push(m2[1]+(n*10+d)+m2[3]);
        });
      }
      // 1자리 번길 → 2자리 변형 (×10 + 0~9)
      var m1 = road.match(/(.*로\s*)(\d{1})(번길.*)/);
      if(m1){
        var n1 = parseInt(m1[2],10);
        [1,2,0,3,4,5].forEach(function(d){
          v.push(m1[1]+(n1*10+d)+m1[3]);
        });
      }
      return v.filter(function(x,i,a){ return x && a.indexOf(x)===i; });
    }
    var roadVariants = _roadVariants(roadStr);

    // 쿼리 후보 생성 — 단지명+동을 최우선 (OCR 도로명 오인식 극복)
    var kwCands = [];
    // ① 아파트명(별칭)+동번호 — 가장 강력한 식별자 (단지명은 오인식 적음)
    if(aptStr && dongStr){
      aptAliases.forEach(function(an){
        if(!an) return;
        kwCands.push(an+' '+dongStr);
        kwCands.push('부산 '+guStr+an+' '+dongStr);
        kwCands.push('부산 '+an+' '+dongStr); // guStr 없는 버전
      });
    }
    // ② 도로명+동번호 (OCR 자리누락 변형 포함) — 단지명 매칭 실패 시 폴백
    if(roadStr && dongStr){
      roadVariants.forEach(function(rv){
        kwCands.push(rv+', '+dongStr);
        kwCands.push(rv+' '+dongStr);
        kwCands.push('부산 '+guStr+rv+' '+dongStr);
      });
    }
    // ③ 아파트명+도로명 (동 없을 때) — 변형 포함
    if(roadStr && !dongStr){
      aptAliases.forEach(function(an){
        if(!an) return;
        roadVariants.forEach(function(rv){
          kwCands.push(an+' '+rv);
        });
      });
    }
    // 중복 제거 + 빈값 제거
    kwCands = kwCands.filter(function(v,i,a){ return v && v.length>3 && a.indexOf(v)===i; });
    console.log('[KAKAO_KW_CANDS v9.62]', kwCands.slice(0,10));

    // 행정구/행정동 강제 검증 추가
    function _scoreDoc(d){
      var pn = (d.place_name||'')+' '+(d.address_name||'')+' '+(d.road_address_name||'');
      var pnNS = pn.replace(/\s/g,'');
      var pnName = (d.place_name||'').replace(/\s/g,'');
      var addrFullPn = (d.address_name||'') + ' ' + (d.road_address_name||'');
      var sc = 0;
      // 행정구 검증 — OCR에 "사상구"인데 결과가 "진구"면 -100 (강력 거부)
      if(guStrTrim && guStrTrim.length >= 2){
        if(addrFullPn.indexOf(guStrTrim) < 0){
          console.log('[KW_GU_MISMATCH]', d.place_name, '|', addrFullPn, '≠', guStrTrim);
          return -100; // 행정구 불일치 = 완전 거부
        }
      }
      // 행정동 검증 — OCR에 "모라동"인데 결과가 "개금동"이면 -50
      if(legalDongStr && legalDongStr.length >= 2){
        if(addrFullPn.indexOf(legalDongStr) >= 0) sc += 30;
        else sc -= 50;
      }
      if(dongStr && pn.indexOf(dongStr) >= 0) sc += 50;
      // 원본 도로명 + OCR 교정 변형 도로명 매칭
      var roadMatched = false;
      if(roadStr){
        for(var rvi=0; rvi<roadVariants.length; rvi++){
          if(pnNS.indexOf(roadVariants[rvi].replace(/\s/g,'')) >= 0){
            sc += (rvi===0 ? 20 : 25);
            roadMatched = true;
            break;
          }
        }
      }
      // 단지명(별칭 포함) 매칭 — 강화된 점수
      var aptMatched = false;
      var aptKey = null;
      if(aptStr && pnName.length > 0){
        for(var ai=0; ai<aptAliases.length; ai++){
          if(!aptAliases[ai]) continue;
          var aliasKey = aptAliases[ai].slice(0,4).replace(/\s/g,'');
          if(aliasKey.length >= 2 && pnName.indexOf(aliasKey) >= 0){
            sc += 40; // 단지명(별칭 포함) 매칭 +40
            aptMatched = true; aptKey = aliasKey;
            break;
          }
        }
      }
      // 정확히 "{단지명} {동번호}" 패턴이면 추가 +30
      if(aptMatched && dongStr && pnName.indexOf(dongStr) >= 0){
        sc += 30;
      }
      // 도로명만 매칭되고 단지명 매칭 안 되면 -50 (OCR 오인식 위험)
      if(roadMatched && !aptMatched && aptStr){
        sc -= 50;
        console.log('[KW_PENALTY]', d.place_name, '단지명 미포함 -50');
      }
      // 동별 좌표 압도적 우선 — place_name이 "N동"으로 끝나면 +100
      //   예: "모라주공1단지아파트 106동" (동별) vs "모라주공1단지아파트" (단지중심)
      //   동별 결과는 카카오에 동 입구 좌표로 등록되어 있어 가장 정확
      if(dongStr && aptMatched){
        var pnTrim = (d.place_name||'').trim();
        var dongAtEnd = pnTrim.match(/(\d+동)\s*$/);
        if(dongAtEnd && dongAtEnd[1] === dongStr){
          sc += 100; // 동별 핀 강제 우선
          console.log('[KW_DONG_EXACT]', pnTrim, '+100 (동별 좌표)');
        }
      }
      if(d.category_group_code==='AT4') sc += 5;
      if(d.category_group_code==='') sc += 3;
      return sc;
    }

    var bestDoc = null, bestScore = 0, bestQuery = '';
    for(var ki=0; ki<Math.min(kwCands.length, 6); ki++){
      try{
        var kr0 = await fetch('https://dapi.kakao.com/v2/local/search/keyword.json?query='+encodeURIComponent(kwCands[ki])+'&size=15',
          {headers:{'Authorization':'KakaoAK '+kKey}});
        var kd0 = await kr0.json();
        if(kd0.documents && kd0.documents.length > 0){
          for(var di=0; di<kd0.documents.length; di++){
            var sc = _scoreDoc(kd0.documents[di]);
            if(sc > bestScore){
              bestScore = sc; bestDoc = kd0.documents[di]; bestQuery = kwCands[ki];
            }
          }
          // 동별 매칭(+100점) 나올 때까지 기다리기 — 임계값 150
          if(bestScore >= 150) break;
        }
      }catch(e){ console.debug('[KW'+ki+']', e.message); }
    }

    if(bestDoc && bestScore >= 50){
      // 동 번호 매칭된 결과 → 동 단위 정확도 확보
      var _isDongExact = (bestDoc.place_name||'').match(/(\d+동)\s*$/);
      var _matchType = (_isDongExact && _isDongExact[1]===dongStr) ? '동별핀' : (bestScore>=100?'정확':'단지');
      _geoResultBanner('📍 카카오키워드('+_matchType+' '+bestScore+'점) ✅ | '+bestDoc.y+', '+bestDoc.x+'\n   "'+bestQuery+'" → '+bestDoc.place_name);
      // 카카오 매칭 도로명을 반환값에 포함 (주소 텍스트 자동 갱신용)
      var matchedRoad = bestDoc.road_address_name || bestDoc.address_name || '';
      var matchedName = bestDoc.place_name || '';
      var _gpsKW = {lat:parseFloat(bestDoc.y), lng:parseFloat(bestDoc.x), src:'kakao_kw_dong', matchedAddr:matchedRoad, matchedName:matchedName};
      _geoCacheSet(address, _gpsKW);
      console.log('[KAKAO_KW_BEST v9.65]', bestQuery, '→', matchedName, '|', matchedRoad, 'score:', bestScore);
      // 카카오 매칭 도로명으로 emer-addr 입력란 강제 재구성
      try{
        var emerAddrEl = document.getElementById('emer-addr');
        if(emerAddrEl && matchedRoad){
          var curVal = emerAddrEl.value || '';
          // 호수 추출 (예: "1209호")
          var hoMatch = curVal.match(/(\d+호)/);
          var hoStr = hoMatch ? hoMatch[1] : '';
          // 새 주소 재구성: "{카카오도로명} {단지명} {동번호} {호수}"
          var rebuilt = matchedRoad;
          if(matchedName) rebuilt += ' ' + matchedName.replace(matchedRoad,'').trim();
          if(dongStr && rebuilt.indexOf(dongStr)<0) rebuilt += ' ' + dongStr;
          if(hoStr && rebuilt.indexOf(hoStr)<0) rebuilt += ' ' + hoStr;
          rebuilt = rebuilt.replace(/\s+/g,' ').trim();
          if(rebuilt !== curVal && rebuilt.length > 10){
            emerAddrEl.value = rebuilt;
            console.log('[ADDR_AUTO_REBUILD v9.65]', curVal, '→', rebuilt);
            _geoResultBanner('🔧 주소 자동교정 ✅\n   원본: '+curVal.slice(0,50)+'\n   교정: '+rebuilt);
          }
        }
      }catch(autoCorrErr){ console.debug('addr rebuild skip:', autoCorrErr); }
      return _gpsKW;
    }
    if(bestDoc && bestScore >= 20){
      // 동 매칭은 못 했지만 도로명/아파트명 매칭 → 단지 단위
      _geoResultBanner('📍 카카오키워드(단지'+bestScore+'점) ⚠️ | '+bestDoc.y+', '+bestDoc.x);
      var _gpsKW2 = {lat:parseFloat(bestDoc.y), lng:parseFloat(bestDoc.x), src:'kakao_kw_apt'};
      _geoCacheSet(address, _gpsKW2);
      console.log('[KAKAO_KW_APT]', bestQuery, '→', bestDoc.place_name, 'score:', bestScore);
      return _gpsKW2;
    }
    // 점수 부족 → STEP 1로 fallthrough
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STEP 1: 카카오 주소검색 — OCR 번길 오인식 자동교정
  //  2자리 번길(예:19번길)이면 ×10, +1, +2 변형도 시도
  //  건물번호(main_building_no) 있는 결과만 채택 → 틀린 도로는 자동 탈락
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if(kKey){
    // 도로명+번지 추출 (아파트명 제거, 동번호 유지)
    var roadBase = addrFull
      .replace(/\s*[가-힣A-Za-z]{2,}(?:아파트|오피스텔|빌라|맨션|주공|임대)[가-힣A-Za-z\d\s]*/g,'')
      .replace(/\s*\d+호\s*$/,'').trim();
    var dongStr = dongM ? ' '+dongM[1]+'동' : '';

    // 쿼리 후보 생성: 원본 + 2자리 번길이면 × 10, +1, +2 교정 추가
    function makeAddrCandidates(base){
      var cands = [(base+dongStr).trim(), base.replace(/\s*\d+동\s*$/, '').trim()];
      var twoDigit = base.match(/(로\s*)(\d{2})(번길)/);
      if(twoDigit){
        var n = parseInt(twoDigit[2], 10);
        [0, 2, 1, 3, 4, 5].forEach(function(d){
          var v = base.replace(/(로\s*)(\d{2})(번길)/, '$1'+(n*10+d)+'$3');
          cands.push((v+dongStr).trim());
          cands.push(v.replace(/\s*\d+동\s*$/,'').trim());
        });
      }
      return cands.filter(function(v,i,a){ return v && v.length>5 && a.indexOf(v)===i; });
    }

    var addrCands = makeAddrCandidates(roadBase);
    console.log('[KAKAO_CANDS]', addrCands.slice(0,4));

    for(var ai=0; ai<addrCands.length; ai++){
      try{
        var ar = await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addrCands[ai])+'&size=1',
          {headers:{'Authorization':'KakaoAK '+kKey}});
        var ad = await ar.json();
        if(ad.documents && ad.documents.length > 0){
          var adoc = ad.documents[0];
          var bno  = adoc.road_address && adoc.road_address.main_building_no;
          console.log('[KAKAO_ADDR]', addrCands[ai].slice(-30), '→ 건물번호:', bno||'없음');
          if(bno){
            // 건물번호 있는 결과 → 정확한 도로+번지 확인됨
            _geoResultBanner('📍 카카오주소 | '+adoc.y+', '+adoc.x);
            var _gpsS1 = {lat:parseFloat(adoc.y), lng:parseFloat(adoc.x), src:'kakao_addr'};
            _geoCacheSet(address, _gpsS1);
            return _gpsS1;
          }
        }
      }catch(e){ console.debug('[A'+ai+']',e.message); }
    }
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STEP 2: Google — 원본 주소 + 번길 교정 변형
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if(gKey){
    var baseG = addrFull.replace(/\s*\d+호\s*$/,'').trim();
    var googleCands = [baseG];
    var twoG = addrFull.match(/(로\s*)(\d{2})(번길)/);
    if(twoG){
      var ng = parseInt(twoG[2],10);
      [0,2,1,3].forEach(function(d){
        var v = addrFull.replace(/(로\s*)(\d{2})(번길)/, '$1'+(ng*10+d)+'$3').replace(/\s*\d+호\s*$/,'');
        googleCands.push(v.trim());
      });
    }
    googleCands = googleCands.filter(function(v,i,a){ return v && a.indexOf(v)===i; });

    for(var gi=0; gi<googleCands.length; gi++){
      try{
        var gr = await fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(googleCands[gi])+'&language=ko&region=kr&key='+gKey);
        var gd = await gr.json();
        var fmt = gd.results&&gd.results[0]&&gd.results[0].formatted_address||'';
        console.log('[GOOGLE]', googleCands[gi].slice(-30), '→', gd.status, fmt.slice(-25));
        if(gd.status==='OK' && gd.results && gd.results[0]){
          var gl = gd.results[0].geometry.location;
          _geoResultBanner('🌐 Google | '+gl.lat.toFixed(5)+', '+gl.lng.toFixed(5));
          var _gpsS2 = {lat:gl.lat, lng:gl.lng, src:'google'};
          _geoCacheSet(address, _gpsS2);
          return _gpsS2;
        }
        if(gd.status==='REQUEST_DENIED'){
          _geoResultBanner('❌ Google Geocoding API 미활성 — Cloud Console 확인');
          break;
        }
      }catch(e){ console.debug('[G'+gi+']',e.message); }
    }
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STEP 3: 카카오 키워드 — 아파트명+동 (최후)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if(kKey && aptM){
    var kwQ = '부산 '+guStr+aptM[1]+(dongM?' '+dongM[1]+'동':'');
    try{
      var kr = await fetch('https://dapi.kakao.com/v2/local/search/keyword.json?query='+encodeURIComponent(kwQ)+'&size=3',
        {headers:{'Authorization':'KakaoAK '+kKey}});
      var kd = await kr.json();
      if(kd.documents && kd.documents.length > 0){
        var best = (dongM && kd.documents.find(function(d){return d.place_name&&d.place_name.indexOf(dongM[1]+'동')>=0;}))
                 || kd.documents[0];
        _geoResultBanner('📍 카카오키워드⚠️ | '+best.y+', '+best.x);
        var _gpsS3 = {lat:parseFloat(best.y), lng:parseFloat(best.x), src:'kakao_kw'};
        _geoCacheSet(address, _gpsS3);
        return _gpsS3;
      }
    }catch(e){}
  }

  _geoResultBanner('❌ 좌표 변환 실패 — 주소를 확인하세요');
  return null;
}

async function _googleGeocodePin(addrFull, gKey){
  // _kakaoGeocode 내부에서 직접 Google 호출하므로 이 함수는 호환용 래퍼
  if(!gKey) return null;
  try{

function _geoResultBanner(msg){
  var existing = document.getElementById('geo-result-banner');
  if(existing) existing.remove();
  var el = document.createElement('div');
  el.id = 'geo-result-banner';
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1e293b;color:#fff;font-size:13px;font-weight:700;padding:10px 14px;text-align:center;word-break:break-all;box-shadow:0 2px 8px rgba(0,0,0,.4)';
  el.textContent = msg;
  el.onclick = function(){ el.remove(); };
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.remove(); }, 30000);
}

function _geoCacheKey(address){
  if(!address) return '';
  var s = String(address).replace(/\s+/g,'').toLowerCase();
  // 아파트명+동 추출 (캐시 키 최소화)
  var aptM = s.match(/([가-힣a-z\d]+(?:임대아파트|공공아파트|영구임대|아파트|오피스텔|빌라|맨션|주공|lh|sh))/);
  var dongM = s.match(/([a-z가-힣]?\d+)동(?![아네은])/);
  if(aptM && dongM) return aptM[1]+'_'+dongM[1]+'동';
  // 도로명+번지만 있으면 그것으로
  var roadM = s.match(/([가-힣a-z]+(?:로|길|번길)\d+(?:-\d+)?)/);
  if(roadM) return roadM[1];
  return s.slice(0, 30);
}

function _geoCacheGet(address){
  var k = _geoCacheKey(address);
  if(!k) return null;
  if(window._geoCacheMem[k]) return window._geoCacheMem[k];
  try{
    var raw = localStorage.getItem('mbti_geo_cache_'+k);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    if(!obj || !obj.lat || !obj.lng) return null;
    // 90일 만료
    if(obj.ts && (Date.now() - obj.ts) > 90*24*3600*1000){
      localStorage.removeItem('mbti_geo_cache_'+k); return null;
    }
    window._geoCacheMem[k] = obj;
    return obj;
  }catch(e){ return null; }
}

function _geoCacheSet(address, gps){
  if(!address || !gps || !gps.lat || !gps.lng) return;
  var k = _geoCacheKey(address);
  if(!k) return;
  var obj = {lat:gps.lat, lng:gps.lng, src:gps.src||'cached', ts:Date.now()};
  window._geoCacheMem[k] = obj;
  try{ localStorage.setItem('mbti_geo_cache_'+k, JSON.stringify(obj)); }catch(e){}
}
// 저장된 emergency_deliveries에서 같은 동 GPS 찾기 (즉시 메모리, Firestore 조회 안 함)

function _geoFromStoredDeliveries(address){
  if(!address) return null;
  var k = _geoCacheKey(address);
  if(!k) return null;
  // window._emerStoredList 등에서 검색 (이미 메모리에 있는 경우만)
  var lists = [window._emerStoredList, window._driverDeliveries, window._allDeliveries];
  for(var i=0;i<lists.length;i++){
    var list = lists[i];
    if(!list || !list.length) continue;
    for(var j=0;j<list.length;j++){
      var r = list[j];
      if(!r || !r.gps || !r.gps.lat) continue;
      if(_geoCacheKey(r.addr||r.address||'') === k){
        return {lat:r.gps.lat, lng:r.gps.lng, src:'stored_reuse'};
      }
    }
  }
  return null;
}

// Claude Vision Haiku 검증 — Google OCR 동번호 오인식 보정
// 1순위: Firestore의 anthropicApiKey로 직접 호출 (이미 등록된 키 활용)
// 2순위: /claude-ocr 프록시 폴백 (Cloudflare env.CLAUDE_API_KEY)
function _loadMapsScript(apiKey){
  return new Promise(function(res, rej){
    if(window.google && window.google.maps){ res(); return; }
    if(!apiKey){ rej(new Error('NO_API_KEY')); return; }
    if(window._mapsScriptLoading){
      var check = setInterval(function(){
        if(window.google && window.google.maps){ clearInterval(check); res(); }
      },100);
      return;
    }
    window._mapsScriptLoading = true;
    window.gm_authFailure = function(){ rej(new Error('AUTH_FAILURE')); };
    var sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(apiKey)+'&language=ko&region=KR';
    sc.async = true; sc.defer = true;
    sc.onload = function(){ window._mapsScriptLoading=false; res(); };
    sc.onerror = function(){ window._mapsScriptLoading=false; rej(new Error('SCRIPT_ERROR')); };
    document.head.appendChild(sc);
  });
}

// 지도 닫기 (닫기 버튼 + 뒤로가기 공통)

function _nativeCamJsQR(cv, cw, ch, statusEl, fallback){
  if(!window.jsQR){ if(statusEl) statusEl.textContent='❌ jsQR 미로드'; if(fallback) fallback(); return; }
  var cv2=document.createElement('canvas'), ctx2=cv2.getContext('2d');

  // 파란 쿠팡 송장 감지 — 파란 배경 제거 후 흑백 변환
  function isBlueLabel(d){
    var px=d.data, blue=0, total=px.length/4;
    for(var i=0;i<px.length;i+=16){ // 4픽셀 샘플링
      if(px[i+2]>px[i]+40 && px[i+2]>px[i+1]+30 && px[i+2]>100) blue++;
    }
    return (blue/(total/4)) > 0.15; // 15% 이상 파란 픽셀이면 파란 송장
  }
  function removeBlue(d){
    var px=d.data;
    for(var i=0;i<px.length;i+=4){
      var r=px[i],g=px[i+1],b=px[i+2];
      if(b>r+30 && b>g+20 && b>80){
        px[i]=px[i+1]=px[i+2]=255; // 파란 배경 → 흰색
      } else {
        var gray=Math.round(r*.299+g*.587+b*.114);
        px[i]=px[i+1]=px[i+2]=(gray<128?0:255); // 나머지 → 이진화
      }
    }
    return d;
  }
  function enhance(d){ var px=d.data,len=px.length,mn=255,mx=0; for(var i=0;i<len;i+=4){var g=Math.round(px[i]*.299+px[i+1]*.587+px[i+2]*.114);px[i]=px[i+1]=px[i+2]=g;} for(var j=0;j<len;j+=4){if(px[j]<mn)mn=px[j];if(px[j]>mx)mx=px[j];} var rng=mx-mn||1; for(var k=0;k<len;k+=4){var v=Math.round((px[k]-mn)/rng*255);px[k]=px[k+1]=px[k+2]=v;} return d; }
  function scan(sx,sy,sw,sh,enh){ cv2.width=sw;cv2.height=sh; ctx2.drawImage(cv,sx,sy,sw,sh,0,0,sw,sh); var d=ctx2.getImageData(0,0,sw,sh); if(enh)enhance(d); ctx2.putImageData(d,0,0); return window.jsQR(d.data,sw,sh,{inversionAttempts:'attemptBoth'}); }
  function scanBlue(sx,sy,sw,sh){ cv2.width=sw;cv2.height=sh; ctx2.drawImage(cv,sx,sy,sw,sh,0,0,sw,sh); var d=ctx2.getImageData(0,0,sw,sh); removeBlue(d); ctx2.putImageData(d,0,0); return window.jsQR(d.data,sw,sh,{inversionAttempts:'attemptBoth'}); }

  // 파란 송장 여부 사전 감지
  cv2.width=Math.min(cw,200); cv2.height=Math.min(ch,200);
  ctx2.drawImage(cv,0,0,cw,ch,0,0,cv2.width,cv2.height);
  var _sampleData=ctx2.getImageData(0,0,cv2.width,cv2.height);
  var _isBlue=isBlueLabel(_sampleData);

  var rx=Math.floor(cw/2), cy2=Math.floor(ch*.12), cw2=Math.floor(cw*.72), ch2=Math.floor(ch*.76);
  var r;
  if(_isBlue){
    // 파란 송장: 파란 배경 제거 버전 우선
    r=scanBlue(0,0,cw,ch)||scanBlue(rx,0,cw-rx,ch)||scan(0,0,cw,ch,true)||scan(Math.floor(cw*.14),cy2,cw2,ch2,false);
  } else {
    r=scan(0,0,cw,ch,false)||scan(rx,0,cw-rx,ch,false)||scan(Math.floor(cw*.14),cy2,cw2,ch2,false)||scan(0,0,cw,ch,true);
  }
  if(r&&r.data){
    if(r.data.indexOf('V1|')===0 || r.data.indexOf('V1\t')===0){
      if(statusEl) statusEl.textContent='✅ QR 인식!'; _emerHandleScan(r.data,statusEl);
    } else if(fallback){ fallback(); }
    else { if(statusEl) statusEl.textContent='✅ QR 인식!'; _emerHandleScan(r.data,statusEl); }
  }
  else if(fallback){ fallback(); }
  else { if(statusEl) statusEl.innerHTML='❌ 인식 실패 — 다시 찍어주세요'; }
}

function _parseQrText(text){
  if(!text) return {};
  var result = {};

  // 쿠팡 QR 파이프 구분 형식 우선 파싱
  if(text.indexOf('|') >= 0){
    var parts = text.split('|').map(function(p){ return p.trim(); }).filter(Boolean);
    // |V1|운송장|주소|상세주소|수령인|해시|위도|경도|타입|타임스탬프|
    // parts[0]=V1, [1]=운송장, [2]=주소, [3]=상세주소, [4]=수령인, [5]=해시, [6]=위도, [7]=경도
    if(parts[0] === 'V1' && parts.length >= 5){
      // 운송장 번호
      if(parts[1] && /^\d{10,20}$/.test(parts[1])){
        result.tracking_no = parts[1];
      }
      // 주소 (주소 + 상세주소 합치기)
      var addr = parts[2] || '';
      var addrDetail = parts[3] || '';
      if(addr) result.address = addrDetail ? addr + ' ' + addrDetail : addr;
      // 수령인 (김*우 패턴)
      if(parts[4] && parts[4].match(/[가-힣]+\*[가-힣]/)){
        result.recipient = parts[4];
      }
      // GPS 좌표 — 전체 파트 스캔 (고정 인덱스 아님 — 쿠팡 포맷 변경 대응)
      // 한국 좌표: lat 33~38, lng 126~130
      for(var gi=2; gi<parts.length-1; gi++){
        var pLat = parseFloat(parts[gi]);
        var pLng = parseFloat(parts[gi+1]);
        if(!isNaN(pLat) && !isNaN(pLng) &&
           pLat > 33 && pLat < 38 && pLng > 126 && pLng < 130){
          result.lat = pLat;
          result.lng = pLng;
          break;
        }
      }
      return result;
    }
  }

  // 일반 텍스트 폴백 파싱 (비쿠팡 형식)
  var lines = text.split(/[\n\r,]/).map(function(l){ return l.trim(); }).filter(Boolean);
  var full = text.replace(/\s+/g,' ');
  var recMatch = full.match(/[가-힣]{2,4}\*[가-힣]/) || full.match(/수령인[:\s]*([가-힣]{2,4})/);
  if(recMatch) result.recipient = recMatch[1]||recMatch[0];
  lines.forEach(function(l){
    if(!result.address && (l.match(/(시|구)\s*.*(로|길|동)/) || l.match(/(로|길)\s*\d+/) || l.match(/\d+동\s*\d+호/))){
      result.address = l;
    }
  });
  var ordMatch = full.match(/7[\d\.\-]{12,16}/);
  if(ordMatch) result.order_id = ordMatch[0].replace(/[^\d]/g,'');
  var memoMatch = full.match(/문\s*앞|경비실|자율출입|택배함|부재/);
  if(memoMatch) result.memo = memoMatch[0];
  return result;
}

function _cleanAddr(addr){
  if(!addr || typeof addr !== 'string') return '';
  return addr
    .replace(/["']\s*\(string\)/g, '')   // " (string) 제거
    .replace(/^["']+|["']+$/g, '')           // 앞뒤 따옴표 제거
    .replace(/\\n|\\t|\\r/g, ' ')       // 이스케이프 개행 제거
    .replace(/\s{2,}/g, ' ')                 // 연속 공백 단일화
    .trim();
}

function emerRefreshTrackingList(){
  var list = document.getElementById('emer-tracking-list');
  if(!list) return;

  var cnt = window._emerTrackings.length;

  // 스캔 카운터 업데이트
  var counter = document.getElementById('emer-scan-counter');
  if(counter){
    if(cnt > 0){
      counter.style.display = 'block';
      counter.textContent = cnt+'건 스캔됨';
      counter.style.animation = 'none';
      counter.offsetHeight; // reflow
      counter.style.animation = 'notiPop .3s ease';
    } else {
      counter.style.display = 'none';
    }
  }

  // 오프라인 감지 표시
  var offWarn = document.getElementById('emer-offline-warn');
  if(offWarn) offWarn.style.display = !navigator.onLine ? 'block' : 'none';

  // 스캔 목록 렌더 (최신 추가분 팝인 애니메이션)
  list.innerHTML = window._emerTrackings.map(function(t, i){
    var isNew = (i === cnt-1 && cnt > 0);
    var timeStr = window._emerTrackingTimes && window._emerTrackingTimes[t]
      ? window._emerTrackingTimes[t] : '';
    return '<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg3);border-radius:8px;border:1px solid var(--border);'+(isNew?'animation:notiPop .3s ease;border-color:var(--teal)':'')+'">'
      +'<span style="font-size:14px;flex-shrink:0">'+(i===0&&cnt===1?'📦':'📦')+'</span>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-family:monospace;font-weight:700;color:'+(isNew?'var(--teal)':'var(--text)')+'">'+t+'</div>'
      +(timeStr?'<div style="font-size:10px;color:var(--text3)">'+timeStr+' 스캔</div>':'')
      +'</div>'
      +'<span style="font-size:10px;color:var(--teal);font-weight:700;margin-right:4px">✓</span>'
      +'<button onclick="window._emerTrackings.splice('+i+',1);emerRefreshTrackingList()" '
      +'style="padding:2px 8px;background:var(--red-l,#fee2e2);color:var(--red);border:none;border-radius:4px;font-size:11px;cursor:pointer">✕</button>'
      +'</div>';
  }).join('');

function emerNativeCamQR(input){
  var statusEl = document.getElementById('emer-native-status');
  if(!input.files || !input.files[0]) return;
  var file = input.files[0];
  input.value = '';
  if(statusEl) statusEl.textContent = '🔍 QR 분석 중...';
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    var scale = Math.min(1, 2000/Math.max(img.naturalWidth, img.naturalHeight));
    var cw=Math.round(img.naturalWidth*scale), ch=Math.round(img.naturalHeight*scale);
    var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    cv.getContext('2d').drawImage(img,0,0,cw,ch);
    // BarcodeDetector 시도
    if('BarcodeDetector' in window){
      var bd; try{ bd=new BarcodeDetector({formats:['qr_code','data_matrix','aztec','code_128']}); }catch(e){ try{bd=new BarcodeDetector({formats:['qr_code']});}catch(e2){} }
      if(bd){ bd.detect(cv).then(function(codes){
        if(codes&&codes.length&&codes[0].rawValue){
          if(statusEl) statusEl.textContent='✅ QR 인식!';
          _emerHandleScan(codes[0].rawValue, statusEl); return;
        }
        _nativeCamJsQR(cv, cw, ch, statusEl);
      }).catch(function(){ _nativeCamJsQR(cv, cw, ch, statusEl); }); return; }
    }
    _nativeCamJsQR(cv, cw, ch, statusEl);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); if(statusEl) statusEl.textContent='❌ 이미지 로드 실패'; };
  img.src = url;
}

function _getEmerLocs(){
  var local = [];
  try{ local = JSON.parse(localStorage.getItem('mbti_emergency_del')||'[]'); }catch(e){}
  var todayLocs = local.filter(function(x){ return x.driver===S.curDriver && x.date===today() && x.gps&&x.gps.lat; });
  if(FB&&_db){
    _db.collection('emergency_deliveries')
      .where('driver','==',S.curDriver).where('date','==',today()).get()
      .then(function(snap){
        var fbLocs=[];
        snap.forEach(function(d){ var x=d.data(); x.fbId=d.id; if(x.gps&&x.gps.lat) fbLocs.push(x); });
        if(window._activeDriverMapEmerLocs && fbLocs.length > window._activeDriverMapEmerLocs.length){
          window._activeDriverMapEmerLocs.length = 0;
          fbLocs.forEach(function(x){ window._activeDriverMapEmerLocs.push(x); });
          if(window._rerenderRoutePins) window._rerenderRoutePins();
        }
      }).catch(function(){});
  }
  return Promise.resolve(todayLocs);
}

function emerAddTracking(){
  var inp = document.getElementById('emer-tracking-inp');
  if(!inp) return;
  var val = inp.value.replace(/[\.\-\s]/g,'').trim();
  if(!val){ toast('운송장 번호를 입력하세요'); return; }
  if(window._emerTrackings.indexOf(val)>=0){ toast('이미 추가된 번호입니다'); inp.value=''; return; }
  window._emerTrackings.push(val);
  inp.value = '';
  emerRefreshTrackingList();
}

function emerAddPhotos(files){
  if(!files||!files.length) return;
  Array.from(files).forEach(function(file){
    if(window._emerPhotos.length >= 5){ toast('사진은 최대 5장입니다'); return; }
    var reader = new FileReader();
    reader.onload = function(e){ window._emerPhotos.push(e.target.result); emerRefreshPhotoWrap(); };
    reader.readAsDataURL(file);
  });
}

async function emerSave(){
  if(window._emerSaving){ toast('⏳ 저장 중입니다...'); return; }
  window._emerSaving = true;

  if(!window._emerTrackings||!window._emerTrackings.length){
    var inp = document.getElementById('emer-tracking-inp')?.value.replace(/[\.\-\s]/g,'').trim();
    if(inp){ window._emerTrackings=[inp]; emerRefreshTrackingList(); }
    // 운송장 없어도 주소 있으면 저장 허용 (파란송장 등 OCR 부분 인식)
    else {
      var _addrCheck = (document.getElementById('emer-addr')?.value||'').trim();
      if(!_addrCheck){
        window._emerSaving=false;
        window._emerScanLock=false;
        toast('❌ 운송장 또는 주소를 입력해주세요');
        return;
      }
      // 주소만 있을 경우 임시 운송장 생성 (나중에 수정 가능)
      window._emerTrackings=['미확인-'+Date.now().toString().slice(-6)];
      emerRefreshTrackingList();
    }
  }
  // 사진 필수 조건 제거 (배송완료 사진은 지도 핀에서 처리)

  var orderId   = (document.getElementById('emer-orderid')?.value||'').trim();
  if(!orderId && window._pendingOrderId) orderId = window._pendingOrderId; // OCR 경로 보완
  var recipient = (document.getElementById('emer-recipient')?.value||'').trim(); if(!recipient) recipient='수령인 미상'; // v9.59
  var addr      = (document.getElementById('emer-addr')?.value||'').trim();
  // 카카오 매칭 도로명이 있으면 addr 강제 보정 (OCR 텍스트 오류 무력화)
  if(window._emerGps && window._emerGps.matchedAddr && window._emerGps.src && window._emerGps.src.indexOf('kakao')>=0){
    var mAddr = window._emerGps.matchedAddr;
    var mName = window._emerGps.matchedName || '';
    // addr이 카카오 도로명을 포함하지 않으면 → OCR 오인식이므로 강제 재구성
    if(addr && mAddr && addr.replace(/\s/g,'').indexOf(mAddr.replace(/\s/g,'').slice(0,8)) < 0){
      var hoM = addr.match(/(\d+호)/);
      var dongM2 = addr.match(/(\d+동)(?![아네은])/);
      var rebuilt2 = mAddr;
      if(mName && mName.indexOf(mAddr) < 0) rebuilt2 += ' ' + mName;
      if(dongM2 && rebuilt2.indexOf(dongM2[1])<0) rebuilt2 += ' ' + dongM2[1];
      if(hoM && rebuilt2.indexOf(hoM[1])<0) rebuilt2 += ' ' + hoM[1];
      rebuilt2 = rebuilt2.replace(/\s+/g,' ').trim();
      console.log('[emerSave ADDR_OVERRIDE v9.65]', addr, '→', rebuilt2);
      addr = rebuilt2;
      var emerAddrEl2 = document.getElementById('emer-addr');
      if(emerAddrEl2) emerAddrEl2.value = addr;
    }
  }
  var delivMemo = (document.getElementById('emer-delivmemo')?.value||'').trim();
  var memo      = (document.getElementById('emer-memo')?.value||'').trim();
  var now = new Date();

  // GPS 정제 (undefined 값 차단 — Firestore invalid-argument 방지)
  var gpsClean = null;
  if(window._emerGps && typeof window._emerGps.lat==='number' && typeof window._emerGps.lng==='number'){
    gpsClean = { lat: window._emerGps.lat, lng: window._emerGps.lng, acc: window._emerGps.acc||0, src: window._emerGps.src||'device' };
  }

  // 저장 직전 GPS 처리 — QR/OCR 때 이미 Geocoding 완료된 경우 재실행 안 함 (속도 개선)
  if(window._emerGps && window._emerGps.lat && 
     (window._emerGps.src==='geocode'||window._emerGps.src==='QR'||
      window._emerGps.src==='kakao'||window._emerGps.src==='kakao_addr'||
      window._emerGps.src==='kakao_kw'||window._emerGps.src==='kakao_kw2'||
      window._emerGps.src==='kakao_kw_dong'||window._emerGps.src==='kakao_kw_apt'||
      window._emerGps.src==='cache')){
    // 카카오/QR/Geocode 좌표 모두 재사용 (중복 geocoding 방지)
    gpsClean = {lat:window._emerGps.lat, lng:window._emerGps.lng, acc:0, src:window._emerGps.src};
    console.debug('[emerSave] 기존 GPS 사용:', window._emerGps.src);
  } else if(addr){
    // GPS 없거나 device GPS인 경우에만 geocoding 시도 (1.5초 타임아웃)
    var apiKey2 = window._cachedGoogleApiKey || localStorage.getItem('mbti_google_api_key') || '';
    if(apiKey2){
      try{
        var gcCtrl = new AbortController();
        var gcTimer = setTimeout(function(){ gcCtrl.abort(); }, 1500);
        var gcRes2 = await fetch(
          'https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(addr)+'&language=ko&region=kr&key='+apiKey2,
          { signal: gcCtrl.signal }
        );
        clearTimeout(gcTimer);
        var gcData2 = await gcRes2.json();
        if(gcData2.status==='OK' && gcData2.results && gcData2.results[0]){

// 배송완료 처리 모달 (지도 핀 클릭 → 완료사진 + Firebase 상태 업데이트)

async function _emerCompressPhoto(file, maxSize, quality){
  maxSize = maxSize || 1600; // 기본 1600px
  quality = quality || 0.85; // 기본 85%
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          var ratio = Math.min(maxSize/w, maxSize/h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        var cvs = document.createElement('canvas');
        cvs.width = w; cvs.height = h;
        cvs.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cvs.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){ reject(new Error('이미지 로드 실패')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('파일 읽기 실패')); };
    reader.readAsDataURL(file);
  });
}

// Storage 업로드 + 자동 재시도 (최대 3회) — 폴백 발생률 ↓↓

async function _emerStorageUpload(dataUrl, path, maxRetry){
  maxRetry = maxRetry || 3;
  var byteStr = atob(dataUrl.split(',')[1]);
  var ab = new ArrayBuffer(byteStr.length);
  var ia = new Uint8Array(ab);
  for(var j=0; j<byteStr.length; j++) ia[j] = byteStr.charCodeAt(j);
  var blob = new Blob([ab], {type:'image/jpeg'});

  var lastErr = null;
  for(var attempt=1; attempt<=maxRetry; attempt++){
    try{
      var ref = _st.ref(path);
      await ref.put(blob);
      var url = await ref.getDownloadURL();
      if(attempt > 1) console.log('✅ Storage 업로드 성공 (재시도 '+attempt+'회차)');
      return url;
    }catch(e){
      lastErr = e;
      console.warn('Storage 업로드 실패 ('+attempt+'/'+maxRetry+') —', e.code||e.message);
      if(attempt < maxRetry){
        // 재시도 대기 (점진 백오프: 500ms → 1000ms → 2000ms)
        await new Promise(function(r){ setTimeout(r, 500 * Math.pow(2, attempt-1)); });
      }
    }
  }
  throw lastErr || new Error('Storage 업로드 최종 실패');
}

// 배송완료 사진 추가

async function _emerVerifyWithClaude(file, googleOcrAddr){
  if(!file) return null;
  try{
    // 사진을 base64로
    var b64 = await new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onload = function(){ res((fr.result||'').split(',')[1] || ''); };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
    if(!b64) return null;

    var prompt = '이 송장 사진에서 정확한 한국어 주소를 추출해 주세요.\n\n'
      + 'Google OCR 결과 (오인식 가능): "' + (googleOcrAddr||'') + '"\n\n'
      + '특히 동번호(예: 408동), 호수(예: 505호), 도로명+번지를 사진에서 직접 읽어 정확히 추출하세요.\n'
      + '숫자 1자리 오인식 가능성 주의 (예: 408 vs 403, 408 vs 480).\n\n'
      + '응답 형식 (JSON만, 다른 설명 없이):\n'
      + '{"address":"정확한 도로명 주소","apt":"단지명","dong":"408동","ho":"505호","tracking":"운송장번호 12-13자리","recipient":"수령인"}\n'
      + '읽을 수 없는 필드는 빈 문자열 "".';

    var requestBody = {
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 500,
      messages: [{
        role:'user',
        content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
          {type:'text', text: prompt}
        ]
      }]
    };

    // ─── 1순위: Firestore의 anthropicApiKey로 직접 호출 ───
    var apiKey = '';
    if(FB && _db){
      try{
        var doc = await _fsGetCached('settings/claude_config', 20);
        if(doc && doc.anthropicApiKey) apiKey = doc.anthropicApiKey.trim();
      }catch(e){}
    }
    if(!apiKey) apiKey = (localStorage.getItem('mbti_anthropic_api_key')||'').trim();

    var resp = null, data = null;
    if(apiKey && apiKey.indexOf('sk-ant-') === 0){
      try{
        console.log('[ClaudeVerify v9.68a] Firestore 키로 직접 호출');
        resp = await fetch('https://api.anthropic.com/v1/messages', {
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'x-api-key': apiKey,
            'anthropic-version':'2023-06-01',
            'anthropic-dangerous-direct-browser-access':'true'
          },
          body: JSON.stringify(requestBody)
        });
        if(resp.ok) data = await resp.json();
        else console.warn('[ClaudeVerify direct] HTTP', resp.status);
      }catch(e1){ console.warn('[ClaudeVerify direct] error:', e1.message); }
    }

    // ─── 2순위: /claude-ocr 프록시 폴백 ───
    if(!data){
      try{
        console.log('[ClaudeVerify v9.68a] /claude-ocr 프록시 폴백');
        resp = await fetch('/claude-ocr', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(requestBody)
        });
        if(resp.ok) data = await resp.json();
        else console.warn('[ClaudeVerify proxy] HTTP', resp.status);
      }catch(e2){ console.warn('[ClaudeVerify proxy] error:', e2.message); }
    }

    if(!data){
      console.warn('[ClaudeVerify] 모든 경로 실패 — Claude 키 확인 필요');
      _geoResultBanner('⚠️ Claude 키 미설정 — 마이페이지에서 등록하세요');
      return null;
    }
    if(data.error){
      console.warn('[ClaudeVerify] API error:', data.error.message);
      return null;
    }
    var text = (data.content||[]).map(function(x){return x.text||'';}).join('').trim();
    text = text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    var parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ console.warn('[ClaudeVerify] JSON parse fail:', text.slice(0,200)); return null; }
    console.log('[ClaudeVerify v9.68a]', parsed);
    return parsed;
  }catch(e){
    console.warn('[ClaudeVerify] error:', e.message);
    return null;
  }
}

// 배송 핀 지도

function gpsDistance(lat1,lng1,lat2,lng2){
  if(lat1==null||lng1==null||lat2==null||lng2==null)return Infinity;
  var R=6371000,toRad=function(d){return d*Math.PI/180;};
  var dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function openDeliveryMap(){
  var did=localStorage.getItem('mbti_emer_dealerId')||(_CU&&_CU.uid)||'';
  var today=new Date().toISOString().slice(0,10);
  if(!did){toast('로그인 후 이용하세요');return;}
  toast('📍 지도 로딩 중...');
  try{
    var snap=await _db.collection('emergency_deliveries')
      .where('dealerId','==',did)
      .where('date','==',today)
      .limit(100).get();
    var locs=[];
    var kKey=window._cachedKakaoApiKey||localStorage.getItem('mbti_kakao_api_key')||'';
    for(var i=0;i<snap.docs.length;i++){
      var d=snap.docs[i];
      var x=d.data();x.fbId=d.id;
      // GPS 없거나 이전 방식으로 저장된 경우 재검색
      var needGeo=!x.gps||!x.gps.lat||!x.gps.src||x.gps.src==='kakao'||x.gps.src==='kakao-kw';
      if(needGeo&&x.addr&&kKey){
        try{
          var gDong=/(\d+)동/.exec(x.addr);
          if(gDong){
            // [1단계] 도로명(동 이전)으로 address 검색 → 단지명(building_name) 획득
            var gBaseQ=x.addr.replace(/,/g,' ').replace(/\s*\d+동.*/,'').replace(/\s+/g,' ').trim();
            var gR1=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(gBaseQ)+'&size=1',
              {headers:{'Authorization':'KakaoAK '+kKey}});
            var gKd1=await gR1.json();
            var gDoc1=gKd1.documents&&gKd1.documents[0];
            var gBldName=(gDoc1&&gDoc1.road_address&&gDoc1.road_address.building_name)||'';
            var gBaseLat=gDoc1?parseFloat(gDoc1.y):null;
            var gBaseLng=gDoc1?parseFloat(gDoc1.x):null;
            var gGot=false;
            // [2단계] "단지명 N동" keyword 검색 → 단지 중심 500m 반경 내에서 정확한 동 건물 좌표
            if(gBldName&&gBaseLat){
              var gKwQ2=gBldName+' '+gDong[1]+'동';
              var gKwUrl='https://dapi.kakao.com/v2/local/search/keyword.json?query='+encodeURIComponent(gKwQ2)
                +'&x='+gBaseLng+'&y='+gBaseLat+'&radius=500&size=1';
              var gR2=await fetch(gKwUrl,{headers:{'Authorization':'KakaoAK '+kKey}});
              var gKd2=await gR2.json();
              if(gKd2.documents&&gKd2.documents[0]){
                var gKwLat=parseFloat(gKd2.documents[0].y),gKwLng=parseFloat(gKd2.documents[0].x);
                if(gpsDistance(gBaseLat,gBaseLng,gKwLat,gKwLng)<500){
                  x.gps={lat:gKwLat,lng:gKwLng,acc:0,src:'kakao-dong'};
                  _db.collection('emergency_deliveries').doc(x.fbId).update({gps:x.gps}).catch(function(){});
                  gGot=true;
                }
              }
            }
            // fallback: 단지 중심 좌표
            if(!gGot&&gBaseLat){
              x.gps={lat:gBaseLat,lng:gBaseLng,acc:0,src:'kakao'};
              _db.collection('emergency_deliveries').doc(x.fbId).update({gps:x.gps}).catch(function(){});
            }
          }else{
            // 일반 주소 (동 없음) — 호/층 제거 후 건물 단위로 지오코딩
            var gQ3=x.addr.replace(/,?\s*\d+\s*(층|호).*/,'').replace(/\s+/g,' ').trim()||x.addr;
            var gR3=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(gQ3)+'&size=1',
              {headers:{'Authorization':'KakaoAK '+kKey}});
            var gKd3=await gR3.json();
            if(gKd3.documents&&gKd3.documents[0]){
              x.gps={lat:parseFloat(gKd3.documents[0].y),lng:parseFloat(gKd3.documents[0].x),acc:0,src:'kakao'};
              _db.collection('emergency_deliveries').doc(x.fbId).update({gps:x.gps}).catch(function(){});
            }
          }
        }catch(e2){}
      }
      locs.push(x);
    }
    locs.sort(function(a,b){return (b.savedAt||'').localeCompare(a.savedAt||'');});
    _showMapModal(locs);
  }catch(e){toast('❌ 오류: '+e.message);}
}

function _loadLeafletMap(locs){
  if(window.L){setTimeout(function(){_renderLeafletMap(locs);},50);return;}
  var link=document.createElement('link');
  link.rel='stylesheet';
  link.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
  s.onload=function(){setTimeout(function(){_renderLeafletMap(locs);},100);};
  s.onerror=function(){
    var el=document.getElementById('dm-map');
    if(el)el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:rgba(255,255,255,.4);padding:16px;text-align:center">지도 로드 실패<br>아래 목록에서 완료처리 가능합니다</div>';
  };
  document.head.appendChild(s);
}

function _renderLeafletMap(locs){
  var el=document.getElementById('dm-map');
  if(!el||!window.L)return;
  if(el._leaflet_id)return;
  var center=[locs[0].gps.lat,locs[0].gps.lng];
  var map=L.map(el,{zoomControl:false,attributionControl:false}).setView(center,15);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true}).addTo(map);

  // 동일/인근 좌표 그룹핑 — 50m 이내 OR 동일 건물 주소(호/층 제거 후 일치)
  // 동 주소는 동 단위로 유지, 호/층만 제거 → 아파트는 동별 핀, 오피스는 건물별 핀
  function _baseAddr(a){return (a||'').replace(/,?\s*\d+\s*(층|호).*/,'').replace(/\s+/g,' ').trim();}
  var groups=[];
  locs.forEach(function(x){
    var ba=_baseAddr(x.addr);
    var hasDong=/\d+동/.test(x.addr||'');
    var found=null;
    for(var p=0;p<groups.length;p++){
      var sameBuilding=ba&&groups[p].baseAddr&&ba===groups[p].baseAddr;
      var grpHasDong=groups[p].items[0]&&/\d+동/.test(groups[p].items[0].addr||'');
      // 동 없는 주소만 거리 클러스터링 (아파트 동간 혼용 방지)
      var nearby=!hasDong&&!grpHasDong&&gpsDistance(x.gps.lat,x.gps.lng,groups[p].lat,groups[p].lng)<50;
      if(sameBuilding||nearby){found=groups[p];break;}
    }
    if(found){found.items.push(x);}
    else{groups.push({lat:x.gps.lat,lng:x.gps.lng,baseAddr:ba,items:[x]});}
  });

  var bounds=[];
  groups.forEach(function(grp){
    var n=grp.items.length;
    grp.items.sort(function(a,b){
      var ma=(a.addr||'').match(/(\d+)동/),mb=(b.addr||'').match(/(\d+)동/);
      return ((ma?parseInt(ma[1]):9999)-(mb?parseInt(mb[1]):9999));
    });
    var idxList=grp.items.map(function(x){return x._locsIdx!=null?x._locsIdx:0;});
    var allDone=grp.items.every(function(x){return x.status==='완료';});
    var anyDone=grp.items.some(function(x){return x.status==='완료';});
    var clr=allDone?'#16a34a':(anyDone?'#f97316':'#dc2626');
    var ll=[grp.lat,grp.lng];
    bounds.push(ll);
    var pinHtml;
    if(n===1){
      pinHtml='<div style="width:28px;height:28px;border-radius:50%;background:'+clr+';border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)">'+(idxList[0]+1)+'</div>';
    } else {
      pinHtml='<div style="width:36px;height:36px;border-radius:50%;background:'+clr+';border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5)">'+n+'</div>';
    }
    var icon=L.divIcon({className:'',html:pinHtml,iconSize:n===1?[28,28]:[36,36],iconAnchor:n===1?[14,14]:[18,18]});
    var popupHtml=n===1
      ?(function(){var x=grp.items[0];var dm=(x.addr||'').match(/(\d+)동/);return '<b>'+(x.recipient||'미확인')+(dm?' <span style="background:#c9a84c;color:#000;font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700">'+dm[1]+'동</span>':'')+'</b><br><span style="font-size:11px;color:#aaa">'+(x.addr||'')+'</span>';}())
      :'<b>'+n+'건</b><br><span style="font-size:11px;color:#aaa">'+(_baseAddr(grp.items[0].addr||'')||grp.items[0].addr||'')+'</span>';
    (function(idxList,grp){
      L.marker(ll,{icon:icon}).addTo(map)
        .bindPopup(popupHtml)
        .on('click',function(){
          var mo=document.getElementById('delivery-map-mo');
          if(!mo)return;
          map.flyTo(ll,17,{animate:true,duration:0.6});
          var allCards=mo.querySelectorAll('[data-map-idx]');
          for(var ci=0;ci<allCards.length;ci++) allCards[ci].style.display='none';
          var first=true;
          for(var ii=0;ii<idxList.length;ii++){
            var c=mo.querySelector('[data-map-idx="'+idxList[ii]+'"]');
            if(c){
              c.style.display='';
              if(first){c.scrollIntoView({behavior:'smooth',block:'nearest'});first=false;}
              c.style.boxShadow='0 0 0 2px #c9a84c,0 0 12px rgba(201,168,76,.4)';
              setTimeout((function(cc){return function(){cc.style.boxShadow='';};})(c),2000);
            }
          }
          var bar=mo.querySelector('#map-filter-bar');
          var txt=mo.querySelector('#map-filter-txt');
          if(bar)bar.style.display='flex';
          if(txt){
            var ba2=_baseAddr(grp.items[0].addr||'');
            txt.textContent=(ba2||grp.items[0].addr||'')+(n>1?' · '+n+'건':'');
          }
        });
    })(idxList,grp);
  });

  if(bounds.length>1)map.fitBounds(bounds,{padding:[20,20]});
  setTimeout(function(){map.invalidateSize();},300);

  // 실시간 내 위치 추적
  if(window._geoWatchId!=null){navigator.geolocation.clearWatch(window._geoWatchId);window._geoWatchId=null;}
  if(navigator.geolocation){
    var locCircle=null;
    var locIcon=L.divIcon({
      className:'',
      html:'<div style="width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 5px rgba(59,130,246,.3)"></div>',
      iconSize:[18,18],iconAnchor:[9,9]
    });
    // 내 위치로 이동 버튼
    var BtnCtrl=L.Control.extend({
      onAdd:function(){
        var d=L.DomUtil.create('div','');
        d.innerHTML='<button title="내 위치로 이동" style="width:36px;height:36px;background:#fff;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:manipulation"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>';
        d.querySelector('button').addEventListener('click',function(e){
          e.stopPropagation();
          if(window._geoLocMarker){map.setView(window._geoLocMarker.getLatLng(),17);}
          else{_filoToast&&_filoToast('위치 권한을 허용해 주세요');}
        });
        L.DomEvent.disableClickPropagation(d);
        return d;
      }
    });
    new BtnCtrl({position:'bottomleft'}).addTo(map);
    window._geoLocMarker=null;
    window._geoWatchId=navigator.geolocation.watchPosition(function(pos){
      var ll=[pos.coords.latitude,pos.coords.longitude];
      if(!window._geoLocMarker){
        window._geoLocMarker=L.marker(ll,{icon:locIcon,zIndexOffset:2000}).addTo(map);
        locCircle=L.circle(ll,{radius:pos.coords.accuracy||30,color:'#3b82f6',fillColor:'#93c5fd',fillOpacity:0.15,weight:1}).addTo(map);
      }else{
        window._geoLocMarker.setLatLng(ll);
        if(locCircle){locCircle.setLatLng(ll);locCircle.setRadius(pos.coords.accuracy||30);}
      }
    },function(err){
      if(err.code===1){var t=document.getElementById('geo-denied-hint');if(!t){var h=document.createElement('div');h.id='geo-denied-hint';h.style.cssText='position:absolute;bottom:60px;left:8px;z-index:1000;background:rgba(220,38,38,.9);color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;pointer-events:none';h.textContent='위치 권한을 허용해 주세요';var mp=document.getElementById('dm-map');if(mp){mp.style.position='relative';mp.appendChild(h);setTimeout(function(){h.remove();},4000);}}}
    },{enableHighAccuracy:false,maximumAge:10000,timeout:30000});
  }
}

window._fuParsedRows = [];

async function _fuHandleFile(inp) {
  var file = inp.files[0];
  if(!file) return;
  var status = document.getElementById('fu-status');
  var preview = document.getElementById('fu-preview');
  if(status) status.textContent = '⏳ 파일 읽는 중...';
  if(preview) preview.innerHTML = '';
  document.getElementById('fu-save-wrap').style.display = 'none';
  var ext = file.name.split('.').pop().toLowerCase();
  var rows = [];
  try {
    if(ext === 'csv' || ext === 'txt') {
      var text = await file.text();
      rows = _fuParseCSV(text);
    } else if(ext === 'xlsx' || ext === 'xls') {
      rows = await _fuParseExcel(file);
    } else {
      if(status) status.textContent = '❌ CSV 또는 Excel 파일만 지원합니다';
      return;
    }
  } catch(e) {
    if(status) status.textContent = '❌ 파일 읽기 실패: ' + e.message;
    return;
  }
  if(!rows || rows.length < 2) {
    if(status) status.textContent = '❌ 데이터가 없습니다 (헤더 포함 2행 이상 필요)';
    return;
  }
  var mapped = _fuMapColumns(rows);
  window._fuParsedRows = mapped;
  if(status) status.textContent = '✅ ' + mapped.length + '건 인식됨 — 아래에서 확인 후 저장하세요';
  _fuRenderPreview(mapped);
  document.getElementById('fu-save-wrap').style.display = 'block';
}

function _fuParseCSV(text) {
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var lines = text.split('\n').filter(function(l){ return l.trim(); });
  var firstLine = lines[0] || '';
  var sep = firstLine.indexOf('\t') >= 0 ? '\t' : (firstLine.split(';').length > firstLine.split(',').length ? ';' : ',');
  return lines.map(function(line) {
    var cells = [], cur = '', inQ = false;
    for(var i = 0; i < line.length; i++) {
      var ch = line[i];
      if(ch === '"') { inQ = !inQ; }
      else if(ch === sep && !inQ) { cells.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cells.push(cur.trim());
    return cells;
  });
}

async function _fuParseExcel(file) {
  if(!window.XLSX) {
    await new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  var buf = await file.arrayBuffer();
  var wb = XLSX.read(buf, { type: 'array' });
  var ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
}

function _fuMapColumns(rows) {
  var header = rows[0].map(function(h){ return String(h).toLowerCase().trim(); });
  function findIdx(names) {
    for(var i = 0; i < names.length; i++)
      for(var j = 0; j < header.length; j++)
        if(header[j].indexOf(names[i]) >= 0) return j;
    return -1;
  }
  var iName     = findIdx(['이름','수령인','받는분','name','recipient','고객명']);
  var iAddr     = findIdx(['주소','address','addr','배송지','배송주소']);
  var iPhone    = findIdx(['전화','연락처','phone','tel','mobile','휴대폰']);
  var iTracking = findIdx(['운송장','송장','tracking','택배번호','운송장번호']);
  var iMemo     = findIdx(['메모','memo','note','비고','요청사항']);
  var result = [];
  for(var r = 1; r < rows.length; r++) {
    var row = rows[r];
    if(row.every(function(c){ return !String(c).trim(); })) continue;
    var addr = iAddr >= 0 ? String(row[iAddr]||'').trim() : '';
    if(!addr) continue;
    result.push({
      recipient: iName >= 0 ? String(row[iName]||'').trim() : '',
      addr: addr,
      phone: iPhone >= 0 ? String(row[iPhone]||'').trim() : '',
      tracking: iTracking >= 0 ? String(row[iTracking]||'').trim() : '',
      memo: iMemo >= 0 ? String(row[iMemo]||'').trim() : ''
    });
  }
  return result;
}

function _fuRenderPreview(rows) {
  var preview = document.getElementById('fu-preview');
  if(!preview) return;
  var cols = [{key:'recipient',label:'수령인'},{key:'addr',label:'주소'},{key:'phone',label:'연락처'},{key:'tracking',label:'운송장'}];
  var html = '<table style="width:100%;border-collapse:collapse;font-size:11px">'
    + '<thead><tr>' + cols.map(function(c){
        return '<th style="padding:5px 6px;background:var(--bg3);color:var(--text2);text-align:left;border-bottom:1px solid var(--border)">'+c.label+'</th>';
      }).join('') + '</tr></thead><tbody>';
  rows.slice(0,10).forEach(function(row){
    html += '<tr>' + cols.map(function(c){
      return '<td style="padding:4px 6px;border-bottom:1px solid var(--border);color:var(--text);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(row[c.key]||'—')+'</td>';
    }).join('') + '</tr>';
  });
  if(rows.length > 10) html += '<tr><td colspan="4" style="padding:6px;text-align:center;color:var(--text3)">... 외 '+(rows.length-10)+'건</td></tr>';
  preview.innerHTML = html + '</tbody></table>';
}

async function _fuSaveAll() {
  var rows = window._fuParsedRows;
  if(!rows || !rows.length) { toast('저장할 데이터가 없습니다'); return; }
  var btn = document.querySelector('#file-upload-mo button[onclick="_fuSaveAll()"]');
  if(btn) { btn.disabled = true; btn.textContent = '⏳ 저장 중...'; }
  var now = new Date();
  var todayStr = now.toISOString().slice(0,10);
  var timeStr = now.toTimeString().slice(0,5);
  var did = (_CU&&_CU.uid) || localStorage.getItem('mbti_emer_dealerId') || 'shared';
  var driver = S.curDriver || localStorage.getItem('mbti_emer_driver') || '';
  var camp = (_CU&&_CU.camp) || localStorage.getItem('mbti_emer_camp') || '';
  var kKey = window._cachedKakaoApiKey || localStorage.getItem('mbti_kakao_api_key') || '';
  var saved = 0, failed = 0;
  for(var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var gps = null;
    if(row.addr && kKey) {
      try {
        var kRes = await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(row.addr),
          { headers: {'Authorization':'KakaoAK '+kKey} });
        var kData = await kRes.json();
        if(kData.documents && kData.documents[0]) {
          var kd = kData.documents[0];
          gps = {lat:parseFloat(kd.y),lng:parseFloat(kd.x),acc:0,src:'kakao'};
        }
      } catch(e) {}
    }
    var record = {
      type:'emergency_delivery', driver:driver, dealerId:did, camp:camp,
      recipient:row.recipient||'', addr:row.addr||'', phone:row.phone||'',
      tracking:row.tracking||'', trackings:row.tracking?[row.tracking]:[],
      order_id:'', delivery_memo:row.memo||'', memo:'',
      gps:gps, photos:[], entryMode:'file',
      date:todayStr, time:timeStr, savedAt:now.toISOString()
    };
    try {
      if(FB&&_db) { await _db.collection('emergency_deliveries').add(record); }
      else {
        var list = JSON.parse(localStorage.getItem('mbti_emergency_del')||'[]');
        list.push(Object.assign({},record,{_localId:'emer_'+Date.now()+'_'+i}));
        localStorage.setItem('mbti_emergency_del',JSON.stringify(list));
      }
      saved++;
    } catch(e) { failed++; }
  }
  toast('✅ '+saved+'건 저장'+(failed?' / ❌ '+failed+'건 실패':''));
  document.getElementById('file-upload-mo')?.remove();
  loadTodayStats();
  window._emerSaveCount = (window._emerSaveCount||0)+saved;
  _updateEmerCounters();
}

var _aiHintTimer = null;
window._aiGps = null;

function _aiAddrInput() {
  clearTimeout(_aiHintTimer);
  var addr = (document.getElementById('ai-addr')||{}).value.trim();
  if(addr.length < 4) return;
  _aiHintTimer = setTimeout(function(){ _aiGeocodeHint(addr); }, 700);
}

async function _aiGeocodeHint(addr) {
  var hint = document.getElementById('ai-addr-hint');
  if(!hint) return;
  var kKey = window._cachedKakaoApiKey || localStorage.getItem('mbti_kakao_api_key') || '';
  if(!kKey) { hint.textContent = '(API 키 없음 — GPS 없이 등록됩니다)'; return; }
  try {
    var res = await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr),
      { headers: {'Authorization':'KakaoAK '+kKey} });
    var data = await res.json();
    if(data.documents && data.documents[0]) {
      var doc = data.documents[0];
      hint.innerHTML = '<span style="color:#34d399">📍 '+( doc.address_name || addr)+' (GPS 인식됨)</span>';
      window._aiGps = {lat:parseFloat(doc.y),lng:parseFloat(doc.x),acc:0,src:'kakao'};
    } else {
      hint.innerHTML = '<span style="color:#f87171">⚠️ 주소 미인식 — 그래도 등록 가능합니다</span>';
      window._aiGps = null;
    }
  } catch(e) { window._aiGps = null; }
}

async function _aiSave() {
  var addr = (document.getElementById('ai-addr')||{}).value.trim();
  if(!addr) { toast('주소를 입력하세요'); return; }
  var recipient = (document.getElementById('ai-recipient')||{}).value.trim();
  var phone     = (document.getElementById('ai-phone')||{}).value.trim();
  var tracking  = (document.getElementById('ai-tracking')||{}).value.trim();
  var btn = document.querySelector('#addr-input-mo button[onclick="_aiSave()"]');
  if(btn) { btn.disabled = true; btn.textContent = '⏳ 저장 중...'; }
  var gps = window._aiGps || null;
  if(!gps) {
    var kKey = window._cachedKakaoApiKey || localStorage.getItem('mbti_kakao_api_key') || '';
    if(kKey) {
      try {
        var res2 = await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(addr),
          { headers: {'Authorization':'KakaoAK '+kKey} });
        var data2 = await res2.json();
        if(data2.documents && data2.documents[0]) {
          var d2 = data2.documents[0];
          gps = {lat:parseFloat(d2.y),lng:parseFloat(d2.x),acc:0,src:'kakao'};
        }
      } catch(e) {}
    }
  }
  var now = new Date();
  var did = (_CU&&_CU.uid) || localStorage.getItem('mbti_emer_dealerId') || 'shared';
  var driver = S.curDriver || localStorage.getItem('mbti_emer_driver') || '';
  var camp = (_CU&&_CU.camp) || localStorage.getItem('mbti_emer_camp') || '';
  var record = {
    type:'emergency_delivery', driver:driver, dealerId:did, camp:camp,
    recipient:recipient, addr:addr, phone:phone,
    tracking:tracking, trackings:tracking?[tracking]:[],
    order_id:'', delivery_memo:'', memo:'',
    gps:gps, photos:[], entryMode:'manual',
    date:now.toISOString().slice(0,10), time:now.toTimeString().slice(0,5),
    savedAt:now.toISOString()
  };
  try {
    if(FB&&_db) { await _db.collection('emergency_deliveries').add(record); }
    else {
      var list2 = JSON.parse(localStorage.getItem('mbti_emergency_del')||'[]');
      list2.push(Object.assign({},record,{_localId:'emer_'+Date.now()}));
      localStorage.setItem('mbti_emergency_del',JSON.stringify(list2));
    }
    toast('✅ 배송 등록 완료'+(gps?' (GPS 인식됨)':''));
    document.getElementById('addr-input-mo')?.remove();
    window._aiGps = null;
    loadTodayStats();
    window._emerSaveCount = (window._emerSaveCount||0)+1;
    _updateEmerCounters();
  } catch(e) {
    toast('❌ 저장 실패: '+e.message);
    if(btn) { btn.disabled=false; btn.textContent='💾 배송 등록'; }
  }
}
