<!DOCTYPE html>

<title>배송 — DONWAY</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--border:rgba(255,255,255,.12);--r:10px;--rl:14px;--blue:#185FA5;--blue-l:#E6F1FB;--red:#A32D2D;--red-l:#FCEBEB;--green:#3B6D11;--green-l:#EAF3DE;--teal:#0F6E56;--teal-l:#E1F5EE;--amber:#854F0B;--amber-l:#FAEEDA;--gray:#5F5E5A;--gray-l:#F1EFE8;--gray-m:#D3D1C7;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh}
.top-bar{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top-logo{font-size:13px;font-weight:800;letter-spacing:1px;color:#60a5fa}
.top-title{font-size:16px;font-weight:700;flex:1;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-blue{background:#3b82f6;color:#fff;border-color:#3b82f6}
.btn-teal{background:#0d9488;color:#fff;border-color:#0d9488}
.btn-red{background:#dc2626;color:#fff;border-color:#dc2626}
.main-area{padding:16px;max-width:600px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px}
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat-box{flex:1;background:var(--bg3);border-radius:8px;padding:10px;text-align:center}
.stat-num{font-size:24px;font-weight:800;color:#60a5fa}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.action-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.action-btns .btn{flex:1;min-width:140px;justify-content:center;padding:14px;font-size:14px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--bg2);border-radius:16px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo .logo-text{font-size:20px;font-weight:900;color:#60a5fa;letter-spacing:2px}
.login-logo .sub{font-size:12px;color:var(--text3);margin-top:4px}
input[type=email],input[type=password],input[type=text],input[type=tel]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:var(--bg3);color:var(--text);transition:.15s}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.form-group{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
/* 토스트 */
#toast-container{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast-item{background:rgba(0,0,0,.85);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:.3s;max-width:300px;text-align:center}
.toast-item.show{opacity:1}
</style>

firebase.initializeApp({

var _db=firebase.firestore(),_auth=firebase.auth(),_storage=firebase.storage();
var _fbReady=true;
var _st=_storage; // v9 호환
var _CU=null,FB=true;

// did URL 파라미터 즉시 저장

// ── 토스트 (toast-container 방식) ──
function toast(msg, duration){
  var container=document.getElementById('toast-container');
  if(!container){console.log('[toast]',msg);return;}
  var el=document.createElement('div');
  el.className='toast-item';el.textContent=msg;
  container.appendChild(el);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ el.classList.add('show'); });
  });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);
  },duration||2500);
}

var _SA_EM=['kimdh4790@gmail.com','soungkyekim@naver.com'];
// _auth.onAuthStateChanged disabled — 캠프+이름 방식 사용
if(false) _auth.onAuthStateChanged(function(user){
  if(user){
    _CU={uid:user.uid,email:user.email,dealerId:user.uid};
    window._CU=_CU;
    // 구독 체크
    _db.collection('companies').doc(user.uid).get().then(function(snap){
      var co=snap.exists?snap.data():{};
      var isSA=_SA_EM.indexOf(user.email)>=0;
      var subs=(co.subscriptions||{});
      var sub=subs.mbtico||subs.delivery||subs.settle||{};
      var today=new Date().toISOString().slice(0,10);
      var ok=isSA||(sub.active&&(!sub.expiry||sub.expiry>=today))||co.settlePaid;
      if(!ok){
        document.getElementById('login-screen').style.display='flex';
        document.getElementById('main-screen').style.display='none';
        toast('❌ 구독이 필요합니다. 관리자에게 문의하세요.');
        _auth.signOut();
        return;
      }
      S.curDriver=user.email||''; S.curAdminName=user.email||'';
      document.getElementById('login-screen').style.display='none';
      document.getElementById('main-screen').style.display='block';
      loadApiKeys();loadTodayStats();
      // 3도메인 통합 연결
      fetch('/api/link-account',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:user.email,fromDomain:'mbtico.kr'})}).catch(function(){});
    }).catch(function(){
      S.curDriver=user.email||'';
      document.getElementById('login-screen').style.display='none';
      document.getElementById('main-screen').style.display='block';
      loadApiKeys();loadTodayStats();
    });
  } else {
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('main-screen').style.display='none';
  }
});


// emergency 로그인 — 캠프+이름 방식 (delivery 동일)
var _emerSelCamp = localStorage.getItem('mbti_emer_camp') || '';
var _emerSelDriver = localStorage.getItem('mbti_emer_driver') || '';

function _emerInitLogin() {
  var camps = window._CO_EMER_CAMPS || ['부산1','부산2','부산3','대구2','진주M'];
  var row = document.getElementById('emer-camp-row');
  if(!row) return;
  row.innerHTML = '';
  camps.forEach(function(c) {
    var btn = document.createElement('button');
    btn.textContent = c;
    btn.setAttribute('data-camp', c);
    var isSel = c === _emerSelCamp;
    btn.style.cssText = 'padding:10px 4px;background:'+(isSel?'rgba(201,168,76,.2)':'rgba(255,255,255,.05)')+';border:1.5px solid '+(isSel?'#c9a84c':'rgba(255,255,255,.15)')+';border-radius:8px;color:'+(isSel?'#c9a84c':'#e2e8f0')+';font-size:12px;font-weight:700;cursor:pointer;text-align:center';
    btn.onclick = function() {
      _emerSelCamp = this.getAttribute('data-camp');
      _emerInitLogin(); // 리렌더
    };
    row.appendChild(btn);
  });
  // 저장된 이름 복원
  var inp = document.getElementById('emer-driver-name');
  if(inp && _emerSelDriver) {
    inp.value = _emerSelDriver;
    var loginBtn = document.getElementById('emer-login-btn');
    if(loginBtn) { loginBtn.disabled = false; loginBtn.style.opacity = '1'; }
  }
  // 회사명 로드
  _emerLoadCoName();
}

function _emerLoadCoName() {
  var urlDid = new URLSearchParams(location.search).get('did');
  if(urlDid) localStorage.setItem('mbti_emer_dealerId', urlDid); // URL에 있으면 즉시 저장
  var did = urlDid || localStorage.getItem('mbti_emer_dealerId') || '';
  if(!did) {
    // did 없으면 기본 CAMPS 사용
    return;
  }
  var savedName = localStorage.getItem('mbti_emer_coname');
  if(savedName) {
    var t = document.getElementById('emer-co-name');
    var s = document.getElementById('emer-co-sub');
    if(t) t.textContent = savedName;
    if(s) s.textContent = savedName + ' 기사 전용';
  }
  if(!_fbReady || !_db) return;
  _db.collection('companies').doc(did).get().then(function(snap) {
    if(!snap.exists) return;
    var co = snap.data();
    var name = co.companyName || co.company || '배송앱';
    localStorage.setItem('mbti_emer_dealerId', did);
    localStorage.setItem('mbti_emer_coname', name);
    if(co.camps && co.camps.length) window._CO_EMER_CAMPS = co.camps;
    var t2 = document.getElementById('emer-co-name');
    var s2 = document.getElementById('emer-co-sub');
    if(t2) t2.textContent = name;
    if(s2) s2.textContent = name + ' 기사 전용';
    document.title = name + ' 배송앱';
    _emerInitLogin(); // 캠프 목록 갱신
  }).catch(function(){});
}

function _emerDoLogin() {
  var name = (document.getElementById('emer-driver-name')||{}).value.trim();
  if(!name) { _emerToast('이름을 입력하세요'); return; }
  if(!_emerSelCamp) { _emerToast('캠프를 선택하세요'); return; }
  _emerSelDriver = name;
  localStorage.setItem('mbti_emer_driver', name);
  localStorage.setItem('mbti_emer_camp', _emerSelCamp);
  // _CU 설정 (기존 코드와 호환)
  var did = new URLSearchParams(location.search).get('did')
          || localStorage.getItem('mbti_emer_dealerId') || 'shared';
  _CU = { uid: did, email: '', dealerId: did, driver: name, camp: _emerSelCamp };
  window._CU = _CU;
  // 로그인 화면 → 메인 화면
  var ls = document.getElementById('login-screen');
  var ms = document.getElementById('main-screen');
  if(ls) ls.style.display = 'none';
  if(ms) ms.style.display = 'block';
  // 상단 회사명 표시
  var topLogo = document.querySelector('.top-logo');
  if(topLogo) {
    var coName = localStorage.getItem('mbti_emer_coname') || 'DONWAY';
    topLogo.textContent = coName;
  }
  loadApiKeys();
  loadTodayStats();
}

function _emerToast(msg) {
  toast(msg);
}

function doLogin(){
  var email=document.getElementById('login-email').value.trim();
  var pw=document.getElementById('login-pw').value;
  if(!email||!pw){toast('이메일과 비밀번호를 입력해주세요');return;}
  _auth.signInWithEmailAndPassword(email,pw).catch(function(e){toast('❌ 로그인 실패: '+e.message);});
}
function doLogout(){
  localStorage.removeItem('mbti_emer_driver');
  localStorage.removeItem('mbti_emer_camp');
  _emerSelDriver='';
  _emerSelCamp='';
  _CU=null;window._CU=null;
  var ls=document.getElementById('login-screen');
  var ms=document.getElementById('main-screen');
  if(ms)ms.style.display='none';
  if(ls)ls.style.display='flex';
  _auth.signOut().catch(function(){});

function loadApiKeys(){

// ═══════════════════════════════════════
// OCR / 스캔
// ═══════════════════════════════════════
async function emerOcrScan(file, _statusOverride){
  if(!file) return;
  var status = _statusOverride || document.getElementById('emer-ocr-status');
  if(!window._emerGps || window._emerGps.src==='device_fallback') window._emerGps=null;

  // 1단계 — jsQR로 QR 코드 먼저 해독 (API 비용 0, 빠름)
  // 사진을 네이티브 카메라로 찍으면 고해상도+자동초점 → jsQR 인식률 대폭 향상
  if(status) status.innerHTML = '<span style="color:var(--blue)">📷 QR 코드 분석 중...</span>';
  try{
    var qrResult = await new Promise(function(resolve){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = async function(){
        URL.revokeObjectURL(url);
        // 최대 1600px (QR 밀도 대응, 너무 크면 jsQR 느려짐)
        var max = 1600;
        var w = img.width, h = img.height;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, w, h);

        // ① BarcodeDetector — 파일에서 직접 ImageBitmap 생성 (가장 정확)
        if('BarcodeDetector' in window){
          try{
            var bd = new BarcodeDetector({formats:['qr_code','aztec','data_matrix']}); // 바코드포맷제거
            // 원본 파일로 직접 ImageBitmap 생성 (canvas 경유 없이 = 품질 손실 없음)
            var bmp = await createImageBitmap(file);
            var bdCodes = await bd.detect(bmp);
            bmp.close && bmp.close();
            if(bdCodes && bdCodes.length > 0 && bdCodes[0].rawValue){
              resolve(bdCodes[0].rawValue); return;
            }
          }catch(e){ console.warn('[BarcodeDetector 파일직접]', e.message||e); }
        }

        // ② jsQR — 원본 픽셀 (iOS Safari 폴백)
        var raw = cx.getImageData(0, 0, w, h);
        var code = null;
        if(window.jsQR) code = window.jsQR(raw.data, raw.width, raw.height, {inversionAttempts:'attemptBoth'});
        if(code && code.data){ resolve(code.data); return; }

        // ③ jsQR — 우측 절반 크롭
        var hw = Math.round(w / 2);
        var cv2 = document.createElement('canvas');
        cv2.width = hw; cv2.height = h;
        cv2.getContext('2d').drawImage(img, Math.round(img.width/2), 0, Math.round(img.width/2), img.height, 0, 0, hw, h);
        if(window.jsQR){
          var raw2 = cv2.getContext('2d').getImageData(0, 0, hw, h);
          var code2 = window.jsQR(raw2.data, raw2.width, raw2.height, {inversionAttempts:'attemptBoth'});
          if(code2 && code2.data){ resolve(code2.data); return; }
        }

        // ④ jsQR — 좌측 절반 크롭
        var cv3 = document.createElement('canvas');
        cv3.width = hw; cv3.height = h;
        cv3.getContext('2d').drawImage(img, 0, 0, Math.round(img.width/2), img.height, 0, 0, hw, h);
        if(window.jsQR){
          var raw3 = cv3.getContext('2d').getImageData(0, 0, hw, h);
          var code3 = window.jsQR(raw3.data, raw3.width, raw3.height, {inversionAttempts:'attemptBoth'});
          if(code3 && code3.data){ resolve(code3.data); return; }
        }

        resolve(null); // QR 없음 → Vision OCR로 폴백
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });

    if(qrResult){

        else if(prev.match(/\d+$/) && ml === '호'){
          mergedLines[mergedLines.length-1] = prev + '호';
        }
        // 현재 줄이 숫자만 (번지)이고 이전 줄이 도로명이면 합치기
        else if(prev.match(/(로|길|번길)\s*$/) && ml.match(/^\d+$/)){
          mergedLines[mergedLines.length-1] = prev + ml;
        }
        else {
          mergedLines.push(ml);
        }
      }
      lines = mergedLines;

      for(var i=0; i<lines.length; i++){
        var l = lines[i].trim();
        if(!l || isJunkLine(l)) continue;

        // 영어 잡텍스트 잘라내기
        l = l.replace(/\s+[a-zA-Z][a-zA-Z\s]{1,}.*$/,'').trim();
        // 번지 뒤 잡문자 제거 (아파트명은 보존)
        // 번지수 뒤에 붙은 OCR 아티팩트 (~, 숫자 등) 제거
        l = l.replace(/((?:로|길|번길)\s*\d{1,4})([~\-]\d+|\d{1,2}(?=[\s\D]))/, '$1').trim();
        // 2글자 이하 한글 잡텍스트만 제거 (아파트명 3글자↑ 보존)
        l = l.replace(/((?:로|길|번길)\s*\d+(?:-\d+)?)\s+[가-힣]{1,2}$/, '$1').trim();
        if(!l) continue;

        var hasStreet = l.match(/(시|구).*(로|길)/) || l.match(/(로|길)\s*\d+/);

        var hasHo     = l.match(/\d+호/);

        if(hasStreet && !streetPart){
          streetPart = l;
          // 다음 줄이 번길 숫자 보정인지 확인 (예: "2번길 50")
          var nextL = lines[i+1] ? lines[i+1].trim() : '';
          if(nextL.match(/^\d{1,2}번길\s*\d/) && streetPart.match(/(로|길)\d+$/)){
            streetPart = streetPart + nextL;

          }
        } else if(hasDong && !detailParts.some(function(x){ return x.match(/아파트|오피스텔|동/); })){

          // 같은 줄에 호수도 있으면 종료

        } else if(hasHo && detailParts.length > 0 && !detailParts[detailParts.length-1].match(/\d+호/)){

          detailParts[detailParts.length-1] += ' ' + l;
          break;
        } else if(hasHo && detailParts.length === 0 && streetPart){
          // 도로명 바로 다음에 호수만 있는 경우
          detailParts.push(l);
          break;
        }
      }

      // ② 조합
      var detailPart = detailParts.join(' ').trim();
      if(streetPart && detailPart) return _cleanAddr(streetPart + ' ' + detailPart);
      return _cleanAddr(streetPart || detailPart || '');
    })();

    // 국제 송장 주소가 더 정확하면 우선 사용

                window._emerGps = {lat:_kkr2.lat, lng:_kkr2.lng, acc:0, src:(_kkr2.src||'kakao_v68'), addr:_cleanAddr(newAddr), matchedAddr:_kkr2.matchedAddr, matchedName:_kkr2.matchedName};

      reader.readAsDataURL(file);

    if(!document.getElementById('emer-recipient')?.value?.trim()){
      var _rr = document.getElementById('emer-recipient');
      if(_rr) _rr.value = '수령인 미상';
    }
    if(_ocrTrk || _ocrAddr){
      if(status) status.innerHTML = '<span style="color:var(--teal)">📸 스캔 ✅ &nbsp;→&nbsp; 💾 저장 중...</span>';
      _tts('스캔'); _emerIncScan();
      window._emerSaving = false;
      setTimeout(function(){
        if(p.order_id){
          var _oe2=document.getElementById('emer-orderid');
          if(_oe2 && !_oe2.value) _oe2.value = p.order_id;
        }
        if(typeof emerSave==='function') emerSave();
      }, 600);
    }

  }catch(e){
    var errMsg = e.message || String(e);
    var hint = '';
    if(errMsg.indexOf('API key')>=0 || errMsg.indexOf('API_KEY')>=0 || errMsg.indexOf('403')>=0){
      hint = '— Google Vision API 키를 확인해주세요';
    } else if(errMsg.indexOf('quota')>=0 || errMsg.indexOf('QUOTA')>=0 || errMsg.indexOf('429')>=0){
      hint = '— API 할당량 초과 (내일 다시 시도)';
    } else if(errMsg.indexOf('빈 응답')>=0 || errMsg.indexOf('파싱 실패')>=0){
      hint = '— 네트워크 확인 후 재시도';
    } else if(errMsg.indexOf('텍스트 인식 실패')>=0){
      hint = '— 밝은 곳에서 라벨 전체가 보이게 다시 찍어주세요';
    }
    if(status) status.innerHTML = '<span style="color:var(--red)">❌ OCR 실패: '+errMsg+' '+hint+'</span>';
    console.error('[OCR]', errMsg);
  }
}

// 바코드/QR 인식 (운송장 훼손 시 보조 수단)
// QR/바코드 텍스트에서 주소/수령인/주문번호/GPS 파싱
// 쿠팡 QR 형식: |V1|운송장|주소|상세주소|수령인|해시|위도|경도|타입|타임스탬프|

function emerUnifiedScan(input){
  var statusEl = document.getElementById('emer-unified-status');
  if(!input.files || !input.files[0]) return;
  var file = input.files[0];
  input.value = '';
  window._scanPhotoAdded=false;
  window._emerGps=null;           // GPS 초기화
  window._pendingPhotoUpload=null; // 이전 사진 취소
  if(statusEl) statusEl.innerHTML = '🔍 QR 분석 중...';

  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    var scale = Math.min(1, 2000/Math.max(img.naturalWidth, img.naturalHeight));
    var cw=Math.round(img.naturalWidth*scale), ch=Math.round(img.naturalHeight*scale);
    var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    var ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0,cw,ch);

    // 파란 송장 감지 → 전처리 캔버스 추가
    var _smp=document.createElement('canvas'); _smp.width=100; _smp.height=100;
    _smp.getContext('2d').drawImage(img,0,0,cw,ch,0,0,100,100);
    var _sd=_smp.getContext('2d').getImageData(0,0,100,100);
    var _bl=0; for(var _i=0;_i<_sd.data.length;_i+=16){if(_sd.data[_i+2]>_sd.data[_i]+40&&_sd.data[_i+2]>80)_bl++;}
    var _isBlueLabel=(_bl/625)>0.15;
    var cvBlue=null;
    if(_isBlueLabel){
      cvBlue=document.createElement('canvas'); cvBlue.width=cw; cvBlue.height=ch;
      var ctxB=cvBlue.getContext('2d'); ctxB.drawImage(img,0,0,cw,ch);
      var dB=ctxB.getImageData(0,0,cw,ch);
      for(var _j=0;_j<dB.data.length;_j+=4){
        var _r=dB.data[_j],_g=dB.data[_j+1],_b=dB.data[_j+2];
        if(_b>_r+30&&_b>_g+20&&_b>80){ dB.data[_j]=dB.data[_j+1]=dB.data[_j+2]=255; }
        else{ var _gr=Math.round(_r*.299+_g*.587+_b*.114); dB.data[_j]=dB.data[_j+1]=dB.data[_j+2]=(_gr<140?0:255); }
      }
      ctxB.putImageData(dB,0,0);
    }

    function goOCR(){
      toast('📷 goOCR호출', 2000); // 디버그
      if(statusEl) statusEl.innerHTML = '🔍 OCR 분석 중...';
      statusEl.id = 'emer-ocr-status';
      setTimeout(function(){ var el=document.getElementById('emer-ocr-status'); if(el) el.id='emer-unified-status'; }, 10000);
      emerOcrScan(file, document.getElementById('emer-ocr-status'));
    }

    // ① BarcodeDetector — QR 전용 (로컬, API 비용 0)
    if('BarcodeDetector' in window){
      var bd;
      try{ bd=new BarcodeDetector({formats:['qr_code','data_matrix','aztec']}); }
      catch(e){ try{ bd=new BarcodeDetector({formats:['qr_code']}); }catch(e2){} }
      if(bd){
        // 파란 송장이면 전처리 캔버스도 시도
        var _detectTarget = (_isBlueLabel && cvBlue) ? cvBlue : cv;
        bd.detect(_detectTarget).then(function(codes){
          if(codes&&codes.length&&codes[0].rawValue){
            var raw=codes[0].rawValue;
            if(raw.indexOf('V1|')===0){
              if(statusEl) statusEl.textContent='✅ QR 인식!';
              _emerHandleScan(raw, statusEl);
            } else if(_isBlueLabel && cvBlue){
              // 파란 전처리 실패 → 원본으로 재시도
              bd.detect(cv).then(function(c2){
                if(c2&&c2.length&&c2[0].rawValue&&c2[0].rawValue.indexOf('V1|')===0){
                  if(statusEl) statusEl.textContent='✅ QR 인식!';
                  _emerHandleScan(c2[0].rawValue,statusEl);
                } else { _nativeCamJsQR(_isBlueLabel&&cvBlue?cvBlue:cv,cw,ch,statusEl,goOCR); }
              }).catch(function(){ _nativeCamJsQR(cv,cw,ch,statusEl,goOCR); });
            } else { goOCR(); }
          } else { _nativeCamJsQR(_isBlueLabel&&cvBlue?cvBlue:cv,cw,ch,statusEl,goOCR); }
        }).catch(function(){ _nativeCamJsQR(cv,cw,ch,statusEl,goOCR); });
        return;
      }
    }
    // ② jsQR (로컬, API 비용 0)
    _nativeCamJsQR(_isBlueLabel&&cvBlue?cvBlue:cv, cw, ch, statusEl, goOCR);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); if(statusEl) statusEl.textContent='❌ 이미지 로드 실패'; };
  img.src = url;
}

// 카메라 스캐너
// ═══════════════════════════════════════
function emerStartScan(){
  var mo = document.getElementById('emer-scan-mo');
  if(!mo) return;
  mo.style.display = 'flex';
  var statusEl = document.getElementById('emer-scan-status');
  statusEl.textContent = '카메라 시작 중...';
  var video = document.getElementById('emer-scan-video');

  // QR 트래킹 오버레이 캔버스 (네이티브 카메라처럼 QR 따라다니는 박스)
  var ov = document.getElementById('emer-scan-overlay');
  if(!ov){
    ov = document.createElement('canvas');
    ov.id = 'emer-scan-overlay';
    ov.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3';
    video.parentNode.insertBefore(ov, video.nextSibling);
  }
  var octx = ov.getContext('2d');

  function syncOv(){
    ov.width = video.offsetWidth || 320;
    ov.height = video.offsetHeight || 480;
  }
  function drawGuide(){
    syncOv();
    var cw=ov.width, ch=ov.height;
    octx.clearRect(0,0,cw,ch);
    // QR만 꽉 채우도록 큰 가이드 박스 (화면의 80%)
    var pad=Math.min(cw,ch)*0.08;
    var bw=cw-pad*2, bh=bw; // 정사각형
    if(bh > ch-pad*2) bh = ch-pad*2;
    var x=pad, y=(ch-bh)/2;
    // 사방 어둡게
    octx.fillStyle='rgba(0,0,0,0.5)';
    octx.fillRect(0,0,cw,y);
    octx.fillRect(0,y+bh,cw,ch-y-bh);
    octx.fillRect(0,y,x,bh);
    octx.fillRect(x+bw,y,cw-x-bw,bh);
    // 모서리 코너 (노란색 — 눈에 잘 띔)
    var cl=28, lw=4;
    octx.strokeStyle='#FFD600'; octx.lineWidth=lw;
    [[x,y,1,1],[x+bw,y,-1,1],[x,y+bh,1,-1],[x+bw,y+bh,-1,-1]].forEach(function(p){
      octx.beginPath();
      octx.moveTo(p[0],p[1]); octx.lineTo(p[0]+p[2]*cl,p[1]);
      octx.moveTo(p[0],p[1]); octx.lineTo(p[0],p[1]+p[3]*cl);
      octx.stroke();
    });
    // 안내 텍스트
    octx.font='bold 15px sans-serif';
    octx.textAlign='center';
    octx.fillStyle='rgba(0,0,0,0.7)';
    octx.fillRect(cw/2-140, y+bh+6, 280, 28);
    octx.fillStyle='#FFD600';
    octx.fillText('QR 코드를 노란 박스에 꽉 채우세요  📦', cw/2, y+bh+24);
    octx.textAlign='start';
  }
  function drawQrBox(pts, vw, vh){
    syncOv();
    var cw=ov.width, ch=ov.height, sx=cw/vw, sy=ch/vh;
    octx.clearRect(0,0,cw,ch);
    // QR 위치에 초록 추적 박스
    octx.save();
    octx.beginPath();
    octx.moveTo(pts[0].x*sx, pts[0].y*sy);
    for(var i=1;i<pts.length;i++) octx.lineTo(pts[i].x*sx, pts[i].y*sy);
    octx.closePath();
    // 반투명 채우기
    octx.fillStyle='rgba(0,255,136,0.18)'; octx.fill();
    // 테두리
    octx.strokeStyle='#00ff88'; octx.lineWidth=3;
    octx.shadowColor='#00ff88'; octx.shadowBlur=10;
    octx.stroke();
    octx.restore();
  }

  // 스캔라인 애니메이션
  var _scanLineY = 0, _scanDir = 1, _scanAni = null;
  function _startScanline(){
    var pad=Math.min(ov.width,ov.height)*0.08;
    var bw=ov.width-pad*2, bh=bw;
    if(bh > ov.height-pad*2) bh = ov.height-pad*2;
    var x0=pad, y0=(ov.height-bh)/2; bw=bw; // x0,y0,bw 재정의
    if(_scanAni) cancelAnimationFrame(_scanAni);
    function aniTick(){
      drawGuide();
      _scanLineY += _scanDir * 2.5;
      if(_scanLineY > bw-4){ _scanDir=-1; _scanLineY=bw-4; }
      if(_scanLineY < 4){ _scanDir=1; _scanLineY=4; }
      var grad=octx.createLinearGradient(0, y0+_scanLineY-8, 0, y0+_scanLineY+8);
      grad.addColorStop(0,'rgba(0,255,136,0)');
      grad.addColorStop(0.5,'rgba(0,255,136,0.8)');
      grad.addColorStop(1,'rgba(0,255,136,0)');
      octx.fillStyle=grad;
      octx.fillRect(x0, y0+_scanLineY-8, bw, 16);
      _scanAni=requestAnimationFrame(aniTick);
    }
    _scanAni=requestAnimationFrame(aniTick);
  }
  function _stopScanline(){ if(_scanAni){ cancelAnimationFrame(_scanAni); _scanAni=null; } }

  var constraints = {
    video:{
      facingMode:{ideal:'environment'},
      width:{ideal:1280, min:640},
      height:{ideal:720, min:480},
      frameRate:{ideal:30}
    }
  };

  navigator.mediaDevices.getUserMedia(constraints)
    .catch(function(){
      return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    })
    .catch(function(){
      return navigator.mediaDevices.getUserMedia({video:true});
    })
    .then(function(stream){
      window._emerCamStream = stream;
      video.srcObject = stream;
      video.play();
      statusEl.innerHTML = '📦 QR 코드에 <b style="color:#FFD600">바짝</b> 가까이 — 화면 가득 채우세요';

      // getCapabilities() 체크 후 지원 기기만 autofocus 적용
      try{
        var vTrack = stream.getVideoTracks()[0];
        var caps = vTrack.getCapabilities ? vTrack.getCapabilities() : {};
        var adv = {};
        if(caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) adv.focusMode = 'continuous';
        if(caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf('continuous') >= 0) adv.whiteBalanceMode = 'continuous';
        if(caps.exposureMode && caps.exposureMode.indexOf('continuous') >= 0) adv.exposureMode = 'continuous';
        if(Object.keys(adv).length > 0) vTrack.applyConstraints({advanced:[adv]}).catch(function(){});
      }catch(e){}

      video.addEventListener('loadedmetadata', function(){
        syncOv(); _startScanline();
      }, {once:true});
      setTimeout(function(){ syncOv(); _startScanline(); }, 600);

      function _startScanLoop(){
        var _active = true;

        // BarcodeDetector 단순화 — 필터 제거, 감지 즉시 처리
        if('BarcodeDetector' in window){
          var bd;
          try{ bd = new BarcodeDetector({formats:['qr_code','code_128','data_matrix','aztec','code_39']}); }
          catch(e){ try{ bd = new BarcodeDetector({formats:['qr_code','code_128']}); }
          catch(e2){ try{ bd = new BarcodeDetector({formats:['qr_code']}); }catch(e3){} } }

          if(bd){
            function bdTick(){
              if(!_active) return;
              if(video.readyState < 2){ requestAnimationFrame(bdTick); return; }
              // live video 대신 스냅샷 방식 (BarcodeDetector 정확도 향상)
              createImageBitmap(video).then(function(bmp){
                return bd.detect(bmp).then(function(codes){ bmp.close(); return codes; });
              }).catch(function(){ return bd.detect(video); })
                .then(function(codes){
                  if(!_active) return;
                  if(codes && codes.length > 0){
                    // 가장 큰 코드 선택 (작은 것 무시)
                    var best = codes.reduce(function(a,b){
                      if(!a.cornerPoints) return b;
                      if(!b.cornerPoints) return a;
                      var aw = Math.abs(a.cornerPoints[1].x - a.cornerPoints[0].x);
                      var bw = Math.abs(b.cornerPoints[1].x - b.cornerPoints[0].x);
                      return bw > aw ? b : a;
                    });
                    if(!best.rawValue){ requestAnimationFrame(bdTick); return; }
                    // 최소 크기만 체크 (화면의 6% 이상)
                    if(best.cornerPoints && video.videoWidth){
                      var pw = Math.abs(best.cornerPoints[1].x - best.cornerPoints[0].x);
                      if(pw < video.videoWidth * 0.06){ requestAnimationFrame(bdTick); return; }
                    }
                    _active = false;
                    _stopScanline();
                    if(best.cornerPoints && video.videoWidth) drawQrBox(best.cornerPoints, video.videoWidth, video.videoHeight);
                    var _fmt = best.format||'';
                    var _isBC = (_fmt==='code_128'||_fmt==='code_39');
                    if(_isBC){
                      var _bParsed = _parseQrText(best.rawValue);
                      if(_bParsed.tracking_no || _bParsed.address){
                        statusEl.textContent = '✅ 바코드 인식!';
                        _emerHandleScan(best.rawValue, statusEl);
                      } else {
                        var _bNum = best.rawValue.replace(/[^\d]/g,'');
                        statusEl.textContent = '✅ 운송장: ' + _bNum;
                        window._emerTrackings=[_bNum]; emerRefreshTrackingList&&emerRefreshTrackingList();
                        var _i=document.getElementById('emer-tracking-inp'); if(_i)_i.value=_bNum;
                        window._emerEntryMode='barcode';
                        try{navigator.vibrate&&navigator.vibrate([80,40,80]);}catch(e){}
                        _active=true; requestAnimationFrame(bdTick);
                      }
                    } else {
                      statusEl.textContent = '✅ QR 인식!';
                      _emerHandleScan(best.rawValue, statusEl);
                    }
                    return;
                  }
                  requestAnimationFrame(bdTick);
                })
                .catch(function(){ requestAnimationFrame(bdTick); });
            }
            video.addEventListener('loadedmetadata', function(){ requestAnimationFrame(bdTick); }, {once:true});
            if(video.readyState >= 2) requestAnimationFrame(bdTick);
            window._emerBdStop = function(){ _active=false; _stopScanline(); };
            return;
          }
        }

        // iOS Safari 폴백: jsQR + 중앙 크롭 + 크기 필터
        var canvas2 = document.createElement('canvas');
        var ctx2 = canvas2.getContext('2d');
        var _trackCount2 = 0;

        // QR 크기+비율 필터 — 작은QR/바코드 차단, 정사각형만 통과
        function _isQrBigEnough(loc, sw, sh){
          if(!loc) return true;
          var w = Math.abs(loc.topRightCorner.x - loc.topLeftCorner.x);
          var h = Math.abs(loc.bottomLeftCorner.y - loc.topLeftCorner.y);
          var ratio = h > 0 ? w / h : 0;
          return (w >= sw * 0.12) && (h >= sh * 0.12) && (ratio >= 0.4 && ratio <= 2.5);
        }

        // 이미지 전처리 — 그레이스케일 + 대비 강화 (파란 송장 대응)
        function _enhanceContrast(imgData){
          var d=imgData.data, len=d.length;
          // 1. 그레이스케일 변환
          for(var i=0;i<len;i+=4){
            var g = Math.round(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
            d[i]=d[i+1]=d[i+2]=g;
          }
          // 2. 히스토그램 기반 대비 스트레칭 (min~max → 0~255)
          var mn=255, mx=0;
          for(var j=0;j<len;j+=4){ if(d[j]<mn)mn=d[j]; if(d[j]>mx)mx=d[j]; }
          var range=mx-mn||1;
          for(var k=0;k<len;k+=4){
            var v=Math.round((d[k]-mn)/range*255);
            d[k]=d[k+1]=d[k+2]=v;
          }
          return imgData;
        }

        function _jsqrScan(sx,sy,sw,sh,vw,vh,enhance){
          if(!window.jsQR) return null;
          canvas2.width=sw; canvas2.height=sh;
          ctx2.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);
          var d=ctx2.getImageData(0,0,sw,sh);
          if(enhance) _enhanceContrast(d);
          var r=window.jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
          if(r && r.data){
            // 크기 필터: 작은 QR / 바코드 차단
            if(!_isQrBigEnough(r.location, sw, sh)) return null;
            if(r.location){
              var loc=r.location;
              function adj(p){ return {x:p.x+sx, y:p.y+sy}; }
              r._pts=[adj(loc.topLeftCorner),adj(loc.topRightCorner),adj(loc.bottomRightCorner),adj(loc.bottomLeftCorner)];
              r._vw=vw; r._vh=vh;
            }
            return r;
          }
          return null;
        }

        function jsqrTick(){
          if(!_active) return;
          if(video.readyState < 2){ requestAnimationFrame(jsqrTick); return; }
          var vw=video.videoWidth, vh=video.videoHeight;
          if(!vw){ requestAnimationFrame(jsqrTick); return; }
          try{
            // v9.25 크롭 전략: 중앙 집중 (사이드 바코드·우상단 작은QR 영역 제외)
            // 중앙 60%x70% → 중앙 80%x85% → 전체
            var cx=Math.floor(vw*0.20), cy=Math.floor(vh*0.15);
            var cw2=Math.floor(vw*0.60), ch2=Math.floor(vh*0.70);
            // 원본 시도 → 전처리(대비강화) 재시도 (파란송장 대응)
            var r = _jsqrScan(cx, cy, cw2, ch2, vw, vh, false)                 // ①중앙 원본
                 || _jsqrScan(Math.floor(vw*0.10), Math.floor(vh*0.08),
                              Math.floor(vw*0.80), Math.floor(vh*0.84), vw, vh, false) // ②중앙 원본
                 || _jsqrScan(0, 0, vw, vh, vw, vh, false)                     // ③전체 원본
                 || _jsqrScan(cx, cy, cw2, ch2, vw, vh, true)                  // ④중앙 대비강화
                 || _jsqrScan(Math.floor(vw*0.10), Math.floor(vh*0.08),
                              Math.floor(vw*0.80), Math.floor(vh*0.84), vw, vh, true)  // ⑤중앙 대비강화
                 || _jsqrScan(0, 0, vw, vh, vw, vh, true);                     // ⑥전체 대비강화
            if(r && r.data && _active){
              _stopScanline();
              if(r._pts) drawQrBox(r._pts, r._vw, r._vh);
              _trackCount2++;
              if(_trackCount2 >= 2){
                _active=false;
                statusEl.textContent='✅ QR 인식!';
                _emerHandleScan(r.data, statusEl);
              } else {
                requestAnimationFrame(jsqrTick);
              }
              return;
            }
            _trackCount2 = 0;
          }catch(e){}
          requestAnimationFrame(jsqrTick);
        }
        video.addEventListener('loadedmetadata', function(){ requestAnimationFrame(jsqrTick); }, {once:true});
        if(video.readyState >= 2) requestAnimationFrame(jsqrTick);
        window._emerBdStop = function(){ _active=false; _stopScanline(); };
      }

      _startScanLoop();
    })
    .catch(function(e){
      statusEl.textContent = '❌ 카메라 권한 필요 — 주소창 🔒 → 카메라 허용';
      console.warn('[cam]', e);
    });
}

// 스캔 결과 통합 처리


// ═══════════════════════════════════════
// 스캔 결과 처리
// ═══════════════════════════════════════
function emerStopScan(){
  window._emerScanLock = false; // 락 초기화 (다음 스캔 세션 대비)
  // BarcodeDetector 루프 정지
  if(window._emerBdStop){ try{window._emerBdStop();}catch(e){} window._emerBdStop=null; }
  // ZXing 정지
  try{ if(_emerScanReader){_emerScanReader.reset();_emerScanReader=null;} }catch(e){}
  // 카메라 스트림 정지 (배터리 절약)
  try{
    if(window._emerCamStream){
      window._emerCamStream.getTracks().forEach(function(t){t.stop();});
      window._emerCamStream = null;
    }
  }catch(e){}
  var video = document.getElementById('emer-scan-video');
  if(video){ video.srcObject = null; }
  var mo = document.getElementById('emer-scan-mo');
  if(mo) mo.style.display = 'none';
}

function _emerHandleScan(raw, statusEl){
  if(!raw) return;
  if(window._emerScanLock) return;
  window._emerScanLock = true;
  // 1.2초 자동 해제 제거 → emerSave 완료 시점에 해제
  // (자동 저장 1.5초 타이머 > 락 해제 1.2초 → 저장 전 스캔 가능했던 버그 수정)

  // 중복 운송장 체크
  var _qpCheck = _parseQrText(raw);
  var _tnCheck = _qpCheck.tracking_no || (raw.replace(/[.\-\s]/g,'').match(/^\d{10,}$/) ? raw.replace(/[.\-\s]/g,'') : null);
  if(_tnCheck){
    // 오늘 저장된 기록에서 중복 확인
    var _todayLocs = window._activeDriverMapEmerLocs || window._emerLocs || [];
    var _dup = _todayLocs.find(function(x){
      return (x.trackings||[]).indexOf(_tnCheck)>=0 || x.tracking===_tnCheck;
    });
    if(_dup){
      // 중복 경고
      try{
        var _ac=new(window.AudioContext||window.webkitAudioContext)();
        var _o=_ac.createOscillator(),_g=_ac.createGain();
        _o.connect(_g);_g.connect(_ac.destination);
        _o.type='sawtooth';_o.frequency.value=280;
        _g.gain.setValueAtTime(0.3,_ac.currentTime);
        _g.gain.exponentialRampToValueAtTime(0.001,_ac.currentTime+0.4);
        _o.start();_o.stop(_ac.currentTime+0.4);
        setTimeout(function(){try{_ac.close();}catch(e){}},600);
        navigator.vibrate&&navigator.vibrate([200,100,200,100,200]);
      }catch(e){}
      _tts('중복');
      // 중복 토스트
      var _dt=document.createElement('div');
      _dt.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(220,38,38,.95);color:#fff;padding:16px 24px;border-radius:12px;font-size:16px;font-weight:900;z-index:9999;text-align:center';
      _dt.innerHTML='⚠️ 중복 운송장!<br><span style="font-size:12px;font-weight:500">'+_tnCheck+'<br>이미 저장된 건입니다</span>';
      document.body.appendChild(_dt);
      setTimeout(function(){_dt.style.opacity='0';_dt.style.transition='opacity .3s';setTimeout(function(){_dt.remove();},300);},2000);
      window._emerScanLock=false;
      return;
    }

    // 같은 집 묶음 체크 — GPS 15m + 수령인 + 동호수 모두 일치
    function _extractUnit(addr){
      if(!addr) return {};
      // v9.34 보강: 알파벳 동(A동/B동) + 숫자 동 + 맨션/차(단지) 모두 인식
      var dongMatch = addr.match(/([A-Za-z\d]+)\s*동(?![아네은])/)        // A동, 102동, 5동
                   || addr.match(/(\d+)\s*맨션/)                          // 1맨션, 2맨션
                   || addr.match(/(\d+)\s*차(?![량선])/)                  // 1차, 2차 (차량/차선 제외)
                   || addr.match(/(\d+)동/);                              // 폴백
      var hoMatch = addr.match(/(\d+)\s*호/) || addr.match(/(\d+)\s*-\s*\d+\s*호/);
      var dong = dongMatch ? String(dongMatch[1]).toUpperCase() : null;
      var ho = hoMatch ? hoMatch[1] : null;
      return {dong:dong, ho:ho};
    }
    function _gpsDist(a,b){
      if(!a||!b) return 9999;
      var R=6371000, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
      var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
      return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    }
    if(_qpCheck.address){
      var _newGps = _qpCheck.lat ? {lat:_qpCheck.lat,lng:_qpCheck.lng} : (window._emerGps||null);
      var _newUnit = _extractUnit(_qpCheck.address);
      var _newName = (_qpCheck.recipient||'').replace(/\*/g,'');
      var _bundle = _todayLocs.find(function(x){
        if(!x.addr || x.fbId && x.fbId.indexOf('_preview')>=0) return false;
        // ① GPS 15m 이내
        var dist = _gpsDist(_newGps, x.gps);
        if(dist > 15) return false;
        // ② 수령인 일치 (★ v9.59: 수령인 미상이면 동호수만으로 판단)
        var xName = (x.recipient||'').replace(/\*/g,'');
        var _nameUnknown = !_newName || _newName==='수령인미상' || _newName==='수령인 미상';
        var _xUnknown = !xName || xName==='수령인미상' || xName==='수령인 미상';
        if(!_nameUnknown && !_xUnknown && _newName !== xName) return false;
        // ③ 동호수 일치 (아파트/오피스텔), 없으면 GPS 8m 이내
        var xUnit = _extractUnit(x.addr);
        var hasUnit = _newUnit.ho || xUnit.ho;
        if(hasUnit){
          if(_newUnit.dong && xUnit.dong && _newUnit.dong !== xUnit.dong) return false;
          if(_newUnit.ho && xUnit.ho && _newUnit.ho !== xUnit.ho) return false;
        } else {
          if(dist > 8) return false; // 주택: 8m 이내만
        }
        return true;
      });
      if(_bundle && _bundle.fbId && _bundle.fbId.indexOf('_preview')<0){
        // 같은 집 발견 → 기존 핀에 운송장 추가
        _tts('묶음');
        var _bt=document.createElement('div');
        _bt.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(245,158,11,.95);color:#fff;padding:16px 24px;border-radius:12px;font-size:15px;font-weight:900;z-index:9999;text-align:center';
        _bt.innerHTML='📦 같은 집 묶음!<br><span style="font-size:12px;font-weight:500">'+(_bundle.recipient||'')+'<br>'+(_bundle.addr||'').slice(0,25)+'</span>';
        document.body.appendChild(_bt);
        setTimeout(function(){_bt.style.opacity='0';_bt.style.transition='opacity .3s';setTimeout(function(){_bt.remove();},300);},2000);
        // Firebase에 기존 레코드에 운송장 추가
        if(FB && _db){
          var _newTrackings = (_bundle.trackings||[_bundle.tracking]).slice();
          if(_newTrackings.indexOf(_tnCheck)<0) _newTrackings.push(_tnCheck);
          _db.collection('emergency_deliveries').doc(_bundle.fbId).update({trackings:_newTrackings}).catch(function(){});
        }
        window._emerIncScan && window._emerIncScan();
        window._emerIncSave && window._emerIncSave();
        window._emerScanLock=false;
        // 폼 닫고 다음 스캔
        setTimeout(function(){
          document.getElementById('emer-del-mo')?.remove();
          setTimeout(function(){ openEmergencyDelivery(); }, 300);
        }, 2200);
        return;
      }
    }
  }

  if(statusEl) statusEl.textContent = '✅ 인식: ' + raw.slice(0,40);
  try{ navigator.vibrate && navigator.vibrate([60,30,120]); }catch(e){}
  _tts('스캔'); _emerIncScan();
  try{
    var _ac = new (window.AudioContext||window.webkitAudioContext)();
    var _osc = _ac.createOscillator();
    var _g = _ac.createGain();
    _osc.connect(_g); _g.connect(_ac.destination);
    _osc.type = 'square';
    _osc.frequency.setValueAtTime(1480, _ac.currentTime);
    _osc.frequency.setValueAtTime(1760, _ac.currentTime + 0.07);
    _g.gain.setValueAtTime(0.18, _ac.currentTime);
    _g.gain.exponentialRampToValueAtTime(0.001, _ac.currentTime + 0.18);
    _osc.start(_ac.currentTime);
    _osc.stop(_ac.currentTime + 0.18);
    setTimeout(function(){ try{_ac.close();}catch(e){} }, 400);
  }catch(e){}
  // 화면 초록 플래시
  try{
    var _fl = document.createElement('div');
    _fl.style.cssText = 'position:fixed;inset:0;background:rgba(0,255,136,0.28);z-index:9999;pointer-events:none;transition:opacity 0.4s';
    document.body.appendChild(_fl);
    setTimeout(function(){ _fl.style.opacity='0'; setTimeout(function(){ _fl.remove(); },400); },120);
  }catch(e){}

  var code = raw.replace(/[.\-\s]/g,'').trim();
  var isTrack = /^[0-9]{8,25}$/.test(code);
  var qp = _parseQrText(raw);
  var fld = [];

  // 운송장 추가
  var trackToAdd = qp.tracking_no || (isTrack ? code : null);
  if(trackToAdd){
    window._emerTrackings = window._emerTrackings||[];
    if(window._emerTrackings.indexOf(trackToAdd)<0){
      window._emerTrackings.push(trackToAdd);
      window._emerTrackingTimes = window._emerTrackingTimes||{};
      var n=new Date();
      window._emerTrackingTimes[trackToAdd]=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
      emerRefreshTrackingList();
      // QR(주소/GPS)이면 ocr, 순수 바코드면 barcode
      if(qp.address || qp.lat){ window._emerEntryMode = 'ocr'; }
      else if(!window._emerEntryMode){ window._emerEntryMode = 'barcode'; }
    }
  }

  // 주소/수령인/GPS
  if(qp.address){var ae=document.getElementById('emer-addr');if(ae&&!ae.value){ae.value=qp.address;fld.push('주소');}}
  if(qp.recipient){var re=document.getElementById('emer-recipient');if(re&&!re.value){re.value=qp.recipient;fld.push('수령인');}}
  if(qp.order_id){var oe=document.getElementById('emer-orderid');if(oe&&!oe.value){oe.value=qp.order_id;fld.push('주문번호');}}
  if(qp.memo){var dm=document.getElementById('emer-delivmemo');if(dm&&!dm.value)dm.value=qp.memo;}
  if(qp.lat&&qp.lng){
    window._emerGps={lat:qp.lat,lng:qp.lng,src:'QR'};fld.push('GPS');
    var gpsEl=document.getElementById('emer-gps-status');
    if(gpsEl)gpsEl.innerHTML='<span style="color:var(--teal)">📍 QR GPS: '+qp.lat.toFixed(6)+', '+qp.lng.toFixed(6)+'</span>';
  } else if(qp.address) {
    // QR에 GPS 없을 때 → _kakaoGeocode 통합 호출 (Google 직접 호출 폐기)
    // 이전: Google만 → 'geocode' src로 저장 → 동 단위 부정확
    // 변경: _kakaoGeocode → 캐시 → 카카오키워드(번길 OCR 교정 포함) → 카카오주소 → Google
    var gpsEl2=document.getElementById('emer-gps-status');
    if(gpsEl2) gpsEl2.innerHTML='<span style="color:var(--blue)">📍 배송지 좌표 변환 중 (카카오 우선)...</span>';
    var _gcAddr = qp.address;
    if(typeof _kakaoGeocode === 'function'){
      _kakaoGeocode(_gcAddr).then(function(_kr){
        if(_kr && _kr.lat && _kr.lng){
          window._emerGps={lat:_kr.lat,lng:_kr.lng,src:(_kr.src||'kakao'),addr:_gcAddr};
          var gEl=document.getElementById('emer-gps-status');
          var _srcL = {kakao_kw_dong:'카카오키워드(동)',kakao_kw_apt:'카카오키워드(단지)',kakao_addr:'카카오주소',google:'Google',cache:'캐시',stored_reuse:'재사용',QR:'QR'}[_kr.src]||_kr.src;
          if(gEl) gEl.innerHTML='<span style="color:var(--teal)">📍 '+_srcL+' GPS ✅</span>';
          // 지도 핀 생성
          if(window._activeDriverMapAddPin){
            var pr={fbId:'_preview_qr_'+Date.now(),driver:S.curDriver||'',trackings:window._emerTrackings.slice(),tracking:window._emerTrackings[0]||'',order_id:(document.getElementById('emer-orderid')||{}).value||'',recipient:qp.recipient||'',addr:_gcAddr,gps:{lat:_kr.lat,lng:_kr.lng},time:new Date().toTimeString().slice(0,5),status:'저장대기'};
            window._activeDriverMapAddPin(pr);
            window._activeDriverMap&&window._activeDriverMap.panTo({lat:_kr.lat,lng:_kr.lng});
          }
        } else {
          var gEl2=document.getElementById('emer-gps-status');
          if(gEl2) gEl2.innerHTML='<span style="color:#f59e0b">⚠️ 좌표 변환 실패 — 저장 시 재시도</span>';
        }
      }).catch(function(e){ console.warn('[_emerHandleScan _kakaoGeocode]', e); });
    }
  }

  // QR/바코드 인식 후 자동저장 — 운송장만 있어도 저장
  if(qp.tracking_no || (window._emerTrackings && window._emerTrackings.length > 0)){
    var _scanMo = document.getElementById('emer-scan-mo');
    if(_scanMo){ _scanMo.style.display='none'; emerStopScan&&emerStopScan(); }
    if(statusEl) statusEl.innerHTML = '<span style="color:var(--teal)">📸 스캔 ✅ → 💾 저장 중...</span>';
    window._emerSaving = false;
    setTimeout(function(){ if(typeof emerSave==='function') emerSave(); }, 600);
    return;
  }

  // 묶음 감지
  var curAddr=(document.getElementById('emer-addr')||{}).value||'';
  var curRecip=(document.getElementById('emer-recipient')||{}).value||'';
  var curTracks=window._emerTrackings||[];
  if(curTracks.length>1 && trackToAdd && (curAddr||curRecip)){
    var mc=0,mr=[];
    if(curAddr&&qp.address){var a1=curAddr.replace(/\s/g,''),a2=qp.address.replace(/\s/g,'');if(a1===a2||a1.indexOf(a2)>=0||a2.indexOf(a1)>=0){mc++;mr.push('주소');}}
    if(curRecip&&qp.recipient&&curRecip===qp.recipient){mc++;mr.push('수령인');}
    if(window._emerGps&&qp.lat&&qp.lng){
      var R=6371000,dLat=(qp.lat-window._emerGps.lat)*Math.PI/180,dLng=(qp.lng-window._emerGps.lng)*Math.PI/180;
      var ab=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(window._emerGps.lat*Math.PI/180)*Math.cos(qp.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
      var dist=R*2*Math.atan2(Math.sqrt(ab),Math.sqrt(1-ab));
      if(dist<=50){mc++;mr.push('GPS('+Math.round(dist)+'m)');}
    }
    if(mc>=2&&curTracks.indexOf(trackToAdd)<0){
      emerStopScan();
      if(confirm('📦 같은 집 감지! ('+mr.join('+')+')\n운송장 '+trackToAdd+' 추가할까요?')){
        window._emerTrackings.push(trackToAdd);emerRefreshTrackingList();
      }
      return;
    }
  }

  // 결과 표시
  var msg = trackToAdd
    ? '✅ 운송장: '+trackToAdd+(fld.length?' ('+fld.join('/')+'자동입력)':'')
    : (fld.length?'✅ '+fld.join('/')+' 입력됨':'⚠️ 운송장 형식 아님 — 직접 입력');
  var bSt=document.getElementById('emer-barcode-status');
  if(bSt)bSt.innerHTML='<span style="color:var(--teal)">'+msg+'</span>';

  // 요약 박스
  if(fld.length||trackToAdd){
    var sumEl=document.getElementById('emer-ocr-summary');
    if(sumEl){sumEl.style.display='block';sumEl.innerHTML='<b>📊 스캔 결과</b><br>'+(trackToAdd?'📦 운송장: '+trackToAdd+'<br>':'')+(qp.address?'📍 주소: '+qp.address+'<br>':'')+(qp.recipient?'👤 수령인: '+qp.recipient+'<br>':'')+(qp.lat?'🗺️ GPS: 자동수집<br>':'');}
  }

  if(trackToAdd||fld.length){
    emerStopScan();
    // 자동 저장 — 운송장 + 주소 모두 인식되면 1.5초 후 자동 저장
    // 주소 필수: 배송 핀 위치 지정 + GPS 검증 + 호수 확인 모두 주소 기반
    if(trackToAdd && qp.address){
      var _autoStatusEl = document.getElementById('emer-barcode-status');
      var _countdown = 15; // 0.1초 단위 → 1.5초
      if(_autoStatusEl){
        _autoStatusEl.innerHTML = '<span style="color:var(--green);font-weight:800">⏳ 자동 저장: 1.5초… (다른 항목 클릭 시 취소)</span>';
      }
      // 자동 저장 카운트다운 (취소 가능)
      window._emerAutoSaveTimer = setTimeout(function(){
        window._emerAutoSaveTimer = null;
        // 모달이 아직 열려있고 저장 중이 아닐 때만 실행
        var _t=(window._emerTrackings&&window._emerTrackings.length>0)||(document.getElementById('emer-tracking-inp')&&document.getElementById('emer-tracking-inp').value.trim().length>5);
        var _a=document.getElementById('emer-addr')&&document.getElementById('emer-addr').value.trim().length>5;
        // 수령인 없으면 "수령인 미상" 자동 입력 후 저장
        var _rEl=document.getElementById('emer-recipient');
        if(_rEl && !_rEl.value.trim()){ _rEl.value='수령인 미상'; }
        if(document.getElementById('emer-del-mo')&&!window._emerSaving&&typeof emerSave==='function'){
          if(_t&&_a){ emerSave(); }
          else{ var _ms=[]; if(!_t)_ms.push('운송장'); if(!_a)_ms.push('주소');
            var _st2=document.getElementById('emer-unified-status');
            if(_st2)_st2.innerHTML='<span style="color:#f59e0b">⚠️ '+_ms.join('+')+' 확인 후 저장</span>'; }
        }
      }, 1500);
      // 입력 필드 클릭/포커스 시 자동 저장 취소 (사용자가 수정하려는 의도)
      var _cancelAutoSave = function(){
        if(window._emerAutoSaveTimer){
          clearTimeout(window._emerAutoSaveTimer);
          window._emerAutoSaveTimer = null;
          if(_autoStatusEl) _autoStatusEl.innerHTML = '<span style="color:var(--amber)">⏸ 자동 저장 취소됨 — 수동 저장 버튼을 눌러주세요</span>';
        }
      };
      // click으로 변경 — focus는 OCR 자동입력 시도 발생해서 자동 저장 오취소됨
      ['emer-addr','emer-recipient','emer-orderid','emer-memo','emer-delivmemo','emer-tracking-inp'].forEach(function(id){
        var el=document.getElementById(id);
        if(el) el.addEventListener('click', _cancelAutoSave, {once:true});
      });
    }
  } else {
    // 운송장/주소 모두 없는 QR → 0.8초 후 락 해제 (계속 스캔)
    if(statusEl) statusEl.textContent = '⚠️ 미인식 — 다시 갖다 대세요';
    setTimeout(function(){ window._emerScanLock = false; }, 800);
  }
}

async function emerBarcodeScan(file){
  if(!file) return;
  var status = document.getElementById('emer-barcode-status');
  if(status) status.innerHTML = '<span style="color:var(--blue)">📊 바코드 분석 중...</span>';

  try{
    // BarcodeDetector API 지원 여부 확인 (안드로이드 크롬 / 데스크톱 크롬 지원, iOS 미지원)
    if(!('BarcodeDetector' in window)){
      // iOS Safari 등 미지원 → ZXing 폴백 (이미 로드되어있을 가능성 높음)
      if(typeof ZXing !== 'undefined' && ZXing.BrowserMultiFormatReader){
        var reader = new ZXing.BrowserMultiFormatReader();
        var imgUrl = URL.createObjectURL(file);
        var img = new Image();
        await new Promise(function(r){ img.onload=r; img.onerror=r; img.src=imgUrl; });
        try{
          var result = await reader.decodeFromImageElement(img);
          URL.revokeObjectURL(imgUrl);
          if(result && result.text){
            var raw = result.text;
            var code = raw.replace(/[\.\-\s]/g,'').trim();
            if(/^[0-9]{8,25}$/.test(code)){
              window._emerTrackings = window._emerTrackings||[];
              if(window._emerTrackings.indexOf(code)<0) window._emerTrackings.push(code);
              emerRefreshTrackingList();
              window._emerEntryMode = 'barcode';
              // QR 텍스트에서 주소/수령인 추가 파싱
              var qp = _parseQrText(raw);
              var fld = [];
              if(qp.address){ var ae=document.getElementById('emer-addr'); if(ae&&!ae.value){ae.value=qp.address;fld.push('주소');} }
              if(qp.recipient){ var re=document.getElementById('emer-recipient'); if(re&&!re.value){re.value=qp.recipient;fld.push('수령인');} }
              if(qp.order_id){ var oe=document.getElementById('emer-orderid'); if(oe&&!oe.value){oe.value=qp.order_id;fld.push('주문번호');} }
              if(status) status.innerHTML = '<span style="color:var(--teal)">✅ 바코드 인식 성공: '+code+(fld.length?' ('+fld.join('/')+'자동입력)':'')+'</span>';
            } else {
              // 숫자 아닌 QR → 주소/수령인 파싱 시도
              var qp2 = _parseQrText(raw);
              var fld2 = [];
              if(qp2.address){ var ae2=document.getElementById('emer-addr'); if(ae2&&!ae2.value){ae2.value=qp2.address;fld2.push('주소');} }
              if(qp2.recipient){ var re2=document.getElementById('emer-recipient'); if(re2&&!re2.value){re2.value=qp2.recipient;fld2.push('수령인');} }
              if(fld2.length){
                if(status) status.innerHTML = '<span style="color:var(--teal)">✅ QR에서 '+fld2.join('/')+'자동 입력됨 (운송장은 직접 입력)</span>';
              } else {
                if(status) status.innerHTML = '<span style="color:var(--amber)">⚠️ 인식됨: '+raw.slice(0,30)+' (운송장 형식 아님 — 직접 입력 필요)</span>';
              }
            }
            // 사진도 자동 첨부
            var fr = new FileReader();
            fr.onload = function(e){ window._emerPhotos.push(e.target.result); emerRefreshPhotoWrap(); };
            fr.readAsDataURL(file);
            return;
          }
        }catch(e){
          URL.revokeObjectURL(imgUrl);
          if(status) status.innerHTML = '<span style="color:var(--red)">❌ 바코드 인식 실패 — 직접 입력해주세요</span>';
          return;
        }
      } else {
        if(status) status.innerHTML = '<span style="color:var(--amber)">⚠️ 이 기기는 바코드 인식 미지원 — 직접 입력해주세요</span>';
        return;
      }
    }

    // BarcodeDetector API 사용 (안드로이드 크롬 / 데스크톱 크롬)
    var detector = new BarcodeDetector({
      formats: ['qr_code','code_128','code_39','ean_13'] // 운송장 바코드 스캐너는 바코드 유지
    });

    var imgBitmap = await createImageBitmap(file);
    var barcodes = await detector.detect(imgBitmap);

    if(!barcodes || !barcodes.length){
      if(status) status.innerHTML = '<span style="color:var(--red)">❌ 바코드를 찾지 못했습니다 — 직접 입력해주세요</span>';
      return;
    }

    // 바코드 1개 이상 인식 → 운송장 형태(숫자 8~25자리)에 가까운 것 우선
    var foundTrack = null, foundOther = [];
    for(var i=0; i<barcodes.length; i++){
      var raw = (barcodes[i].rawValue||'').replace(/[\.\-\s]/g,'').trim();
      if(!raw) continue;
      if(/^[0-9]{8,25}$/.test(raw) && !foundTrack){ foundTrack = raw; }
      else { foundOther.push(barcodes[i].rawValue); }
    }

    // QR 텍스트에서 주소/수령인/주문번호 파싱 시도
    if(foundTrack){
      window._emerTrackings = window._emerTrackings||[];
      if(window._emerTrackings.indexOf(foundTrack)<0) window._emerTrackings.push(foundTrack);
      emerRefreshTrackingList();
      window._emerEntryMode = 'barcode';

      // QR에서 추가 정보 파싱 (주소, 수령인, 주문번호)
      var qrExtra = {};
      if(foundOther.length){
        foundOther.forEach(function(t){ var p=_parseQrText(t); Object.assign(qrExtra, p); });
      }
      // 운송장 번호 자체에도 텍스트 붙어있을 수 있음
      var allRaw = barcodes.map(function(b){return b.rawValue||'';}).join('\n');
      var mainParsed = _parseQrText(allRaw);
      Object.assign(qrExtra, mainParsed);

      // 파싱된 정보 자동 입력
      var filled = [];
      if(qrExtra.address){
        var adEl=document.getElementById('emer-addr'); if(adEl&&!adEl.value){adEl.value=qrExtra.address; filled.push('주소');}
      }
      if(qrExtra.recipient){
        var reEl=document.getElementById('emer-recipient'); if(reEl&&!reEl.value){reEl.value=qrExtra.recipient; filled.push('수령인');}
      }
      if(qrExtra.order_id){
        var oiEl=document.getElementById('emer-orderid'); if(oiEl&&!oiEl.value){oiEl.value=qrExtra.order_id; filled.push('주문번호');}
      }
      if(qrExtra.memo){
        var dmEl=document.getElementById('emer-delivmemo'); if(dmEl&&!dmEl.value){dmEl.value=qrExtra.memo;}
      }

      var extra = filled.length ? ' + '+filled.join('/') : '';
      if(status) status.innerHTML = '<span style="color:var(--teal)">✅ 인식 성공: '+foundTrack+(extra?' ('+extra+' 자동입력)':'')+'</span>';

      // OCR 요약 표시 (주소/수령인 있으면)
      if(filled.length){
        var sumEl=document.getElementById('emer-ocr-summary');
        if(sumEl){
          sumEl.style.display='block';
          sumEl.innerHTML='<b>📊 QR 인식 결과</b><br>'
            +(qrExtra.address?'📍 주소: '+qrExtra.address+'<br>':'')
            +(qrExtra.recipient?'👤 수령인: '+qrExtra.recipient+'<br>':'')
            +(qrExtra.order_id?'📋 주문번호: '+qrExtra.order_id+'<br>':'')
            +(qrExtra.memo?'💬 메모: '+qrExtra.memo+'<br>':'');
        }
      }

    } else if(foundOther.length){
      // 숫자 형태는 아니지만 텍스트 QR → 주소/수령인 파싱 시도
      var qrText = foundOther.join('\n');
      var parsed = _parseQrText(qrText);
      var filled2 = [];
      if(parsed.address){ var ae=document.getElementById('emer-addr'); if(ae&&!ae.value){ae.value=parsed.address; filled2.push('주소');} }
      if(parsed.recipient){ var re=document.getElementById('emer-recipient'); if(re&&!re.value){re.value=parsed.recipient; filled2.push('수령인');} }
      if(parsed.order_id){ var oe=document.getElementById('emer-orderid'); if(oe&&!oe.value){oe.value=parsed.order_id; filled2.push('주문번호');} }

      if(filled2.length){
        if(status) status.innerHTML = '<span style="color:var(--teal)">✅ QR에서 '+filled2.join('/')+'자동 입력됨 (운송장은 직접 입력)</span>';
        var sumEl2=document.getElementById('emer-ocr-summary');
        if(sumEl2){
          sumEl2.style.display='block';
          sumEl2.innerHTML='<b>📊 QR 인식 결과</b><br>'
            +(parsed.address?'📍 주소: '+parsed.address+'<br>':'')
            +(parsed.recipient?'👤 수령인: '+parsed.recipient+'<br>':'')
            +(parsed.order_id?'📋 주문번호: '+parsed.order_id+'<br>':'');
        }
      } else {
        if(status) status.innerHTML = '<span style="color:var(--amber)">⚠️ 인식됨: '+foundOther[0].slice(0,30)+' — 운송장 형식 아님, 직접 입력 필요</span>';
        var memoEl = document.getElementById('emer-memo');
        if(memoEl && !memoEl.value) memoEl.value = '[바코드 인식] '+foundOther.join(' / ');
      }
    } else {
      if(status) status.innerHTML = '<span style="color:var(--red)">❌ 인식된 바코드가 비어있음 — 직접 입력해주세요</span>';
    }

    // 사진도 자동 첨부 (분쟁 대응)
    var fr2 = new FileReader();
    fr2.onload = function(e){ window._emerPhotos.push(e.target.result); emerRefreshPhotoWrap(); };
    fr2.readAsDataURL(file);

  }catch(e){
    console.warn('바코드 스캔 오류:', e);
    if(status) status.innerHTML = '<span style="color:var(--red)">❌ 바코드 인식 실패: '+(e.message||'알 수 없음')+' — 직접 입력해주세요</span>';
  }
}

async function emerLogSelectDelete(){
  var checked=document.querySelectorAll('.emer-log-chk:checked');
  if(!checked.length){toast('⚠️ 삭제할 항목을 선택하세요');return;}
  if(!confirm(checked.length+'건을 삭제하시겠습니까?\n(되돌릴 수 없습니다)'))return;
  var fbIds=[];
  checked.forEach(function(c){if(c.dataset.fbid)fbIds.push(c.dataset.fbid);});
  if(FB&&_db&&fbIds.length){
    var batch=_db.batch();
    fbIds.forEach(function(id){try{batch.delete(_db.collection('emergency_deliveries').doc(id));}catch(e){}});
    try{await batch.commit();}catch(e){console.warn('emerDel:',e.code);}
  }
  try{
    var list=JSON.parse(localStorage.getItem('mbti_emergency_del')||'[]');
    list=list.filter(function(x){return fbIds.indexOf(x.fbId||x._fbId||x.id||'')<0;});
    localStorage.setItem('mbti_emergency_del',JSON.stringify(list));
  }catch(e){}
  toast('✅ '+fbIds.length+'건 삭제 완료');
  // 삭제 후 즉시 UI 갱신 (onSnapshot 대기 X — 실시간 반영)
  setTimeout(function(){
    var ca = document.getElementById('ca');
    if(ca && typeof rEmergencyLog==='function') ca.innerHTML = rEmergencyLog();
    // 기사 앱 긴급배송 기록
    var dca = document.getElementById('dca');
    if(dca && typeof rEmergencyLog==='function') dca.innerHTML = rEmergencyLog();
  }, 300);
}

// 배송 기록 목록
// ═══════════════════════════════════════
function rEmergencyLog(){
  var isAdmin = S.curMode==='admin';
  var cut = _drv60Cut();

  // 이전 리스너 해제
  if(window._emerLogUnsub){ try{window._emerLogUnsub();}catch(e){} window._emerLogUnsub=null; }

  function _dedup(records){
    var seen={}, out=[];
    records.forEach(function(x){
      var k=x.fbId||x._fbId||x.id||('_'+( x.trackings&&x.trackings[0]||x.tracking||'')+x.savedAt);
      if(!seen[k]){seen[k]=true;out.push(x);}
    });
    return out;
  }

  function _renderContent(fbRecs){
    // 로컬 병합
    var all = fbRecs.slice();
    try{
      var local2=JSON.parse(localStorage.getItem('mbti_emergency_del')||'[]');
      if(!isAdmin) local2=local2.filter(function(x){return x.driver===S.curDriver;});
      local2.forEach(function(lx){
        var dup=lx._fbId&&fbRecs.some(function(r){return r.fbId===lx._fbId;});
        if(!dup) all.push(lx);
      });
    }catch(e){}

    var records = _dedup(all)
      .filter(function(x){return (x.date||(x.savedAt||'').slice(0,10)||'')>=cut;})
      .sort(function(a,b){return (b.savedAt||'').localeCompare(a.savedAt||'');});

    var pending = records.filter(function(x){return x.status!=='완료'&&x.status!=='부분완료';});
    var partial = records.filter(function(x){return x.status==='부분완료';});
    var done    = records.filter(function(x){return x.status==='완료';});

    function rowHTML(x){
      var isDone=x.status==='완료';
      var isPartial=x.status==='부분완료';
      var fbId=x.fbId||x._fbId||x.id||'';
      var trackingsArr=(x.trackings&&x.trackings.length)?x.trackings:[x.tracking||''];
      var trackStr=trackingsArr.filter(Boolean).join(', ')||'—';
      // 운송장별 상태 (부분완료 지원)
      var tStatus = x.trackingStatus || {};
      var doneCnt = trackingsArr.filter(function(t){ return tStatus[t]&&tStatus[t].status==='완료'; }).length;
      var statusColor = isDone?'#16a34a':(isPartial?'#f97316':'#dc2626');

      // 운송장 복사 버튼
      var trackCopy='';
      var copyVal=trackingsArr.filter(Boolean).map(function(t){return t.replace(/[^\d.\.\-]/g,'');}).join('\n');
      if(copyVal&&copyVal!=='—'){
        trackCopy='<button onclick="var t=\''+copyVal.replace(/'/g,"\\'").replace(/\n/g,'\\n')+'\';navigator.clipboard?navigator.clipboard.writeText(t).then(function(){toast(\'✅ 운송장 복사됨\')}).catch(function(){prompt(\'복사:\',t);}):(prompt(\'복사:\',t));event.stopPropagation()" '
          +'style="padding:1px 6px;font-size:9px;background:var(--blue-l);color:var(--blue);border:1px solid var(--blue);border-radius:4px;cursor:pointer;font-weight:700;flex-shrink:0">📋</button>';
      }
      // 주문번호 복사 버튼
      var orderCopy='';
      if(x.order_id){
        orderCopy='<button onclick="var t=\''+String(x.order_id).replace(/[^\d.\.\-]/g,'').replace(/'/g,"\\'")+'\';navigator.clipboard?navigator.clipboard.writeText(t).then(function(){toast(\'✅ 주문번호 복사됨\')}).catch(function(){prompt(\'복사:\',t);}):(prompt(\'복사:\',t));event.stopPropagation()" '
          +'style="padding:1px 6px;font-size:9px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-weight:700;flex-shrink:0">📋</button>';
      }

      // 사진: URL·base64 모두 표시, 완료 사진도 포함
      var photos = (x.photos||[]).filter(Boolean);
      if(!photos.length) photos = (x.photosLocal||[]).filter(Boolean).slice(0,3);
      var cPhotos = (x.completePhotos||[]).filter(Boolean);
      if(!cPhotos.length) cPhotos = (x.completePhotosLocal||[]).filter(Boolean).slice(0,2);
      var hasComplete = isDone || isPartial;
      var allPh = (hasComplete ? photos.concat(cPhotos) : photos).slice(0,5);

      var phHTML = allPh.length
        ? '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">'+allPh.map(function(u,pi){
            var label = (hasComplete&&pi>=photos.length) ? '<div style="font-size:8px;color:'+statusColor+';text-align:center;margin-top:2px">완료</div>' : '';
            return '<div style="text-align:center">'
              +'<img src="'+u+'" onclick="openIV(this.src,\'긴급배송\')" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;touch-action:manipulation;border:2px solid '+(hasComplete&&pi>=photos.length?statusColor:'#e5e7eb')+'" onerror="this.parentElement.style.display=\'none\'">'
              +label+'</div>';
          }).join('')+'</div>'
        : '<div style="font-size:11px;color:var(--text3);margin-top:4px">📷 사진 없음</div>';

      // 부분완료 시 운송장별 상태 표시
      var trackBreakdownHtml = '';
      if(isPartial && trackingsArr.length>1){
        trackBreakdownHtml = '<div style="margin-top:6px;padding:6px 8px;background:#fff7ed;border:1px solid #f97316;border-radius:6px;font-size:10px">'
          +'<div style="color:#f97316;font-weight:700;margin-bottom:3px">🟠 운송장별 상태 ('+doneCnt+'/'+trackingsArr.length+')</div>'
          + trackingsArr.map(function(t){
              var s = tStatus[t]&&tStatus[t].status==='완료';
              return '<div style="display:flex;align-items:center;gap:5px;font-family:monospace;font-size:10px">'
                + '<span style="color:'+(s?'#16a34a':'#dc2626')+';font-weight:700;width:12px">'+(s?'✓':'✗')+'</span>'
                + '<span style="color:'+(s?'var(--text3)':'var(--text)')+';'+(s?'text-decoration:line-through;':'font-weight:700;')+'">'+t+'</span>'
                + '</div>';
            }).join('')
          + '</div>';
      }

      var statusBadge;
      if(isDone) statusBadge = '<span style="font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;background:#dcfce7;color:#16a34a">✅완료</span>';
      else if(isPartial) statusBadge = '<span style="font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;background:#fff7ed;color:#f97316;border:1px solid #f97316">🟠부분완료 '+doneCnt+'/'+trackingsArr.length+'</span>';
      else statusBadge = '<span style="font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;background:#fee2e2;color:#dc2626">⏳미완료</span>';

      return '<div style="padding:10px;background:var(--bg);border-radius:10px;margin-bottom:8px;border-left:3px solid '+statusColor+';box-shadow:0 1px 4px rgba(0,0,0,.06)">'
        +'<div style="display:flex;align-items:flex-start;gap:8px">'
        +'<input type="checkbox" class="emer-log-chk" data-fbid="'+fbId+'" style="margin-top:4px;transform:scale(1.3);flex-shrink:0;cursor:pointer">'
        +'<div style="flex:1;min-width:0">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div style="font-size:13px;font-weight:700;margin-bottom:2px">'+(x.recipient||'수령인미상')+(trackingsArr.length>1?' <span style="color:var(--text3);font-size:11px;font-weight:600">('+trackingsArr.length+'건)</span>':'')+'</div>'
        +'<div style="display:flex;gap:4px;flex-shrink:0;margin-left:4px;flex-wrap:wrap">'
        +(isAdmin?'<span style="font-size:10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px">'+( x.driver||'')+'</span>':'')
        +(x.entryMode==='manual'?'<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:#fef3c7;color:#92400e;border:1px solid #d97706;font-weight:700" title="운송장 훼손/직접입력">✏️수기</span>':'')
        +(x.entryMode==='barcode'?'<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:#ede9fe;color:#7c3aed;border:1px solid #7c3aed;font-weight:700" title="바코드/QR로 인식">📊바코드</span>':'')
        +(x.entryMode==='ocr'?'<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:#dbeafe;color:#1d4ed8;border:1px solid #1d4ed8;font-weight:700" title="OCR 자동 인식">🤖OCR</span>':'')
        +statusBadge
        +'</div></div>'
        +(x.addr?'<div style="font-size:11px;color:var(--text2);margin-bottom:3px">📍 '+x.addr+'</div>':'')
        +'<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:2px">'
        +'<span style="font-size:11px;color:var(--text2)">🔢 '+trackStr+'</span>'
        +trackCopy
        +'</div>'
        +(x.order_id?'<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">'
          +'<span style="font-size:11px;color:var(--text2)">📋 '+x.order_id+'</span>'
          +orderCopy
          +'</div>':'')
        +'<div style="font-size:11px;color:var(--text3)">⏰ '+(x.date||'')+' '+(x.time||'')
        +((isDone||isPartial)&&(x.lastCompletedAt||x.completedAt)?' → '+(isPartial?'🟠':'✅')+' '+(x.lastCompletedAt||x.completedAt).slice(11,16):'')
        +'</div>'
        +trackBreakdownHtml
        +phHTML
        +((isDone||isPartial)&&x.completeMemo?'<div style="font-size:11px;color:var(--text3);margin-top:4px">📝 '+x.completeMemo+'</div>':'')
        +'</div></div></div>';
    }

    var el=document.getElementById('emer-log-content');
    if(!el) return;

    var pendingHTML='<div style="margin-bottom:16px">'
      +'<div style="font-size:13px;font-weight:700;color:#dc2626;padding:8px 0 6px;border-bottom:2px solid #dc2626;margin-bottom:8px">⏳ 미완료 — '+pending.length+'건</div>'
      +(pending.length?pending.map(rowHTML).join(''):'<div style="text-align:center;padding:14px;font-size:12px;color:var(--text3)">없음</div>')
      +'</div>';

    var partialHTML = partial.length ? '<div style="margin-bottom:16px">'
      +'<div style="font-size:13px;font-weight:700;color:#f97316;padding:8px 0 6px;border-bottom:2px solid #f97316;margin-bottom:8px">🟠 부분완료 — '+partial.length+'건 <span style="font-size:10px;font-weight:600;color:var(--text3)">(일부 운송장만 완료, 나머지는 별도 처리 필요)</span></div>'
      +partial.map(rowHTML).join('')
      +'</div>' : '';

    var doneHTML='<div style="margin-bottom:16px">'
      +'<div style="font-size:13px;font-weight:700;color:#16a34a;padding:8px 0 6px;border-bottom:2px solid #16a34a;margin-bottom:8px">✅ 완료 — '+done.length+'건</div>'
      +(done.length?done.map(rowHTML).join(''):'<div style="text-align:center;padding:14px;font-size:12px;color:var(--text3)">없음</div>')
      +'</div>';

    el.innerHTML = pendingHTML + partialHTML + doneHTML;
  }

  // Firebase onSnapshot 실시간 구독
  if(FB&&_db){
    try{
      // 기사 모드: where+orderBy 복합 인덱스 없이도 동작하도록 orderBy 제거 → 클라이언트 정렬
      var q;
      if(isAdmin){
        q=_db.collection('emergency_deliveries').orderBy('savedAt','desc').limit(60); // reads 절감
      } else {
        q=_db.collection('emergency_deliveries').where('driver','==',S.curDriver||'').limit(60); // v9.61
      }
      window._emerLogUnsub=q.onSnapshot(function(snap){
        var fbRecs=[];
        snap.forEach(function(d){var x=d.data();x.fbId=d.id;fbRecs.push(x);});
        window._emerLogCache = fbRecs; // 엑셀 다운로드용 캐시
        _renderContent(fbRecs);
      },function(e){
        console.warn('emerLog snapshot:',e.code);
        _renderContent([]);
      });
    }catch(e){ _renderContent([]); }
  } else {
    setTimeout(function(){ _renderContent([]); }, 50);
  }

  var totalLabel=isAdmin?'전체 기사':'내 기록';
  return '<div style="padding:12px 10px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px">'
    +'<div><div style="font-size:16px;font-weight:800">📋 배송 기록</div>'
    +'<div style="font-size:11px;color:var(--text3)">최근 60일 · '+totalLabel+' · 🔴실시간</div></div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +(isAdmin?'<button onclick="emerLogExportExcel()" style="padding:5px 10px;background:#16a34a;border:1px solid #16a34a;border-radius:6px;font-size:11px;color:#fff;font-weight:700;cursor:pointer">📊 엑셀</button>':'')
    +'<button onclick="emerLogSelectDelete()" style="padding:5px 10px;background:var(--amber-l,#fef3c7);border:1px solid var(--amber,#d97706);border-radius:6px;font-size:11px;color:var(--amber,#d97706);font-weight:700;cursor:pointer">☑ 선택삭제</button>'
    +'<button onclick="if(window._emerLogUnsub){try{window._emerLogUnsub();}catch(e){}}'+( isAdmin ? "SP('home',null)" : "DT('home',null)")+'" style="padding:5px 10px;background:var(--bg3);border:1.5px solid var(--border);border-radius:6px;font-size:11px;cursor:pointer">← 홈</button>'
    +'</div></div>'
    +'<div id="emer-log-content"><div style="text-align:center;padding:30px;color:var(--text3);font-size:12px">🔄 로드 중...</div></div>'
    +'</div>';
}

// 긴급배송 엑셀 다운로드 (이미지 셀 삽입 — ExcelJS 동적 로드)


// ═══════════════════════════════════════
// 엑셀 내보내기
// ═══════════════════════════════════════
async function emerLogExportExcel(){
  if(!window._emerLogCache || !window._emerLogCache.length){
    toast('⚠️ 다운로드할 데이터가 없습니다');
    return;
  }

  toast('📊 엑셀 생성 준비 중... (사진 다운로드)');

  // ExcelJS 동적 로드 (한 번만)
  if(typeof ExcelJS === 'undefined'){
    await new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = resolve;
      s.onerror = function(){ reject(new Error('ExcelJS 로드 실패')); };
      document.head.appendChild(s);
    }).catch(function(e){
      toast('❌ '+e.message+' — 인터넷 연결 확인');
      return null;
    });
    if(typeof ExcelJS === 'undefined') return;
  }

  try{
    var wb = new ExcelJS.Workbook();
    wb.creator = '엠비티아이 물류';
    wb.created = new Date();
    var ws = wb.addWorksheet('긴급배송기록');

    // 헤더 행
    ws.columns = [
      { header: '등록일시', key: 'savedAt', width: 18 },
      { header: '운송장번호', key: 'tracking', width: 22 },
      { header: '주문번호', key: 'orderId', width: 18 },
      { header: '주소', key: 'addr', width: 35 },
      { header: '수령인', key: 'recipient', width: 12 },
      { header: '완료사진', key: 'photo', width: 48 }, // ★ 320px 이미지 들어갈 칸
      { header: '완료일시', key: 'completedAt', width: 18 },
      { header: '기사명', key: 'driver', width: 10 },
      { header: '등록방식', key: 'entryMode', width: 10 },
      { header: '상태', key: 'status', width: 8 },
    ];
    ws.getRow(1).font = { bold: true, size: 12 };
    ws.getRow(1).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFEE2E2'} };
    ws.getRow(1).alignment = { vertical:'middle', horizontal:'center' };

    // 데이터 정렬 (최신순)
    var records = window._emerLogCache.slice().sort(function(a,b){
      return (b.savedAt||'').localeCompare(a.savedAt||'');
    });

    // 사진 fetch & 삽입을 비동기 병렬 처리
    var btnExcel = document.querySelector('button[onclick="emerLogExportExcel()"]');
    if(btnExcel){ btnExcel.disabled = true; btnExcel.textContent = '⏳ 생성중...'; }

    // 운송장별 행 분리 — 부분완료를 정확히 표시
    var rowIdx = 0; // 실제 엑셀 행 번호 (0-base, 헤더 제외)
    for(var i=0; i<records.length; i++){
      var x = records[i];
      var trackings = (x.trackings && x.trackings.length) ? x.trackings : (x.tracking?[x.tracking]:['']);
      var savedAtStr = '';
      if(x.savedAt){
        try{ savedAtStr = new Date(x.savedAt).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ savedAtStr = x.savedAt; }
      }
      var entryModeLabel = ({ ocr:'🤖 OCR', barcode:'📊 바코드', manual:'✏️ 수기' })[x.entryMode||'manual'] || '✏️ 수기';
      var tStatus = x.trackingStatus || {};

      // 운송장 1건당 1행 (묶음배송도 분리하여 상태 정확히 표시)
      for(var ti=0; ti<trackings.length; ti++){
        var t = trackings[ti];
        var tInfo = tStatus[t] || {};
        var tIsDone = tInfo.status === '완료';
        var tCompletedAt = '';
        if(tIsDone && tInfo.completedAt){
          try{ tCompletedAt = new Date(tInfo.completedAt).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ tCompletedAt = tInfo.completedAt; }
        } else if(x.status==='완료' && x.completedAt){
          // 옛날 데이터 호환 (trackingStatus 없는 경우)
          try{ tCompletedAt = new Date(x.completedAt).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ tCompletedAt = x.completedAt; }
          tIsDone = true;
        }

        // 운송장 묶음 표시 (같은 핀의 다른 운송장도 알 수 있게)
        var trackDisplay = t;
        if(trackings.length > 1){
          trackDisplay = t + ' (' + (ti+1) + '/' + trackings.length + '건 묶음)';
        }

        // 상태 라벨 (운송장별)
        var tStatusLabel;
        if(tIsDone) tStatusLabel = '✅완료';
        else if(x.status==='부분완료') tStatusLabel = '⏳미완료(부분)';
        else tStatusLabel = '⏳미완료';

        var row = ws.addRow({
          savedAt: savedAtStr,
          tracking: trackDisplay,
          orderId: x.order_id||'',
          addr: x.addr||'',
          recipient: x.recipient||'',
          photo: '', // 이미지 칸
          completedAt: tCompletedAt,
          driver: x.driver||'',
          entryMode: entryModeLabel,
          status: tStatusLabel
        });
        row.height = 240;
        row.alignment = { vertical:'middle', wrapText: true };

        // 부분완료 행 색상 강조
        if(x.status==='부분완료' && !tIsDone){
          row.eachCell(function(cell){
            cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFFF7ED' } }; // 옅은 주황
          });
        }

        // 운송장별 완료 사진 (또는 대표 사진)
        var photoUrls = [];
        if(tIsDone && tInfo.completePhotos && tInfo.completePhotos.length){
          photoUrls = tInfo.completePhotos.filter(Boolean);
        } else {
          photoUrls = (x.completePhotos||[]).filter(Boolean);
          if(!photoUrls.length) photoUrls = (x.photos||[]).filter(Boolean);
        }

        if(photoUrls.length && tIsDone){
          try{
            var imgUrl = photoUrls[0];
            var imgBuf;
            if(imgUrl.indexOf('data:image')===0){
              var b64 = imgUrl.split(',')[1];
              var binary = atob(b64);
              var bytes = new Uint8Array(binary.length);
              for(var k=0;k<binary.length;k++) bytes[k] = binary.charCodeAt(k);
              imgBuf = bytes.buffer;
            } else {
              var resp = await fetch(imgUrl);
              if(resp.ok) imgBuf = await resp.arrayBuffer();
            }
            if(imgBuf){
              var imageId = wb.addImage({ buffer: imgBuf, extension: 'jpeg' });
              ws.addImage(imageId, {
                tl: { col: 5.05, row: (rowIdx+1) + 0.05 },
                ext: { width: 320, height: 320 }
              });
            }
          }catch(e){
            console.warn('사진 행 '+rowIdx+' 삽입 실패:', e.message);
          }
        }

        rowIdx++;
      }

      // 진행 상황 토스트 (10건마다)
      if((i+1) % 10 === 0){
        toast('📊 처리 중... '+(i+1)+'/'+records.length);
        await new Promise(function(r){ setTimeout(r, 0); });
      }
    }

    // 헤더 행 고정
    ws.views = [{ state:'frozen', ySplit:1 }];

    // 파일 생성 & 다운로드
    var buf = await wb.xlsx.writeBuffer();
    var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = '긴급배송기록_'+dateStr+'.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    toast('✅ 엑셀 다운로드 완료 ('+records.length+'건)');
    if(btnExcel){ btnExcel.disabled = false; btnExcel.textContent = '📊 엑셀'; }

  }catch(e){
    console.warn('엑셀 생성 오류:', e);
    toast('❌ 엑셀 생성 실패: '+e.message);
    var btn = document.querySelector('button[onclick="emerLogExportExcel()"]');
    if(btn){ btn.disabled = false; btn.textContent = '📊 엑셀'; }
  }
}
