name: 소셜미디어 자동 스케줄 업로드

# 날짜별 제품별 자동 업로드
# KST = UTC+9  →  09:00 KST = 00:00 UTC
#
# 스케줄 (2026-10-03 기준):
#   매일 09:05 KST → MailMind Variant A (14개국 언어 로테이션)
#   매일 15:00 KST → MailMind Variant B (14개국 언어 로테이션)
#   월 09:00 KST → 용차앱 YouTube Shorts
#   목 09:00 KST → DONWAY YouTube Shorts
#   목 10:30 KST → DONWAY Instagram Reels
#   일 09:00 KST → 인프런 YouTube
#   일 10:30 KST → 인프런 Instagram
#   수 09:00 KST → 인프런 YouTube
#   수 10:30 KST → 인프런 Instagram
#   토 09:00 KST → 인프런 YouTube
#
# MailMind 14일 로테이션:
#   기준일 2026-10-04 (day0=EN)
#   EN→KR→JP→ZH→ES→DE→PT→FR→IT→VN→NL→PL→TR→HI (반복)
#
# [보류]
#   화 → FILO (보류)
#   금 → DINE (보류)

on:
  schedule:
    - cron: '5 0 * * *'   # 매일 09:05 KST → MailMind Variant A
    - cron: '0 6 * * *'   # 매일 15:00 KST → MailMind Variant B
    - cron: '0 0 * * 1'   # 월 09:00 KST → 용차앱 YouTube
    - cron: '0 0 * * 4'   # 목 09:00 KST → DONWAY YouTube
    - cron: '30 1 * * 4'  # 목 10:30 KST → DONWAY Instagram
    - cron: '0 0 * * 0'   # 일 09:00 KST → 인프런 YouTube
    - cron: '30 1 * * 0'  # 일 10:30 KST → 인프런 Instagram
    - cron: '0 0 * * 3'   # 수 09:00 KST → 인프런 YouTube
    - cron: '30 1 * * 3'  # 수 10:30 KST → 인프런 Instagram
    - cron: '0 0 * * 6'   # 토 09:00 KST → 인프런 YouTube
    # - cron: '0 0 * * 2'   # 화 09:00 KST → FILO YouTube [보류]
    # - cron: '30 1 * * 2'  # 화 10:30 KST → FILO Instagram [보류]
    # - cron: '0 0 * * 5'   # 금 09:00 KST → DINE YouTube [보류]
    # - cron: '30 1 * * 5'  # 금 10:30 KST → DINE Instagram [보류]
  workflow_dispatch:
    inputs:
      product:
        description: '제품 수동 선택 (비워두면 스케줄 기준 자동)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - mailmind
          - inflearn
          - yongcha
          - filo
          - donway
          - dine
      mailmind_lang:
        description: 'MailMind 언어 코드 (수동 실행 시, 비우면 오늘 로테이션)'
        required: false
        default: ''
      mailmind_variant:
        description: 'MailMind Variant (A 또는 B, 수동 실행 시)'
        required: false
        type: choice
        default: 'A'
        options:
          - 'A'
          - 'B'
      platforms:
        description: '업로드 플랫폼'
        required: false
        default: 'youtube,instagram'
        type: choice
        options:
          - 'youtube'
          - 'instagram'
          - 'youtube,instagram'
      dry_run:
        description: '업로드 없이 테스트만'
        type: boolean
        default: false

jobs:
  schedule-upload:
    name: 자동 업로드 (${{ github.event.inputs.product || '스케줄 기준' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: FFmpeg 설치
        run: sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-extra

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      # 스케줄 또는 수동 입력에 따라 제품·플랫폼 결정
      - name: 업로드 대상 결정
        id: target
        run: |
          MANUAL_PRODUCT="${{ github.event.inputs.product }}"
          MANUAL_PLATFORMS="${{ github.event.inputs.platforms }}"
          MANUAL_LANG="${{ github.event.inputs.mailmind_lang }}"
          MANUAL_VARIANT="${{ github.event.inputs.mailmind_variant }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # MailMind 14일 로테이션 계산 (기준일 2026-10-04 = day0 = EN)
          ROTATION=(EN KR JP ZH ES DE PT FR IT VN NL PL TR HI)
          REF_EPOCH=$(date -d "2026-10-04" +%s 2>/dev/null || python3 -c "import datetime; print(int(datetime.datetime(2026,10,4).timestamp()))")
          TODAY_EPOCH=$(date -u +%s)
          DAY_INDEX=$(( (TODAY_EPOCH - REF_EPOCH) / 86400 % 14 ))
          [ $DAY_INDEX -lt 0 ] && DAY_INDEX=0
          AUTO_LANG="${ROTATION[$DAY_INDEX]}"

          if [ -n "$MANUAL_PRODUCT" ]; then
            # 수동 실행
            PRODUCT="$MANUAL_PRODUCT"
            PLATFORMS="${MANUAL_PLATFORMS:-youtube,instagram}"
            DRY_FLAG=$([ "$DRY_RUN" = "true" ] && echo "--dry-run" || echo "")
            REASON="수동 실행"
            if [ "$PRODUCT" = "mailmind" ]; then
              MAILMIND_LANG="${MANUAL_LANG:-$AUTO_LANG}"
              MAILMIND_VARIANT="${MANUAL_VARIANT:-A}"
            fi
          else
            # 스케줄 기반 — github.event.schedule 값으로 정확히 매칭
            SCHEDULE="${{ github.event.schedule }}"
            echo "실행 스케줄: $SCHEDULE / 오늘 MailMind 언어: $AUTO_LANG (day $DAY_INDEX)"
            case "$SCHEDULE" in
              "5 0 * * *")  PRODUCT="mailmind"; PLATFORMS="youtube,instagram"; MAILMIND_LANG="$AUTO_LANG"; MAILMIND_VARIANT="A"; REASON="매일 09:05 KST MailMind Variant A ($AUTO_LANG)" ;;
              "0 6 * * *")  PRODUCT="mailmind"; PLATFORMS="youtube,instagram"; MAILMIND_LANG="$AUTO_LANG"; MAILMIND_VARIANT="B"; REASON="매일 15:00 KST MailMind Variant B ($AUTO_LANG)" ;;
              "0 0 * * 0")  PRODUCT="inflearn";  PLATFORMS="youtube";   REASON="일 09:00 KST 인프런 YouTube" ;;
              "30 1 * * 0") PRODUCT="inflearn";  PLATFORMS="instagram"; REASON="일 10:30 KST 인프런 Instagram" ;;
              "0 0 * * 1")  PRODUCT="yongcha";   PLATFORMS="youtube";   REASON="월 09:00 KST 용차앱 YouTube" ;;
              "0 0 * * 2")  PRODUCT="filo";       PLATFORMS="youtube";   REASON="화 09:00 KST FILO YouTube" ;;
              "30 1 * * 2") PRODUCT="filo";       PLATFORMS="instagram"; REASON="화 10:30 KST FILO Instagram" ;;
              "0 0 * * 3")  PRODUCT="inflearn";   PLATFORMS="youtube";   REASON="수 09:00 KST 인프런 YouTube" ;;
              "30 1 * * 3") PRODUCT="inflearn";   PLATFORMS="instagram"; REASON="수 10:30 KST 인프런 Instagram" ;;
              "0 0 * * 4")  PRODUCT="donway";     PLATFORMS="youtube";   REASON="목 09:00 KST DONWAY YouTube" ;;
              "30 1 * * 4") PRODUCT="donway";     PLATFORMS="instagram"; REASON="목 10:30 KST DONWAY Instagram" ;;
              "0 0 * * 5")  PRODUCT="dine";       PLATFORMS="youtube";   REASON="금 09:00 KST DINE YouTube" ;;
              "30 1 * * 5") PRODUCT="dine";       PLATFORMS="instagram"; REASON="금 10:30 KST DINE Instagram" ;;
              "0 0 * * 6")  PRODUCT="inflearn";   PLATFORMS="youtube";   REASON="토 09:00 KST 인프런 YouTube" ;;
              *)
                echo "스케줄 매칭 없음: SCHEDULE=$SCHEDULE — 건너뜀"
                echo "PRODUCT=skip" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
            DRY_FLAG=""
          fi

          echo "PRODUCT=$PRODUCT" >> $GITHUB_OUTPUT
          echo "PLATFORMS=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "DRY_FLAG=$DRY_FLAG" >> $GITHUB_OUTPUT
          echo "REASON=$REASON" >> $GITHUB_OUTPUT
          echo "MAILMIND_LANG=${MAILMIND_LANG:-}" >> $GITHUB_OUTPUT
          echo "MAILMIND_VARIANT=${MAILMIND_VARIANT:-A}" >> $GITHUB_OUTPUT

      - name: 실행 정보 출력
        run: |
          echo "제품: ${{ steps.target.outputs.PRODUCT }}"
          echo "플랫폼: ${{ steps.target.outputs.PLATFORMS }}"
          echo "이유: ${{ steps.target.outputs.REASON }}"

      - name: 나레이션 MP3 생성
        if: steps.target.outputs.PRODUCT != 'skip'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          if [ "$PRODUCT" = "mailmind" ]; then
            LANG="${{ steps.target.outputs.MAILMIND_LANG }}"
            VARIANT="${{ steps.target.outputs.MAILMIND_VARIANT }}"
            echo "[mailmind] 나레이션 생성 LANG=$LANG VARIANT=$VARIANT"
            node scripts/audio/generate-narration.js --product mailmind \
              --lang "$LANG" --variant "$VARIANT" \
              || echo "[mailmind] 나레이션 생성 건너뜀"
          else
            node scripts/audio/generate-narration.js --product "$PRODUCT" \
              || echo "[$PRODUCT] 나레이션 생성 건너뜀 (API 키 없거나 파일 없음)"
          fi

      - name: Remotion 영상 렌더링 (인프런/DINE)
        if: steps.target.outputs.PRODUCT == 'inflearn' || steps.target.outputs.PRODUCT == 'dine'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          mkdir -p output
          CHROMIUM=$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || which chromium 2>/dev/null || echo "")
          [ -n "$CHROMIUM" ] && export CHROMIUM_PATH="$CHROMIUM"
          RENDER_SCRIPT="scripts/remotion/render-${PRODUCT}.js"
          if [ -f "$RENDER_SCRIPT" ]; then
            echo "[$PRODUCT] Remotion 본영상 렌더링..."
            node "$RENDER_SCRIPT" || echo "[$PRODUCT] 본영상 렌더링 실패"
            echo "[$PRODUCT] Remotion Reels 렌더링..."
            node "$RENDER_SCRIPT" --reels || echo "[$PRODUCT] Reels 렌더링 실패"
          else
            echo "[$PRODUCT] Remotion 스크립트 없음 — 건너뜀"
          fi

      - name: MailMind Playwright 녹화
        if: steps.target.outputs.PRODUCT == 'mailmind'
        env:
          MAILMIND_LANG: ${{ steps.target.outputs.MAILMIND_LANG }}
          MAILMIND_VARIANT: ${{ steps.target.outputs.MAILMIND_VARIANT }}
        run: |
          mkdir -p output
          LANG="${{ steps.target.outputs.MAILMIND_LANG }}"
          VARIANT="${{ steps.target.outputs.MAILMIND_VARIANT }}"
          echo "[mailmind] Playwright 녹화 LANG=$LANG VARIANT=$VARIANT"
          node scripts/capture/record-mailmind.js

      - name: MailMind FFmpeg 편집
        if: steps.target.outputs.PRODUCT == 'mailmind'
        run: |
          LANG="${{ steps.target.outputs.MAILMIND_LANG }}"
          VARIANT="${{ steps.target.outputs.MAILMIND_VARIANT }}"
          echo "[mailmind] FFmpeg 편집 LANG=$LANG VARIANT=$VARIANT"
          bash scripts/compose/compose-video.sh mailmind

      - name: 화면 녹화 (Playwright)
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          steps.target.outputs.PRODUCT != 'inflearn' &&
          steps.target.outputs.PRODUCT != 'dine' &&
          steps.target.outputs.PRODUCT != 'mailmind'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          mkdir -p output
          node scripts/capture/record-$PRODUCT.js

      - name: FFmpeg 영상 편집
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          steps.target.outputs.PRODUCT != 'inflearn' &&
          steps.target.outputs.PRODUCT != 'dine' &&
          steps.target.outputs.PRODUCT != 'mailmind'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          bash scripts/compose/compose-video.sh "$PRODUCT"

      - name: YouTube Shorts 업로드
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          contains(steps.target.outputs.PLATFORMS, 'youtube')
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          DRY_FLAG="${{ steps.target.outputs.DRY_FLAG }}"
          if [ "$PRODUCT" = "mailmind" ]; then
            LANG="${{ steps.target.outputs.MAILMIND_LANG }}"
            VARIANT="${{ steps.target.outputs.MAILMIND_VARIANT }}"
            echo "[mailmind] YouTube 업로드 LANG=$LANG VARIANT=$VARIANT"
            node scripts/upload/upload-youtube-api.js --product mailmind \
              --lang "$LANG" --variant "$VARIANT" --reels $DRY_FLAG
          else
            echo "[$PRODUCT] YouTube Shorts 업로드..."
            node scripts/upload/upload-youtube-api.js --product "$PRODUCT" --reels $DRY_FLAG
          fi

      - name: Instagram Reels 업로드
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          contains(steps.target.outputs.PLATFORMS, 'instagram')
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          DRY_FLAG="${{ steps.target.outputs.DRY_FLAG }}"
          if [ "$PRODUCT" = "mailmind" ]; then
            LANG="${{ steps.target.outputs.MAILMIND_LANG }}"
            VARIANT="${{ steps.target.outputs.MAILMIND_VARIANT }}"
            echo "[mailmind] Instagram 업로드 LANG=$LANG VARIANT=$VARIANT"
            node scripts/upload/upload-instagram-api.js --product mailmind \
              --lang "$LANG" --variant "$VARIANT" $DRY_FLAG
          else
            echo "[$PRODUCT] Instagram Reels 업로드..."
            node scripts/upload/upload-instagram-api.js --product "$PRODUCT" $DRY_FLAG
          fi

      - name: 네이버 블로그 게시
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          contains(steps.target.outputs.PLATFORMS, 'youtube')
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          DRY_FLAG="${{ steps.target.outputs.DRY_FLAG }}"
          echo "[$PRODUCT] 네이버 블로그 게시..."
          node scripts/upload/post-naver-blog.js --product "$PRODUCT" $DRY_FLAG \
            || echo "[$PRODUCT] 블로그 게시 건너뜀 (세션 없거나 차단)"

      - name: 결과 아티팩트 업로드
        if: always() && steps.target.outputs.PRODUCT != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: schedule-${{ steps.target.outputs.PRODUCT }}-${{ steps.target.outputs.MAILMIND_LANG || 'X' }}-${{ steps.target.outputs.MAILMIND_VARIANT || 'X' }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*-result.json
          if-no-files-found: warn
          retention-days: 14
