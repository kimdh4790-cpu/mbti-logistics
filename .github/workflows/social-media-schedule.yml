name: 소셜미디어 자동 스케줄 업로드

# 날짜별 제품별 자동 업로드
# KST = UTC+9  →  09:00 KST = 00:00 UTC
#
# 스케줄:
#   월 09:00 KST → 용차앱 YouTube Shorts
#   화 09:00 KST → FILO YouTube Shorts
#   화 10:30 KST → FILO Instagram Reels
#   수 09:00 KST → 인프런 YouTube Shorts
#   수 10:30 KST → 인프런 Instagram Reels
#   목 09:00 KST → DONWAY YouTube Shorts
#   목 10:30 KST → DONWAY Instagram Reels
#   토 09:00 KST → mbtico YouTube Shorts

on:
  schedule:
    - cron: '0 0 * * 1'   # 월 09:00 KST → 용차앱 YouTube
    - cron: '0 0 * * 2'   # 화 09:00 KST → FILO YouTube
    - cron: '30 1 * * 2'  # 화 10:30 KST → FILO Instagram
    - cron: '0 0 * * 3'   # 수 09:00 KST → 인프런 YouTube
    - cron: '30 1 * * 3'  # 수 10:30 KST → 인프런 Instagram
    - cron: '0 0 * * 4'   # 목 09:00 KST → DONWAY YouTube
    - cron: '30 1 * * 4'  # 목 10:30 KST → DONWAY Instagram
    - cron: '0 0 * * 6'   # 토 09:00 KST → mbtico YouTube
  workflow_dispatch:
    inputs:
      product:
        description: '제품 수동 선택 (비워두면 스케줄 기준 자동)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - inflearn
          - yongcha
          - filo
          - donway
          - mbtico
      platforms:
        description: '업로드 플랫폼'
        required: false
        default: 'youtube,instagram'
        type: choice
        options:
          - 'youtube'
          - 'instagram'
          - 'youtube,instagram'
      dry_run:
        description: '업로드 없이 테스트만'
        type: boolean
        default: false

jobs:
  schedule-upload:
    name: 자동 업로드 (${{ github.event.inputs.product || '스케줄 기준' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: FFmpeg 설치
        run: sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      # 스케줄 또는 수동 입력에 따라 제품·플랫폼 결정
      - name: 업로드 대상 결정
        id: target
        run: |
          MANUAL_PRODUCT="${{ github.event.inputs.product }}"
          MANUAL_PLATFORMS="${{ github.event.inputs.platforms }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          if [ -n "$MANUAL_PRODUCT" ]; then
            # 수동 실행
            echo "PRODUCT=$MANUAL_PRODUCT" >> $GITHUB_OUTPUT
            echo "PLATFORMS=${MANUAL_PLATFORMS:-youtube,instagram}" >> $GITHUB_OUTPUT
            echo "DRY_FLAG=$([ "$DRY_RUN" = "true" ] && echo "--dry-run" || echo "")" >> $GITHUB_OUTPUT
            echo "REASON=수동 실행" >> $GITHUB_OUTPUT
          else
            # 스케줄 기반 — 요일+시간으로 결정
            DAY=$(date -u +%u)   # 1=월 2=화 3=수 4=목 5=금 6=토 7=일
            HOUR=$(date -u +%H)  # UTC 기준
            MINUTE=$(date -u +%M)

            if [ "$DAY" = "1" ] && [ "$HOUR" = "00" ]; then
              PRODUCT="yongcha"; PLATFORMS="youtube"; REASON="월 09:00 KST 자동"
            elif [ "$DAY" = "2" ] && [ "$HOUR" = "00" ]; then
              PRODUCT="filo"; PLATFORMS="youtube"; REASON="화 09:00 KST 자동"
            elif [ "$DAY" = "2" ] && [ "$HOUR" = "01" ]; then
              PRODUCT="filo"; PLATFORMS="instagram"; REASON="화 10:30 KST 자동"
            elif [ "$DAY" = "3" ] && [ "$HOUR" = "00" ]; then
              PRODUCT="inflearn"; PLATFORMS="youtube"; REASON="수 09:00 KST 자동"
            elif [ "$DAY" = "3" ] && [ "$HOUR" = "01" ]; then
              PRODUCT="inflearn"; PLATFORMS="instagram"; REASON="수 10:30 KST 자동"
            elif [ "$DAY" = "4" ] && [ "$HOUR" = "00" ]; then
              PRODUCT="donway"; PLATFORMS="youtube"; REASON="목 09:00 KST 자동"
            elif [ "$DAY" = "4" ] && [ "$HOUR" = "01" ]; then
              PRODUCT="donway"; PLATFORMS="instagram"; REASON="목 10:30 KST 자동"
            elif [ "$DAY" = "6" ] && [ "$HOUR" = "00" ]; then
              PRODUCT="mbtico"; PLATFORMS="youtube"; REASON="토 09:00 KST 자동"
            else
              echo "스케줄 매칭 없음: DAY=$DAY HOUR=$HOUR — 건너뜀"
              echo "PRODUCT=skip" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "PRODUCT=$PRODUCT" >> $GITHUB_OUTPUT
            echo "PLATFORMS=$PLATFORMS" >> $GITHUB_OUTPUT
            echo "DRY_FLAG=" >> $GITHUB_OUTPUT
            echo "REASON=$REASON" >> $GITHUB_OUTPUT
          fi

      - name: 실행 정보 출력
        run: |
          echo "제품: ${{ steps.target.outputs.PRODUCT }}"
          echo "플랫폼: ${{ steps.target.outputs.PLATFORMS }}"
          echo "이유: ${{ steps.target.outputs.REASON }}"

      - name: 나레이션 MP3 생성
        if: steps.target.outputs.PRODUCT != 'skip'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          node scripts/audio/generate-narration.js --product "$PRODUCT" \
            || echo "[$PRODUCT] 나레이션 생성 건너뜀 (API 키 없거나 파일 없음)"

      - name: Remotion 영상 렌더링 (인프런)
        if: steps.target.outputs.PRODUCT == 'inflearn'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          mkdir -p output
          CHROMIUM=$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || which chromium 2>/dev/null || echo "")
          [ -n "$CHROMIUM" ] && export CHROMIUM_PATH="$CHROMIUM"
          echo "[$PRODUCT] Remotion 본영상 렌더링..."
          node scripts/remotion/render-${PRODUCT}.js || echo "[$PRODUCT] 본영상 렌더링 실패"
          echo "[$PRODUCT] Remotion Reels 렌더링..."
          node scripts/remotion/render-${PRODUCT}.js --reels || echo "[$PRODUCT] Reels 렌더링 실패"

      - name: 화면 녹화 (Playwright)
        if: steps.target.outputs.PRODUCT != 'skip' && steps.target.outputs.PRODUCT != 'inflearn'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          mkdir -p output
          node scripts/capture/record-$PRODUCT.js

      - name: FFmpeg 영상 편집
        if: steps.target.outputs.PRODUCT != 'skip' && steps.target.outputs.PRODUCT != 'inflearn'
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          bash scripts/compose/compose-video.sh "$PRODUCT"

      - name: YouTube Shorts 업로드
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          contains(steps.target.outputs.PLATFORMS, 'youtube')
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          DRY_FLAG="${{ steps.target.outputs.DRY_FLAG }}"
          echo "[$PRODUCT] YouTube Shorts 업로드..."
          node scripts/upload/upload-youtube-api.js --product "$PRODUCT" --reels $DRY_FLAG

      - name: Instagram Reels 업로드
        if: >-
          steps.target.outputs.PRODUCT != 'skip' &&
          contains(steps.target.outputs.PLATFORMS, 'instagram')
        run: |
          PRODUCT="${{ steps.target.outputs.PRODUCT }}"
          DRY_FLAG="${{ steps.target.outputs.DRY_FLAG }}"
          echo "[$PRODUCT] Instagram Reels 업로드..."
          node scripts/upload/upload-instagram-api.js --product "$PRODUCT" $DRY_FLAG

      - name: 결과 아티팩트 업로드
        if: always() && steps.target.outputs.PRODUCT != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: schedule-${{ steps.target.outputs.PRODUCT }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*-result.json
          if-no-files-found: warn
          retention-days: 14
