name: OCI A1.Flex 생성

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  create-a1-flex:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: OCI CLI 설치
        run: pip install oci-cli -q

      - name: OCI 인증 설정
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-tokyo-1\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" "$HOME/.oci/oci_api_key.pem" > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: 기존 인스턴스 확인
        id: check
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          TOTAL=0
          for REGION in ap-tokyo-1 ap-osaka-1 ap-seoul-1 ap-singapore-1; do
            COUNT=$(oci compute instance list \
              --compartment-id "$TENANCY" \
              --lifecycle-state RUNNING \
              --region "$REGION" \
              2>/dev/null | jq -r '(.data // []) | length' 2>/dev/null || echo "0")
            COUNT="${COUNT:-0}"
            [[ "$COUNT" =~ ^[0-9]+$ ]] || COUNT=0
            if [ "$COUNT" -gt "0" ]; then
              echo "[$REGION] 실행중인 인스턴스 ${COUNT}개 -- 생성 건너뜀"
              TOTAL=$((TOTAL+COUNT))
            fi
          done
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -gt "0" ]; then
            echo "전체 실행중 ${TOTAL}개 -- 종료"
          else
            echo "인스턴스 없음 -- 리전 순서대로 생성 시도"
          fi

      - name: 다중 리전 순차 시도
        if: steps.check.outputs.total == '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SSH_PUB: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          printf '%s' "$SSH_PUB" > /tmp/ssh_pub.key

          for REGION in ap-tokyo-1 ap-osaka-1 ap-seoul-1 ap-singapore-1; do
            echo "===== [$REGION] 시도 ====="

            # AD 조회
            AD=$(oci iam availability-domain list \
              --compartment-id "$TENANCY" \
              --region "$REGION" \
              --query 'data[0].name' --raw-output 2>/dev/null || echo "")
            if [ -z "$AD" ]; then
              echo "[$REGION] AD 조회 실패 -- 다음 리전"
              continue
            fi
            echo "AD: $AD"

            # 서브넷 동적 조회 (첫 번째 퍼블릭 서브넷)
            SUBNET=$(oci network subnet list \
              --compartment-id "$TENANCY" \
              --region "$REGION" \
              2>/dev/null | jq -r '.data // [] | map(select(."prohibit-public-ip-on-vnic" == false)) | .[0].id // ""' 2>/dev/null || echo "")
            if [ -z "$SUBNET" ]; then
              # 퍼블릭 서브넷 없으면 첫 번째 서브넷
              SUBNET=$(oci network subnet list \
                --compartment-id "$TENANCY" \
                --region "$REGION" \
                2>/dev/null | jq -r '.data // [] | .[0].id // ""' 2>/dev/null || echo "")
            fi
            if [ -z "$SUBNET" ]; then
              echo "[$REGION] 서브넷 없음 -- 다음 리전"
              continue
            fi
            echo "Subnet: $SUBNET"

            # 이미지 조회
            IMAGE=$(oci compute image list \
              --compartment-id "$TENANCY" \
              --shape "VM.Standard.A1.Flex" \
              --region "$REGION" \
              2>/dev/null | jq -r '.data // [] | sort_by(."time-created") | reverse | .[0].id // ""' 2>/dev/null || echo "")
            if [ -z "$IMAGE" ]; then
              echo "[$REGION] 이미지 없음 -- 다음 리전"
              continue
            fi
            echo "Image: $IMAGE"

            # 인스턴스 생성 시도
            oci compute instance launch \
              --compartment-id "$TENANCY" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --display-name "filo-a1-flex" \
              --boot-volume-size-in-gbs 200 \
              --assign-public-ip true \
              --ssh-authorized-keys-file /tmp/ssh_pub.key \
              --region "$REGION" \
              > /tmp/launch_result.json 2>&1 || true

            RESULT=$(cat /tmp/launch_result.json 2>/dev/null || echo "")
            echo "$RESULT"

            if echo "$RESULT" | grep -q '"lifecycle-state"'; then
              echo "[$REGION] 인스턴스 생성 성공!"
              PUBLIC_IP=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('public-ip','할당중'))" 2>/dev/null || echo "IP 확인 필요")
              echo "Public IP: $PUBLIC_IP"
              exit 0
            elif echo "$RESULT" | grep -qi "capacity\|InternalError\|TooManyRequests"; then
              echo "[$REGION] 용량 부족 -- 다음 리전 시도"
              continue
            else
              echo "[$REGION] 오류 -- 다음 리전 시도"
              continue
            fi
          done

          echo "모든 리전 용량 부족 -- 10분 후 재시도"
          exit 0
