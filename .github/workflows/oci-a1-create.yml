name: OCI A1.Flex 생성

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  create-a1-flex:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: OCI CLI 설치
        run: pip install oci-cli -q

      - name: OCI 인증 설정
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-tokyo-1\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" "$HOME/.oci/oci_api_key.pem" > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: 현재 OCPU 사용량 확인
        id: check
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          # Always Free A1.Flex 총 허용: 4 OCPU + 24GB (홈리전 도쿄만)
          INSTANCES=$(oci compute instance list \
            --compartment-id "$TENANCY" \
            --lifecycle-state RUNNING \
            --region ap-tokyo-1 \
            2>/dev/null | jq -r '.data // []' 2>/dev/null || echo "[]")
          COUNT=$(echo "$INSTANCES" | jq 'length' 2>/dev/null || echo "0")
          TOTAL_OCPU=$(echo "$INSTANCES" | jq '[.[].["shape-config"].ocpus // 0] | add // 0' 2>/dev/null || echo "0")
          REMAIN=$((4 - TOTAL_OCPU))
          echo "도쿄 실행중: ${COUNT}개, 사용 OCPU: ${TOTAL_OCPU}/4, 남은 할당: ${REMAIN}"
          echo "total_ocpu=$TOTAL_OCPU" >> "$GITHUB_OUTPUT"
          echo "remain=$REMAIN" >> "$GITHUB_OUTPUT"

      - name: A1.Flex 생성 시도 (남은 할당량으로)
        if: steps.check.outputs.remain != '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SSH_PUB: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          REMAIN: ${{ steps.check.outputs.remain }}
        run: |
          printf '%s' "$SSH_PUB" > /tmp/ssh_pub.key
          REGION="ap-tokyo-1"

          # AD 조회
          AD=$(oci iam availability-domain list \
            --compartment-id "$TENANCY" \
            --region "$REGION" \
            --query 'data[0].name' --raw-output 2>/dev/null || echo "")
          if [ -z "$AD" ]; then
            echo "AD 조회 실패"
            exit 0
          fi
          echo "AD: $AD"

          # 서브넷 조회
          SUBNET=$(oci network subnet list \
            --compartment-id "$TENANCY" \
            --region "$REGION" \
            2>/dev/null | jq -r '.data // [] | map(select(."prohibit-public-ip-on-vnic" == false)) | .[0].id // ""' 2>/dev/null || echo "")
          if [ -z "$SUBNET" ]; then
            SUBNET=$(oci network subnet list \
              --compartment-id "$TENANCY" \
              --region "$REGION" \
              2>/dev/null | jq -r '.data // [] | .[0].id // ""' 2>/dev/null || echo "")
          fi
          if [ -z "$SUBNET" ]; then
            echo "서브넷 없음 -- 종료"
            exit 0
          fi
          echo "Subnet: $SUBNET"

          # 이미지 조회
          IMAGE=$(oci compute image list \
            --compartment-id "$TENANCY" \
            --shape "VM.Standard.A1.Flex" \
            --region "$REGION" \
            2>/dev/null | jq -r '.data // [] | sort_by(."time-created") | reverse | .[0].id // ""' 2>/dev/null || echo "")
          if [ -z "$IMAGE" ]; then
            echo "이미지 없음 -- 종료"
            exit 0
          fi
          echo "Image: $IMAGE"

          # 남은 할당량 기준으로 스펙 결정 (작은 것부터 시도 — 1 OCPU가 할당 가능성 가장 높음)
          # REMAIN=4 → 1/2/4 시도, REMAIN=3 → 1/2/3, REMAIN=2 → 1/2, REMAIN=1 → 1
          SPECS=""
          if [ "$REMAIN" -ge 4 ]; then SPECS="1 2 4"; fi
          if [ "$REMAIN" -eq 3 ]; then SPECS="1 2 3"; fi
          if [ "$REMAIN" -eq 2 ]; then SPECS="1 2"; fi
          if [ "$REMAIN" -eq 1 ]; then SPECS="1"; fi

          for OCPU in $SPECS; do
            MEM=$((OCPU * 6))
            BOOT=$((OCPU * 50))
            echo "===== 시도: ${OCPU} OCPU / ${MEM}GB / 부트${BOOT}GB ====="

            oci compute instance launch \
              --compartment-id "$TENANCY" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "{\"ocpus\":${OCPU},\"memoryInGBs\":${MEM}}" \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --display-name "filo-a1-${OCPU}c${MEM}g" \
              --boot-volume-size-in-gbs "$BOOT" \
              --assign-public-ip true \
              --ssh-authorized-keys-file /tmp/ssh_pub.key \
              --region "$REGION" \
              > /tmp/launch_result.json 2>&1 || true

            RESULT=$(cat /tmp/launch_result.json 2>/dev/null || echo "")
            echo "$RESULT"

            if echo "$RESULT" | grep -q '"lifecycle-state"'; then
              echo "인스턴스 생성 성공! (${OCPU} OCPU / ${MEM}GB)"
              PUBLIC_IP=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('public-ip','할당중'))" 2>/dev/null || echo "IP 확인 필요")
              echo "Public IP: $PUBLIC_IP"
              exit 0
            elif echo "$RESULT" | grep -qi "TooManyRequests"; then
              echo "API 레이트 리밋 -- 30초 대기 후 다음 시도"
              sleep 30
              continue
            elif echo "$RESULT" | grep -qi "capacity\|InternalError"; then
              echo "용량 부족 -- 다음 스펙 시도"
              sleep 10
              continue
            else
              echo "오류 -- 다음 스펙 시도"
              continue
            fi
          done

          echo "모든 스펙 용량 부족 -- 10분 후 재시도"
          exit 0

      - name: 할당량 소진
        if: steps.check.outputs.remain == '0'
        run: |
          echo "Always Free 4 OCPU 전부 사용 중 -- 종료"
