name: 소셜미디어 홍보 영상 제작

on:
  workflow_dispatch:
    inputs:
      product:
        description: '제품 선택'
        required: true
        type: choice
        default: filo
        options:
          - filo
          - donway
          - yongcha
          - mbtico
          - dine
          - all
      steps:
        description: '실행 단계 (콤마 구분)'
        required: true
        default: 'record,compose'
        type: choice
        options:
          - 'record,compose'
          - 'record'
          - 'compose'
          - 'record,compose,youtube'
          - 'record,compose,instagram'
          - 'record,compose,youtube,instagram'
          - 'record,compose,youtube,instagram,blog'
          - 'youtube'
          - 'instagram'
          - 'youtube,instagram'
      dry_run:
        description: '업로드 없이 테스트만'
        type: boolean
        default: false

jobs:
  run-on-oracle:
    name: Oracle Cloud 실행 (${{ inputs.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: SSH 키 설정
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Oracle Cloud에서 파이프라인 실행
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_IP: '161.33.136.154'
          ORACLE_USER: 'opc'
          PRODUCT: ${{ inputs.product }}
          STEPS: ${{ inputs.steps }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          ssh -i ~/.ssh/oracle_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${ORACLE_USER}@${ORACLE_IP} \
            "cd ~/mbti-logistics && git pull origin main && node scripts/run-pipeline.js --product ${PRODUCT} --steps \"${STEPS}\" ${DRY_FLAG} 2>&1"
