name: 소셜미디어 홍보 영상 제작

on:
  # 자동 스케줄은 social-media-schedule.yml 에서 관리 (중복 방지)
  workflow_dispatch:
    inputs:
      product:
        description: '제품 선택'
        required: true
        type: choice
        default: all
        options:
          - all
          - filo
          - donway
          - yongcha
          - dine
          - mbtico
          - inflearn
      steps:
        description: '실행 단계 (콤마 구분)'
        required: true
        default: 'record,compose,youtube,instagram'
        type: choice
        options:
          - 'record,compose,youtube,instagram'
          - 'record,compose,youtube'
          - 'record,compose'
          - 'youtube,instagram'
          - 'youtube'
          - 'instagram'
          - 'record'
          - 'compose'
      dry_run:
        description: '업로드 없이 테스트만'
        type: boolean
        default: false

jobs:
  run-pipeline:
    name: 파이프라인 실행
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: FFmpeg 설치
        run: sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      - name: 제품 및 단계 자동 설정
        id: config
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date +%u)  # 1=월 2=화 3=수 4=목
            case $DOW in
              1) PRODUCT="yongcha"; STEPS="record,compose,youtube,instagram" ;;
              2) PRODUCT="filo";    STEPS="record,compose,youtube,instagram" ;;
              4) PRODUCT="donway";  STEPS="record,compose,youtube,instagram" ;;
              *) PRODUCT="none";    STEPS="" ;;
            esac
            DRY_RUN="false"
            echo "실행 모드: 스케줄 자동 ($PRODUCT, $STEPS)"
          else
            PRODUCT="${{ inputs.product }}"
            STEPS="${{ inputs.steps }}"
            DRY_RUN="${{ inputs.dry_run }}"
            echo "실행 모드: 수동 ($PRODUCT, $STEPS)"
          fi
          echo "PRODUCT=$PRODUCT" >> $GITHUB_ENV
          echo "STEPS=$STEPS" >> $GITHUB_ENV
          echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV

      - name: 실행 대상 확인
        run: |
          if [ "$PRODUCT" = "none" ] || [ -z "$STEPS" ]; then
            echo "오늘은 스케줄 대상 없음. 종료."
            exit 0
          fi
          echo "제품: $PRODUCT / 단계: $STEPS / 드라이런: $DRY_RUN"

      - name: BGM 파일 준비
        run: |
          if [ -f "assets/bgm/background.mp3" ]; then
            echo "[BGM] 기존 파일 사용: assets/bgm/background.mp3"
          else
            echo "[BGM] 파일 없음 — ffmpeg으로 앰비언트 BGM 자동 생성 (실제 BGM은 assets/bgm/background.mp3 직접 추가 권장)"
            mkdir -p assets/bgm
            # 코드 아르페지오 + 서브베이스 + 하이햇 시뮬레이션
            ffmpeg -y -f lavfi \
              -i "aevalsrc=0.018*sin(2*PI*110*t)+0.014*sin(2*PI*165*t)+0.010*sin(2*PI*220*t)+0.008*sin(2*PI*277*t)+0.006*sin(2*PI*330*t)+0.015*sin(2*PI*55*t)*exp(-3*(t-floor(t/0.5)*0.5)):sample_rate=44100" \
              -af "afade=in:st=0:d=4,afade=out:st=296:d=4,aecho=0.6:0.6:80:0.3,bass=g=4:f=120,treble=g=2:f=4000,volume=0.55" \
              -t 300 assets/bgm/background.mp3 2>/dev/null \
              && echo "[BGM] 앰비언트 BGM 생성 완료 (실제 음악은 assets/bgm/background.mp3 직접 추가 권장)" \
              || echo "[BGM] 생성 실패 — BGM 없이 진행"
          fi

      - name: 콘텐츠 Variant 선택 (주차 기반 A/B/C/D 로테이션)
        if: ${{ contains(env.STEPS, 'record') || contains(env.STEPS, 'compose') }}
        run: |
          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha; do
              node scripts/compose/generate-variant.js --product $p || echo "[$p] variant 생성 건너뜀"
            done
          else
            node scripts/compose/generate-variant.js --product $PRODUCT || echo "[$PRODUCT] variant 생성 건너뜀"
          fi

      - name: 나레이션 MP3 생성
        if: ${{ contains(env.STEPS, 'record') || contains(env.STEPS, 'compose') }}
        run: |
          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do
              node scripts/audio/generate-narration.js --product $p || echo "[$p] 나레이션 건너뜀"
            done
          else
            node scripts/audio/generate-narration.js --product $PRODUCT || echo "[$PRODUCT] 나레이션 건너뜀"
          fi

      - name: DONWAY 목업 스크린샷 생성
        if: ${{ contains(env.STEPS, 'record') && (env.PRODUCT == 'donway' || env.PRODUCT == 'all') }}
        run: |
          mkdir -p output
          echo "[DONWAY] 목업 PNG 생성..."
          node scripts/capture/generate-donway-mockups.js \
            && echo "[DONWAY] 목업 3종 생성 완료" \
            || echo "[DONWAY] 목업 생성 실패 — Runway image 모드 건너뜀"

      - name: Runway AI 영상 생성 (Gen-4 Turbo)
        if: ${{ contains(env.STEPS, 'record') }}
        env:
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
        run: |
          mkdir -p output
          runway_run() {
            local p=$1
            if [ "$p" = "donway" ] && [ -f "output/donway-mock-settle.png" ]; then
              echo "[$p] Runway 이미지→영상 (3씬 목업 모드)..."
              node scripts/runway-generate.js --product $p --mode scenes
            else
              echo "[$p] Runway 텍스트→영상..."
              node scripts/runway-generate.js --product $p --mode text
            fi
          }
          if [ "$PRODUCT" = "all" ]; then
            # donway는 Remotion 사용 (Runway AI 한글 hallucination 방지)
            for p in filo yongcha inflearn dine; do
              runway_run $p \
                && cp output/${p}-runway.mp4 output/${p}-promo.mp4 \
                && cp output/${p}-runway.mp4 output/${p}-reels.mp4 \
                || echo "[$p] Runway 생성 실패 (Remotion 폴백)"
            done
          elif [ "$PRODUCT" != "donway" ]; then
            runway_run $PRODUCT \
              && cp output/${PRODUCT}-runway.mp4 output/${PRODUCT}-promo.mp4 \
              && cp output/${PRODUCT}-runway.mp4 output/${PRODUCT}-reels.mp4 \
              || echo "[$PRODUCT] Runway 생성 실패 (Remotion 폴백)"
          else
            echo "[donway] Runway 스킵 — Remotion 코드 영상 사용"
          fi

      - name: DONWAY anime.js 영상 생성 (비교용 — $0)
        if: ${{ contains(env.STEPS, 'record') && (env.PRODUCT == 'donway' || env.PRODUCT == 'all') }}
        run: |
          mkdir -p output
          CHROMIUM=$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || which chromium 2>/dev/null || echo "")
          [ -n "$CHROMIUM" ] && export CHROMIUM_PATH="$CHROMIUM"
          echo "[anime.js] DONWAY 애니메이션 영상 생성..."
          node scripts/capture/record-donway-anime.js \
            && echo "[anime.js] donway-anime.mp4 생성 완료" \
            || echo "[anime.js] 생성 실패 (건너뜀)"

      - name: Remotion 코드 영상 렌더링 (FILO·DONWAY·용차앱·인프런)
        if: ${{ contains(env.STEPS, 'record') && (env.PRODUCT == 'filo' || env.PRODUCT == 'donway' || env.PRODUCT == 'yongcha' || env.PRODUCT == 'inflearn' || env.PRODUCT == 'all') }}
        run: |
          mkdir -p output
          CHROMIUM=$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || which chromium 2>/dev/null || echo "")
          [ -n "$CHROMIUM" ] && export CHROMIUM_PATH="$CHROMIUM" && echo "[Remotion] Chromium: $CHROMIUM"

          render_remotion() {
            local p=$1
            echo "[Remotion] ${p} 본영상 렌더링..."
            node scripts/remotion/render-${p}.js || echo "[Remotion] ${p} 본영상 렌더링 실패"
            echo "[Remotion] ${p} Reels 렌더링..."
            node scripts/remotion/render-${p}.js --reels || echo "[Remotion] ${p} Reels 렌더링 실패"
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha inflearn; do
              [ -f "output/${p}-promo.mp4" ] && echo "[$p] Runway 영상 있음 — Remotion 스킵" || render_remotion $p
            done
          elif [ "$PRODUCT" = "filo" ] || [ "$PRODUCT" = "donway" ] || [ "$PRODUCT" = "yongcha" ] || [ "$PRODUCT" = "inflearn" ]; then
            [ -f "output/${PRODUCT}-promo.mp4" ] && echo "[$PRODUCT] Runway 영상 있음 — Remotion 스킵" || render_remotion $PRODUCT
          fi

      - name: 화면 녹화 (Playwright) — dine·mbtico만
        if: ${{ contains(env.STEPS, 'record') && (env.PRODUCT == 'dine' || env.PRODUCT == 'mbtico' || env.PRODUCT == 'all') }}
        run: |
          mkdir -p output
          if [ "$PRODUCT" = "all" ]; then
            for p in dine mbtico; do
              echo "[$p] 녹화 시작..."
              node scripts/capture/record-$p.js || echo "[$p] 녹화 실패 (건너뜀)"
            done
          elif [ "$PRODUCT" = "dine" ] || [ "$PRODUCT" = "mbtico" ]; then
            node scripts/capture/record-$PRODUCT.js
          fi

      - name: FFmpeg 영상 편집
        if: ${{ contains(env.STEPS, 'compose') }}
        run: |
          # Runway/Remotion 출력(promo.mp4)에 나레이션+자막 합성
          mix_audio() {
            local p=$1
            local PROMO="output/${p}-promo.mp4"
            local NAR="output/${p}-narration.mp3"
            local BGM="assets/bgm/background.mp3"
            local SRT="scripts/content/${p}-subtitles.srt"
            local ASS_FILE="output/${p}-subtitles.ass"
            local MIXED="output/${p}-mixed.mp4"

            if [ ! -f "$NAR" ] && [ ! -f "$BGM" ]; then
              echo "[$p] 나레이션/BGM 없음 — 믹싱 스킵"
              return
            fi

            SUBTITLE_FILTER=""
            if [ -f "$SRT" ]; then
              node scripts/compose/srt-to-ass.js "$SRT" "$ASS_FILE" 2>/dev/null \
                && SUBTITLE_FILTER=",ass='${ASS_FILE}'" \
                || echo "[$p] ASS 변환 실패 — 자막 없이 진행"
            fi

            if [ -f "$NAR" ] && [ -f "$BGM" ]; then
              AUDIO_ARGS="-i $NAR -i $BGM"
              AUDIO_FILTER="[1:a]volume=1.0[nar];[2:a]volume=0.10[bgm];[nar][bgm]amix=inputs=2:duration=first:normalize=0[audio]"
              MAP="-map 0:v -map [audio]"
            elif [ -f "$NAR" ]; then
              AUDIO_ARGS="-i $NAR"
              AUDIO_FILTER="[1:a]volume=1.0[audio]"
              MAP="-map 0:v -map [audio]"
            else
              AUDIO_ARGS="-i $BGM"
              AUDIO_FILTER="[1:a]volume=1.0[audio]"
              MAP="-map 0:v -map [audio]"
            fi

            echo "[$p] 나레이션+자막 합성 중..."
            ffmpeg -y -i "$PROMO" $AUDIO_ARGS \
              -filter_complex "${AUDIO_FILTER}" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1${SUBTITLE_FILTER}" \
              $MAP -c:v libx264 -preset fast -crf 18 -c:a aac -b:a 192k -shortest "$MIXED" \
              && mv "$MIXED" "$PROMO" \
              && cp "$PROMO" "output/${p}-reels.mp4" \
              && echo "[$p] 합성 완료" \
              || echo "[$p] 합성 실패 — 원본 사용"
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha inflearn; do
              [ -f "output/${p}-promo.mp4" ] && mix_audio $p || echo "[$p] promo.mp4 없음"
            done
            for p in dine mbtico; do
              RAW="output/${p}-raw.webm"
              [ -f "$RAW" ] && bash scripts/compose/compose-video.sh $p || echo "[$p] 녹화 파일 없음: 건너뜀"
            done
          elif [ "$PRODUCT" = "filo" ] || [ "$PRODUCT" = "donway" ] || [ "$PRODUCT" = "yongcha" ] || [ "$PRODUCT" = "inflearn" ]; then
            [ -f "output/${PRODUCT}-promo.mp4" ] && mix_audio $PRODUCT || echo "[$PRODUCT] promo.mp4 없음 — compose 건너뜀"
          else
            bash scripts/compose/compose-video.sh $PRODUCT
          fi

      - name: YouTube 업로드 (Data API v3)
        if: ${{ contains(env.STEPS, 'youtube') }}
        continue-on-error: true
        env:
          DRY_FLAG: ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        run: |
          DRY_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"

          upload_yt() {
            local p=$1
            if [ "$p" = "filo" ]; then
              MP4="output/filo-promo.mp4"
              if [ ! -f "$MP4" ]; then
                MP4="output/filo-final.mp4"
              fi
            else
              MP4="output/${p}-reels.mp4"
            fi
            if [ -f "$MP4" ] || [ "$DRY_RUN" = "true" ]; then
              echo "[$p] YouTube 업로드..."
              node scripts/upload/upload-youtube-api.js --product $p --reels $DRY_FLAG || echo "[$p] 업로드 실패"
            else
              echo "[$p] MP4 없음: $MP4 (건너뜀)"
            fi
          }

          FAILED=0
          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha inflearn; do upload_yt $p || FAILED=1; done
          else
            upload_yt $PRODUCT || FAILED=1
          fi
          if [ "$FAILED" = "1" ]; then
            echo "::warning::YouTube 업로드 일부 실패 — Actions 로그 확인"
          fi

      - name: Instagram Reels 업로드
        if: ${{ always() && contains(env.STEPS, 'instagram') }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          DRY_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"

          upload_one() {
            local p=$1
            MP4="output/${p}-reels.mp4"
            [ ! -f "$MP4" ] && [ "$p" = "filo" ] && MP4="output/filo-promo.mp4"
            if [ ! -f "$MP4" ] && [ "$DRY_RUN" != "true" ]; then
              echo "[$p] Reels MP4 없음 (건너뜀)"
              return
            fi
            if [ -n "$INSTAGRAM_ACCESS_TOKEN" ] && [ -n "$INSTAGRAM_ACCOUNT_ID" ]; then
              echo "[$p] Instagram Graph API 업로드..."
              node scripts/upload/upload-instagram-api.js --product $p $DRY_FLAG || echo "[$p] Graph API 업로드 실패"
            else
              echo "[$p] Playwright 업로드..."
              timeout 120 node scripts/upload/upload-instagram.js --product $p --type reels $DRY_FLAG || echo "[$p] Playwright 업로드 실패"
            fi
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do upload_one $p; done
          else
            upload_one $PRODUCT
          fi

      - name: 영상 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ env.PRODUCT }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.webm
            output/*.png
            output/*-upload-result.json
          if-no-files-found: warn
          retention-days: 7
