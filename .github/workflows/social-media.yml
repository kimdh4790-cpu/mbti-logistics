name: 소셜미디어 홍보 영상 제작

on:
  workflow_dispatch:
    inputs:
      product:
        description: '제품 선택'
        required: true
        type: choice
        default: yongcha
        options:
          - yongcha
          - filo
          - dine
          - donway
          - mbtico
          - all
      steps:
        description: '실행 단계 (콤마 구분)'
        required: true
        default: 'record,compose,youtube'
        type: choice
        options:
          - 'record,compose'
          - 'record,compose,youtube'
          - 'record,compose,youtube,instagram'
          - 'record'
          - 'compose'
          - 'youtube'
          - 'instagram'
          - 'youtube,instagram'
      dry_run:
        description: '업로드 없이 테스트만'
        type: boolean
        default: false

jobs:
  run-pipeline:
    name: 파이프라인 실행 (${{ inputs.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: FFmpeg 설치
        run: sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      - name: 나레이션 MP3 생성
        if: ${{ contains(inputs.steps, 'record') || contains(inputs.steps, 'compose') }}
        run: |
          PRODUCT="${{ inputs.product }}"
          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do
              echo "[$p] 나레이션 생성..."
              node scripts/audio/generate-narration.js --product $p || echo "[$p] 나레이션 생성 건너뜀 (API 키 없거나 파일 이미 존재)"
            done
          else
            node scripts/audio/generate-narration.js --product $PRODUCT || echo "[$PRODUCT] 나레이션 생성 건너뜀"
          fi

      - name: Remotion FILO 영상 렌더링
        if: ${{ contains(inputs.steps, 'record') && (inputs.product == 'filo' || inputs.product == 'all') }}
        run: |
          mkdir -p output
          # Playwright가 설치한 Chromium 경로 탐색
          CHROMIUM=$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || which chromium 2>/dev/null || echo "")
          if [ -n "$CHROMIUM" ]; then
            export CHROMIUM_PATH="$CHROMIUM"
            echo "[Remotion] Chromium: $CHROMIUM"
          fi
          echo "[Remotion] FILO 본영상 렌더링 (30초)..."
          node scripts/remotion/render-filo.js || echo "[Remotion] 본영상 렌더링 실패"
          echo "[Remotion] FILO Reels 렌더링..."
          node scripts/remotion/render-filo.js --reels || echo "[Remotion] Reels 렌더링 실패"

      - name: 화면 녹화 (Playwright)
        if: ${{ contains(inputs.steps, 'record') }}
        run: |
          PRODUCT="${{ inputs.product }}"
          mkdir -p output
          if [ "$PRODUCT" = "all" ]; then
            # filo는 Remotion에서 처리하므로 제외
            for p in dine donway yongcha mbtico; do
              echo "[$p] 녹화 시작..."
              node scripts/capture/record-$p.js || echo "[$p] 녹화 실패 (건너뜀)"
            done
          elif [ "$PRODUCT" != "filo" ]; then
            node scripts/capture/record-$PRODUCT.js
          else
            echo "[filo] Remotion에서 처리됨 (Playwright 녹화 건너뜀)"
          fi

      - name: FFmpeg 영상 편집
        if: ${{ contains(inputs.steps, 'compose') }}
        run: |
          PRODUCT="${{ inputs.product }}"
          if [ "$PRODUCT" = "all" ]; then
            for p in dine donway yongcha mbtico; do
              RAW="output/${p}-raw.webm"
              if [ -f "$RAW" ]; then
                echo "[$p] 편집 시작..."
                bash scripts/compose/compose-video.sh $p || echo "[$p] 편집 실패"
              else
                echo "[$p] 녹화 파일 없음: $RAW (건너뜀)"
              fi
            done
            # filo: Remotion 출력 확인
            if [ -f "output/filo-promo.mp4" ]; then
              echo "[filo] Remotion 영상 준비됨 (FFmpeg 편집 건너뜀)"
            else
              echo "[filo] Remotion 출력 없음. Playwright 영상으로 시도..."
              RAW="output/filo-raw.webm"
              if [ -f "$RAW" ]; then
                bash scripts/compose/compose-video.sh filo || echo "[filo] 편집 실패"
              else
                echo "[filo] 영상 없음: 건너뜀"
              fi
            fi
          elif [ "$PRODUCT" = "filo" ]; then
            if [ -f "output/filo-promo.mp4" ]; then
              echo "[filo] Remotion 영상 준비됨 (FFmpeg 편집 건너뜀)"
            else
              bash scripts/compose/compose-video.sh filo
            fi
          else
            bash scripts/compose/compose-video.sh $PRODUCT
          fi

      - name: YouTube 업로드 (Data API v3)
        if: ${{ contains(inputs.steps, 'youtube') }}
        run: |
          PRODUCT="${{ inputs.product }}"
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi

          upload_yt() {
            local p=$1
            # filo는 promo.mp4 사용, 나머지는 reels.mp4
            if [ "$p" = "filo" ]; then
              MP4="output/filo-promo.mp4"
              [ ! -f "$MP4" ] && MP4="output/filo-final.mp4"
            else
              MP4="output/${p}-reels.mp4"
            fi
            if [ -f "$MP4" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "[$p] YouTube 숏츠 업로드..."
              node scripts/upload/upload-youtube-api.js --product $p --reels $DRY_FLAG || echo "[$p] 업로드 실패"
            else
              echo "[$p] MP4 없음: $MP4 (건너뜀)"
            fi
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do
              upload_yt $p
            done
          else
            upload_yt $PRODUCT
          fi

      - name: Instagram Reels 업로드
        if: ${{ contains(inputs.steps, 'instagram') }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          PRODUCT="${{ inputs.product }}"
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi

          upload_one() {
            local p=$1
            # filo: reels 없으면 promo 사용
            MP4="output/${p}-reels.mp4"
            if [ ! -f "$MP4" ] && [ "$p" = "filo" ]; then
              MP4="output/filo-promo.mp4"
            fi
            if [ ! -f "$MP4" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "[$p] Reels MP4 없음: $MP4 (건너뜀)"
              return
            fi
            if [ -n "$INSTAGRAM_ACCESS_TOKEN" ] && [ -n "$INSTAGRAM_ACCOUNT_ID" ]; then
              echo "[$p] Instagram Graph API 방식으로 업로드..."
              node scripts/upload/upload-instagram-api.js --product $p $DRY_FLAG || echo "[$p] Graph API 업로드 실패"
            else
              echo "[$p] Playwright 방식으로 업로드 (토큰 미설정)..."
              timeout 120 node scripts/upload/upload-instagram.js --product $p --type reels $DRY_FLAG || echo "[$p] Playwright 업로드 실패 또는 타임아웃"
            fi
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do
              upload_one $p
            done
          else
            upload_one $PRODUCT
          fi

      - name: 영상 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ inputs.product }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.webm
            output/*.png
            output/*-upload-result.json
          if-no-files-found: warn
          retention-days: 7
