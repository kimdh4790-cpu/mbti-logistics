name: 소셜미디어 홍보 영상 제작

on:
  schedule:
    # KST 09:00 = UTC 00:00
    - cron: '0 0 * * 1'   # 월요일 09:00 KST — 용차앱 YouTube
    - cron: '0 0 * * 2'   # 화요일 09:00 KST — FILO YouTube+Instagram
    - cron: '0 0 * * 4'   # 목요일 09:00 KST — DONWAY YouTube+Instagram
  workflow_dispatch:
    inputs:
      product:
        description: '제품 선택'
        required: true
        type: choice
        default: all
        options:
          - all
          - filo
          - donway
          - yongcha
          - dine
          - mbtico
      steps:
        description: '실행 단계 (콤마 구분)'
        required: true
        default: 'record,compose,youtube,instagram'
        type: choice
        options:
          - 'record,compose,youtube,instagram'
          - 'record,compose,youtube'
          - 'record,compose'
          - 'youtube,instagram'
          - 'youtube'
          - 'instagram'
          - 'record'
          - 'compose'
      dry_run:
        description: '업로드 없이 테스트만'
        type: boolean
        default: false

jobs:
  run-pipeline:
    name: 파이프라인 실행
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: FFmpeg 설치
        run: sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      - name: 제품 및 단계 자동 설정
        id: config
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date +%u)  # 1=월 2=화 3=수 4=목
            case $DOW in
              1) PRODUCT="yongcha"; STEPS="record,compose,youtube,instagram" ;;
              2) PRODUCT="filo";    STEPS="record,compose,youtube,instagram" ;;
              4) PRODUCT="donway";  STEPS="record,compose,youtube,instagram" ;;
              *) PRODUCT="none";    STEPS="" ;;
            esac
            DRY_RUN="false"
            echo "실행 모드: 스케줄 자동 ($PRODUCT, $STEPS)"
          else
            PRODUCT="${{ inputs.product }}"
            STEPS="${{ inputs.steps }}"
            DRY_RUN="${{ inputs.dry_run }}"
            echo "실행 모드: 수동 ($PRODUCT, $STEPS)"
          fi
          echo "PRODUCT=$PRODUCT" >> $GITHUB_ENV
          echo "STEPS=$STEPS" >> $GITHUB_ENV
          echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV

      - name: 실행 대상 확인
        run: |
          if [ "$PRODUCT" = "none" ] || [ -z "$STEPS" ]; then
            echo "오늘은 스케줄 대상 없음. 종료."
            exit 0
          fi
          echo "제품: $PRODUCT / 단계: $STEPS / 드라이런: $DRY_RUN"

      - name: BGM 파일 준비
        run: |
          if [ -f "assets/bgm/background.mp3" ]; then
            echo "[BGM] 기존 파일 사용: assets/bgm/background.mp3"
          else
            echo "[BGM] 파일 없음 — ffmpeg으로 앰비언트 BGM 자동 생성 (실제 BGM은 assets/bgm/background.mp3 직접 추가 권장)"
            mkdir -p assets/bgm
            # 코드 아르페지오 + 서브베이스 + 하이햇 시뮬레이션
            ffmpeg -y -f lavfi \
              -i "aevalsrc=0.018*sin(2*PI*110*t)+0.014*sin(2*PI*165*t)+0.010*sin(2*PI*220*t)+0.008*sin(2*PI*277*t)+0.006*sin(2*PI*330*t)+0.015*sin(2*PI*55*t)*exp(-3*(t-floor(t/0.5)*0.5)):sample_rate=44100" \
              -af "afade=in:st=0:d=4,afade=out:st=296:d=4,aecho=0.6:0.6:80:0.3,bass=g=4:f=120,treble=g=2:f=4000,volume=0.55" \
              -t 300 assets/bgm/background.mp3 2>/dev/null \
              && echo "[BGM] 앰비언트 BGM 생성 완료 (실제 음악은 assets/bgm/background.mp3 직접 추가 권장)" \
              || echo "[BGM] 생성 실패 — BGM 없이 진행"
          fi

      - name: 콘텐츠 Variant 선택 (주차 기반 A/B/C/D 로테이션)
        if: ${{ contains(env.STEPS, 'record') || contains(env.STEPS, 'compose') }}
        run: |
          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha; do
              node scripts/compose/generate-variant.js --product $p || echo "[$p] variant 생성 건너뜀"
            done
          else
            node scripts/compose/generate-variant.js --product $PRODUCT || echo "[$PRODUCT] variant 생성 건너뜀"
          fi

      - name: 나레이션 MP3 생성
        if: ${{ contains(env.STEPS, 'record') || contains(env.STEPS, 'compose') }}
        run: |
          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do
              node scripts/audio/generate-narration.js --product $p || echo "[$p] 나레이션 건너뜀"
            done
          else
            node scripts/audio/generate-narration.js --product $PRODUCT || echo "[$PRODUCT] 나레이션 건너뜀"
          fi

      - name: Remotion 코드 영상 렌더링 (FILO·DONWAY·용차앱)
        if: ${{ contains(env.STEPS, 'record') && (env.PRODUCT == 'filo' || env.PRODUCT == 'donway' || env.PRODUCT == 'yongcha' || env.PRODUCT == 'all') }}
        run: |
          mkdir -p output
          CHROMIUM=$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || which chromium 2>/dev/null || echo "")
          [ -n "$CHROMIUM" ] && export CHROMIUM_PATH="$CHROMIUM" && echo "[Remotion] Chromium: $CHROMIUM"

          render_remotion() {
            local p=$1
            echo "[Remotion] ${p} 본영상 렌더링..."
            node scripts/remotion/render-${p}.js || echo "[Remotion] ${p} 본영상 렌더링 실패"
            echo "[Remotion] ${p} Reels 렌더링..."
            node scripts/remotion/render-${p}.js --reels || echo "[Remotion] ${p} Reels 렌더링 실패"
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha; do render_remotion $p; done
          elif [ "$PRODUCT" = "filo" ] || [ "$PRODUCT" = "donway" ] || [ "$PRODUCT" = "yongcha" ]; then
            render_remotion $PRODUCT
          fi

      - name: 화면 녹화 (Playwright) — dine·mbtico만
        if: ${{ contains(env.STEPS, 'record') && (env.PRODUCT == 'dine' || env.PRODUCT == 'mbtico' || env.PRODUCT == 'all') }}
        run: |
          mkdir -p output
          if [ "$PRODUCT" = "all" ]; then
            for p in dine mbtico; do
              echo "[$p] 녹화 시작..."
              node scripts/capture/record-$p.js || echo "[$p] 녹화 실패 (건너뜀)"
            done
          elif [ "$PRODUCT" = "dine" ] || [ "$PRODUCT" = "mbtico" ]; then
            node scripts/capture/record-$PRODUCT.js
          fi

      - name: FFmpeg 영상 편집
        if: ${{ contains(env.STEPS, 'compose') }}
        run: |
          # Remotion 렌더 완료 제품(filo/donway/yongcha)은 FFmpeg 편집 불필요
          # Playwright 녹화 제품(dine/mbtico)만 FFmpeg 합성
          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha; do
              [ -f "output/${p}-promo.mp4" ] && echo "[$p] Remotion 영상 준비됨" || echo "[$p] Remotion 영상 없음"
            done
            for p in dine mbtico; do
              RAW="output/${p}-raw.webm"
              [ -f "$RAW" ] && bash scripts/compose/compose-video.sh $p || echo "[$p] 녹화 파일 없음: 건너뜀"
            done
          elif [ "$PRODUCT" = "filo" ] || [ "$PRODUCT" = "donway" ] || [ "$PRODUCT" = "yongcha" ]; then
            [ -f "output/${PRODUCT}-promo.mp4" ] && echo "[$PRODUCT] Remotion 영상 준비됨 (FFmpeg 건너뜀)" || echo "[$PRODUCT] Remotion 영상 없음 — compose 건너뜀"
          else
            bash scripts/compose/compose-video.sh $PRODUCT
          fi

      - name: YouTube 업로드 (Data API v3)
        if: ${{ contains(env.STEPS, 'youtube') }}
        env:
          DRY_FLAG: ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        run: |
          DRY_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"

          upload_yt() {
            local p=$1
            if [ "$p" = "filo" ]; then
              MP4="output/filo-promo.mp4"
              [ ! -f "$MP4" ] && MP4="output/filo-final.mp4"
            else
              MP4="output/${p}-reels.mp4"
            fi
            if [ -f "$MP4" ] || [ "$DRY_RUN" = "true" ]; then
              echo "[$p] YouTube 업로드..."
              node scripts/upload/upload-youtube-api.js --product $p --reels $DRY_FLAG || echo "[$p] 업로드 실패"
            else
              echo "[$p] MP4 없음: $MP4 (건너뜀)"
            fi
          }

          FAILED=0
          if [ "$PRODUCT" = "all" ]; then
            for p in filo donway yongcha; do upload_yt $p || FAILED=1; done
          else
            upload_yt $PRODUCT || FAILED=1
          fi
          [ "$FAILED" = "1" ] && echo "::warning::YouTube 업로드 일부 실패 — Actions 로그 확인"

      - name: Instagram Reels 업로드
        if: ${{ contains(env.STEPS, 'instagram') }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          DRY_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"

          upload_one() {
            local p=$1
            MP4="output/${p}-reels.mp4"
            [ ! -f "$MP4" ] && [ "$p" = "filo" ] && MP4="output/filo-promo.mp4"
            if [ ! -f "$MP4" ] && [ "$DRY_RUN" != "true" ]; then
              echo "[$p] Reels MP4 없음 (건너뜀)"
              return
            fi
            if [ -n "$INSTAGRAM_ACCESS_TOKEN" ] && [ -n "$INSTAGRAM_ACCOUNT_ID" ]; then
              echo "[$p] Instagram Graph API 업로드..."
              node scripts/upload/upload-instagram-api.js --product $p $DRY_FLAG || echo "[$p] Graph API 업로드 실패"
            else
              echo "[$p] Playwright 업로드..."
              timeout 120 node scripts/upload/upload-instagram.js --product $p --type reels $DRY_FLAG || echo "[$p] Playwright 업로드 실패"
            fi
          }

          if [ "$PRODUCT" = "all" ]; then
            for p in filo dine donway yongcha mbtico; do upload_one $p; done
          else
            upload_one $PRODUCT
          fi

      - name: 영상 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ env.PRODUCT }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.webm
            output/*.png
            output/*-upload-result.json
          if-no-files-found: warn
          retention-days: 7
