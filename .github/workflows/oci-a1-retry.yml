name: OCI A1.Flex 자동 생성 (10분 재시도)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-a1-retry.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [oci-retry]

jobs:
  create-a1-flex:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: OCI CLI 설치
        run: pip install oci-cli -q

      - name: OCI 인증 설정
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-tokyo-1\nkey_file=/root/.oci/oci_api_key.pem\n' \
            "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" > ~/.oci/config

      - name: 기존 실행중 인스턴스 확인
        id: check
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id "$TENANCY" \
            --lifecycle-state RUNNING \
            --query 'length(data)' \
            --raw-output 2>/dev/null || echo "0")
          echo "running=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "✅ 이미 실행중인 인스턴스 $COUNT 개 있음 — 생성 건너뜀"
          else
            echo "인스턴스 없음 — 생성 시도"
          fi

      - name: 리소스 정보 조회 (AD / Image)
        id: res
        if: steps.check.outputs.running == '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          # Availability Domain
          AD=$(oci iam availability-domain list \
            --compartment-id "$TENANCY" \
            --query 'data[0].name' --raw-output 2>&1 || echo "")
          echo "Availability Domain: $AD"

          if [ -z "$AD" ] || echo "$AD" | grep -qi "error\|ServiceError\|Traceback"; then
            echo "❌ AD 조회 실패: $AD"
            exit 1
          fi
          echo "ad=$AD" >> "$GITHUB_OUTPUT"

          # Subnet — 콘솔에서 직접 가져온 OCID 사용
          echo "subnet=${{ secrets.OCI_SUBNET_ID }}" >> "$GITHUB_OUTPUT"
          echo "Subnet: ${{ secrets.OCI_SUBNET_ID }}"

          # Image (Oracle Linux ARM) — Python으로 안전하게 파싱
          IMAGE_RAW=$(oci compute image list \
            --compartment-id "$TENANCY" \
            --shape "VM.Standard.A1.Flex" \
            --operating-system "Oracle Linux" \
            2>/dev/null || echo "")

          IMAGE=$(echo "$IMAGE_RAW" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    items = sorted(d.get('data', []), key=lambda x: x.get('time-created', ''))
    print(items[-1]['id'] if items else '')
except:
    print('')
" 2>/dev/null || echo "")

          # 폴백: Oracle Linux 8 시도
          if [ -z "$IMAGE" ]; then
            echo "Oracle Linux 폴백 → Oracle Linux 8 시도..."
            IMAGE_RAW2=$(oci compute image list \
              --compartment-id "$TENANCY" \
              --shape "VM.Standard.A1.Flex" \
              --operating-system "Oracle Linux 8" \
              2>/dev/null || echo "")
            IMAGE=$(echo "$IMAGE_RAW2" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    items = sorted(d.get('data', []), key=lambda x: x.get('time-created', ''))
    print(items[-1]['id'] if items else '')
except:
    print('')
" 2>/dev/null || echo "")
          fi

          # 폴백2: OS 필터 없이 ARM 이미지 조회
          if [ -z "$IMAGE" ]; then
            echo "OS 필터 없이 ARM 이미지 조회..."
            IMAGE_RAW3=$(oci compute image list \
              --compartment-id "$TENANCY" \
              --shape "VM.Standard.A1.Flex" \
              2>/dev/null || echo "")
            IMAGE=$(echo "$IMAGE_RAW3" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    items = sorted(d.get('data', []), key=lambda x: x.get('time-created', ''))
    print(items[-1]['id'] if items else '')
except:
    print('')
" 2>/dev/null || echo "")
          fi

          echo "Image: $IMAGE"
          if [ -z "$IMAGE" ]; then
            echo "❌ 이미지를 찾을 수 없음"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: A1.Flex 인스턴스 생성 시도
        id: launch
        if: steps.check.outputs.running == '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SSH_PUB: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          AD: ${{ steps.res.outputs.ad }}
          SUBNET: ${{ steps.res.outputs.subnet }}
          IMAGE: ${{ steps.res.outputs.image }}
        run: |
          printf '%s' "$SSH_PUB" > /tmp/ssh_pub.key

          RESULT=$(oci compute instance launch \
            --compartment-id "$TENANCY" \
            --availability-domain "$AD" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --image-id "$IMAGE" \
            --subnet-id "$SUBNET" \
            --display-name "filo-a1-flex" \
            --boot-volume-size-in-gbs 200 \
            --assign-public-ip true \
            --ssh-authorized-keys-file /tmp/ssh_pub.key \
            2>&1)

          echo "$RESULT"

          if echo "$RESULT" | grep -q '"lifecycle-state"'; then
            echo "✅ 인스턴스 생성 성공!"
            PUBLIC_IP=$(echo "$RESULT" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            print(d.get('data', {}).get('public-ip', 'IP 할당중'))
          except:
            print('IP 확인 필요')
          " 2>/dev/null || echo "IP 확인 필요")
            echo "Public IP: $PUBLIC_IP"
            echo "success=true" >> "$GITHUB_OUTPUT"
          elif echo "$RESULT" | grep -qi "InternalError\|TooManyRequests\|Out of capacity\|capacity"; then
            echo "⏳ 용량 부족 — 10분 후 자동 재시도"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "❌ 오류 발생:"
            echo "$RESULT"
            exit 1
          fi
