name: OCI A1.Flex 자동 생성 (10분 재시도)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create-a1-flex:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: OCI CLI 설치
        run: pip install oci-cli -q

      - name: OCI 인증 설정
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-tokyo-1\nkey_file=/root/.oci/oci_api_key.pem\n' \
            "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" > ~/.oci/config

      - name: 기존 실행중 인스턴스 확인
        id: check
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id "$TENANCY" \
            --lifecycle-state RUNNING \
            --query 'length(data)' \
            --raw-output 2>/dev/null || echo "0")
          echo "running=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "✅ 이미 실행중인 인스턴스 $COUNT 개 있음 — 생성 건너뜀"
          else
            echo "인스턴스 없음 — 생성 시도"
          fi

      - name: 리소스 정보 조회 (AD / Subnet / Image)
        id: res
        if: steps.check.outputs.running == '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          # Availability Domain
          AD=$(oci iam availability-domain list \
            --compartment-id "$TENANCY" \
            --query 'data[0].name' --raw-output 2>&1)
          echo "AD 조회 결과: $AD"
          echo "ad=$AD" >> "$GITHUB_OUTPUT"

          # VCN - 하위 컴파트먼트 포함 검색
          echo "--- VCN 목록 조회 ---"
          VCN_RAW=$(oci network vcn list \
            --compartment-id "$TENANCY" \
            --compartment-id-in-subtree true \
            2>&1)
          echo "$VCN_RAW"

          VCN=$(echo "$VCN_RAW" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            items = d.get('data', [])
            if items:
              print(items[0]['id'])
            else:
              print('')
          except Exception as e:
            print('')
          " 2>/dev/null)

          if [ -z "$VCN" ] || [ "$VCN" = "None" ]; then
            echo "❌ VCN 없음 — 기본 VCN 생성"
            VCN=$(oci network vcn create \
              --compartment-id "$TENANCY" \
              --cidr-block "10.0.0.0/16" \
              --display-name "filo-vcn" \
              --query 'data.id' --raw-output 2>&1)
            echo "생성된 VCN: $VCN"

            IGW=$(oci network internet-gateway create \
              --compartment-id "$TENANCY" \
              --vcn-id "$VCN" \
              --is-enabled true \
              --display-name "filo-igw" \
              --query 'data.id' --raw-output 2>/dev/null)

            RT_ID=$(oci network route-table list \
              --compartment-id "$TENANCY" \
              --vcn-id "$VCN" \
              --query 'data[0].id' --raw-output 2>/dev/null)

            oci network route-table update \
              --rt-id "$RT_ID" \
              --route-rules "[{\"destination\":\"0.0.0.0/0\",\"destinationType\":\"CIDR_BLOCK\",\"networkEntityId\":\"$IGW\"}]" \
              --force 2>/dev/null || true
          fi

          echo "VCN ID: $VCN"

          # Subnet
          echo "--- Subnet 조회 ---"
          SUBNET=$(oci network subnet list \
            --compartment-id "$TENANCY" \
            --vcn-id "$VCN" \
            --query 'data[0].id' --raw-output 2>&1)
          echo "Subnet 결과: $SUBNET"

          if [ -z "$SUBNET" ] || [ "$SUBNET" = "None" ]; then
            echo "Subnet 없음 — 생성"
            SUBNET=$(oci network subnet create \
              --compartment-id "$TENANCY" \
              --vcn-id "$VCN" \
              --cidr-block "10.0.0.0/24" \
              --display-name "filo-subnet" \
              --query 'data.id' --raw-output 2>&1)
            echo "생성된 Subnet: $SUBNET"
          fi

          echo "subnet=$SUBNET" >> "$GITHUB_OUTPUT"

          # Image (Oracle Linux ARM)
          echo "--- Image 조회 ---"
          IMAGE=$(oci compute image list \
            --compartment-id "$TENANCY" \
            --shape "VM.Standard.A1.Flex" \
            --operating-system "Oracle Linux" \
            --query 'sort_by(data, &"time-created")[-1].id' \
            --raw-output 2>&1)
          echo "Image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: A1.Flex 인스턴스 생성 시도
        id: launch
        if: steps.check.outputs.running == '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SSH_PUB: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          AD: ${{ steps.res.outputs.ad }}
          SUBNET: ${{ steps.res.outputs.subnet }}
          IMAGE: ${{ steps.res.outputs.image }}
        run: |
          printf '%s' "$SSH_PUB" > /tmp/ssh_pub.key

          RESULT=$(oci compute instance launch \
            --compartment-id "$TENANCY" \
            --availability-domain "$AD" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --image-id "$IMAGE" \
            --subnet-id "$SUBNET" \
            --display-name "filo-a1-flex" \
            --boot-volume-size-in-gbs 200 \
            --assign-public-ip true \
            --ssh-authorized-keys-file /tmp/ssh_pub.key \
            2>&1)

          echo "$RESULT"

          if echo "$RESULT" | grep -q '"lifecycle-state"'; then
            echo "✅ 인스턴스 생성 성공!"
            PUBLIC_IP=$(echo "$RESULT" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            print(d.get('data', {}).get('public-ip', 'IP 할당중'))
          except:
            print('IP 확인 필요')
          " 2>/dev/null || echo "IP 확인 필요")
            echo "Public IP: $PUBLIC_IP"
            echo "success=true" >> "$GITHUB_OUTPUT"
          elif echo "$RESULT" | grep -qi "InternalError\|TooManyRequests\|Out of capacity\|capacity"; then
            echo "⏳ 용량 부족 — 10분 후 자동 재시도"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "❌ 오류 발생:"
            echo "$RESULT"
            exit 1
          fi
