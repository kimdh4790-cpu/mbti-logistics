name: Reset Firebase Password (One-Time)
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler@4 --silent

      - name: Sync CF_GLOBAL_KEY Worker secret and reset admin passwords
        env:
          CF_KEY: ${{ secrets.CF_GLOBAL_KEY }}
          CF_EMAIL: kimdh4790@gmail.com
        run: |
          CF_KEY="$(printf '%s' "$CF_KEY" | tr -d '\r\n\t ')"

          echo "--- Step 1: Worker CF_GLOBAL_KEY = GitHub CF_GLOBAL_KEY 업데이트 ---"
          if printf '%s' "$CF_KEY" | CLOUDFLARE_API_TOKEN="$CF_KEY" npx wrangler secret put CF_GLOBAL_KEY 2>&1; then
            echo "Updated via API Token"
          else
            printf '%s' "$CF_KEY" | CLOUDFLARE_API_KEY="$CF_KEY" CLOUDFLARE_EMAIL="$CF_EMAIL" npx wrangler secret put CF_GLOBAL_KEY 2>&1
          fi

          echo "--- Worker 반영 대기 (5초) ---"
          sleep 5

          echo "--- Step 2: 모든 도메인에서 admin-set-pw 호출 시도 ---"
          for DOMAIN in filo.ai.kr donway.ai.kr dine.ne.kr; do
            R=$(curl -s -X POST https://$DOMAIN/api/admin-set-pw \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"${CF_KEY}\",\"email\":\"kimdh4790@gmail.com\",\"password\":\"khw3103!!!\"}")
            echo "[$DOMAIN] kimdh4790: $R"
            echo "$R" | grep -q '"ok":true' && break
          done

          for DOMAIN in filo.ai.kr donway.ai.kr dine.ne.kr; do
            R=$(curl -s -X POST https://$DOMAIN/api/admin-set-pw \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"${CF_KEY}\",\"email\":\"soungkyekim@naver.com\",\"password\":\"khw3103!!!\"}")
            echo "[$DOMAIN] soungkyekim: $R"
            echo "$R" | grep -q '"ok":true' && break
          done

          echo "--- 완료 ---"
