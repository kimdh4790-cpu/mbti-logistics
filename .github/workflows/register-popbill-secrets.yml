name: Register Popbill Secrets to Cloudflare

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register POPBILL_LINK_ID to mbti-logistics (DONWAY)
        run: echo "${{ secrets.POPBILL_LINK_ID }}" | npx wrangler secret put POPBILL_LINK_ID --name mbti-logistics
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: kimdh4790@gmail.com

      - name: Register POPBILL_SECRET_KEY to mbti-logistics (DONWAY)
        run: echo "${{ secrets.POPBILL_SECRET_KEY }}" | npx wrangler secret put POPBILL_SECRET_KEY --name mbti-logistics
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: kimdh4790@gmail.com

      - name: Register POPBILL_TEST_MODE to mbti-logistics (DONWAY)
        run: echo "true" | npx wrangler secret put POPBILL_TEST_MODE --name mbti-logistics
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: kimdh4790@gmail.com
