<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Demo Account Setup</title>
<style>
body{font-family:sans-serif;background:#08101f;color:#fff;padding:40px;max-width:500px;margin:0 auto}
h2{color:#c9a84c}
.item{padding:10px;margin:6px 0;border-radius:8px;font-size:14px}
.ok{background:#1a3a1a;color:#4caf50}
.exist{background:#1a2a3a;color:#90caf9}
.err{background:#3a1a1a;color:#ef5350}
.pending{background:#2a2a2a;color:#888}
#status{margin-top:20px;font-size:18px;color:#c9a84c}
</style>
</head>
<body>
<h2>FILO 데모 계정 자동 생성</h2>
<div id="list"></div>
<div id="status">생성 중...</div>
<script>
var API_KEY='AIzaSyDQmEFfLczgCuPQidunbBXqaHWgs39VMg0';
var ACCOUNTS=[
  {email:'demo.cafe@filo.ai.kr',    pw:'Filo2026!', label:'카페/베이커리'},
  {email:'demo.korean@filo.ai.kr',  pw:'Filo2026!', label:'한식당'},
  {email:'demo.japanese@filo.ai.kr',pw:'Filo2026!', label:'일식/횟집'},
  {email:'demo.snack@filo.ai.kr',   pw:'Filo2026!', label:'패스트푸드/분식'},
  {email:'demo.western@filo.ai.kr', pw:'Filo2026!', label:'이자카야/술집'},
  {email:'demo.bakery@filo.ai.kr',  pw:'Filo2026!', label:'기타'}
];
var list=document.getElementById('list');
var statusEl=document.getElementById('status');

ACCOUNTS.forEach(function(a){
  var el=document.createElement('div');
  el.className='item pending';
  el.id='acc-'+a.email;
  el.textContent=a.label+' — '+a.email;
  list.appendChild(el);
});

(async function(){
  var ok=0,exist=0,err=0;
  for(var i=0;i<ACCOUNTS.length;i++){
    var a=ACCOUNTS[i];
    var el=document.getElementById('acc-'+a.email);
    try{
      var res=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+API_KEY,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:a.email,password:a.pw,returnSecureToken:false})
      });
      var data=await res.json();
      if(data.email){
        el.className='item ok';
        el.textContent='생성완료 — '+a.label+' ('+a.email+')';
        ok++;
      } else if(data.error&&data.error.message==='EMAIL_EXISTS'){
        el.className='item exist';
        el.textContent='이미 존재 — '+a.label+' ('+a.email+')';
        exist++;
      } else {
        el.className='item err';
        el.textContent='오류 — '+a.label+': '+(data.error&&data.error.message||'unknown');
        err++;
      }
    } catch(e){
      el.className='item err';
      el.textContent='네트워크 오류 — '+a.label+': '+e.message;
      err++;
    }
  }
  statusEl.textContent='완료! 생성: '+ok+'개 / 기존: '+exist+'개 / 오류: '+err+'개';
  if(err===0) statusEl.style.color='#4caf50';
})();
</script>
</body>
</html>
