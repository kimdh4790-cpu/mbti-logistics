function makeCard(d){
 var card=document.createElement('div');
 card.className='card';
 card.id='card-'+d.id;
 var feats=d.features.map(function(f){
  return '<span style="font-size:10px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:1px 6px;color:#c9a84c">'+f+'</span>';
 }).join(' ');
 card.innerHTML='<h3>'+d.label+' <span style="font-size:10px;color:#94a3b8;font-weight:400">('+d.id+' · 메뉴 '+d.menus.length+'개)</span></h3>'+
  '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">'+feats+'</div>'+
  '<div class="row"><span>딜러 문서</span><span class="badge pending" id="doc-'+d.id+'">대기</span></div>'+
  '<div class="row"><span>메뉴 세팅</span><span class="badge pending" id="menu-'+d.id+'">대기</span></div>';
 document.getElementById('cards').appendChild(card);
}

async function initDealer(d){
 var docEl=document.getElementById('doc-'+d.id);
 var menuEl=document.getElementById('menu-'+d.id);

 docEl.className='badge pending';docEl.textContent='저장 중...';
 try{
  await db.collection('companies').doc(d.id).set({
   companyName:'데모 '+d.label,
   theme:d.theme,
   primaryColor:d.primary,
   bgColor:d.bg,
   services:d.services,
   subscriptions:{combo:{active:true}},
   isDemo:true,
   updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
  docEl.className='badge ok';docEl.textContent='완료';
 }catch(e){
  docEl.className='badge err';docEl.textContent='오류: '+e.code;return;
 }

 menuEl.className='badge pending';menuEl.textContent='삭제 후 재등록...';
 try{
  /* 기존 메뉴 전체 삭제 */
  var old=await db.collection('filo_menus').where('dealerId','==',d.id).get();
  if(!old.empty){
   var del=db.batch();
   old.docs.forEach(function(doc){ del.delete(doc.ref); });
   await del.commit();
  }
  /* 배치 50개 제한 처리 */
  var chunks=[];
  for(var i=0;i<d.menus.length;i+=500) chunks.push(d.menus.slice(i,i+500));
  for(var ci=0;ci<chunks.length;ci++){
   var batch=db.batch();
   chunks[ci].forEach(function(m){
    var ref=db.collection('filo_menus').doc();
    batch.set(ref,{
     dealerId:d.id,name:m.name,price:m.price,
     category:m.category,emoji:m.emoji,forSale:true,
     img:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
   });
   await batch.commit();
  }
  menuEl.className='badge ok';menuEl.textContent=d.menus.length+'개 등록';
 }catch(e){
  menuEl.className='badge err';menuEl.textContent='오류: '+e.code;
 }
}

async function runInit(){

 var sum=document.getElementById('summary');
 btn.disabled=true;
 document.getElementById('cards').innerHTML='';
 sum.textContent='';

 var user=auth.currentUser;
 if(!user){
  sum.textContent='로그인이 필요합니다. filo.ai.kr에서 로그인 후 이 페이지를 다시 여세요.';
  btn.disabled=false;return;
 }

 DEMOS.forEach(makeCard);
 for(var i=0;i<DEMOS.length;i++){
  await initDealer(DEMOS[i]);
 }
 sum.textContent='완료! filo.ai.kr에서 업종별 데모 버튼을 눌러 확인하세요.';
 btn.disabled=false;
}
