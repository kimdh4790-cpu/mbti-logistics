function _judgeJobApply(applyId, status, name, driverId){
  _db.collection('yongcha_applies').doc(applyId).update({
    status:status, judgedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast(status==='approved'?name+'님 승인 처리했어요!':'미선발 처리했어요');
    if(driverId){
      if(status==='approved') _yNotify(driverId,'수락 통보 🎉','축하해요! '+_CU.name+'에서 수락 통보가 왔어요!','hire');
      else _yNotify(driverId,'공고 결과 안내',_CU.name+'에서 공고 검토가 완료됐어요','hire');
    }
    _closeModal();
  });
}

/* ══════════════════════════════════════════════════════════
   용차 공고 — 기사가 차량/조건을 올리는 양방향 마켓플레이스

var _yofRegion='전체', _yofCourier='전체';

function _yofFilterRegion(r){
  _yofRegion=r;
  document.querySelectorAll('#yongcha-offer-filter .filter-btn').forEach(function(b){
    if(b.id&&b.id.startsWith('yof-r-')) b.classList.toggle('on', b.id==='yof-r-'+r);
  });
  _loadDriverOfferList();
}
function _yofFilterCourier(c){
  _yofCourier=c;
  document.querySelectorAll('#yongcha-offer-filter .filter-btn').forEach(function(b){
    if(b.id&&b.id.startsWith('yof-c-')) b.classList.toggle('on', b.id==='yof-c-'+c);
  });
  _loadDriverOfferList();
}

function _loadDriverOfferList(){
  var el=document.getElementById('yongcha-offer-list');
  if(!el)return;
  el.innerHTML=_skeletonCards(3);
  var q=_db.collection('yongcha_driver_posts').where('status','==','active').orderBy('createdAt','desc').limit(60);
  q.get().then(function(snap){
    var items=[];
    snap.forEach(function(doc){items.push(Object.assign({id:doc.id},doc.data()));});
    // 필터
    if(_yofRegion&&_yofRegion!=='전체') items=items.filter(function(d){return d.region===_yofRegion;});
    if(_yofCourier&&_yofCourier!=='전체') items=items.filter(function(d){return !d.preferredCourier||d.preferredCourier==='전체'||d.preferredCourier===_yofCourier;});
    if(!items.length){el.innerHTML=_emptyHtml('','등록된 용차 공고가 없어요','기사가 차량 공고를 등록하면 여기 표시됩니다');return;}
    el.innerHTML='';
    items.forEach(function(d){
      var card=document.createElement('div');card.className='card';card.style.cssText='margin-bottom:12px;cursor:pointer';
      var isMe=_CU&&d.driverId===_CU.uid;
      var trust=d.trustGrade||'';
      var trustCol=trust==='S'?'#f59e0b':trust==='A'?'var(--gn)':trust==='B'?'var(--ac)':'var(--t3)';
      var dayEst=(d.desiredUnitPrice&&d.desiredVolume)?Math.round(d.desiredUnitPrice*d.desiredVolume/10000):0;
      card.innerHTML=
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px">'+
          '<div style="flex:1;min-width:0">'+
            '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">'+
              (d.carType?'<span style="background:var(--acl);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:800">'+_esc(d.carType)+'</span>':'')+
              (d.region&&d.region!=='전체'?'<span style="background:var(--bg3);color:var(--t2);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700">'+_esc(d.region)+'</span>':'')+
              (trust?'<span style="background:'+trustCol+';color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:900">'+trust+'등급</span>':'')+
            '</div>'+
            '<div style="font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--tx)">'+
              (d.desiredUnitPrice?_won(d.desiredUnitPrice)+'<span style="font-size:13px;font-weight:700;color:var(--t2)">원/건</span>':'단가 협의')+
            '</div>'+
            (dayEst?'<div style="font-size:12px;color:var(--t2);margin-top:1px">예상 일 수입 약 '+dayEst+'만원</div>':'')+
          '</div>'+
          (isMe?'<span style="font-size:11px;background:var(--gnl);color:var(--gn);border-radius:20px;padding:3px 10px;font-weight:800;flex-shrink:0">내 공고</span>':'')+
        '</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--t2);margin-bottom:12px">'+
          (d.desiredVolume?'<span>일 희망 물량 <b style="color:var(--tx)">'+_won(d.desiredVolume)+'건</b></span>':'')+
          (d.preferredCourier&&d.preferredCourier!=='전체'?'<span>희망 택배사 <b style="color:var(--tx)">'+_esc(d.preferredCourier)+'</b></span>':'')+
          (d.availDate?'<span>가능 일정 <b style="color:var(--tx)">'+_esc(d.availDate)+'</b></span>':'')+
        '</div>'+
        (d.memo?'<div style="font-size:13px;color:var(--t2);background:var(--bg3);border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.55">'+_esc(d.memo)+'</div>':'')+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          (!isMe&&_CU&&_CU.type!=='driver'?
            '<button type="button" onclick="event.stopPropagation();_openChatRoom(\''+d.driverId+'\',\''+_jsq(d.driverName||'기사')+'\',\'driver\')" '+
            'style="min-height:44px;background:var(--acl);color:var(--ac);border:1.5px solid var(--acln);border-radius:var(--r);font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit">채팅 연락</button>':
            '<div></div>')+
          (isMe?
            '<button type="button" onclick="event.stopPropagation();_deleteDriverOffer(\''+d.id+'\')" '+
            'style="min-height:44px;background:var(--rdl,#fee2e2);color:var(--rd);border:1px solid #fca5a5;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">공고 내리기</button>':'<div></div>')+
        '</div>';
      el.appendChild(card);
    });
  }).catch(function(e){if(el)el.innerHTML='<div class="err-block">'+_esc(e.message)+'</div>';});
}

function _deleteDriverOffer(offerId){
  if(!confirm('이 공고를 내릴까요?'))return; // 예외적 confirm: 삭제는 되돌릴 수 없음
  _db.collection('yongcha_driver_posts').doc(offerId).update({status:'closed'}).then(function(){
    _yToast('공고를 내렸어요');
    _loadDriverOfferList();
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _loadMyDriverOffers(){
  var el=document.getElementById('my-offer-list');if(!el)return;
  _db.collection('yongcha_driver_posts').where('driverId','==',_CU.uid).orderBy('createdAt','desc').limit(10).get()
  .then(function(snap){
    if(snap.empty){el.innerHTML='<div style="padding:12px 0;font-size:13px;color:var(--t3);text-align:center">아직 등록한 공고가 없어요</div>';return;}
    el.innerHTML='';
    snap.docs.forEach(function(doc){
      var d=Object.assign({id:doc.id},doc.data());
      var isActive=d.status==='active';
      var row=document.createElement('div');row.className='card';row.style.cssText='margin-bottom:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;';
      row.innerHTML=
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13.5px;font-weight:800">'+
            (d.region||'전체')+' · '+(d.carType||'차종 미설정')+
            (d.desiredUnitPrice?' · '+_won(d.desiredUnitPrice)+'원/건':'')+
          '</div>'+
          '<div style="font-size:12px;color:var(--t2);margin-top:2px">'+_esc(d.availDate||'일정 미설정')+'</div>'+
        '</div>'+
        (isActive?
          '<span style="font-size:11px;background:var(--gnl);color:var(--gn);border-radius:20px;padding:2px 10px;font-weight:800;flex-shrink:0">활성</span>':
          '<span style="font-size:11px;background:var(--bg3);color:var(--t3);border-radius:20px;padding:2px 10px;font-weight:800;flex-shrink:0">마감</span>')+
        (isActive?'<button type="button" onclick="_deleteDriverOffer(\''+d.id+'\')" '+
          'style="min-height:34px;padding:0 12px;background:none;border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;flex-shrink:0">내리기</button>':'');
      el.appendChild(row);
    });
  }).catch(function(){});
}

function _submitDriverOffer(){
  var carType=(document.getElementById('of-cartype')||{}).value||'';
  var region=(document.getElementById('of-region')||{}).value||'전체';
  var courier=(document.getElementById('of-courier')||{}).value||'전체';
  var price=parseInt((document.getElementById('of-price')||{}).value||0,10)||0;
  var volume=parseInt((document.getElementById('of-volume')||{}).value||0,10)||0;
  var availDate=((document.getElementById('of-date')||{}).value||'').trim();
  var memo=((document.getElementById('of-memo')||{}).value||'').trim();
  var btn=document.getElementById('of-submit-btn');

  if(!carType){_yToast('차종을 선택하세요');return;}
  if(!price){_yToast('희망 단가를 입력하세요');return;}

  if(btn){btn.textContent='등록 중...';btn.disabled=true;}
  _db.collection('yongcha_driver_posts').add({
    driverId:_CU.uid, driverName:_CU.name||'', driverPhone:_CU.phone||'',
    region:region, carType:carType,
    preferredCourier:courier, desiredUnitPrice:price, desiredVolume:volume,
    availDate:availDate, memo:memo,
    trustScore:_CU.trustScore||0, trustGrade:_CU.trustGrade||'',
    status:'active',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    if(btn){btn.textContent='공고 올리기';btn.disabled=false;}
    _yToast('공고가 등록됐어요! 소장들이 연락할 거예요');
    // 폼 초기화
    ['of-price','of-volume','of-date','of-memo'].forEach(function(id){
      var el=document.getElementById(id);if(el)el.value='';
    });
    _loadMyDriverOffers();
  }).catch(function(e){
    if(btn){btn.textContent='공고 올리기';btn.disabled=false;}
    _yToast('오류: '+e.message);
  });
}

function _jSwitchDriver(tab){
  _jSubTab=tab;
  document.querySelectorAll('.sub-tab').forEach(function(b){b.classList.remove('on');});
  var btns=document.querySelectorAll('.sub-tab');
  if(tab==='list'&&btns[0])btns[0].classList.add('on');
  if(tab==='resume'&&btns[1])btns[1].classList.add('on');
  var el=document.getElementById('jobs-content');
  if(!el)return;
  if(tab==='list') _loadJobList(el);
  else _loadMyResume(el);
}

function _applyJob(jobId, agencyId, agencyName){
  var btn=document.getElementById('job-apply-btn');
  if(btn){btn.textContent='지원 중...';btn.disabled=true;}
  _db.collection('yongcha_applies').add({
    jobId:jobId, postId:'',
    driverId:_CU.uid, driverName:_CU.name,
    driverPhone:_CU.phone, driverRegion:_CU.region,
    agencyId:agencyId, agencyName:agencyName,
    status:'pending',
    appliedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast('지원 완료! 대리점 연락을 기다려주세요');

    if(btn){btn.textContent='🙋 지원하기';btn.disabled=false;}

  });

function _submitResume(docId){
  var career=(document.getElementById('rc-career')||{}).value||'';
  var careerDesc=(document.getElementById('rc-careerDesc')||{}).value||'';
  var vehicle=(document.getElementById('rc-vehicle')||{}).value||'';
  var region=(document.getElementById('rc-region')||{}).value||_CU.region||'';
  var pay=parseInt((document.getElementById('rc-pay')||{}).value)||0;
  var intro=(document.getElementById('rc-intro')||{}).value||'';
  var isPublic=document.getElementById('rc-public-toggle')&&document.getElementById('rc-public-toggle').classList.contains('on');
  var btn=document.getElementById('rc-submit-btn');

  if(!career){_yToast('경력을 선택해주세요');return;}
  btn.textContent='저장 중...';btn.disabled=true;

  var data={
    driverId:_CU.uid, driverName:_CU.name,
    driverPhone:_CU.phone, driverRegion:_CU.region,
    career:career, careerDesc:careerDesc,
    vehicleType:vehicle, preferRegion:region,
    preferPay:pay, selfIntro:intro, isPublic:isPublic,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };

  var p=docId
    ? _db.collection('yongcha_resumes').doc(docId).update(data)
    : _db.collection('yongcha_resumes').add(Object.assign(data,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));

  p.then(function(){
    _yToast(docId?'이력서가 수정됐어요!':'이력서가 등록됐어요!');
    _jSubTab='resume';
    _pgJobsDriver(document.getElementById('content'));

    btn.textContent=docId?'💾 이력서 수정하기':'📄 이력서 등록하기';btn.disabled=false;
    _yToast('오류: '+e.message);
  });
}

function _submitJob(){
  var get=function(id){return(document.getElementById(id)||{}).value||'';};
  var title=get('jw-title'), jobType=get('jw-type'), salary=get('jw-salary');
  if(!title||!jobType||!salary){_yToast('제목/계약유형/급여는 필수입니다');return;}
  var btn=document.getElementById('jw-submit');

  // ★ 재진입 잠금 + 중복 채용공고 방지 (기존에는 둘 다 없어서 같은 공고가 계속 쌓였다)
  if(window._yJobSubmitLock){_yToast('처리 중이에요…');return;}
  window._yJobSubmitLock=true;
  var _unlockJ=function(){window._yJobSubmitLock=false;};
  var _resetBtn=function(){btn.textContent=' 공고 등록';btn.disabled=false;_unlockJ();};

  btn.textContent='확인 중...';btn.disabled=true;
  var openEnded=document.getElementById('jw-openended-toggle')&&document.getElementById('jw-openended-toggle').classList.contains('on');
  var payload={
    agencyId:_CU.uid, agencyName:_CU.name, agencyRating:_CU.rating||0,
    region:_CU.region, area:get('jw-area'), courier:get('jw-courier'),
    jobTitle:title, jobType:jobType,
    vehicleType:get('jw-vehicle'), careerReq:get('jw-career'),
    salary:parseInt(salary), settleDay:get('jw-settle'),
    workDays:get('jw-days'), headcount:parseInt(get('jw-headcount'))||1,
    openEnded:openEnded, desc:get('jw-desc'),
    status:'open', createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  var myKey=_yJobKey(payload);

  _db.collection('yongcha_jobs').where('agencyId','==',_CU.uid).limit(100).get()
  .then(function(snap){
    // 모집 중(open)인 동일 공고가 이미 있으면 막는다 — 마감된 공고 재등록은 허용
    var dup=snap.docs.some(function(d){
      var v=d.data();
      return v.status==='open'&&_yJobKey(v)===myKey;
    });
    if(dup)throw new Error('__DUP__');
    btn.textContent='등록 중...';
    return _db.collection('yongcha_jobs').add(payload);
  })
  .then(function(){
    _unlockJ();
    _yToast('공고가 등록됐어요!');
    _closeModal();
    _jSubTab='myjobs';
    _pgJobsAgency(document.getElementById('content'));
  }).catch(function(e){
    _resetBtn();
    _yToast(e.message==='__DUP__'
      ? '동일한 공고가 이미 모집 중이에요'
      : '오류: '+e.message);
  });
}

function _careerLabel(c){
  var map={'신입':'신입','1년 미만':'1년 미만','1~3년':'1~3년','3~5년':'3~5년','5년 이상':'5년 이상',
    '1년 이상':'1년 이상','3년 이상':'3년 이상','무관':'무관'};
  return map[c]||c||'무관';
}

var _chatUnsub=null;

/* 채팅 목록 — 이전엔 get() 1회라 새 메시지가 와도 목록이 갱신되지 않았다.
   onSnapshot 으로 바꿔 실시간 반영한다. */
var _chatListUnsub=null;
function _pgChats(el){
  el.innerHTML=
    '<div class="page-hdr"><h1 class="page-title">채팅</h1>'+
    '<p class="page-sub">대리점·기사와 직접 소통해요</p></div>'+
    '<div id="chat-list">'+_skRows(3)+'</div>';

  if(_chatListUnsub){_chatListUnsub();_chatListUnsub=null;}
  _chatListUnsub=_db.collection('yongcha_chats').where('participants','array-contains',_CU.uid)
    .limit(50)
    .onSnapshot(function(snap){
      var list=document.getElementById('chat-list');if(!list)return;
      if(snap.empty){
        list.innerHTML=_emptyHtml('💬','아직 채팅이 없어요','연결이 확정되면 채팅방이 자동으로 열려요');
        return;
      }
      var docs=snap.docs.sort(function(a,b){
        var at=a.data().lastAt,bt=b.data().lastAt;
        return (bt&&bt.seconds||0)-(at&&at.seconds||0);
      }).slice(0,30);
      var frag=document.createDocumentFragment();
      docs.forEach(function(doc){
        var d=Object.assign({id:doc.id},doc.data());
        var otherUid=(d.participants||[]).filter(function(u){return u!==_CU.uid;})[0]||'';
        var otherName=(d.participantNames||{})[otherUid]||'상대방';
        var otherType=(d.participantTypes||{})[otherUid]||'';
        var unread=(d.unread||{})[_CU.uid]||0;
        var lastAt='';
        if(d.lastAt&&d.lastAt.seconds){
          var dt=new Date(d.lastAt.seconds*1000);
          if(new Date().toDateString()===dt.toDateString())
            lastAt=('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
          else lastAt=(dt.getMonth()+1)+'/'+dt.getDate();
        }
        var row=document.createElement('div');
        row.className='chat-row';
        row.onclick=function(){_pgChatRoom(d.id,otherUid,otherName);};
        row.innerHTML=
          '<div class="chat-av">'+(otherType==='agency'?'🏢':otherType==='driver'?'🚗':'👤')+'</div>'+
          '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">'+
          '<div style="font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+_esc(otherName)+'</div>'+
          '<div style="font-size:11px;color:var(--t3);flex-shrink:0;font-weight:600">'+lastAt+'</div>'+
          '</div>'+
          '<div style="font-size:12.5px;color:'+(unread>0?'var(--tx)':'var(--t2)')+';font-weight:'+(unread>0?'700':'500')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          _esc((d.lastMessage||'메시지를 보내보세요').replace(/\n/g,' '))+'</div>'+
          '</div>'+
          (unread>0?'<div class="chat-unread">'+(unread>99?'99+':unread)+'</div>':'');
        frag.appendChild(row);
      });
      list.innerHTML='';
      list.appendChild(frag);
    },function(e){
      var list=document.getElementById('chat-list');
      if(list)list.innerHTML=_errHtml(e);
    });
}

function _openChatRoom(otherUid,otherName,otherType){
  _closeModal();
  var ids=[_CU.uid,otherUid].sort();
  var chatId=ids[0]+'__'+ids[1];
  var chatRef=_db.collection('yongcha_chats').doc(chatId);
  chatRef.get().catch(function(){return {exists:false};}).then(function(snap){
    if(!snap||!snap.exists){
      var names={};names[_CU.uid]=_CU.name;names[otherUid]=otherName;
      var types={};types[_CU.uid]=_CU.type;types[otherUid]=otherType;
      var unread={};unread[_CU.uid]=0;unread[otherUid]=0;
      return chatRef.set({
        participants:[_CU.uid,otherUid],
        participantNames:names,participantTypes:types,
        lastMessage:'',lastAt:firebase.firestore.FieldValue.serverTimestamp(),
        unread:unread,createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(){});
    }
  }).then(function(){_pgChatRoom(chatId,otherUid,otherName);}).catch(function(e){_yToast('채팅 오류: '+e.message);});
}

function _pgChatRoom(chatId,otherUid,otherName){
  if(_chatUnsub){_chatUnsub();_chatUnsub=null;}
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('on');});
  var nb=document.getElementById('bnav-chat');if(nb)nb.classList.add('on');

  var el=document.getElementById('content');
  el.style.overflowY='hidden';
  el.style.padding='0';
  el.style.display='flex';
  el.style.flexDirection='column';
  el.innerHTML=
    '<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0">'+
    '<button type="button" class="icon-btn" aria-label="뒤로" onclick="_goPage(\'chat\')" style="font-size:26px">‹</button>'+
    '<div style="min-width:0"><div style="font-size:15.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+_esc(otherName)+'</div>'+
    '<div id="chat-phone" style="font-size:11.5px;color:var(--t2);display:none;font-weight:600"></div></div>'+
    '<a id="chat-call" href="#" style="margin-left:auto;display:none;width:var(--tap);height:var(--tap);place-items:center;color:var(--ac);font-size:19px;border-radius:var(--r);text-decoration:none" aria-label="전화">📞</a>'+
    '</div>'+
    '<div id="chat-msgs" style="flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain"></div>'+
    '<div style="display:flex;gap:8px;padding:10px 12px;background:var(--bg2);border-top:1px solid var(--bd);flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom))">'+
    '<input class="inp" id="chat-inp" placeholder="메시지 입력..." autocomplete="off" style="flex:1;margin:0" '+
    'onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();_sendMsg(\''+chatId+'\',\''+otherUid+'\');}">'+
    '<button type="button" onclick="_sendMsg(\''+chatId+'\',\''+otherUid+'\')" style="min-width:64px;min-height:var(--tap);background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-ink);border:none;border-radius:var(--r);font-size:14.5px;font-weight:800;white-space:nowrap">전송</button>'+
    '</div>';

  // Reset unread + load phone
  var upd={};upd['unread.'+_CU.uid]=0;
  _db.collection('yongcha_chats').doc(chatId).update(upd).catch(function(){});
  _db.collection('yongcha_chats').doc(chatId).get().then(function(snap){
    if(!snap.exists)return;
    var phones=snap.data().participantPhones||{};
    var phone=phones[otherUid]||'';
    var phoneEl=document.getElementById('chat-phone');
    if(phoneEl&&phone){phoneEl.textContent='📞 '+phone;phoneEl.style.display='block';}
    var callEl=document.getElementById('chat-call');
    if(callEl&&phone){callEl.href='tel:'+phone.replace(/[^0-9+]/g,'');callEl.style.display='grid';}
  }).catch(function(){});

  // 실시간 메시지 — 이전엔 m.text 를 이스케이프 없이 innerHTML 로 넣어
  // 상대방이 보낸 HTML/스크립트가 그대로 실행될 수 있었다.
  _chatUnsub=_db.collection('yongcha_chats').doc(chatId).collection('messages')
    .orderBy('createdAt','asc').limit(300).onSnapshot(function(snap){
      var msgs=document.getElementById('chat-msgs');if(!msgs)return;
      var frag=document.createDocumentFragment();
      var lastDate='';
      snap.forEach(function(doc){
        var m=doc.data();
        var isMe=m.senderId===_CU.uid;
        var isSys=m.senderId==='system';
        var timeStr='',dateStr='';
        if(m.createdAt&&m.createdAt.seconds){
          var dt=new Date(m.createdAt.seconds*1000);
          timeStr=('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
          dateStr=dt.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
        }
        // 날짜 구분선
        if(dateStr&&dateStr!==lastDate){
          lastDate=dateStr;
          var sep=document.createElement('div');
          sep.style.cssText='align-self:center;font-size:11.5px;font-weight:700;color:var(--t3);background:var(--bg2);border:1px solid var(--bd);padding:5px 13px;border-radius:999px;margin:6px 0';
          sep.textContent=dateStr;
          frag.appendChild(sep);
        }
        var div=document.createElement('div');
        if(isSys){
          div.style.cssText='display:flex;justify-content:center';
          var sb=document.createElement('div');
          sb.className='chat-sys';
          sb.textContent=m.text||'';          // textContent = 이스케이프 불필요
          div.appendChild(sb);
        } else {
          div.style.cssText='display:flex;flex-direction:column;align-items:'+(isMe?'flex-end':'flex-start');
          if(!isMe){
            var nm=document.createElement('div');
            nm.style.cssText='font-size:11px;color:var(--t2);margin-bottom:4px;font-weight:600';
            nm.textContent=m.senderName||'';
            div.appendChild(nm);
          }
          var bub=document.createElement('div');
          bub.className='chat-bubble '+(isMe?'chat-me':'chat-you');
          bub.textContent=m.text||'';
          div.appendChild(bub);
          var tm=document.createElement('div');
          tm.style.cssText='font-size:10.5px;color:var(--t3);margin-top:4px;font-weight:600';
          tm.textContent=timeStr;
          div.appendChild(tm);
        }
        frag.appendChild(div);
      });
      msgs.innerHTML='';
      msgs.appendChild(frag);
      msgs.scrollTop=msgs.scrollHeight;
    },function(){});
}

function _sendMsg(chatId,otherUid){
  var inp=document.getElementById('chat-inp');if(!inp)return;
  var text=inp.value.trim();if(!text)return;
  inp.value='';
  var now=firebase.firestore.FieldValue.serverTimestamp();
  _db.collection('yongcha_chats').doc(chatId).collection('messages').add({
    senderId:_CU.uid,senderName:_CU.name,text:text,createdAt:now
  }).then(function(){
    var upd={lastMessage:text,lastAt:now};
    upd['unread.'+otherUid]=firebase.firestore.FieldValue.increment(1);
    return _db.collection('yongcha_chats').doc(chatId).update(upd);
  }).then(function(){
    _yNotify(otherUid,'💬 '+_CU.name,text.substring(0,60),'chat');
  }).catch(function(e){_yToast('전송 실패: '+e.message);});
}

function _showReviewModal(targetId,targetName,targetType,applyId){

function _calcTrustScore(userId){
  _db.collection('yongcha_reviews').where('revieweeId','==',userId).get().then(function(snap){
    if(snap.empty)return;
    var total=0,count=0,fakeCount=0,lastFakeAt=null,highRatingCount=0;
    snap.forEach(function(doc){
      var d=doc.data();
      total+=d.rating||0;count++;
      if(d.isFake){
        fakeCount++;
        var ct=d.createdAt;
        if(ct&&(!lastFakeAt||(ct.seconds||0)>(lastFakeAt.seconds||0)))lastFakeAt=ct;
      }
      if((d.rating||0)>=4.5)highRatingCount++;
    });
    var avg=count>0?Math.round((total/count)*10)/10:0;
    var upd={rating:avg,reviewCount:count,fakeCount:fakeCount};
    if(lastFakeAt)upd.lastFakeAt=lastFakeAt;
    if(fakeCount>=10)upd.postSuspended=true;
    else if(fakeCount>=5)upd.postRestrictedAt=lastFakeAt||firebase.firestore.FieldValue.serverTimestamp();
    // 기사 트러스트 포인트 갱신 (완료건수는 별도 관리)
    _db.collection('yongcha_users').doc(userId).get().then(function(us){
      if(!us.exists)return;
      var ud=us.data();
      if(ud.type==='driver'){
        var completed=ud.completedRoutes||0;
        var score=Math.min(100, completed*5 + highRatingCount*10);
        upd.trustScore=score;
      }
      _db.collection('yongcha_users').doc(userId).update(upd).catch(function(){});
    }).catch(function(){
      _db.collection('yongcha_users').doc(userId).update(upd).catch(function(){});
    });
  }).catch(function(){});
}

// ── FCM 알림 ─────────────────────────────────────────────────
/* FCM 초기화.
   과거 실패 원인 3가지 — 전부 여기와 서버에서 고쳤다.
     1) yongcha.app 이 모든 경로를 yongcha.html 로 응답해 /firebase-messaging-sw.js 가
        text/html 로 내려왔다 → SW 등록이 MIME 오류로 거부됨. (_worker.js handleYongcha 에서 수정)
     2) getToken() 을 vapidKey / serviceWorkerRegistration 없이 호출했다 → 토큰 발급 실패.
     3) yongcha_fcm_tokens 컬렉션에 Firestore 규칙이 없어 쓰기가 permission-denied 였다.
        (firestore.rules 에 규칙 추가) */
var _Y_VAPID='BHO3mU6K2VlLkYfUgsunV5zXsx6oOc_I4dIyE9ErYPBZE5AkBhPP-HUmQhqvHLDsbjcRgEDsMbXg0TYiSiKW93c';
var _yFcmReg=null;

function _yInitFCM(){
  if(!('serviceWorker' in navigator)){console.warn('[FCM] ServiceWorker 미지원 브라우저');return;}
  if(!firebase.messaging||!firebase.messaging.isSupported||!firebase.messaging.isSupported()){
    console.warn('[FCM] 이 브라우저는 FCM 미지원 (iOS Safari는 홈화면 추가 후 가능)');return;
  }
  if(typeof Notification==='undefined'||Notification.permission==='denied')return;

  var msg;
  try{ msg=firebase.messaging(); }catch(e){ console.warn('[FCM] 초기화 실패:',e); return; }

  // 포그라운드 수신은 권한과 무관하게 먼저 연결
  try{
    msg.onMessage(function(payload){
      var n=(payload||{}).notification||{};
      _yToast(' '+(n.title||'알림')+(n.body?' — '+n.body:''));
      var dot=document.getElementById('notif-dot');
      if(dot)dot.style.display='block';
    });
  }catch(e){}

  navigator.serviceWorker.register('/firebase-messaging-sw.js',{scope:'/'})
  .then(function(reg){
    _yFcmReg=reg;
    return navigator.serviceWorker.ready.then(function(){return reg;});
  })
  .then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if(perm!=='granted'){console.info('[FCM] 알림 권한 거부됨');return null;}
      return msg.getToken({vapidKey:_Y_VAPID,serviceWorkerRegistration:reg});
    });
  })
  .then(function(token){
    if(!token)return;
    return _db.collection('yongcha_fcm_tokens').doc(_CU.uid).set({
      token:token,userId:_CU.uid,
      type:_CU.type,region:_CU.region||'',
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  })
  .then(function(){ if(_yFcmReg)console.info('[FCM] 준비 완료'); })
  .catch(function(e){
    // 등록 실패해도 앱 기능은 그대로 — 조용히 실패하지 말고 원인은 남긴다
    console.warn('[FCM] 등록/토큰 실패:',(e&&(e.code||e.message))||e);
  });
}

function _yNotify(recipientId,title,body,type){

  // FCM push
  _yGetToken().then(function(tok){

        if(!snap.exists)return;
        var token=snap.data().token;

          headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
          body:JSON.stringify({token:token,title:title,body:body||''})
        });
      });
  }).catch(function(){});
}

/* ══════════════════════════════════════════════════════════
   과로 방지 (12시간 규정)
   ──────────────────────────────────────────────────────────
   yongcha_daily_records 의 당일 근무시간을 합산해
   · 10h 이상 → 주의 배너
   · 12h 초과 → 경고 + 신규 지원(배차) 차단
   근로기준·화물 안전운임 취지에 맞춘 안전장치. 승인된 배차는 건드리지 않는다.
   ══════════════════════════════════════════════════════════ */
var FATIGUE_WARN_H=10, FATIGUE_BLOCK_H=12;
var _fatigue={hours:0,loaded:false,blocked:false};

/* 오늘 누적 운행시간(시간 단위). 기록이 없으면 0 */
function _yLoadFatigue(){
  if(!_CU||_CU.type!=='driver'){_fatigue={hours:0,loaded:true,blocked:false};return Promise.resolve(_fatigue);}
  return _db.collection('yongcha_daily_records')
    .where('driverId','==',_CU.uid).where('date','==',_yToday()).limit(20).get()
    .then(function(snap){
      var h=0;
      snap.forEach(function(d){
        var r=d.data();
        if(typeof r.workHours==='number')h+=r.workHours;
        else if(r.startTime&&r.endTime)h+=_yHourDiff(r.startTime,r.endTime);
      });
      _fatigue={hours:Math.round(h*10)/10,loaded:true,blocked:h>FATIGUE_BLOCK_H};
      return _fatigue;
    }).catch(function(){
      _fatigue={hours:0,loaded:true,blocked:false};   // 조회 실패로 배차를 막지는 않는다
      return _fatigue;
    });
}
function _yHourDiff(a,b){
  var pa=String(a).split(':'),pb=String(b).split(':');
  if(pa.length<2||pb.length<2)return 0;
  var m=(+pb[0]*60+ +pb[1])-(+pa[0]*60+ +pa[1]);
  if(m<0)m+=1440;                       // 야간 조 (자정 넘김)
  return m/60;
}

function _yRenderFatigue(el){
  if(!el)return;
  el.innerHTML='';
  if(!_CU||_CU.type!=='driver')return;
  _yLoadFatigue().then(function(f){
    if(!el)return;
    if(f.hours<=0)return;
    var pct=Math.min(100,Math.round(f.hours/FATIGUE_BLOCK_H*100));
    var lvl=f.hours>FATIGUE_BLOCK_H?'block':f.hours>=FATIGUE_WARN_H?'warn':'ok';
    var col=lvl==='block'?'var(--rd)':lvl==='warn'?'var(--br)':'var(--gn)';
    var bgc=lvl==='block'?'var(--rdl)':lvl==='warn'?'var(--brl)':'var(--gnl)';
    var bdc=lvl==='block'?'var(--rdln)':lvl==='warn'?'var(--brln)':'var(--gnln)';
    var ico=lvl==='block'?'차단':lvl==='warn'?'주의':'정상';
    var msg=lvl==='block'?'12시간 초과 — 오늘은 추가 지원이 제한됩니다'
           :lvl==='warn'?'10시간 초과 — 무리한 추가 운행은 피해주세요'
           :'안전 운행 중입니다';
    el.innerHTML=
      '<div class="card" style="margin-bottom:14px;background:'+bgc+';border-color:'+bdc+'">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
          '<span style="font-size:22px">'+ico+'</span>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:14px;font-weight:900;color:'+col+'">오늘 누적 운행 '+f.hours+'시간</div>'+
            '<div style="font-size:11.5px;color:var(--t2);margin-top:2px">'+msg+'</div>'+
          '</div>'+
        '</div>'+
        '<div style="height:8px;border-radius:99px;background:var(--bg3);overflow:hidden">'+
          '<div style="height:100%;width:'+pct+'%;border-radius:99px;background:'+col+';transition:width .6s var(--ease)"></div>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);font-weight:700;margin-top:6px">'+
          '<span>0h</span><span>권고 '+FATIGUE_WARN_H+'h</span><span>한도 '+FATIGUE_BLOCK_H+'h</span></div>'+
      '</div>';
  });
}

/* ══════════════════════════════════════════════════════════
   기사 월 대시보드 — 운행건수 / 수입 / 평균단가
   ══════════════════════════════════════════════════════════ */
function _pgDashboard(el){
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('on');});
  if(_CU.type==='agency') return _pgDashboardAgency(el);
  el.innerHTML=
    '<div class="page-hdr"><h1 class="page-title">월 대시보드</h1>'+
    '<p class="page-sub">최근 6개월 운행 실적을 한눈에</p></div>'+
    '<div id="dash-body">'+_skRows(4)+'</div>';

  var since=new Date();since.setMonth(since.getMonth()-5);since.setDate(1);
  var sinceStr=since.toISOString().slice(0,10);

  _db.collection('yongcha_daily_records')
    .where('driverId','==',_CU.uid).where('date','>=',sinceStr).limit(600).get()
  .then(function(snap){
    var body=document.getElementById('dash-body');if(!body)return;
    var months={},order=[];
    for(var i=5;i>=0;i--){
      var d=new Date();d.setMonth(d.getMonth()-i);
      var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
      months[k]={cnt:0,amt:0,days:0};order.push(k);
    }
    snap.forEach(function(doc){
      var r=doc.data(),k=String(r.date||'').slice(0,7);
      if(!months[k])return;
      months[k].cnt+=Number(r.count||0);
      months[k].amt+=Number(r.amount||(Number(r.count||0)*Number(r.unitPrice||0)));
      months[k].days++;
    });
    var cur=months[order[order.length-1]];
    var prev=months[order[order.length-2]]||{cnt:0,amt:0};
    var maxAmt=Math.max.apply(null,order.map(function(k){return months[k].amt;}).concat([1]));
    var totalCnt=order.reduce(function(a,k){return a+months[k].cnt;},0);
    var totalAmt=order.reduce(function(a,k){return a+months[k].amt;},0);
    var avgUnit=totalCnt?Math.round(totalAmt/totalCnt):0;
    var deltaAmt=cur.amt-prev.amt;

    if(!totalCnt){
      body.innerHTML=_emptyHtml('','아직 운행 기록이 없어요','내 노선에서 일일 건수를 입력하면 집계됩니다');
      return;
    }

    body.innerHTML=
      // 이번 달 요약
      '<div class="kpi-grid col2">'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--ac)">'+_won(cur.cnt)+'</div>'+
          '<div class="kpi-lbl">이번 달 운행건수</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--br)">'+_won(Math.round(cur.amt/10000))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">이번 달 수입</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--gn)">'+_won(cur.cnt?Math.round(cur.amt/cur.cnt):0)+'<span style="font-size:13px">원</span></div>'+
          '<div class="kpi-lbl">평균 단가</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:'+(deltaAmt>=0?'var(--gn)':'var(--rd)')+'">'+
          (deltaAmt>=0?'▲':'▼')+' '+_won(Math.abs(Math.round(deltaAmt/10000)))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">전월 대비</div></div>'+
      '</div>'+

      // 월별 수입 막대그래프
      '<div class="card" style="margin-top:6px">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:4px">💰 월별 수입 추이</div>'+
        '<div style="font-size:11.5px;color:var(--t3);margin-bottom:16px">최근 6개월 · 단위 만원</div>'+
        '<div class="bars">'+
          order.map(function(k){
            var m=months[k],h=Math.max(3,Math.round(m.amt/maxAmt*100));
            var isCur=(k===order[order.length-1]);
            return '<div class="bar-col">'+
              '<div class="bar-val">'+(m.amt?_won(Math.round(m.amt/10000)):'')+'</div>'+
              '<div class="bar-track"><div class="bar-fill'+(isCur?' cur':'')+'" style="height:'+h+'%"></div></div>'+
              '<div class="bar-lbl">'+k.slice(5)+'월</div></div>';
          }).join('')+
        '</div>'+
      '</div>'+

      // 월별 상세
      '<div class="card">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:14px">📅 월별 상세</div>'+
        order.slice().reverse().map(function(k){
          var m=months[k];
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)">'+
            '<div style="font-size:13.5px;font-weight:800;min-width:62px">'+k.slice(5)+'월</div>'+
            '<div style="flex:1;font-size:12px;color:var(--t2)">'+_won(m.cnt)+'건 · '+m.days+'일 근무</div>'+
            '<div style="font-size:14px;font-weight:900;color:var(--br);font-variant-numeric:tabular-nums">'+_won(Math.round(m.amt/10000))+'만</div>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0 2px">'+
          '<div style="font-size:13.5px;font-weight:900">6개월 합계</div>'+
          '<div style="font-size:12px;color:var(--t2)">평균단가 '+_won(avgUnit)+'원</div>'+
          '<div style="font-size:16px;font-weight:900;color:var(--ac)">'+_won(Math.round(totalAmt/10000))+'만</div>'+
        '</div>'+
      '</div>';
  }).catch(function(e){
    var body=document.getElementById('dash-body');
    if(body)body.innerHTML=_errHtml(e);
  });

  // 세금계산서 역발행 대기 배너 (기사 전용)
  _db.collection('yongcha_settlements').where('driverId','==',_CU.uid)
    .where('taxInvoiceState','==','명세서발송').limit(5).get()
  .then(function(snap){
    if(snap.empty)return;
    var items=[];
    snap.forEach(function(doc){
      var s=doc.data();
      items.push('<button type="button" onclick="_pgTaxApprove(document.getElementById(\'content\'),\''+doc.id+'\')" '+
        'style="width:100%;min-height:var(--tap);margin-bottom:8px;background:rgba(79,120,245,.08);border:1.5px solid rgba(79,120,245,.3);border-radius:var(--r);'+
        'color:var(--ac);font-size:13.5px;font-weight:800;cursor:pointer;text-align:left;padding:10px 14px">'+
        _esc(s.agencyName||'소장')+'에서 정산명세서 도착 — '+_won(Number(s.totalAmount||0))+'원 &rarr; 세금계산서 승인</button>');
    });
    var banner=document.createElement('div');
    banner.style.cssText='padding:0 0 4px';
    banner.innerHTML=items.join('');
    var db=document.getElementById('dash-body');
    if(db)db.insertAdjacentElement('beforebegin',banner);
  }).catch(function(){});

  // 정산 내역 카드 (API)
  _yGetToken().then(function(tok){
    return fetch('/api/yongcha/my-settlements',{headers:{'Authorization':'Bearer '+tok}});
  }).then(function(r){return r.json();}).then(function(d){
    if(!d.ok||!d.items||!d.items.length)return;
    var items=d.items.slice(0,10);
    var rows=items.map(function(s){
      var statusLabel=s.status==='paid'?'<span style="color:var(--gn);font-weight:800">입금완료</span>':
        s.isOverdue?'<span style="color:#ef4444;font-weight:800">연체</span>':
        '<span style="color:var(--t2)">정산대기</span>';
      var sub=s.courier&&s.area?_esc(s.courier)+' '+_esc(s.area):(s.agencyName?_esc(s.agencyName):'');
      var penalty=s.penaltyAmt>0?'<div style="font-size:11px;color:#ef4444;margin-top:2px">연체료 '+_won(s.penaltyAmt)+'원</div>':'';
      var paidInfo=s.paidAt?'<div style="font-size:11px;color:var(--t3)">'+s.paidAt.slice(0,10)+' 입금</div>':'';
      return '<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sub+'</div>'+
          '<div style="font-size:11.5px;color:var(--t3);margin-top:2px">'+(s.dueDate?s.dueDate.slice(0,10)+' 지급예정':'')+
            (s.deliveryDate?' · '+s.deliveryDate.slice(0,7)+'월':'')+
          '</div>'+penalty+paidInfo+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:15px;font-weight:900;color:var(--br);font-variant-numeric:tabular-nums">'+_won(s.netAmount)+'원</div>'+
          statusLabel+
        '</div>'+
      '</div>';
    }).join('');
    var card=document.createElement('div');
    card.className='card';
    card.style.marginTop='6px';
    card.innerHTML='<div style="font-size:15px;font-weight:900;margin-bottom:14px">정산 내역</div>'+rows;
    var cnt=document.getElementById('content');
    if(cnt)cnt.appendChild(card);
  }).catch(function(){});
}

// ── 소장 정산 관리 대시보드 ────────────────────────────────────
function _pgDashboardAgency(el){
  var now=new Date();
  var order=[];
  var months={};
  for(var i=5;i>=0;i--){
    var d2=new Date();d2.setMonth(d2.getMonth()-i);
    var k=d2.getFullYear()+'-'+('0'+(d2.getMonth()+1)).slice(-2);
    months[k]={cnt:0,amt:0,fee:0,net:0};
    order.push(k);
  }
  el.innerHTML=
    '<div class="page-hdr"><h1 class="page-title">정산 관리</h1>'+
    '<p class="page-sub">운행 완료 건의 정산 내역이에요</p></div>'+
    '<div id="adash-body">'+_skRows(4)+'</div>';

  _db.collection('yongcha_applies').where('agencyId','==',_CU.uid)
    .where('status','==','done').limit(500).get()
  .then(function(snap){
    var body=document.getElementById('adash-body');if(!body)return;
    if(snap.empty){body.innerHTML=_emptyHtml('','아직 정산 완료 내역이 없어요','운행 완료 후 정산이 승인되면 여기에 표시돼요');return;}
    snap.forEach(function(doc){
      var a=doc.data();
      var date=a.completedAt?new Date(a.completedAt.seconds*1000):null;
      if(!date)return;
      var k=date.getFullYear()+'-'+('0'+(date.getMonth()+1)).slice(-2);
      if(!months[k])return;
      var gross=(a.unitPrice||0)*(a.volume||0);
      months[k].cnt++;
      months[k].amt+=gross;
      months[k].fee+=0;
      months[k].net+=gross;
    });
    var cur=months[order[order.length-1]];
    var prev=months[order[order.length-2]]||{cnt:0,amt:0,net:0};
    var maxAmt=Math.max.apply(null,order.map(function(k){return months[k].amt;}).concat([1]));
    var totalCnt=order.reduce(function(a,k){return a+months[k].cnt;},0);
    var totalNet=order.reduce(function(a,k){return a+months[k].net;},0);
    var deltaNet=cur.net-prev.net;

    body.innerHTML=
      '<div class="kpi-grid col2">'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--ac)">'+_won(cur.cnt)+'</div>'+
          '<div class="kpi-lbl">이번 달 완료건</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--gn)">'+_won(Math.round(cur.net/10000))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">이번 달 순수입</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--br)">'+_won(Math.round(cur.amt/10000))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">이번 달 운임 합계</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:'+(deltaNet>=0?'var(--gn)':'var(--rd)')+'">'+
          (deltaNet>=0?'▲':'▼')+' '+_won(Math.abs(Math.round(deltaNet/10000)))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">전월 대비</div></div>'+
      '</div>'+
      '<div class="card" style="margin-top:6px">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:16px">월별 정산 추이</div>'+
        '<div class="bars">'+
          order.map(function(k){
            var m=months[k],h=Math.max(3,Math.round(m.net/maxAmt*100));
            var isCur=(k===order[order.length-1]);
            return '<div class="bar-col">'+
              '<div class="bar-val">'+(m.net?_won(Math.round(m.net/10000)):'')+'</div>'+
              '<div class="bar-track"><div class="bar-fill'+(isCur?' cur':'')+'" style="height:'+h+'%"></div></div>'+
              '<div class="bar-lbl">'+k.slice(5)+'월</div></div>';
          }).join('')+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:14px">월별 정산 상세</div>'+
        order.slice().reverse().map(function(k){
          var m=months[k];
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)">'+
            '<div style="font-size:13.5px;font-weight:800;min-width:52px">'+k.slice(5)+'월</div>'+
            '<div style="flex:1;font-size:12px;color:var(--t2)">'+_won(m.cnt)+'건</div>'+
            '<div style="font-size:14px;font-weight:900;color:var(--gn);font-variant-numeric:tabular-nums">'+_won(Math.round(m.net/10000))+'만</div>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0 2px">'+
          '<div style="font-size:13.5px;font-weight:900">6개월 합계</div>'+
          '<div style="font-size:12px;color:var(--t2)">'+_won(totalCnt)+'건</div>'+
          '<div style="font-size:16px;font-weight:900;color:var(--ac)">'+_won(Math.round(totalNet/10000))+'만</div>'+
        '</div>'+
      '</div>'+
      // 세금계산서 역발행 섹션
      '<div class="card" style="margin-top:10px">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">'+
          '<span>세금계산서 역발행</span>'+
          '<span style="font-size:11px;color:var(--t3);font-weight:500">명세서 발송 → 기사 승인 → 홈택스 자동등록</span>'+
        '</div>'+
        '<div id="tax-inv-list">'+_skRows(3)+'</div>'+
      '</div>';

    // 세금계산서 목록 로드
    _db.collection('yongcha_settlements').where('agencyId','==',_CU.uid)
      .orderBy('createdAt','desc').limit(30).get()
    .then(function(snap){
      var el=document.getElementById('tax-inv-list');if(!el)return;
      if(snap.empty){el.innerHTML='<p style="color:var(--t3);font-size:13px;text-align:center;padding:16px 0">정산 내역이 없어요</p>';return;}
      var html='';
      snap.forEach(function(doc){
        var s=doc.data(),id=doc.id;
        var state=s.taxInvoiceState||'';
        var badge='';
        if(state==='역발행승인')badge='<span style="background:rgba(16,185,129,.12);color:var(--gn);border:1px solid rgba(16,185,129,.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">홈택스 등록완료</span>';
        else if(state==='명세서발송')badge='<span style="background:rgba(79,120,245,.12);color:var(--ac);border:1px solid rgba(79,120,245,.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">명세서 발송됨</span>';
        else if(state==='역발행요청')badge='<span style="background:rgba(245,158,11,.12);color:var(--br);border:1px solid rgba(245,158,11,.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">기사 승인 대기</span>';
        else if(state==='역발행거부')badge='<span style="background:rgba(239,68,68,.12);color:var(--rd);border:1px solid rgba(239,68,68,.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">기사 거부</span>';
        else badge='<span style="background:var(--bg3);color:var(--t3);border:1px solid var(--bd);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">미발송</span>';
        var canSend=(state===''||state==='미발송'||state==='역발행거부');
        var isPaid=(s.settlePaid===true||state==='입금완료');
        var dPhone=_esc(s.driverPhone||s.notifyPhone||'');
        var dName=_jsq(s.driverName||'기사');
        var aName=_jsq(s.agencyName||_CU.name||'');
        var dId=_esc(s.driverId||'');
        var amt=Number(s.totalAmount||0);
        var cnt=Number(s.totalCount||0);
        var wk=(s.weekStart||'').slice(0,10);
        var btnSend=canSend?
          '<button type="button" onclick="_ySendSettleNotify(\''+id+'\',\''+dPhone+'\',\''+dName+'\',\''+aName+'\',\''+dId+'\','+amt+','+cnt+',\''+_esc(wk)+'\')" '+
          'style="min-height:40px;padding:0 12px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap">명세서 발송</button>':'';
        var btnPaid=(!isPaid&&state==='역발행승인')?
          '<button type="button" onclick="_yMarkSettlePaid(\''+id+'\',\''+dId+'\','+amt+')" '+
          'style="min-height:40px;padding:0 12px;background:var(--gn);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap">입금 완료</button>':'';
        var btn=btnPaid||btnSend;
        html+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)">'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:13.5px;font-weight:800">'+_esc(s.driverName||'기사')+'</div>'+

/* ══════════════════════════════════════════════════════════
   휴식 원장 (yongcha_rest)
   ──────────────────────────────────────────────────────────
   기사가 휴식을 신청 → 대리점/관리자가 승인 → 휴식 기간 동안 지원 차단
   → 종료일이 지나면 자동 복귀 + 본인/승인처에 알림.
   yongcha_users 의 resting / restUntil 을 미러링해서 지원 차단과
   AI 기사 추천이 매번 원장을 조회하지 않아도 되게 한다.
   ══════════════════════════════════════════════════════════ */
var REST_REASONS=['개인 사정','건강·치료','차량 정비','가족 행사','휴가','기타'];

function _yToday(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function _yPlusDays(n){
  var d=new Date();d.setDate(d.getDate()+n);
  var p=function(x){return (x<10?'0':'')+x;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function _yDaysBetween(a,b){
  var ms=new Date(b+'T00:00:00')-new Date(a+'T00:00:00');
  return Math.round(ms/86400000);
}
/* 지금 휴식 중인가 — 승인 상태 + 종료일이 오늘 이후 */
function _yIsResting(u){
  var t=u||_CU;
  if(!t||!t.resting)return false;
  if(!t.restUntil)return true;
  return t.restUntil>=_yToday();
}

/* 앱 진입 시 1회 — 만료된 휴식 자동 종료 + 복귀 알림 */
function _yRestSync(){
  if(!_CU||_CU.type!=='driver')return Promise.resolve();
  if(!_CU.resting)return Promise.resolve();
  if(_CU.restUntil&&_CU.restUntil>=_yToday())return Promise.resolve();  // 아직 휴식 중
  // 종료일 경과 → 자동 복귀
  return _yDoEndRest(_CU.restId||'',true);
}

function _yDoEndRest(restId,auto){
  var upd=_db.collection('yongcha_users').doc(_CU.uid).update({
    resting:false,restUntil:'',restId:''
  });
  var closeDoc=restId
    ? _db.collection('yongcha_rest').doc(restId).update({
        status:'ended',endedAt:firebase.firestore.FieldValue.serverTimestamp(),
        endedBy:auto?'auto':'driver'
      }).catch(function(){})
    : Promise.resolve();
  return Promise.all([upd,closeDoc]).then(function(){
    _CU.resting=false;_CU.restUntil='';_CU.restId='';
    _yNotify(_CU.uid,'🔆 복귀 처리되었습니다',
      (auto?'휴식 기간이 끝나 자동으로 복귀 처리했어요. ':'')+'이제 공고에 지원할 수 있어요','rest');
    // 승인해 준 대리점에도 복귀 통보
    if(restId){
      _db.collection('yongcha_rest').doc(restId).get().then(function(s){
        var r=s.exists?s.data():null;
        if(r&&r.judgedBy&&r.judgedBy!==_CU.uid){
          _yNotify(r.judgedBy,'🔆 기사 복귀',_CU.name+'님이 휴식을 마치고 복귀했어요','rest');
        }
      }).catch(function(){});
    }
  }).catch(function(e){console.warn('[휴식] 복귀 처리 실패',e.message);});
}

/* ── 대리점/관리자 화면 ── */
var _restTab='pending';
function _yRestManagerPage(el){
  el.innerHTML=
    '<div class="page-hdr"><h1 class="page-title"> 휴식 원장</h1>'+
    '<p class="page-sub">기사 휴식 신청을 승인하고 현황을 관리해요</p></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'+
      [['pending','대기'],['approved','휴식중'],['all','전체']].map(function(t){
        return '<button type="button" id="rtab-'+t[0]+'" onclick="_yRestSwitch(\''+t[0]+'\')" '+
          'style="min-height:var(--tap);border-radius:var(--r);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;border:1px solid '+
          (_restTab===t[0]?'var(--acln);background:var(--acl);color:var(--ac)':'var(--bd);background:var(--bg2);color:var(--t2)')+'">'+t[1]+'</button>';
      }).join('')+
    '</div>'+
    '<div id="rest-list">'+_skRows(3)+'</div>';
  _yRestLoadManager();
}
function _yRestSwitch(t){_restTab=t;_yRestManagerPage(document.getElementById('content'));}

function _yRestLoadManager(){
  _db.collection('yongcha_rest').limit(200).get().then(function(snap){
    var list=document.getElementById('rest-list');if(!list)return;
    var today=_yToday();
    var docs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(_restTab==='pending')docs=docs.filter(function(r){return r.status==='pending';});
    else if(_restTab==='approved')docs=docs.filter(function(r){return r.status==='approved'&&(!r.endDate||r.endDate>=today);});
    docs.sort(function(a,b){return String(b.startDate||'').localeCompare(String(a.startDate||''));});
    if(!docs.length){
      list.innerHTML=_emptyHtml('📭',
        _restTab==='pending'?'대기 중인 신청이 없어요':_restTab==='approved'?'휴식 중인 기사가 없어요':'휴식 이력이 없어요','');
      return;
    }
    list.innerHTML=docs.map(function(r){return _yRestCard(r,true);}).join('');
  }).catch(function(e){
    var list=document.getElementById('rest-list');if(list)list.innerHTML=_errHtml(e);
  });
}

function _yRestCard(r,canJudge){
  var badge={pending:['승인 대기','var(--brl)','var(--br)'],
             approved:[' 휴식 중','var(--acl)','var(--ac)'],
             rejected:['반려','var(--rdl)','var(--rd)'],
             ended:['복귀 완료','var(--gnl)','var(--gn)']}[r.status]||['—','var(--bg3)','var(--t2)'];
  var today=_yToday();
  if(r.status==='approved'&&r.endDate&&r.endDate<today)badge=['기간 종료','var(--bg3)','var(--t2)'];
  var days=(r.startDate&&r.endDate)?(_yDaysBetween(r.startDate,r.endDate)+1):0;
  return '<div class="card" style="margin-bottom:10px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">'+
      '<div style="font-size:14.5px;font-weight:800">🚗 '+_esc(r.driverName||'—')+'</div>'+
      '<span style="font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:'+badge[1]+';color:'+badge[2]+'">'+badge[0]+'</span>'+
    '</div>'+
    '<div style="font-size:12.5px;color:var(--t2);margin-bottom:6px">'+
      '📅 '+_esc(r.startDate||'—')+' ~ '+_esc(r.endDate||'—')+(days?' <span style="color:var(--t3)">('+days+'일)</span>':'')+'</div>'+
    '<div style="font-size:12.5px;color:var(--t2);margin-bottom:6px">📝 '+_esc(r.reason||'사유 미기재')+
      (r.memo?' <span style="color:var(--t3)">· '+_esc(r.memo)+'</span>':'')+'</div>'+
    (r.driverRegion?'<div style="font-size:12px;color:var(--t3);margin-bottom:6px">📍 '+_esc(r.driverRegion)+(r.driverPhone?' · 📞 '+_esc(r.driverPhone):'')+'</div>':'')+
    (r.rejectMemo?'<div style="font-size:12px;color:var(--rd);margin-bottom:6px">반려 사유: '+_esc(r.rejectMemo)+'</div>':'')+
    (canJudge&&r.status==='pending'?
      '<div class="judge-row" style="margin-top:10px">'+
      '<button class="judge-btn judge-approve" onclick="_yJudgeRest(\''+r.id+'\',\'approved\',\''+_jsq(r.driverName)+'\',\''+_esc(r.driverId)+'\')">승인</button>'+
      '<button class="judge-btn judge-reject" onclick="_yJudgeRest(\''+r.id+'\',\'rejected\',\''+_jsq(r.driverName)+'\',\''+_esc(r.driverId)+'\')">반려</button>'+
      '</div>':'')+
  '</div>';
}

function _yOpenRestModal(){
  document.getElementById('modal-body').innerHTML=
    '<div style="font-size:20px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px"> 휴식 신청</div>'+
    '<div style="font-size:12.5px;color:var(--t2);margin-bottom:18px">승인되면 휴식 기간 동안 공고 지원이 잠깁니다</div>'+
    '<div class="inp-wrap"><label class="inp-lbl">휴식 시작일</label>'+
      '<input id="rest-start" type="date" class="inp" value="'+_yToday()+'" min="'+_yToday()+'"></div>'+
    '<div class="inp-wrap"><label class="inp-lbl">복귀 예정일</label>'+
      '<input id="rest-end" type="date" class="inp" value="'+_yPlusDays(6)+'" min="'+_yToday()+'"></div>'+
    '<div class="inp-wrap"><label class="inp-lbl">사유</label>'+
      '<select id="rest-reason" class="inp">'+REST_REASONS.map(function(v){return '<option value="'+v+'">'+v+'</option>';}).join('')+'</select></div>'+
    '<div class="inp-wrap"><label class="inp-lbl">상세 메모 (선택)</label>'+
      '<input id="rest-memo" class="inp" placeholder="예: 차량 엔진 정비 입고" maxlength="80"></div>'+
    '<div class="err" id="rest-err"></div>'+
    '<button id="rest-submit-btn" onclick="_ySubmitRest()" style="width:100%;min-height:var(--tap);background:var(--brl);color:var(--br);border:1px solid var(--brln);border-radius:var(--r);font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit">신청서 제출</button>';
  _openModal();
}

function _ySubmitRest(){
  var s=(document.getElementById('rest-start')||{}).value||'';
  var e=(document.getElementById('rest-end')||{}).value||'';
  var reason=(document.getElementById('rest-reason')||{}).value||'';
  var memo=((document.getElementById('rest-memo')||{}).value||'').trim();
  var err=document.getElementById('rest-err');
  var show=function(m){if(err){err.textContent=m;err.style.display='block';}};
  if(!s||!e)return show('시작일과 복귀 예정일을 모두 입력해주세요');
  if(e<s)return show('복귀 예정일이 시작일보다 빠를 수 없어요');
  if(_yDaysBetween(s,e)>180)return show('휴식은 최대 180일까지 신청할 수 있어요');

  var btn=document.getElementById('rest-submit-btn');
  if(btn){btn.textContent='제출 중...';btn.disabled=true;}

  // 이미 처리 대기/진행 중인 신청이 있으면 중복 방지
  _db.collection('yongcha_rest').where('driverId','==',_CU.uid).limit(50).get()
  .then(function(snap){
    var dup=snap.docs.some(function(d){
      var r=d.data();
      return (r.status==='pending')||(r.status==='approved'&&(!r.endDate||r.endDate>=_yToday()));
    });
    if(dup){throw new Error('__DUP__');}
    return _db.collection('yongcha_rest').add({
      driverId:_CU.uid,driverName:_CU.name,
      driverPhone:_CU.phone||'',driverRegion:_CU.region||'',
      startDate:s,endDate:e,reason:reason,memo:memo,
      status:'pending',
      requestedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  })
  .then(function(){
    _closeModal();
    _yToast(' 휴식 신청을 제출했어요. 승인을 기다려주세요');
    _pgRest(document.getElementById('content'));
  })
  .catch(function(ex){
    if(btn){btn.textContent='신청서 제출';btn.disabled=false;}
    show(ex.message==='__DUP__'?'이미 진행 중인 휴식 신청이 있어요':'오류: '+ex.message);
  });
}

function _yJudgeRest(restId,status,driverName,driverId){
  var memo='';
  if(status==='rejected'){
    memo=prompt('반려 사유를 입력해주세요 (기사에게 전달됩니다)','')||'';
    if(!memo.trim())return;
  }
  _db.collection('yongcha_rest').doc(restId).get().then(function(snap){
    if(!snap.exists)throw new Error('신청서를 찾을 수 없어요');
    var r=snap.data();
    return _db.collection('yongcha_rest').doc(restId).update({
      status:status,rejectMemo:memo,
      judgedAt:firebase.firestore.FieldValue.serverTimestamp(),
      judgedBy:_CU.uid,judgedByName:_CU.name
    }).then(function(){
      if(status!=='approved')return;
      // 기사 프로필 미러링 — 지원 차단·AI 추천이 이 값을 본다
      return _db.collection('yongcha_users').doc(driverId).update({
        resting:true,restUntil:r.endDate||'',restId:restId
      });
    }).then(function(){return r;});
  }).then(function(r){
    _yToast(status==='approved'?''+driverName+'님 휴식을 승인했어요':'반려 처리했어요');
    _yNotify(driverId,
      status==='approved'?'휴식 승인':'휴식 반려',
      status==='approved'
        ? (r.startDate||'')+' ~ '+(r.endDate||'')+' 휴식이 승인되었어요. 기간 중에는 지원이 잠깁니다'
        : '휴식 신청이 반려되었어요'+(memo?' — '+memo:''),'rest');
    _yRestLoadManager();
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _riqSwitch(tab){
  _riqTab=tab;
  var tabs_order=['heatmap','record','match'];
  document.querySelectorAll('#riq-tabs .sub-tab').forEach(function(b,i){
    b.classList.toggle('on',tabs_order[i]===tab);
  });
  var body=document.getElementById('riq-body');if(!body)return;
  if(tab==='heatmap')_riqHeatmap(body);
  else if(tab==='record')_riqRecord(body);
  else if(tab==='match')_riqMatch(body);

// ── 1. 시세 히트맵 ───────────────────────────────────────────────
function _riqHeatmap(el){
  el.innerHTML='<div class="card" style="text-align:center;padding:28px">'+
    '<div class="spinner"></div>'+
    '<p style="color:var(--t2);font-size:13px;margin-top:12px">지역별 시세 분석 중...</p></div>';
  _db.collection('yongcha_posts')
    .where('status','in',['open','matched','closed'])
    .orderBy('createdAt','desc').limit(300).get()
  .then(function(snap){
    var regionMap={};
    var courierMap={};
    snap.forEach(function(d){
      var p=d.data();
      var r=p.region||'기타';
      var price=Number(p.unitPrice||p.price||0);
      var c=p.courier||p.courierBrand||'기타';
      courierMap[c]=(courierMap[c]||0)+1;
      if(!price)return;
      if(!regionMap[r])regionMap[r]={sum:0,cnt:0};
      regionMap[r].sum+=price;
      regionMap[r].cnt++;
    });
    var regions=Object.keys(regionMap).map(function(r){
      var d=regionMap[r];
      var avg=Math.round(d.sum/d.cnt);
      return {region:r,avg:avg,cnt:d.cnt,guarantee:Math.round(avg*0.85)};
    }).sort(function(a,b){return b.avg-a.avg;});

    if(!regions.length){
      el.innerHTML=_emptyHtml('📊','시세 데이터 없음','공고가 등록되면 자동으로 분석해요');return;
    }
    var maxAvg=regions[0].avg;
    var html='<div class="card" style="margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<div style="font-size:14px;font-weight:800">지역별 평균 단가</div>'+
      '<div style="font-size:11px;color:var(--t2)">최근 300건 기준</div></div>';
    regions.forEach(function(r){
      var pct=maxAvg>0?Math.round(r.avg/maxAvg*100):0;
      var col=pct>=85?'var(--gn)':pct>=65?'var(--br)':'var(--ac)';
      html+='<div class="heatmap-row">'+
        '<div style="width:54px;font-size:12.5px;font-weight:800;color:var(--tx);flex-shrink:0">'+_esc(r.region)+'</div>'+
        '<div style="flex:1;padding:0 8px"><div class="heatmap-bar" style="width:'+pct+'%;background:'+col+'"></div></div>'+
        '<div style="width:90px;text-align:right;flex-shrink:0">'+
        '<div style="font-size:13px;font-weight:800;color:var(--br);font-variant-numeric:tabular-nums">'+_riqFmtP(r.avg)+'</div>'+
        '<div style="font-size:10px;color:var(--t3)">'+r.cnt+'건</div></div></div>';
    });
    html+='</div>';

    // 최소보장 기준표
    html+='<div class="card" style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:12px">'+
      '<div style="font-size:14px;font-weight:800">최소보장 기준</div>'+
      '<span style="font-size:10.5px;color:var(--t2);background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:2px 7px">시세 × 85%</span></div>';
    regions.slice(0,10).forEach(function(r){
      html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)">'+
        '<div style="font-size:13px;font-weight:700">'+_esc(r.region)+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<span style="font-size:12px;color:var(--gn);font-weight:800">'+_riqFmtP(r.guarantee)+' 이상</span>'+
        '<span style="font-size:11px;color:var(--t3)">(평균 '+_riqFmtP(r.avg)+')</span>'+
        '</div></div>';
    });
    html+='</div>';

    // 택배사별 공고 비중
    var clist=Object.keys(courierMap).sort(function(a,b){return courierMap[b]-courierMap[a];}).slice(0,6);
    var total=snap.size||1;
    if(clist.length){
      html+='<div class="card">'+
        '<div style="font-size:14px;font-weight:800;margin-bottom:12px">택배사별 공고 비중</div>';
      clist.forEach(function(c){
        var pct=Math.round(courierMap[c]/total*100);
        html+='<div class="heatmap-row">'+
          '<div style="width:100px;font-size:12.5px;font-weight:700;color:var(--t2);flex-shrink:0">'+_esc(c)+'</div>'+
          '<div style="flex:1;padding:0 8px"><div class="heatmap-bar" style="width:'+pct+'%;background:var(--pu)"></div></div>'+
          '<div style="width:40px;text-align:right;font-size:12.5px;font-weight:800;color:var(--tx)">'+pct+'%</div></div>';
      });
      html+='</div>';
    }
    el.innerHTML=html;
  }).catch(function(e){
    el.innerHTML='<div class="card" style="color:var(--rd);text-align:center;padding:24px">로드 실패: '+_esc(e.message)+'</div>';
  });
}

function _riqFmtP(n){
  if(!n)return '—';
  if(n>=10000)return Math.round(n/1000)+'k원';
  return n.toLocaleString()+'원';
}

function _riqSaveRecord(){

  var priceEl=document.getElementById('riq-price');

    count:count,
    price:price,

// ── NL 공고 파싱 (소장용) ─────────────────────────────────────────
function _pwNlParse(){
  var nlEl=document.getElementById('pw-nl-input');
  var st=document.getElementById('pw-nl-status');
  var text=(nlEl&&nlEl.value||'').trim();
  if(!text){_yToast('입력 내용이 없어요');return;}
  if(st)st.textContent='AI 분석 중...';
  _yGetToken().then(function(tok){
    return fetch('/api/yongcha/quick-post',{
      method:'POST',
      headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({text:text})
    });
  }).then(function(r){return r.json();}).then(function(res){
    if(!res.ok||!res.fields){if(st)st.textContent='파싱 실패. 직접 입력해주세요.';return;}
    var f=res.fields;
    if(f.courier){var s=document.getElementById('pw-courier');if(s){for(var i=0;i<s.options.length;i++)if(s.options[i].value===f.courier){s.selectedIndex=i;break;}}}
    if(f.volume){var v=document.getElementById('pw-volume');if(v)v.value=f.volume;}
    if(f.unitPrice){var p=document.getElementById('pw-price');if(p){p.value=f.unitPrice;_calcEst();_loadRegionStats();}}
    if(f.urgent&&!_isUrgent){var ub=document.getElementById('toggle-urgent');if(ub)ub.click();}
    if(f.region){
      var ri=document.getElementById('pw-region');if(ri)ri.value=f.region;
      var ai=document.getElementById('pw-area');if(ai&&f.area)ai.value=f.area;
    }
    if(f.workShift){
      document.querySelectorAll('#pw-shift-group button').forEach(function(b){
        if(b.textContent===f.workShift)b.click();
      });
    }
    if(st)st.innerHTML='<span style="color:var(--gn);font-weight:800">자동 완성됨</span> — 내용을 확인하고 수정하세요';
  }).catch(function(e){if(st)st.textContent='오류: '+e.message;});
}

// ── 3. AI 매칭 ──────────────────────────────────────────────────
function _riqMatch(el){
  el.innerHTML='<div class="riq-score-card" style="margin-bottom:14px">'+
    '<div class="riq-badge" style="margin-bottom:8px;display:inline-flex">AI MATCH</div>'+
    '<div style="font-size:16px;font-weight:800;margin-bottom:3px">맞춤 공고 추천</div>'+
    '<div style="font-size:12px;color:var(--t2)">실적·선호구역·택배사 분석 중</div></div>'+
    '<div id="riq-match-body">'+_skRows(4)+'</div>';

  var recentRegions=[],avgPrice=0,preferredCouriers=[];
  // 과거 기록 조회 실패(권한 없음 등) 시 빈 결과로 폴백 — 공고 기반 매칭만 진행
  var recordPromise=_db.collection('yongcha_records').where('driverId','==',_CU.uid)
    .orderBy('createdAt','desc').limit(20).get().catch(function(){return {forEach:function(){}};});
  recordPromise.then(function(recSnap){
    var priceSum=0,cnt=0,courierMap={};
    recSnap.forEach(function(d){
      var r=d.data();
      if(r.driverRegion&&recentRegions.indexOf(r.driverRegion)<0)recentRegions.push(r.driverRegion);
      if(r.price){priceSum+=r.price;cnt++;}
      if(r.courier)courierMap[r.courier]=(courierMap[r.courier]||0)+1;
    });
    avgPrice=cnt>0?Math.round(priceSum/cnt):0;
    preferredCouriers=Object.keys(courierMap).sort(function(a,b){return courierMap[b]-courierMap[a];}).slice(0,3);
    // 기사 선호 설정에서도 보완
    var prefs=(_CU.preferences)||{};
    if(!preferredCouriers.length&&prefs.courier)preferredCouriers=[prefs.courier];
    if(!recentRegions.length&&(_CU.region||prefs.region))recentRegions=[_CU.region||prefs.region];
    return _db.collection('yongcha_posts').where('status','in',['open','urgent'])
      .orderBy('createdAt','desc').limit(30).get();
  }).then(function(postsSnap){
    var posts=[];
    postsSnap.forEach(function(d){posts.push(Object.assign({id:d.id},d.data()));});
    var mb=document.getElementById('riq-match-body');
    if(!posts.length){
      if(mb)mb.innerHTML=_emptyHtml('📭','공개 공고 없음','새 공고가 등록되면 AI 추천이 시작됩니다');
      return;
    }
    return fetch('/api/routeiq-match',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        driver:{name:_CU.name,region:_CU.region||'',carType:_CU.carType||'',
                preferredCouriers:preferredCouriers,avgPrice:avgPrice,recentRegions:recentRegions},
        posts:posts
      })
    }).then(function(r){return r.json();}).then(function(res){
      var matches=res.matches||[];
      var matchMap={};
      matches.forEach(function(m){if(m&&m.id)matchMap[m.id]={score:m.score||0,reason:m.reason||''};});
      var ranked=posts.filter(function(p){return matchMap[p.id];})
        .sort(function(a,b){return (matchMap[b.id].score||0)-(matchMap[a.id].score||0);});
      if(!ranked.length){
        // AI 응답 없으면 지역 기반 단순 정렬
        ranked=posts.filter(function(p){
          return p.region&&(_CU.region||'').indexOf(p.region.slice(0,2))>=0;
        }).slice(0,5);
        if(!ranked.length)ranked=posts.slice(0,5);
      }
      var mb2=document.getElementById('riq-match-body');if(!mb2)return;
      var html='<div style="font-size:13px;color:var(--t2);margin-bottom:12px;font-weight:700">'+
        'AI가 '+ranked.length+'개 맞춤 공고를 선별했어요</div>';
      ranked.forEach(function(post,idx){
        var m=matchMap[post.id]||{};
        var score=m.score||0;
        var scoreColor=score>=80?'var(--gn)':score>=60?'var(--br)':'var(--t2)';
        html+='<div class="pcard is-open" onclick="_yOpenPost(\''+post.id+'\')" style="margin-bottom:12px">'+
          '<div class="pc-ribbon">'+
          '<span class="riq-badge" style="background:transparent;color:#fff;border:none;padding:0;letter-spacing:1px">ROUTEIQ 추천 #'+(idx+1)+'</span>'+
          (score?'<span style="font-size:10.5px;font-weight:800;color:#fff;margin-left:auto">추천 '+score+'점</span>':'')+
          '</div>'+
          '<div class="pc-head">'+
          '<span class="courier-badge">'+_esc(post.courier||post.courierBrand||'택배사')+'</span>'+
          '<span class="st st-open">모집중</span>'+
          '</div>'+
          '<div class="pc-body">'+
          '<div class="pc-title">'+_esc(post.title||'공고')+'</div>'+
          '<div class="pc-price" style="margin-top:10px">'+
          '<span class="pc-price-num">'+(post.unitPrice||post.price||0).toLocaleString()+'</span>'+
          '<span class="pc-price-unit">원/건</span></div>'+
          (m.reason?'<div style="margin-top:9px;padding:8px 11px;background:var(--acl);border-radius:var(--r-sm);font-size:12px;color:var(--ac);font-weight:700;line-height:1.5">'+_esc(m.reason)+'</div>':'')+
          '</div>'+
          '<div class="pc-foot">'+
          '<span class="pc-agency"><span class="nm">'+_esc(post.agencyName||'대리점')+'</span></span>'+
          (score?'<span style="font-size:13px;font-weight:900;color:'+scoreColor+'">'+score+'점</span>':'')+
          '</div></div>';
      });
      mb2.innerHTML=html;
    });
  }).catch(function(e){
    var mb=document.getElementById('riq-match-body');
    if(mb)mb.innerHTML='<div class="card" style="color:var(--rd);text-align:center;padding:24px">AI 추천 오류: '+_esc(e.message)+'</div>';
  });
}

/* ══════════════════════════════════════════════════════════
   AI 기사 추천 정보 (/api/yongcha/recommend)
   후보 기사를 클라이언트에서 모아 서버로 넘기면
   서버가 규칙 점수 + Anthropic 재랭킹으로 추천을 돌려준다.
   ══════════════════════════════════════════════════════════ */
function _yAiRecommend(postId){
  var mb=document.getElementById('modal-body');
  mb.innerHTML='<div style="font-size:20px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px">🤖 AI 기사 추천</div>'+
    '<div style="font-size:12.5px;color:var(--t2);margin-bottom:18px">공고 조건과 기사 데이터를 분석하는 중이에요…</div>'+_skRows(4);
  _openModal();

  var post=(_allPosts||[]).filter(function(p){return p.id===postId;})[0];
  var getPost=post?Promise.resolve(post)
    :_db.collection('yongcha_posts').doc(postId).get().then(function(s){
        return s.exists?Object.assign({id:s.id},s.data()):{};});

  var getDrivers=_db.collection('yongcha_users').where('type','==','driver').limit(120).get()
    .then(function(snap){
      var today=_yToday(), out=[];
      snap.forEach(function(d){
        var u=d.data();
        if(u.suspended)return;
        var days=null;
        var ts=u.updatedAt||u.createdAt;
        if(ts&&ts.seconds)days=Math.floor((Date.now()/1000-ts.seconds)/86400);
        out.push({
          driverId:d.id,name:u.name||'이름없음',
          region:u.region||'',carType:_yCarNorm(u.carType||(u.preferences&&u.preferences.carType)||''),
          lat:(typeof u.lat==='number')?u.lat:null, lng:(typeof u.lng==='number')?u.lng:null,
          rating:Number(u.rating||0),reviewCount:Number(u.reviewCount||0),
          completedRoutes:Number(u.completedRoutes||0),
          trustScore:Number(u.trustScore||0),
          resting:!!(u.resting&&(!u.restUntil||u.restUntil>=today)),
          daysSinceActive:days
        });
      });
      return out;
    });

  Promise.all([getPost,getDrivers]).then(function(res){
    var p=res[0]||{}, drivers=res[1]||[];
    if(!drivers.length){
      document.getElementById('modal-body').innerHTML=
        '<div style="font-size:20px;font-weight:900;margin-bottom:16px">🤖 AI 기사 추천</div>'+
        _emptyHtml('🚗','등록된 기사가 없어요','기사 회원이 가입하면 추천이 시작돼요');
      return;
    }
    return fetch('/api/yongcha/recommend',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        topN:5,
        post:{
          title:((p.region||'')+' '+(p.area||'')).trim(),region:p.region||'',zones:p.zones||[],
          loadingAddr:p.loadingAddr||'',
          loadingLat:(typeof p.loadingLat==='number')?p.loadingLat:null,
          loadingLng:(typeof p.loadingLng==='number')?p.loadingLng:null,
          carType:_yCarNorm(p.vehicleType||p.carType||''),courier:p.courier||'',
          unitPrice:p.unitPrice||0,dailyCount:p.volume||0,
          startDate:p.startDate||'',workDays:p.workDays||'',
          urgent:!!p.urgent,note:p.desc||''
        },
        drivers:drivers
      })
    }).then(function(r){return r.json();}).then(function(data){
      _yAiRenderPicks(data,p,postId);
    });
  }).catch(function(e){
    var body=document.getElementById('modal-body');
    if(body)body.innerHTML='<div style="font-size:20px;font-weight:900;margin-bottom:16px">🤖 AI 기사 추천</div>'+_errHtml(e);
  });
}

function _yAiRenderPicks(data,post,postId){
  var body=document.getElementById('modal-body');if(!body)return;
  var picks=(data&&data.picks)||[];
  var engine=(data&&data.engine)||'rule';
  var isAI=engine==='ai';

  // ── 헤더 ──
  var html=
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">'+
      '<div style="font-size:20px;font-weight:900;letter-spacing:-.6px;flex:1">AI 기사 추천</div>'+
      '<span style="font-size:9.5px;font-weight:900;padding:3px 10px;border-radius:999px;letter-spacing:.5px;'+
        (isAI?'background:rgba(0,212,170,.14);color:var(--ac);border:1px solid var(--acln)':
               'background:var(--bg3);color:var(--t3);border:1px solid var(--bd)')+'">'+(isAI?'ANTHROPIC AI':'RULE ENGINE')+'</span>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--t3);margin-bottom:14px">'+
      (data&&data.restingExcluded?'휴식 '+data.restingExcluded+'명 제외 · ':'')+
      picks.length+'명 후보 분석 완료'+
    '</div>';

  // ── AI 요약 인사이트 ──
  if(data&&data.summary)
    html+='<div style="padding:11px 14px;border-radius:var(--r);background:rgba(0,212,170,.1);border:1px solid var(--acln);margin-bottom:14px">'+
      '<div style="font-size:9.5px;font-weight:900;color:var(--ac);letter-spacing:.5px;margin-bottom:4px">AI INSIGHT</div>'+
      '<div style="font-size:12.5px;color:var(--ac);font-weight:700;line-height:1.55">'+_esc(data.summary)+'</div>'+
    '</div>';

  if(!picks.length){html+=_emptyHtml('','조건에 맞는 기사를 찾지 못했어요','공고 조건을 넓혀보세요');body.innerHTML=html;return;}

  var rankColors=['var(--br)','var(--t2)','#cd7f32','var(--t3)','var(--t3)'];
  var rankLabels=['1위','2위','3위','4위','5위','6위','7위','8위','9위','10위'];

  picks.forEach(function(d,i){
    var score=Math.round(d.aiScore!=null?d.aiScore:d.score)||0;
    var reason=d.aiReason||(d.reasons||[]).join(' · ')||'조건 적합';
    var caution=d.aiCaution||d.caution||'';
    var pct=Math.max(4,Math.min(100,score));
    var scoreColor=score>=80?'var(--ac)':score>=60?'var(--gn)':score>=40?'var(--br)':'var(--t3)';
    var rankColor=rankColors[i]||'var(--t3)';

    // ── SVG 도넛 점수링 ──
    var r=18, circ=Math.round(2*Math.PI*r);
    var dash=Math.round(pct/100*circ);
    var ring='<svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg)">'+
      '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="var(--bg3)" stroke-width="5"/>'+
      '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="'+scoreColor+'" stroke-width="5"'+
        ' stroke-dasharray="'+dash+' '+circ+'" stroke-linecap="round"/>'+
    '</svg>';

    // ── 4개 매칭 팩터 바 ──
    var postVehicle=_yCarNorm((post&&(post.vehicleType||post.carType))||'');
    var postRegion=(post&&post.region)||'';
    var regionPct=d.regionMatch!=null?Math.round(d.regionMatch*100):(d.region&&postRegion&&d.region===postRegion?100:35);
    var carPct=d.carMatch!=null?Math.round(d.carMatch*100):(postVehicle&&d.carType&&_yCarNorm(d.carType)===postVehicle?100:50);
    var ratingPct=Math.round(Math.min(Number(d.rating||0)/5,1)*100);
    var routePct=Math.min(Math.round((d.completedRoutes||0)/50*100),100);
    var factors=[{l:'지역',p:regionPct,c:'var(--ac)'},{l:'차량',p:carPct,c:'var(--sky)'},{l:'평점',p:ratingPct,c:'var(--br)'},{l:'실적',p:routePct,c:'var(--gn)'}];
    var factorHtml=factors.map(function(f){
      return '<div style="flex:1;min-width:0;text-align:center">'+
        '<div style="font-size:9px;font-weight:800;color:var(--t3);margin-bottom:4px;letter-spacing:.3px">'+f.l+'</div>'+
        '<div style="height:4px;border-radius:999px;background:var(--bg3);overflow:hidden">'+
          '<div style="height:100%;width:'+f.p+'%;border-radius:999px;background:'+f.c+'"></div>'+
        '</div>'+
        '<div style="font-size:9px;color:var(--t3);margin-top:2px;font-weight:700">'+f.p+'%</div>'+
      '</div>';
    }).join('');

    // ── 신뢰 검증 배지 ──
    var trust=Number(d.trustScore||0);
    var verifyBadge=trust>=70?
      '<span style="font-size:9px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--gnl);color:var(--gn);border:1px solid var(--gnln);letter-spacing:.3px">검증</span>':
      trust>0?'<span style="font-size:9px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--brl);color:var(--br);letter-spacing:.3px">신규</span>':'';

    html+=
      '<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r-lg);padding:14px 14px 14px 17px;margin-bottom:10px;position:relative;overflow:hidden">'+
        '<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:'+rankColor+'"></div>'+
        // 상단: 링 + 이름·태그
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+
          '<div style="position:relative;flex-shrink:0;width:52px;height:52px">'+
            ring+
            '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">'+
              '<span style="font-size:13px;font-weight:900;color:'+scoreColor+'">'+score+'</span>'+
            '</div>'+
          '</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:4px">'+
              '<span style="font-size:9.5px;font-weight:900;color:'+rankColor+'">'+rankLabels[i]+'</span>'+
              '<span style="font-size:15px;font-weight:900;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+_esc(d.driverName)+'</span>'+
              verifyBadge+
            '</div>'+
            '<div style="display:flex;flex-wrap:wrap;gap:4px">'+
              (d.region?'<span style="font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--bg3);color:var(--t3)">'+_esc(d.region)+'</span>':'')+
              (d.carType?'<span style="font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--bg3);color:var(--t3)">'+_esc(d.carType)+'</span>':'')+
              '<span style="font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--bg3);color:var(--t3)">'+Number(d.rating||0).toFixed(1)+' ('+(d.reviewCount||0)+')</span>'+
              '<span style="font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--bg3);color:var(--t3)">'+(d.completedRoutes||0)+'건</span>'+
            '</div>'+
          '</div>'+
        '</div>'+
        // 4-팩터 바
