  '안녕하세요! '+_CU.name+'입니다.\n저희 대리점에서 기사님을 모시고 싶어 연락드립니다.\n관심 있으시면 연락 부탁드립니다!</textarea></div>'+
  '<button onclick="_sendScout(\''+driverId+'\',\''+driverName+'\')" style="width:100%;padding:14px;background:linear-gradient(135deg,var(--br),var(--br2));color:#000;border:none;border-radius:var(--r);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit">📨 스카웃 보내기</button>';
  _openModal();
}

function _sendScout(driverId, driverName){
  var msg=(document.getElementById('scout-msg')||{}).value||'';
  if(!msg.trim()){_yToast('메시지를 입력해주세요');return;}
  _db.collection('yongcha_scouts').add({
    agencyId:_CU.uid,agencyName:_CU.name,
    driverId:driverId,driverName:driverName,
    message:msg,status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast('✅ 스카웃 제안을 보냈어요!');
    _yNotify(driverId,'스카웃 제안 💌',_CU.name+'에서 스카웃 제안이 왔어요! 확인해보세요');
    _closeModal();
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _replyScout(scoutId, accept){
  _db.collection('yongcha_scouts').doc(scoutId).update({
    status:accept?'accepted':'rejected',
    repliedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast(accept?'✅ 스카웃 제안을 수락했어요!':'스카웃 제안을 거절했어요');
    _pgMyApplies(document.getElementById('content'));
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _toggleJobStatus(id, status){
  var next=status==='open'?'closed':'open';
  _db.collection('yongcha_jobs').doc(id).update({status:next}).then(function(){
    _yToast(next==='open'?'채용공고 재오픈됐어요':'채용공고 마감됐어요');
    _pgJobsAgency(document.getElementById('content'));
  });
}

function _loadJobApplicants(jobId){
  _db.collection('yongcha_applies').where('jobId','==',jobId).get().then(function(snap){
    var body=document.getElementById('modal-body');
    body.innerHTML='<div style="font-size:18px;font-weight:900;margin-bottom:16px">👥 배차 지원자</div>';
    if(snap.empty){body.innerHTML+='<div class="empty"><div class="empty-ico">📭</div><div class="empty-msg">아직 지원자가 없어요</div></div>';_openModal();return;}
    snap.forEach(function(doc){
      var a=Object.assign({id:doc.id},doc.data());
      var statusMap={pending:'⏳ 검토중',approved:'✅ 승인',rejected:'❌ 미선발'};
      var statusColor={pending:'var(--br)',approved:'var(--gn)',rejected:'var(--t3)'};
      var card=document.createElement('div');card.className='applicant-card';
      card.innerHTML=
        '<div class="applicant-top">'+
        '<span class="applicant-name">🚗 '+a.driverName+'</span>'+
        '<span style="font-size:12px;font-weight:700;color:'+(statusColor[a.status]||'var(--t2)')+'">'+
        (statusMap[a.status]||a.status)+'</span></div>'+
        '<div class="applicant-meta">📍 '+(a.driverRegion||'')+'</div>'+
        (a.status==='pending'?
        '<div class="judge-row">'+
        '<button class="judge-btn judge-approve" onclick="_judgeJobApply(\''+a.id+'\',\'approved\',\''+a.driverName+'\',\''+a.driverId+'\')">✅ 승인</button>'+
        '<button class="judge-btn judge-reject" onclick="_judgeJobApply(\''+a.id+'\',\'rejected\',\''+a.driverName+'\',\''+a.driverId+'\')">❌ 미선발</button>'+
        '</div>':'');
      body.appendChild(card);
    });
    _openModal();
  });
}

function _judgeJobApply(applyId, status, name, driverId){
  _db.collection('yongcha_applies').doc(applyId).update({
    status:status, judgedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast(status==='approved'?'✅ '+name+'님 승인 처리했어요!':'미선발 처리했어요');
    if(driverId){
      if(status==='approved') _yNotify(driverId,'채용 승인 🎉','축하해요! '+_CU.name+'에서 승인 통보가 왔어요!');
      else _yNotify(driverId,'채용 결과 안내',_CU.name+'에서 채용 검토가 완료됐어요');
    }
    _closeModal();
  });
}

// ── 기사 구인구직 뷰 ──
function _pgJobsDriver(el){
  var activeTab=(_jSubTab==='resume'?'resume':'list');
  el.innerHTML=
  '<div class="page-hdr"><div class="page-title">💼 구인구직</div>'+
  '<div class="page-sub">채용 공고를 찾고 이력서를 등록해요</div></div>'+
  '<div class="sub-tab-row">'+
  '<button class="sub-tab '+(activeTab==='list'?'on':'')+'" onclick="_jSwitchDriver(\'list\')">📋 채용 공고</button>'+
  '<button class="sub-tab '+(activeTab==='resume'?'on':'')+'" onclick="_jSwitchDriver(\'resume\')">📄 내 이력서</button>'+
  '</div>'+
  '<div id="jobs-content"></div>';

  _jSwitchDriver(activeTab);
}

function _jSwitchDriver(tab){
  _jSubTab=tab;
  document.querySelectorAll('.sub-tab').forEach(function(b){b.classList.remove('on');});
  var btns=document.querySelectorAll('.sub-tab');
  if(tab==='list'&&btns[0])btns[0].classList.add('on');
  if(tab==='resume'&&btns[1])btns[1].classList.add('on');
  var el=document.getElementById('jobs-content');
  if(!el)return;
  if(tab==='list') _loadJobList(el);
  else _loadMyResume(el);
}

function _loadJobList(el){
  el.innerHTML='<div id="job-list"><div style="text-align:center;padding:40px"><div class="spinner"></div></div></div>';
  _db.collection('yongcha_jobs').where('status','==','open').limit(120).get()
  .then(function(snap){
    var list=document.getElementById('job-list');if(!list)return;
    if(snap.empty){list.innerHTML='<div class="empty"><div class="empty-ico">📭</div><div class="empty-msg">등록된 채용공고가 없어요</div></div>';return;}
    list.innerHTML='';
    var _jlDocs=snap.docs.sort(function(a,b){var at=a.data().createdAt;var bt=b.data().createdAt;return (bt&&bt.seconds||0)-(at&&at.seconds||0);}).slice(0,80);
    _jlDocs.forEach(function(doc){
      var d=Object.assign({id:doc.id},doc.data());
      var card=document.createElement('div');card.className='job-card';
      card.onclick=function(){_showJobDetail(d);};
      card.innerHTML=
        '<div style="display:flex;align-items:center;margin-bottom:8px">'+
        '<span class="job-type-badge">'+d.jobType+'</span>'+
        (d.openEnded?'<span style="font-size:10px;background:var(--gnl);color:var(--gn);padding:3px 8px;border-radius:20px;font-weight:700">상시채용</span>':'')+
        '</div>'+
        '<div style="font-size:16px;font-weight:800;margin-bottom:6px">'+d.jobTitle+'</div>'+
        '<div style="font-size:12px;color:var(--t2);margin-bottom:10px">'+
        '🏢 '+d.agencyName+' · 📍 '+d.region+(d.area?' '+d.area:'')+
        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">'+
        '<div style="background:var(--bg3);border-radius:10px;padding:8px 10px">'+
        '<div style="font-size:10px;color:var(--t2);margin-bottom:2px">월 급여</div>'+
        '<div style="font-size:15px;font-weight:900;color:var(--br)">'+Number(d.salary||0).toLocaleString()+'<span style="font-size:10px;color:var(--t2)">원</span></div>'+
        '</div>'+
        '<div style="background:var(--bg3);border-radius:10px;padding:8px 10px">'+
        '<div style="font-size:10px;color:var(--t2);margin-bottom:2px">경력</div>'+
        '<div style="font-size:14px;font-weight:700">'+_careerLabel(d.careerReq)+'</div>'+
        '</div>'+
        '</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">'+
        (d.courier?'<span style="font-size:10px;background:var(--bg3);padding:3px 8px;border-radius:8px;color:var(--t2)">🚚 '+d.courier+'</span>':'')+
        (d.vehicleType?'<span style="font-size:10px;background:var(--bg3);padding:3px 8px;border-radius:8px;color:var(--t2)">🚗 '+d.vehicleType+'</span>':'')+
        (d.workDays?'<span style="font-size:10px;background:var(--bg3);padding:3px 8px;border-radius:8px;color:var(--t2)">📅 '+d.workDays+'</span>':'')+
        '</div>'+
        '<button onclick="event.stopPropagation();_applyJob(\''+d.id+'\',\''+d.agencyId+'\',\''+d.agencyName+'\')" style="width:100%;padding:10px;background:linear-gradient(135deg,var(--br),var(--br2));color:#000;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit">지원하기 →</button>';
      list.appendChild(card);
    });

function _showJobDetail(d){

  (d.openEnded?'<span style="font-size:10px;background:var(--gnl);color:var(--gn);padding:3px 8px;border-radius:20px;font-weight:700;margin-left:4px">상시채용</span>':'')+

    ['⏰ 근무시간',d.workHours||'협의'],

function _applyJob(jobId, agencyId, agencyName){
  var btn=document.getElementById('job-apply-btn');
  if(btn){btn.textContent='지원 중...';btn.disabled=true;}
  _db.collection('yongcha_applies').add({
    jobId:jobId, postId:'',
    driverId:_CU.uid, driverName:_CU.name,
    driverPhone:_CU.phone, driverRegion:_CU.region,
    agencyId:agencyId, agencyName:agencyName,
    status:'pending',
    appliedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast('✅ 지원 완료! 대리점 연락을 기다려주세요');
    _yNotify(agencyId,'배차 지원자 도착! 🚗',_CU.name+'님이 채용공고에 지원했어요');
    _closeModal();
  }).catch(function(e){
    if(btn){btn.textContent='🙋 지원하기';btn.disabled=false;}
    _yToast('오류: '+e.message);
  });
}

// ── 내 이력서 ──
function _loadMyResume(el){
  el.innerHTML='<div id="resume-area"><div style="text-align:center;padding:40px"><div class="spinner"></div></div></div>';
  _db.collection('yongcha_resumes').where('driverId','==',_CU.uid).limit(1).get()
  .then(function(snap){
    var area=document.getElementById('resume-area');if(!area)return;
    if(snap.empty){
      _renderResumeForm(area,null,null);
    } else {
      var doc=snap.docs[0];
      _renderResumeForm(area,doc.id,doc.data());
    }
  });
}

  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="rc-vehicle-group">'+

  '<div class="form-section-title">자기소개</div>'+

function _submitResume(docId){
  var career=(document.getElementById('rc-career')||{}).value||'';
  var careerDesc=(document.getElementById('rc-careerDesc')||{}).value||'';
  var vehicle=(document.getElementById('rc-vehicle')||{}).value||'';
  var region=(document.getElementById('rc-region')||{}).value||_CU.region||'';
  var pay=parseInt((document.getElementById('rc-pay')||{}).value)||0;
  var intro=(document.getElementById('rc-intro')||{}).value||'';
  var isPublic=document.getElementById('rc-public-toggle')&&document.getElementById('rc-public-toggle').classList.contains('on');
  var btn=document.getElementById('rc-submit-btn');

  if(!career){_yToast('경력을 선택해주세요');return;}
  btn.textContent='저장 중...';btn.disabled=true;

  var data={
    driverId:_CU.uid, driverName:_CU.name,
    driverPhone:_CU.phone, driverRegion:_CU.region,
    career:career, careerDesc:careerDesc,
    vehicleType:vehicle, preferRegion:region,
    preferPay:pay, selfIntro:intro, isPublic:isPublic,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };

  var p=docId
    ? _db.collection('yongcha_resumes').doc(docId).update(data)
    : _db.collection('yongcha_resumes').add(Object.assign(data,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));

  p.then(function(){
    _yToast(docId?'✅ 이력서가 수정됐어요!':'✅ 이력서가 등록됐어요!');
    _jSubTab='resume';
    _pgJobsDriver(document.getElementById('content'));
  }).catch(function(e){
    btn.textContent=docId?'💾 이력서 수정하기':'📄 이력서 등록하기';btn.disabled=false;
    _yToast('오류: '+e.message);
  });
}

function _submitJob(){
  var get=function(id){return(document.getElementById(id)||{}).value||'';};
  var title=get('jw-title'), jobType=get('jw-type'), salary=get('jw-salary');
  if(!title||!jobType||!salary){_yToast('제목/고용형태/급여는 필수입니다');return;}
  var btn=document.getElementById('jw-submit');
  btn.textContent='등록 중...';btn.disabled=true;
  var openEnded=document.getElementById('jw-openended-toggle')&&document.getElementById('jw-openended-toggle').classList.contains('on');
  _db.collection('yongcha_jobs').add({
    agencyId:_CU.uid, agencyName:_CU.name, agencyRating:_CU.rating||0,
    region:_CU.region, area:get('jw-area'), courier:get('jw-courier'),
    jobTitle:title, jobType:jobType,
    vehicleType:get('jw-vehicle'), careerReq:get('jw-career'),
    salary:parseInt(salary), settleDay:get('jw-settle'),
    workDays:get('jw-days'), headcount:parseInt(get('jw-headcount'))||1,
    openEnded:openEnded, desc:get('jw-desc'),
    status:'open', createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast('✅ 채용공고가 등록됐어요!');
    _closeModal();
    _jSubTab='myjobs';
    _pgJobsAgency(document.getElementById('content'));
  }).catch(function(e){
    btn.textContent='📋 채용공고 등록';btn.disabled=false;
    _yToast('오류: '+e.message);
  });
}

function _careerLabel(c){
  var map={'신입':'신입','1년 미만':'1년 미만','1~3년':'1~3년','3~5년':'3~5년','5년 이상':'5년 이상',
    '1년 이상':'1년 이상','3년 이상':'3년 이상','무관':'무관'};
  return map[c]||c||'무관';
}

var _chatUnsub=null;

function _pgChats(el){
  el.innerHTML=
    '<div class="page-hdr"><div class="page-title">💬 채팅</div>'+
    '<div class="page-sub">대리점·기사와 직접 소통해요</div></div>'+
    '<div id="chat-list"><div style="text-align:center;padding:40px"><div class="spinner"></div></div></div>';

  _db.collection('yongcha_chats').where('participants','array-contains',_CU.uid)
    .limit(50).get()
    .then(function(snap){
      var list=document.getElementById('chat-list');if(!list)return;
      if(snap.empty){
        list.innerHTML='<div class="empty"><div class="empty-ico">💬</div>'+
          '<div class="empty-msg">아직 채팅이 없어요<br>승인된 지원에서 채팅을 시작해보세요</div></div>';
        return;
      }
      list.innerHTML='';
      var _chDocs=snap.docs.sort(function(a,b){var at=a.data().lastAt;var bt=b.data().lastAt;return (bt&&bt.seconds||0)-(at&&at.seconds||0);}).slice(0,30);
      _chDocs.forEach(function(doc){
        var d=Object.assign({id:doc.id},doc.data());
        var otherUid=d.participants.find(function(u){return u!==_CU.uid;})||'';
        var otherName=(d.participantNames||{})[otherUid]||'상대방';
        var otherType=(d.participantTypes||{})[otherUid]||'';
        var unread=(d.unread||{})[_CU.uid]||0;
        var lastAt='';
        if(d.lastAt&&d.lastAt.seconds){
          var dt=new Date(d.lastAt.seconds*1000);
          var now=new Date();
          if(now.toDateString()===dt.toDateString())
            lastAt=dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0');
          else lastAt=(dt.getMonth()+1)+'/'+(dt.getDate());
        }
        var row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .15s';
        row.onclick=function(){_pgChatRoom(d.id,otherUid,otherName);};
        row.innerHTML=
          '<div style="width:44px;height:44px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;margin-right:12px">'+
          (otherType==='agency'?'🏢':otherType==='driver'?'🚗':'👤')+'</div>'+
          '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">'+
          '<div style="font-size:14px;font-weight:700">'+otherName+'</div>'+
          '<div style="font-size:11px;color:var(--t3)">'+lastAt+'</div>'+
          '</div>'+
          '<div style="font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          (d.lastMessage||'메시지를 보내보세요')+'</div>'+
          '</div>'+
          (unread>0?'<div style="margin-left:8px;background:var(--rd);color:#fff;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+unread+'</div>':'');
        list.appendChild(row);
      });
    }).catch(function(e){
      var list=document.getElementById('chat-list');
      if(list)list.innerHTML='<div class="empty"><div class="empty-msg">불러오기 실패: '+e.message+'</div></div>';
    });
}

function _openChatRoom(otherUid,otherName,otherType){
  _closeModal();
  var ids=[_CU.uid,otherUid].sort();
  var chatId=ids[0]+'__'+ids[1];
  var chatRef=_db.collection('yongcha_chats').doc(chatId);
  chatRef.get().catch(function(){return {exists:false};}).then(function(snap){
    if(!snap||!snap.exists){
      var names={};names[_CU.uid]=_CU.name;names[otherUid]=otherName;
      var types={};types[_CU.uid]=_CU.type;types[otherUid]=otherType;
      var unread={};unread[_CU.uid]=0;unread[otherUid]=0;
      return chatRef.set({
        participants:[_CU.uid,otherUid],
        participantNames:names,participantTypes:types,
        lastMessage:'',lastAt:firebase.firestore.FieldValue.serverTimestamp(),
        unread:unread,createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(){});
    }
  }).then(function(){_pgChatRoom(chatId,otherUid,otherName);}).catch(function(e){_yToast('채팅 오류: '+e.message);});
}

function _pgChatRoom(chatId,otherUid,otherName){
  if(_chatUnsub){_chatUnsub();_chatUnsub=null;}
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('on');});
  var nb=document.getElementById('bnav-chat');if(nb)nb.classList.add('on');

  var el=document.getElementById('content');
  el.style.overflowY='hidden';
  el.style.padding='0';
  el.style.display='flex';
  el.style.flexDirection='column';
  el.innerHTML=
    '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0">'+
    '<button onclick="_goPage(\'chat\')" style="background:none;border:none;color:var(--t2);font-size:24px;cursor:pointer;line-height:1;padding:0;width:32px">‹</button>'+
    '<div><div style="font-size:15px;font-weight:800">'+otherName+'</div>'+
    '<div id="chat-phone" style="font-size:11px;color:var(--t2);display:none"></div></div>'+
    '</div>'+
    '<div id="chat-msgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch"></div>'+
    '<div style="display:flex;gap:8px;padding:10px 12px;background:var(--bg2);border-top:1px solid var(--bd);flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom))">'+
    '<input class="inp" id="chat-inp" placeholder="메시지 입력..." style="flex:1;margin:0;padding:11px 14px;font-size:14px" '+
    'onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();_sendMsg(\''+chatId+'\',\''+otherUid+'\');}">'+
    '<button onclick="_sendMsg(\''+chatId+'\',\''+otherUid+'\')" style="padding:11px 16px;background:var(--br);color:#000;border:none;border-radius:var(--r);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap">전송</button>'+
    '</div>';

  // Reset unread + load phone
  var upd={};upd['unread.'+_CU.uid]=0;
  _db.collection('yongcha_chats').doc(chatId).update(upd).catch(function(){});
  _db.collection('yongcha_chats').doc(chatId).get().then(function(snap){
    if(!snap.exists)return;
    var phones=snap.data().participantPhones||{};
    var phone=phones[otherUid]||'';
    var phoneEl=document.getElementById('chat-phone');
    if(phoneEl&&phone){phoneEl.textContent='📞 '+phone;phoneEl.style.display='block';}
  }).catch(function(){});

  // Real-time listener
  _chatUnsub=_db.collection('yongcha_chats').doc(chatId).collection('messages')
    .orderBy('createdAt','asc').onSnapshot(function(snap){
      var msgs=document.getElementById('chat-msgs');if(!msgs)return;
      msgs.innerHTML='';
      snap.forEach(function(doc){
        var m=doc.data();
        var isMe=m.senderId===_CU.uid;
        var timeStr='';
        if(m.createdAt&&m.createdAt.seconds){
          var dt=new Date(m.createdAt.seconds*1000);
          timeStr=dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0');
        }
        var div=document.createElement('div');
        div.style.cssText='display:flex;flex-direction:column;align-items:'+(isMe?'flex-end':'flex-start');
        div.innerHTML=
          (!isMe?'<div style="font-size:10px;color:var(--t2);margin-bottom:3px">'+m.senderName+'</div>':'')+
          '<div style="max-width:72%;padding:10px 14px;border-radius:'+(isMe?'16px 4px 16px 16px':'4px 16px 16px 16px')+
          ';background:'+(isMe?'var(--br)':'var(--bg3)')+';color:'+(isMe?'#000':'var(--tx)')+
          ';font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap">'+m.text+'</div>'+
          '<div style="font-size:10px;color:var(--t3);margin-top:3px">'+timeStr+'</div>';
        msgs.appendChild(div);
      });
      msgs.scrollTop=msgs.scrollHeight;
    });
}

function _sendMsg(chatId,otherUid){
  var inp=document.getElementById('chat-inp');if(!inp)return;
  var text=inp.value.trim();if(!text)return;
  inp.value='';
  var now=firebase.firestore.FieldValue.serverTimestamp();
  _db.collection('yongcha_chats').doc(chatId).collection('messages').add({
    senderId:_CU.uid,senderName:_CU.name,text:text,createdAt:now
  }).then(function(){
    var upd={lastMessage:text,lastAt:now};
    upd['unread.'+otherUid]=firebase.firestore.FieldValue.increment(1);
    return _db.collection('yongcha_chats').doc(chatId).update(upd);
  }).then(function(){
    _yNotify(otherUid,'💬 '+_CU.name,text.substring(0,60));
  }).catch(function(e){_yToast('전송 실패: '+e.message);});
}

function _setAccuracy(accurate){
  document.getElementById('rv-accuracy').value=accurate?'yes':'no';
  var yes=document.getElementById('acc-yes'),no=document.getElementById('acc-no');
  if(!yes||!no)return;
  yes.style.background=accurate?'var(--gnl)':'var(--bg3)';yes.style.color=accurate?'var(--gn)':'var(--t2)';yes.style.borderColor=accurate?'var(--gn)':'var(--bd)';
  no.style.background=!accurate?'var(--rdl)':'var(--bg3)';no.style.color=!accurate?'var(--rd)':'var(--t2)';no.style.borderColor=!accurate?'var(--rd)':'var(--bd)';
}
function _setStars(n){
  document.getElementById('rv-rating').value=n;
  var labels=['','별로예요','아쉬워요','보통이에요','좋아요','아주 좋아요'];
  var lbl=document.getElementById('rv-star-label');if(lbl)lbl.textContent=labels[n]||'';
  document.querySelectorAll('#rv-stars .star').forEach(function(s,i){s.classList.toggle('on',i<n);});
}
function _hoverStar(n){document.querySelectorAll('#rv-stars .star').forEach(function(s,i){s.style.color=i<n?'var(--br)':'var(--bd)';});}
function _leaveStar(){
  var n=parseInt((document.getElementById('rv-rating')||{}).value)||0;
  document.querySelectorAll('#rv-stars .star').forEach(function(s,i){s.style.color=i<n?'var(--br)':'var(--bd)';});
}

function _toggleCriteria(btn){
  btn.classList.toggle('on');
  var on=btn.classList.contains('on');
  btn.style.borderColor=on?'var(--br)':'var(--bd)';
  btn.style.background=on?'var(--brl)':'var(--bg3)';
  btn.style.color=on?'var(--br)':'var(--t2)';
}

function _submitReview(targetId,targetName,targetType,applyId){
  var rating=parseInt((document.getElementById('rv-rating')||{}).value)||0;
  if(!rating){_yToast('별점을 선택해주세요');return;}
  var comment=(document.getElementById('rv-comment')||{}).value||'';
  var criteria=[];
  document.querySelectorAll('#rv-criteria .on').forEach(function(b){criteria.push(b.dataset.c);});
  var accuracyVal=(document.getElementById('rv-accuracy')||{}).value||'';
  var postAccurate=accuracyVal==='yes'?true:accuracyVal==='no'?false:null;
  var btn=document.getElementById('rv-submit');btn.textContent='제출 중...';btn.disabled=true;

  _db.collection('yongcha_reviews').add({

function _driverGrade(score, completedRoutes){
  var s=score||0, r=completedRoutes||0;
  if(s>=91&&r>=30)return{label:'👑 VIP',color:'var(--br)',bg:'var(--brl)',short:'VIP'};
  if(s>=71&&r>=10)return{label:'⭐ 우수',color:'var(--ac)',bg:'var(--acl)',short:'우수'};
  if(s>=41||r>=3)return{label:'일반',color:'var(--t2)',bg:'var(--bg3)',short:'일반'};
  return{label:'🌱 새내기',color:'var(--t3)',bg:'var(--bg3)',short:'새내기'};
}

function _calcTrustScore(userId){
  _db.collection('yongcha_reviews').where('revieweeId','==',userId).get().then(function(snap){
    if(snap.empty)return;
    var total=0,count=0,fakeCount=0,lastFakeAt=null,highRatingCount=0;
    snap.forEach(function(doc){
      var d=doc.data();
      total+=d.rating||0;count++;
      if(d.isFake){
        fakeCount++;
        var ct=d.createdAt;
        if(ct&&(!lastFakeAt||(ct.seconds||0)>(lastFakeAt.seconds||0)))lastFakeAt=ct;
      }
      if((d.rating||0)>=4.5)highRatingCount++;
    });
    var avg=count>0?Math.round((total/count)*10)/10:0;
    var upd={rating:avg,reviewCount:count,fakeCount:fakeCount};
    if(lastFakeAt)upd.lastFakeAt=lastFakeAt;
    if(fakeCount>=10)upd.postSuspended=true;
    else if(fakeCount>=5)upd.postRestrictedAt=lastFakeAt||firebase.firestore.FieldValue.serverTimestamp();
    // 기사 트러스트 포인트 갱신 (완료건수는 별도 관리)
    _db.collection('yongcha_users').doc(userId).get().then(function(us){
      if(!us.exists)return;
      var ud=us.data();
      if(ud.type==='driver'){
        var completed=ud.completedRoutes||0;
        var score=Math.min(100, completed*5 + highRatingCount*10);
        upd.trustScore=score;
      }
      _db.collection('yongcha_users').doc(userId).update(upd).catch(function(){});
    }).catch(function(){
      _db.collection('yongcha_users').doc(userId).update(upd).catch(function(){});
    });
  }).catch(function(){});
}

// ── FCM 알림 ─────────────────────────────────────────────────
function _yInitFCM(){
  if(!firebase.messaging||!firebase.messaging.isSupported||!firebase.messaging.isSupported())return;
  if(typeof Notification==='undefined'||Notification.permission==='denied')return;
  try{
    var msg=firebase.messaging();
    Notification.requestPermission().then(function(perm){
      if(perm!=='granted')return;
      // VAPID 없이 getToken 시도 (SW에서 VAPID 처리)
      msg.getToken().then(function(token){
        if(!token)return;
        _db.collection('yongcha_fcm_tokens').doc(_CU.uid).set({
          token:token,userId:_CU.uid,
          type:_CU.type,region:_CU.region||'',
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function(){});
      }).catch(function(e){console.warn('[FCM] 토큰 오류:',e.code||e.message);});
    });
    msg.onMessage(function(payload){
      var n=(payload||{}).notification||{};
      _yToast('🔔 '+(n.title||'알림')+(n.body?' — '+n.body:''));
      var dot=document.getElementById('notif-dot');
      if(dot)dot.style.display='block';
    });
  }catch(e){console.warn('[FCM] 초기화 실패:',e);}
}

function _yNotify(recipientId,title,body){
  if(!recipientId||!title)return;
  // 알림 컬렉션에 저장 (벨 실시간 업데이트용)
  _db.collection('yongcha_notifications').add({
    userId:recipientId,title:title,body:body||'',
    read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(function(){});
  // FCM push
  _db.collection('yongcha_fcm_tokens').doc(recipientId).get()
    .then(function(snap){
      if(!snap.exists)return;
      var token=snap.data().token;
      if(!token)return;
      return fetch('/api/ctrl-notify',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token,title:title,body:body||''})
      });
    }).catch(function(){});
}

      mapEl.innerHTML='';
      var pos=new kakao.maps.LatLng(lat,lng);

      var listEl=document.getElementById('nearby-post-list');

    if(p)_showPostDetail(p);
  };

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){_initNearbyMap(pos.coords.latitude,pos.coords.longitude);},
      function(){_initNearbyMap(35.1796,129.0756);},
      {timeout:5000}
    );
  } else {
    _initNearbyMap(35.1796,129.0756);
  }
}

// ── 카카오맵 ────────────────────────────────────────────────
var _kakaoKey=null, _map=null, _markers=[], _selectedZones=[];

function _loadKakaoMap(callback){
  // 이미 로드됨
  if(window.kakao&&window.kakao.maps&&window.kakao.maps.Map){
    if(callback)callback();return;
  }
  // 로딩 중 — 대기
  if(window._kakaoReady===false||document.querySelector('script[src*="dapi.kakao.com"]')){
    var t=0;
    var check=setInterval(function(){
      t++;
      if(window.kakao&&window.kakao.maps&&window.kakao.maps.Map){
        clearInterval(check);if(callback)callback();
      }
      if(t>20){clearInterval(check);console.warn('카카오맵 로드 타임아웃');}
    },300);
    return;
  }
  // 직접 로드
  var key=window._kakaoKey||'3d5a58a3e1099aa2b6b221c3db2b0d13';
  _kakaoKey=key;
  _initKakaoScript(callback);
}

function _initKakaoScript(callback){
  if(!_kakaoKey)return;
  var s=document.createElement('script');
  s.src='//dapi.kakao.com/v2/maps/sdk.js?appkey='+_kakaoKey+'&libraries=services&autoload=false';
  s.onload=function(){
    kakao.maps.load(function(){
      if(callback)callback();
    });
  };
  document.head.appendChild(s);
}

  _loadKakaoMap(function(){

// 좌표간 직선거리 (km) — Haversine
function _yHaversine(lat1,lng1,lat2,lng2){
  var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 상차지 주소 주소검색 → 좌표 저장
function _geocodeLoadingAddr(){
  new daum.Postcode({
    oncomplete:function(data){
      var addr=data.roadAddress||data.jibunAddress;
      var inp=document.getElementById('pw-loadingAddr');
      if(inp)inp.value=addr;
      _loadKakaoMap(function(){
        var gc=new kakao.maps.services.Geocoder();
        gc.addressSearch(addr,function(res,status){
          if(status===kakao.maps.services.Status.OK){
            var lat=parseFloat(res[0].y),lng=parseFloat(res[0].x);
            var latInp=document.getElementById('pw-loadingLat');
            var lngInp=document.getElementById('pw-loadingLng');
            if(latInp)latInp.value=lat;
            if(lngInp)lngInp.value=lng;
            // 구역과의 거리 미리보기
            var prev=document.getElementById('loading-dist-preview');
            if(prev&&window._zones&&window._zones.length){
              var dists=window._zones.map(function(z){return _yHaversine(lat,lng,z.lat,z.lng);});
              var avgD=dists.reduce(function(a,b){return a+b;},0)/dists.length;
              prev.textContent='📍 배송구역 중심까지 약 '+avgD.toFixed(1)+'km';
            } else if(prev){
              prev.textContent='✅ 좌표 저장됨 (구역 추가 후 거리 표시)';
            }
          } else {
            _yToast('주소 좌표를 찾을 수 없어요');
          }
        });
      });
    }
  }).open();
}

// Daum 우편번호 팝업 - 다중 구역 추가
window._zones = window._zones || [];
function _openDaumPost(){
  new daum.Postcode({
    oncomplete: function(data){
      var addr = data.roadAddress || data.jibunAddress;
      var zipcode = data.zonecode;
      var sigungu = (data.sido||'') + ' ' + (data.sigungu||'') + ' ' + (data.bname||data.bname1||'');
      _loadKakaoMap(function(){
        var gc = new kakao.maps.services.Geocoder();
        gc.addressSearch(addr, function(res, status){
          if(status === kakao.maps.services.Status.OK){
            var lat = parseFloat(res[0].y), lng = parseFloat(res[0].x);
            // 중복 체크
            var dup = window._zones.some(function(z){return z.zipcode===zipcode;});
            if(dup){_yToast('이미 추가된 우편번호예요');return;}
            window._zones.push({zipcode:zipcode, name:sigungu.trim(), lat:lat, lng:lng});
            _renderZoneTags();
            _updateMapZones();
            // 구역명 자동입력
            var areaInp = document.getElementById('pw-area');
            if(areaInp) areaInp.value = window._zones.map(function(z){return z.zipcode+' '+z.name;}).join(', ');
          } else {
            _yToast('주소 좌표를 찾을 수 없어요');
          }
        });
      });
    }
  }).open();
}
function _renderZoneTags(){
  var el = document.getElementById('zone-tags');
  if(!el) return;
  if(!window._zones||!window._zones.length){el.innerHTML='';return;}
  el.innerHTML = window._zones.map(function(z,i){
    return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--ac);color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700">'
      +'📮 '+z.zipcode
      +' <span style="font-weight:500">'+z.name+'</span>'
      +'<button onclick="event.stopPropagation();_removeZone('+i+')" style="background:none;border:none;cursor:pointer;font-size:16px;padding:0 0 0 4px;color:#000;line-height:1">×</button>'
      +'</span>';
  }).join('');
  // 상차지 좌표 있으면 거리 미리보기 갱신
  var llat=parseFloat((document.getElementById('pw-loadingLat')||{}).value)||null;
  var llng=parseFloat((document.getElementById('pw-loadingLng')||{}).value)||null;
  var prev=document.getElementById('loading-dist-preview');
  if(prev&&llat&&llng&&window._zones.length){
    var dists=window._zones.map(function(z){return _yHaversine(llat,llng,z.lat,z.lng);});
    var avgD=dists.reduce(function(a,b){return a+b;},0)/dists.length;
    prev.textContent='📍 배송구역 중심까지 약 '+avgD.toFixed(1)+'km';
  }
}
function _removeZone(i){
  window._zones.splice(i,1);
  _renderZoneTags();
  _updateMapZones();
}
function _updateMapZones(){
  // 구역 있으면 지도 표시
  var wrap = document.getElementById('post-map-wrap');
  if(wrap){
    wrap.style.display = window._zones.length ? 'block' : 'none';
    if(window._zones.length && !_map){
      _initPostMap();
      setTimeout(_doUpdateMapZones, 800);
      return;
    }
  }
  _doUpdateMapZones();
}
function _doUpdateMapZones(){
  if(!_map) return;
  (_markers||[]).forEach(function(m){m.setMap(null);});
  _markers = [];
  (window._circles||[]).forEach(function(c){c.setMap(null);});
  window._circles = [];
  window._zones.forEach(function(z){
    var pos = new kakao.maps.LatLng(z.lat, z.lng);
    var m = new kakao.maps.Marker({position:pos, map:_map});
    _markers.push(m);
    var c = new kakao.maps.Circle({center:pos,radius:600,strokeWeight:2,strokeColor:'#00d4aa',strokeOpacity:.8,fillColor:'#00d4aa',fillOpacity:.12,map:_map});
    window._circles.push(c);
  });
  if(window._zones.length){
    var last = window._zones[window._zones.length-1];
    _map.setCenter(new kakao.maps.LatLng(last.lat, last.lng));
    _map.setLevel(5);
    _map.relayout();
  }
}
function _showAddrResult(results){
  var el=document.getElementById('addr-result');
  if(!el)return;
  el.style.display='block';
  el.innerHTML=results.map(function(r,i){
    return '<div class="addr-item" onclick="_selectAddr('+i+')">'+
      '<div style="font-weight:700;font-size:13px">'+r.place_name+'</div>'+
      (r.road_address_name?'<div style="font-size:11px;color:var(--t2);margin-top:2px">'+r.road_address_name+'</div>':'')+
      '</div>';
  }).join('');
  window._addrResults=results;
}

function _selectAddr(idx){
  var r=window._addrResults[idx];
  if(!r)return;
  var el=document.getElementById('addr-result');
  if(el)el.style.display='none';

  var lat=parseFloat(r.y), lng=parseFloat(r.x);
  var name=r.place_name;

  // 지도 이동
  if(_map){
    var pos=new kakao.maps.LatLng(lat,lng);
    _map.setCenter(pos);
    _map.setLevel(4);
    // 마커 추가
    var marker=new kakao.maps.Marker({position:pos,map:_map});
    _markers.push(marker);
    // 원형 오버레이 (배송 구역 표시)
    var circle=new kakao.maps.Circle({
      center:pos, radius:500,
      strokeWeight:2,strokeColor:'#00d4aa',strokeOpacity:.8,
      fillColor:'#00d4aa',fillOpacity:.12,
      map:_map
    });
  }

  window._lastLat=lat;
  window._lastLng=lng;
}

// 공고 상세 지도
function _showDetailMap(lat,lng,name){
  _loadKakaoMap(function(){
    var container=document.getElementById('detail-map');
    if(!container)return;
    var pos=new kakao.maps.LatLng(lat,lng);
    window._detailMap=new kakao.maps.Map(container,{center:pos,level:5});
    window._detailMarker=new kakao.maps.Marker({position:pos,map:window._detailMap});
    window._detailCircle=new kakao.maps.Circle({
      center:pos,radius:600,
      strokeWeight:2,strokeColor:'#00d4aa',strokeOpacity:.8,
      fillColor:'#00d4aa',fillOpacity:.12,
      map:window._detailMap
    });
    var iw=new kakao.maps.InfoWindow({
      content:'<div style="padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;color:#000">📍 '+name+'</div>'
    });
    iw.open(window._detailMap,window._detailMarker);
  });
}


function _showZoneOnMap(i){
  var zones = window._detailZones||[];
  var z = zones[i];
  if(!z) return;
  zones.forEach(function(_,j){
    var t = document.getElementById('ztab-'+j);
    if(!t) return;
    t.style.background = j===i ? 'var(--ac)' : 'transparent';
    t.style.color = j===i ? '#000' : 'var(--ac)';
  });
  _loadKakaoMap(function(){
    var pos = new kakao.maps.LatLng(z.lat, z.lng);
    if(window._detailMap){
      window._detailMap.setCenter(pos);
      window._detailMap.setLevel(5);
      if(window._detailMarker) window._detailMarker.setPosition(pos);
      if(window._detailCircle) window._detailCircle.setCenter(pos);
    }
  });
}

// ── 씨드 데이터 등록 (관리자 전용) ──────────────────────────────
function _seedData(){
  if(_CU.type!=='admin'){_yToast('관리자만 가능합니다');return;}
  var ok=confirm('테스트 데이터를 Firestore에 등록합니다. 계속하시겠습니까?');
  if(!ok)return;
  _yToast('데이터 등록 중...');

  var COURIERS=['CJ대한통운','한진택배','롯데택배','우체국','쿠팡로지스틱스'];
  var REGIONS=['부산','대구','서울','경기','인천','광주','대전','울산','경남','경북'];
  var VEHICLE=['1톤','1.4톤','2.5톤','5톤'];
  var AREAS_BY_REGION={
    '부산':['해운대구','남구','동래구','사하구'],
    '대구':['달서구','수성구','북구','중구'],
    '서울':['강남구','송파구','강서구','은평구'],
    '경기':['수원','성남','안양','용인','화성'],
    '인천':['연수구','남동구','부평구'],
    '광주':['북구','광산구'],
    '대전':['유성구','서구'],
    '울산':['남구','북구'],
    '경남':['창원','진주','김해'],
    '경북':['포항','경주','구미']
  };

  var driverNames=['김철수','이민준','박지훈','정우성','최영호','강동원','오승환','류현진','손흥민','황의조'];
  var agencyNames=['부산종합대리점','대구물류센터','서울북부배송','경기동부물류','인천항만대리점'];

  var drivers=driverNames.map(function(n,i){
    var region=REGIONS[i];
    return {
      uid:'seed_driver_'+i,type:'driver',name:n,
      email:'driver'+i+'@test.com',phone:'010-'+String(1000+i*111).padStart(4,'0')+'-'+String(2000+i*333).padStart(4,'0'),
      region:region,carType:VEHICLE[i%4],license:'1종대형',
      rating:Number((4.2+Math.random()*0.6).toFixed(1)),
      reviewCount:Math.floor(15+Math.random()*35),
      status:'active',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
  });

  var agencies=agencyNames.map(function(n,i){
    var region=REGIONS[i];
    return {
      uid:'seed_agency_'+i,type:'agency',name:n,
      email:'agency'+i+'@test.com',phone:'051-'+String(1000+i*111),
      region:region,bizNum:'123-45-'+String(67890+i),
      contactPerson:'담당자'+i,
      rating:Number((4.0+Math.random()*0.8).toFixed(1)),
      reviewCount:Math.floor(8+Math.random()*22),
      isVerified:true,status:'active',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
  });

  var posts=[];
  agencies.forEach(function(ag,ai){
    var region=ag.region;
    var areas=AREAS_BY_REGION[region]||[region];
    for(var pi=0;pi<4;pi++){
      var unitPrice=Math.floor((700+Math.random()*500)/10)*10;
      var volume=Math.floor(50+Math.random()*200);
      posts.push({
        agencyId:ag.uid,agencyName:ag.name,agencyRegion:ag.region,
        agencyRating:ag.rating,agencyReviewCount:ag.reviewCount,isVerified:true,
        courier:COURIERS[(ai+pi)%5],region:region,
        area:areas[pi%areas.length]+' 노선',
        unitPrice:unitPrice,volume:volume,
        workShift:pi%2===0?'주간':'야간',
        vehicleType:VEHICLE[pi%4],
        startDate:'2026-08-'+(String(10+pi*3).padStart(2,'0')),
        status:pi===0?'matched':'open',
        urgent:pi===1,premium:pi===0,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  });

  var now=new Date();
  var records=[];
  drivers.forEach(function(dr,di){
    for(var day=1;day<=25;day++){
      var dateStr='2026-07-'+(String(day).padStart(2,'0'));
      var isWorked=Math.random()>0.25;
      if(!isWorked)continue;
      var cnt=Math.floor(3+Math.random()*6);
      var unitP=Math.floor((150000+Math.random()*100000)/1000)*1000;
      records.push({
        driverId:dr.uid,driverName:dr.name,
        date:dateStr,count:cnt,unitPrice:unitP,
        amount:cnt*unitP,isEmpty:cnt===0,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  });

  var batch=_db.batch();
  drivers.forEach(function(d){batch.set(_db.collection('yongcha_users').doc(d.uid),d);});
  agencies.forEach(function(a){batch.set(_db.collection('yongcha_users').doc(a.uid),a);});
  batch.commit().then(function(){
    var batch2=_db.batch();
    posts.forEach(function(p,i){batch2.set(_db.collection('yongcha_posts').doc('seed_post_'+i),p);});
    return batch2.commit();
  }).then(function(){
    var batch3=_db.batch();
    records.forEach(function(r,i){batch3.set(_db.collection('yongcha_daily_records').doc('seed_rec_'+i),r);});
    return batch3.commit();
  }).then(function(){
    _yToast('✅ 테스트 데이터 '+drivers.length+'명 기사, '+agencies.length+'개 대리점, '+posts.length+'개 공고, '+records.length+'개 운행기록 등록 완료!');
  }).catch(function(e){_yToast('오류: '+e.message);});
}
