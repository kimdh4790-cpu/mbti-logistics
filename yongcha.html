/* ══════════════════════════════════════════════════════════
   과로 방지 (12시간 규정)
   ──────────────────────────────────────────────────────────
   yongcha_daily_records 의 당일 근무시간을 합산해
   · 10h 이상 → 주의 배너
   · 12h 초과 → 경고 + 신규 지원(배차) 차단
   근로기준·화물 안전운임 취지에 맞춘 안전장치. 승인된 배차는 건드리지 않는다.
   ══════════════════════════════════════════════════════════ */
var FATIGUE_WARN_H=10, FATIGUE_BLOCK_H=12;
var _fatigue={hours:0,loaded:false,blocked:false};

/* 오늘 누적 운행시간(시간 단위). 기록이 없으면 0 */
function _yLoadFatigue(){
  if(!_CU||_CU.type!=='driver'){_fatigue={hours:0,loaded:true,blocked:false};return Promise.resolve(_fatigue);}
  return _db.collection('yongcha_daily_records')
    .where('driverId','==',_CU.uid).where('date','==',_yToday()).limit(20).get()
    .then(function(snap){
      var h=0;
      snap.forEach(function(d){
        var r=d.data();
        if(typeof r.workHours==='number')h+=r.workHours;
        else if(r.startTime&&r.endTime)h+=_yHourDiff(r.startTime,r.endTime);
      });
      _fatigue={hours:Math.round(h*10)/10,loaded:true,blocked:h>FATIGUE_BLOCK_H};
      return _fatigue;
    }).catch(function(){
      _fatigue={hours:0,loaded:true,blocked:false};   // 조회 실패로 배차를 막지는 않는다
      return _fatigue;
    });
}
function _yHourDiff(a,b){
  var pa=String(a).split(':'),pb=String(b).split(':');
  if(pa.length<2||pb.length<2)return 0;
  var m=(+pb[0]*60+ +pb[1])-(+pa[0]*60+ +pa[1]);
  if(m<0)m+=1440;                       // 야간 조 (자정 넘김)
  return m/60;
}

function _yRenderFatigue(el){
  if(!el)return;
  el.innerHTML='';
  if(!_CU||_CU.type!=='driver')return;
  _yLoadFatigue().then(function(f){
    if(!el)return;
    if(f.hours<=0)return;
    var pct=Math.min(100,Math.round(f.hours/FATIGUE_BLOCK_H*100));
    var lvl=f.hours>FATIGUE_BLOCK_H?'block':f.hours>=FATIGUE_WARN_H?'warn':'ok';
    var col=lvl==='block'?'var(--rd)':lvl==='warn'?'var(--br)':'var(--gn)';
    var bgc=lvl==='block'?'var(--rdl)':lvl==='warn'?'var(--brl)':'var(--gnl)';
    var bdc=lvl==='block'?'var(--rdln)':lvl==='warn'?'var(--brln)':'var(--gnln)';
    var ico=lvl==='block'?'차단':lvl==='warn'?'주의':'정상';
    var msg=lvl==='block'?'12시간 초과 — 오늘은 추가 배차가 제한됩니다'
           :lvl==='warn'?'10시간 초과 — 무리한 추가 운행은 피해주세요'
           :'안전 운행 중입니다';
    el.innerHTML=
      '<div class="card" style="margin-bottom:14px;background:'+bgc+';border-color:'+bdc+'">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
          '<span style="font-size:22px">'+ico+'</span>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:14px;font-weight:900;color:'+col+'">오늘 누적 운행 '+f.hours+'시간</div>'+
            '<div style="font-size:11.5px;color:var(--t2);margin-top:2px">'+msg+'</div>'+
          '</div>'+
        '</div>'+
        '<div style="height:8px;border-radius:99px;background:var(--bg3);overflow:hidden">'+
          '<div style="height:100%;width:'+pct+'%;border-radius:99px;background:'+col+';transition:width .6s var(--ease)"></div>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);font-weight:700;margin-top:6px">'+
          '<span>0h</span><span>권고 '+FATIGUE_WARN_H+'h</span><span>한도 '+FATIGUE_BLOCK_H+'h</span></div>'+
      '</div>';
  });
}

/* ══════════════════════════════════════════════════════════
   기사 월 대시보드 — 운행건수 / 수입 / 평균단가
   ══════════════════════════════════════════════════════════ */
function _pgDashboard(el){
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('on');});
  if(_CU.type==='agency') return _pgDashboardAgency(el);
  el.innerHTML=
    '<div class="page-hdr"><h1 class="page-title">월 대시보드</h1>'+
    '<p class="page-sub">최근 6개월 운행 실적을 한눈에</p></div>'+
    '<div id="dash-body">'+_skRows(4)+'</div>';

  var since=new Date();since.setMonth(since.getMonth()-5);since.setDate(1);
  var sinceStr=since.toISOString().slice(0,10);

  _db.collection('yongcha_daily_records')
    .where('driverId','==',_CU.uid).where('date','>=',sinceStr).limit(600).get()
  .then(function(snap){
    var body=document.getElementById('dash-body');if(!body)return;
    var months={},order=[];
    for(var i=5;i>=0;i--){
      var d=new Date();d.setMonth(d.getMonth()-i);
      var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
      months[k]={cnt:0,amt:0,days:0};order.push(k);
    }
    snap.forEach(function(doc){
      var r=doc.data(),k=String(r.date||'').slice(0,7);
      if(!months[k])return;
      months[k].cnt+=Number(r.count||0);
      months[k].amt+=Number(r.amount||(Number(r.count||0)*Number(r.unitPrice||0)));
      months[k].days++;
    });
    var cur=months[order[order.length-1]];
    var prev=months[order[order.length-2]]||{cnt:0,amt:0};
    var maxAmt=Math.max.apply(null,order.map(function(k){return months[k].amt;}).concat([1]));
    var totalCnt=order.reduce(function(a,k){return a+months[k].cnt;},0);
    var totalAmt=order.reduce(function(a,k){return a+months[k].amt;},0);
    var avgUnit=totalCnt?Math.round(totalAmt/totalCnt):0;
    var deltaAmt=cur.amt-prev.amt;

    if(!totalCnt){
      body.innerHTML=_emptyHtml('','아직 운행 기록이 없어요','내 노선에서 일일 건수를 입력하면 집계됩니다');
      return;
    }

    body.innerHTML=
      // 이번 달 요약
      '<div class="kpi-grid col2">'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--ac)">'+_won(cur.cnt)+'</div>'+
          '<div class="kpi-lbl">이번 달 운행건수</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--br)">'+_won(Math.round(cur.amt/10000))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">이번 달 수입</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:var(--gn)">'+_won(cur.cnt?Math.round(cur.amt/cur.cnt):0)+'<span style="font-size:13px">원</span></div>'+
          '<div class="kpi-lbl">평균 단가</div></div>'+
        '<div class="kpi-card"><div class="kpi-val" style="color:'+(deltaAmt>=0?'var(--gn)':'var(--rd)')+'">'+
          (deltaAmt>=0?'▲':'▼')+' '+_won(Math.abs(Math.round(deltaAmt/10000)))+'<span style="font-size:13px">만</span></div>'+
          '<div class="kpi-lbl">전월 대비</div></div>'+
      '</div>'+

      // 월별 수입 막대그래프
      '<div class="card" style="margin-top:6px">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:4px">💰 월별 수입 추이</div>'+
        '<div style="font-size:11.5px;color:var(--t3);margin-bottom:16px">최근 6개월 · 단위 만원</div>'+
        '<div class="bars">'+
          order.map(function(k){
            var m=months[k],h=Math.max(3,Math.round(m.amt/maxAmt*100));
            var isCur=(k===order[order.length-1]);
            return '<div class="bar-col">'+
              '<div class="bar-val">'+(m.amt?_won(Math.round(m.amt/10000)):'')+'</div>'+
              '<div class="bar-track"><div class="bar-fill'+(isCur?' cur':'')+'" style="height:'+h+'%"></div></div>'+
              '<div class="bar-lbl">'+k.slice(5)+'월</div></div>';
          }).join('')+
        '</div>'+
      '</div>'+

      // 월별 상세
      '<div class="card">'+
        '<div style="font-size:15px;font-weight:900;margin-bottom:14px">📅 월별 상세</div>'+
        order.slice().reverse().map(function(k){
          var m=months[k];
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)">'+
            '<div style="font-size:13.5px;font-weight:800;min-width:62px">'+k.slice(5)+'월</div>'+
            '<div style="flex:1;font-size:12px;color:var(--t2)">'+_won(m.cnt)+'건 · '+m.days+'일 근무</div>'+
            '<div style="font-size:14px;font-weight:900;color:var(--br);font-variant-numeric:tabular-nums">'+_won(Math.round(m.amt/10000))+'만</div>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0 2px">'+
          '<div style="font-size:13.5px;font-weight:900">6개월 합계</div>'+
          '<div style="font-size:12px;color:var(--t2)">평균단가 '+_won(avgUnit)+'원</div>'+
          '<div style="font-size:16px;font-weight:900;color:var(--ac)">'+_won(Math.round(totalAmt/10000))+'만</div>'+
        '</div>'+
      '</div>';
  }).catch(function(e){
    var body=document.getElementById('dash-body');
    if(body)body.innerHTML=_errHtml(e);
  });

  // 세금계산서 역발행 대기 배너 (기사 전용)
  _db.collection('yongcha_settlements').where('driverId','==',_CU.uid)
    .where('taxInvoiceState','==','명세서발송').limit(5).get()
  .then(function(snap){
    if(snap.empty)return;
    var items=[];
    snap.forEach(function(doc){
      var s=doc.data();
      items.push('<button type="button" onclick="_pgTaxApprove(document.getElementById(\'content\'),\''+doc.id+'\')" '+
        'style="width:100%;min-height:var(--tap);margin-bottom:8px;background:rgba(79,120,245,.08);border:1.5px solid rgba(79,120,245,.3);border-radius:var(--r);'+
        'color:var(--ac);font-size:13.5px;font-weight:800;cursor:pointer;text-align:left;padding:10px 14px">'+
        _esc(s.agencyName||'소장')+'에서 정산명세서 도착 — '+_won(Number(s.totalAmount||0))+'원 &rarr; 세금계산서 승인</button>');
    });
    var banner=document.createElement('div');
    banner.style.cssText='padding:0 0 4px';
    banner.innerHTML=items.join('');
    var db=document.getElementById('dash-body');
    if(db)db.insertAdjacentElement('beforebegin',banner);
  }).catch(function(){});
}

/* ══════════════════════════════════════════════════════════
   휴식 원장 (yongcha_rest)
   ──────────────────────────────────────────────────────────
   기사가 휴식을 신청 → 대리점/관리자가 승인 → 휴식 기간 동안 지원 차단
   → 종료일이 지나면 자동 복귀 + 본인/승인처에 알림.
   yongcha_users 의 resting / restUntil 을 미러링해서 지원 차단과
   AI 배차 추천이 매번 원장을 조회하지 않아도 되게 한다.
   ══════════════════════════════════════════════════════════ */
var REST_REASONS=['개인 사정','건강·치료','차량 정비','가족 행사','휴가','기타'];

function _yToday(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function _yPlusDays(n){
  var d=new Date();d.setDate(d.getDate()+n);
  var p=function(x){return (x<10?'0':'')+x;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function _yDaysBetween(a,b){
  var ms=new Date(b+'T00:00:00')-new Date(a+'T00:00:00');
  return Math.round(ms/86400000);
}
/* 지금 휴식 중인가 — 승인 상태 + 종료일이 오늘 이후 */
function _yIsResting(u){
  var t=u||_CU;
  if(!t||!t.resting)return false;
  if(!t.restUntil)return true;
  return t.restUntil>=_yToday();
}

/* 앱 진입 시 1회 — 만료된 휴식 자동 종료 + 복귀 알림 */
function _yRestSync(){
  if(!_CU||_CU.type!=='driver')return Promise.resolve();
  if(!_CU.resting)return Promise.resolve();
  if(_CU.restUntil&&_CU.restUntil>=_yToday())return Promise.resolve();  // 아직 휴식 중
  // 종료일 경과 → 자동 복귀
  return _yDoEndRest(_CU.restId||'',true);
}

function _yDoEndRest(restId,auto){
  var upd=_db.collection('yongcha_users').doc(_CU.uid).update({
    resting:false,restUntil:'',restId:''
  });
  var closeDoc=restId
    ? _db.collection('yongcha_rest').doc(restId).update({
        status:'ended',endedAt:firebase.firestore.FieldValue.serverTimestamp(),
        endedBy:auto?'auto':'driver'
      }).catch(function(){})
    : Promise.resolve();
  return Promise.all([upd,closeDoc]).then(function(){
    _CU.resting=false;_CU.restUntil='';_CU.restId='';
    _yNotify(_CU.uid,'🔆 복귀 처리되었습니다',
      (auto?'휴식 기간이 끝나 자동으로 복귀 처리했어요. ':'')+'이제 공고에 지원할 수 있어요','rest');
    // 승인해 준 대리점에도 복귀 통보
    if(restId){
      _db.collection('yongcha_rest').doc(restId).get().then(function(s){
        var r=s.exists?s.data():null;
        if(r&&r.judgedBy&&r.judgedBy!==_CU.uid){
          _yNotify(r.judgedBy,'🔆 기사 복귀',_CU.name+'님이 휴식을 마치고 복귀했어요','rest');
        }
      }).catch(function(){});
    }
  }).catch(function(e){console.warn('[휴식] 복귀 처리 실패',e.message);});
}

function _yRestSwitch(t){_restTab=t;_yRestManagerPage(document.getElementById('content'));}

function _yRestLoadManager(){
  _db.collection('yongcha_rest').limit(200).get().then(function(snap){
    var list=document.getElementById('rest-list');if(!list)return;
    var today=_yToday();
    var docs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(_restTab==='pending')docs=docs.filter(function(r){return r.status==='pending';});
    else if(_restTab==='approved')docs=docs.filter(function(r){return r.status==='approved'&&(!r.endDate||r.endDate>=today);});
    docs.sort(function(a,b){return String(b.startDate||'').localeCompare(String(a.startDate||''));});
    if(!docs.length){
      list.innerHTML=_emptyHtml('📭',
        _restTab==='pending'?'대기 중인 신청이 없어요':_restTab==='approved'?'휴식 중인 기사가 없어요':'휴식 이력이 없어요','');
      return;
    }
    list.innerHTML=docs.map(function(r){return _yRestCard(r,true);}).join('');
  }).catch(function(e){
    var list=document.getElementById('rest-list');if(list)list.innerHTML=_errHtml(e);
  });
}

function _ySubmitRest(){
  var s=(document.getElementById('rest-start')||{}).value||'';
  var e=(document.getElementById('rest-end')||{}).value||'';
  var reason=(document.getElementById('rest-reason')||{}).value||'';
  var memo=((document.getElementById('rest-memo')||{}).value||'').trim();
  var err=document.getElementById('rest-err');
  var show=function(m){if(err){err.textContent=m;err.style.display='block';}};
  if(!s||!e)return show('시작일과 복귀 예정일을 모두 입력해주세요');
  if(e<s)return show('복귀 예정일이 시작일보다 빠를 수 없어요');
  if(_yDaysBetween(s,e)>180)return show('휴식은 최대 180일까지 신청할 수 있어요');

  var btn=document.getElementById('rest-submit-btn');
  if(btn){btn.textContent='제출 중...';btn.disabled=true;}

  // 이미 처리 대기/진행 중인 신청이 있으면 중복 방지
  _db.collection('yongcha_rest').where('driverId','==',_CU.uid).limit(50).get()
  .then(function(snap){
    var dup=snap.docs.some(function(d){
      var r=d.data();
      return (r.status==='pending')||(r.status==='approved'&&(!r.endDate||r.endDate>=_yToday()));
    });
    if(dup){throw new Error('__DUP__');}
    return _db.collection('yongcha_rest').add({
      driverId:_CU.uid,driverName:_CU.name,
      driverPhone:_CU.phone||'',driverRegion:_CU.region||'',
      startDate:s,endDate:e,reason:reason,memo:memo,
      status:'pending',
      requestedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  })
  .then(function(){
    _closeModal();
    _yToast(' 휴식 신청을 제출했어요. 승인을 기다려주세요');
    _pgRest(document.getElementById('content'));
  })
  .catch(function(ex){
    if(btn){btn.textContent='신청서 제출';btn.disabled=false;}
    show(ex.message==='__DUP__'?'이미 진행 중인 휴식 신청이 있어요':'오류: '+ex.message);
  });
}

function _yJudgeRest(restId,status,driverName,driverId){
  var memo='';
  if(status==='rejected'){
    memo=prompt('반려 사유를 입력해주세요 (기사에게 전달됩니다)','')||'';
    if(!memo.trim())return;
  }
  _db.collection('yongcha_rest').doc(restId).get().then(function(snap){
    if(!snap.exists)throw new Error('신청서를 찾을 수 없어요');
    var r=snap.data();
    return _db.collection('yongcha_rest').doc(restId).update({
      status:status,rejectMemo:memo,
      judgedAt:firebase.firestore.FieldValue.serverTimestamp(),
      judgedBy:_CU.uid,judgedByName:_CU.name
    }).then(function(){
      if(status!=='approved')return;
      // 기사 프로필 미러링 — 지원 차단·AI 추천이 이 값을 본다
      return _db.collection('yongcha_users').doc(driverId).update({
        resting:true,restUntil:r.endDate||'',restId:restId
      });
    }).then(function(){return r;});
  }).then(function(r){
    _yToast(status==='approved'?''+driverName+'님 휴식을 승인했어요':'반려 처리했어요');
    _yNotify(driverId,
      status==='approved'?'휴식 승인':'휴식 반려',
      status==='approved'
        ? (r.startDate||'')+' ~ '+(r.endDate||'')+' 휴식이 승인되었어요. 기간 중에는 지원이 잠깁니다'
        : '휴식 신청이 반려되었어요'+(memo?' — '+memo:''),'rest');
    _yRestLoadManager();
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _riqSwitch(tab){
  _riqTab=tab;
  var tabs_order=['heatmap','record','match'];
  document.querySelectorAll('#riq-tabs .sub-tab').forEach(function(b,i){
    b.classList.toggle('on',tabs_order[i]===tab);
  });

// ── 1. 시세 히트맵 ───────────────────────────────────────────────
function _riqHeatmap(el){
  el.innerHTML='<div class="card" style="text-align:center;padding:28px">'+
    '<div class="spinner"></div>'+
    '<p style="color:var(--t2);font-size:13px;margin-top:12px">지역별 시세 분석 중...</p></div>';
  _db.collection('yongcha_posts')
    .where('status','in',['open','matched','closed'])
    .orderBy('createdAt','desc').limit(300).get()
  .then(function(snap){
    var regionMap={};
    var courierMap={};
    snap.forEach(function(d){
      var p=d.data();
      var r=p.region||'기타';
      var price=Number(p.price||0);
      var c=p.courier||p.courierBrand||'기타';
      courierMap[c]=(courierMap[c]||0)+1;
      if(!price)return;
      if(!regionMap[r])regionMap[r]={sum:0,cnt:0};
      regionMap[r].sum+=price;
      regionMap[r].cnt++;
    });
    var regions=Object.keys(regionMap).map(function(r){
      var d=regionMap[r];
      var avg=Math.round(d.sum/d.cnt);
      return {region:r,avg:avg,cnt:d.cnt,guarantee:Math.round(avg*0.85)};
    }).sort(function(a,b){return b.avg-a.avg;});

    if(!regions.length){
      el.innerHTML=_emptyHtml('📊','시세 데이터 없음','공고가 등록되면 자동으로 분석해요');return;
    }
    var maxAvg=regions[0].avg;
    var html='<div class="card" style="margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<div style="font-size:14px;font-weight:800">지역별 평균 단가</div>'+
      '<div style="font-size:11px;color:var(--t2)">최근 300건 기준</div></div>';
    regions.forEach(function(r){
      var pct=maxAvg>0?Math.round(r.avg/maxAvg*100):0;
      var col=pct>=85?'var(--gn)':pct>=65?'var(--br)':'var(--ac)';
      html+='<div class="heatmap-row">'+
        '<div style="width:54px;font-size:12.5px;font-weight:800;color:var(--tx);flex-shrink:0">'+_esc(r.region)+'</div>'+
        '<div style="flex:1;padding:0 8px"><div class="heatmap-bar" style="width:'+pct+'%;background:'+col+'"></div></div>'+
        '<div style="width:90px;text-align:right;flex-shrink:0">'+
        '<div style="font-size:13px;font-weight:800;color:var(--br);font-variant-numeric:tabular-nums">'+_riqFmtP(r.avg)+'</div>'+
        '<div style="font-size:10px;color:var(--t3)">'+r.cnt+'건</div></div></div>';
    });
    html+='</div>';

    // 최소보장 기준표
    html+='<div class="card" style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:12px">'+
      '<div style="font-size:14px;font-weight:800">최소보장 기준</div>'+
      '<span style="font-size:10.5px;color:var(--t2);background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:2px 7px">시세 × 85%</span></div>';
    regions.slice(0,10).forEach(function(r){
      html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)">'+
        '<div style="font-size:13px;font-weight:700">'+_esc(r.region)+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<span style="font-size:12px;color:var(--gn);font-weight:800">'+_riqFmtP(r.guarantee)+' 이상</span>'+
        '<span style="font-size:11px;color:var(--t3)">(평균 '+_riqFmtP(r.avg)+')</span>'+
        '</div></div>';
    });
    html+='</div>';

    // 택배사별 공고 비중
    var clist=Object.keys(courierMap).sort(function(a,b){return courierMap[b]-courierMap[a];}).slice(0,6);
    var total=snap.size||1;
    if(clist.length){
      html+='<div class="card">'+
        '<div style="font-size:14px;font-weight:800;margin-bottom:12px">택배사별 공고 비중</div>';
      clist.forEach(function(c){
        var pct=Math.round(courierMap[c]/total*100);
        html+='<div class="heatmap-row">'+
          '<div style="width:100px;font-size:12.5px;font-weight:700;color:var(--t2);flex-shrink:0">'+_esc(c)+'</div>'+
          '<div style="flex:1;padding:0 8px"><div class="heatmap-bar" style="width:'+pct+'%;background:var(--pu)"></div></div>'+
          '<div style="width:40px;text-align:right;font-size:12.5px;font-weight:800;color:var(--tx)">'+pct+'%</div></div>';
      });
      html+='</div>';
    }
    el.innerHTML=html;
  }).catch(function(e){
    el.innerHTML='<div class="card" style="color:var(--rd);text-align:center;padding:24px">로드 실패: '+_esc(e.message)+'</div>';
  });
}

function _riqFmtP(n){
  if(!n)return '—';
  if(n>=10000)return Math.round(n/1000)+'k원';
  return n.toLocaleString()+'원';
}

// ── 3. AI 매칭 ──────────────────────────────────────────────────
function _riqMatch(el){
  el.innerHTML='<div class="riq-score-card" style="margin-bottom:14px">'+
    '<div class="riq-badge" style="margin-bottom:8px;display:inline-flex">AI MATCH</div>'+
    '<div style="font-size:16px;font-weight:800;margin-bottom:3px">맞춤 공고 추천</div>'+
    '<div style="font-size:12px;color:var(--t2)">실적·선호구역·택배사 분석 중</div></div>'+
    '<div id="riq-match-body">'+_skRows(4)+'</div>';

  var recentRegions=[],avgPrice=0,preferredCouriers=[];
  _db.collection('yongcha_records').where('driverId','==',_CU.uid)
    .orderBy('createdAt','desc').limit(20).get()
  .then(function(recSnap){
    var priceSum=0,cnt=0,courierMap={};
    recSnap.forEach(function(d){
      var r=d.data();
      if(r.driverRegion&&recentRegions.indexOf(r.driverRegion)<0)recentRegions.push(r.driverRegion);
      if(r.price){priceSum+=r.price;cnt++;}
      if(r.courier)courierMap[r.courier]=(courierMap[r.courier]||0)+1;
    });
    avgPrice=cnt>0?Math.round(priceSum/cnt):0;
    preferredCouriers=Object.keys(courierMap).sort(function(a,b){return courierMap[b]-courierMap[a];}).slice(0,3);
    return _db.collection('yongcha_posts').where('status','in',['open','urgent'])
      .orderBy('createdAt','desc').limit(30).get();
  }).then(function(postsSnap){
    var posts=[];
    postsSnap.forEach(function(d){posts.push(Object.assign({id:d.id},d.data()));});
    var mb=document.getElementById('riq-match-body');
    if(!posts.length){
      if(mb)mb.innerHTML=_emptyHtml('📭','공개 공고 없음','새 공고가 등록되면 AI 추천이 시작됩니다');
      return;
    }
    return fetch('/api/routeiq-match',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        driver:{name:_CU.name,region:_CU.region||'',carType:_CU.carType||'',
                preferredCouriers:preferredCouriers,avgPrice:avgPrice,recentRegions:recentRegions},
        posts:posts
      })
    }).then(function(r){return r.json();}).then(function(res){
      var matches=res.matches||[];
      var matchMap={};
      matches.forEach(function(m){if(m&&m.id)matchMap[m.id]={score:m.score||0,reason:m.reason||''};});
      var ranked=posts.filter(function(p){return matchMap[p.id];})
        .sort(function(a,b){return (matchMap[b.id].score||0)-(matchMap[a.id].score||0);});
      if(!ranked.length){

   AI 기사 배차 추천 (/api/yongcha/recommend)

function _yAiRecommend(postId){
  var mb=document.getElementById('modal-body');
  mb.innerHTML='<div style="font-size:20px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px">🤖 AI 기사 추천</div>'+

  _openModal();

  var post=(_allPosts||[]).filter(function(p){return p.id===postId;})[0];
  var getPost=post?Promise.resolve(post)
    :_db.collection('yongcha_posts').doc(postId).get().then(function(s){
        return s.exists?Object.assign({id:s.id},s.data()):{};});

  var getDrivers=_db.collection('yongcha_users').where('type','==','driver').limit(120).get()
    .then(function(snap){
      var today=_yToday(), out=[];
      snap.forEach(function(d){
        var u=d.data();
        if(u.suspended)return;
        var days=null;
        var ts=u.updatedAt||u.createdAt;
        if(ts&&ts.seconds)days=Math.floor((Date.now()/1000-ts.seconds)/86400);
        out.push({
          driverId:d.id,name:u.name||'이름없음',
          region:u.region||'',carType:_yCarNorm(u.carType||(u.preferences&&u.preferences.carType)||''),
          lat:(typeof u.lat==='number')?u.lat:null, lng:(typeof u.lng==='number')?u.lng:null,
          rating:Number(u.rating||0),reviewCount:Number(u.reviewCount||0),
          completedRoutes:Number(u.completedRoutes||0),
          trustScore:Number(u.trustScore||0),
          resting:!!(u.resting&&(!u.restUntil||u.restUntil>=today)),
          daysSinceActive:days
        });
      });
      return out;
    });

  Promise.all([getPost,getDrivers]).then(function(res){
    var p=res[0]||{}, drivers=res[1]||[];
    if(!drivers.length){
      document.getElementById('modal-body').innerHTML=
        '<div style="font-size:20px;font-weight:900;margin-bottom:16px">🤖 AI 기사 추천</div>'+
        _emptyHtml('🚗','등록된 기사가 없어요','기사 회원이 가입하면 추천이 시작돼요');
      return;
    }
    return fetch('/api/yongcha/recommend',{

      body:JSON.stringify({
        topN:5,
        post:{
          title:((p.region||'')+' '+(p.area||'')).trim(),region:p.region||'',zones:p.zones||[],
          loadingAddr:p.loadingAddr||'',

          carType:_yCarNorm(p.vehicleType||p.carType||''),courier:p.courier||'',

          startDate:p.startDate||'',workDays:p.workDays||'',
          urgent:!!p.urgent,note:p.desc||''
        },
        drivers:drivers
      })
    }).then(function(r){return r.json();}).then(function(data){
      _yAiRenderPicks(data,p,postId);

  }).catch(function(e){

// ── 카카오맵 ────────────────────────────────────────────────
var _kakaoKey=null, _map=null, _markers=[], _selectedZones=[];

function _loadKakaoMap(callback){
  // 이미 로드됨
  if(window.kakao&&window.kakao.maps&&window.kakao.maps.Map){
    if(callback)callback();return;
  }
  // 로딩 중 — 대기
  if(window._kakaoReady===false||document.querySelector('script[src*="dapi.kakao.com"]')){
    var t=0;
    var check=setInterval(function(){
      t++;
      if(window.kakao&&window.kakao.maps&&window.kakao.maps.Map){
        clearInterval(check);if(callback)callback();
      }
      if(t>20){clearInterval(check);console.warn('카카오맵 로드 타임아웃');}
    },300);
    return;
  }
  // 직접 로드
  var key=window._kakaoKey||'3d5a58a3e1099aa2b6b221c3db2b0d13';
  _kakaoKey=key;
  _initKakaoScript(callback);
}

function _initKakaoScript(callback){
  if(!_kakaoKey)return;
  var s=document.createElement('script');
  s.src='//dapi.kakao.com/v2/maps/sdk.js?appkey='+_kakaoKey+'&libraries=services&autoload=false';
  s.onload=function(){
    kakao.maps.load(function(){
      if(callback)callback();
    });
  };
  document.head.appendChild(s);
}

// 공고 등록 지도 초기화
function _initPostMap(){
  var wrap=document.getElementById('post-map-wrap');
  if(wrap&&wrap.style.display==='none') return; // 구역 추가 전엔 초기화 안 함
  var container=document.getElementById('post-map');
  if(!container){ return; }
  _loadKakaoMap(function(){
    container=document.getElementById('post-map');
    if(!container)return;
    container.style.width='100%';
    container.style.height='240px';
    container.style.display='block';
    try {
      var opts={center:new kakao.maps.LatLng(35.1796,129.0756),level:5};
      _map=new kakao.maps.Map(container,opts);
      _map.setDraggable(true);
      _map.setZoomable(true);
      _map.relayout();
      // 지도 클릭 → 구역 자동 추가
      kakao.maps.event.addListener(_map,'click',function(mouseEvent){
        var latlng=mouseEvent.latLng;

        var gc=new kakao.maps.services.Geocoder();
        gc.coord2RegionCode(lng,lat,function(res,status){
          var name=status===kakao.maps.services.Status.OK?
            ((res[0].region_2depth_name||'')+(res[0].region_3depth_name?' '+res[0].region_3depth_name:'')).trim():'선택구역';
          var zipcode='MAP'+String(Math.abs(Math.round(lat*100)+Math.round(lng*100)));
          var dup=window._zones.some(function(z){return z.zipcode===zipcode;});
          if(!dup){
            window._zones.push({zipcode:zipcode,name:name||'선택구역',lat:lat,lng:lng});
            _renderZoneTags();
            _doUpdateMapZones();
            _yToast((name||'선택구역')+' 구역이 추가됐어요');
          } else {
            _yToast('이미 추가된 구역이에요');
          }
        });
      });
    } catch(e){ console.error('카카오맵 오류:',e); }
  });
}

// 좌표간 직선거리 (km) — Haversine
function _yHaversine(lat1,lng1,lat2,lng2){
  var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 상차지 주소 주소검색 → 좌표 저장
function _geocodeLoadingAddr(){
  new daum.Postcode({
    oncomplete:function(data){
      var addr=data.roadAddress||data.jibunAddress;
      var inp=document.getElementById('pw-loadingAddr');
      if(inp)inp.value=addr;
      _loadKakaoMap(function(){
        var gc=new kakao.maps.services.Geocoder();
        gc.addressSearch(addr,function(res,status){
          if(status===kakao.maps.services.Status.OK){
            var lat=parseFloat(res[0].y),lng=parseFloat(res[0].x);
            var latInp=document.getElementById('pw-loadingLat');
            var lngInp=document.getElementById('pw-loadingLng');
            if(latInp)latInp.value=lat;
            if(lngInp)lngInp.value=lng;
            // 구역과의 거리 미리보기
            var prev=document.getElementById('loading-dist-preview');
            if(prev&&window._zones&&window._zones.length){
              var dists=window._zones.map(function(z){return _yHaversine(lat,lng,z.lat,z.lng);});
              var avgD=dists.reduce(function(a,b){return a+b;},0)/dists.length;
              prev.textContent='📍 배송구역 중심까지 약 '+avgD.toFixed(1)+'km';
            } else if(prev){
              prev.textContent='좌표 저장됨 (구역 추가 후 거리 표시)';
            }
          } else {
            _yToast('주소 좌표를 찾을 수 없어요');
          }
        });
      });
    }
  }).open();
}

window._zones = window._zones || [];
function _openDaumPost(){

            // 중복 체크
            var dup = window._zones.some(function(z){return z.zipcode===zipcode;});
            if(dup){_yToast('이미 추가된 우편번호예요');return;}
            window._zones.push({zipcode:zipcode, name:sigungu.trim(), lat:lat, lng:lng});
            _renderZoneTags();
            _updateMapZones();
            // 구역명 자동입력
            var areaInp = document.getElementById('pw-area');
            if(areaInp) areaInp.value = window._zones.map(function(z){return z.zipcode+' '+z.name;}).join(', ');
          } else {
            _yToast('주소 좌표를 찾을 수 없어요');
          }
        });
      });
    }
  }).open();
}
function _renderZoneTags(){
  var el = document.getElementById('zone-tags');
  if(!el) return;
  if(!window._zones||!window._zones.length){el.innerHTML='';return;}
  el.innerHTML = window._zones.map(function(z,i){
    return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--ac);color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700">'
      +' '+z.zipcode
      +' <span style="font-weight:500">'+z.name+'</span>'
      +'<button onclick="event.stopPropagation();_removeZone('+i+')" style="background:none;border:none;cursor:pointer;font-size:16px;padding:0 0 0 4px;color:#000;line-height:1">×</button>'
      +'</span>';
  }).join('');
  // 상차지 좌표 있으면 거리 미리보기 갱신
  var llat=parseFloat((document.getElementById('pw-loadingLat')||{}).value)||null;
  var llng=parseFloat((document.getElementById('pw-loadingLng')||{}).value)||null;
  var prev=document.getElementById('loading-dist-preview');
  if(prev&&llat&&llng&&window._zones.length){
    var dists=window._zones.map(function(z){return _yHaversine(llat,llng,z.lat,z.lng);});
    var avgD=dists.reduce(function(a,b){return a+b;},0)/dists.length;
    prev.textContent='📍 배송구역 중심까지 약 '+avgD.toFixed(1)+'km';
  }
}
function _removeZone(i){
  window._zones.splice(i,1);
  _renderZoneTags();
  _updateMapZones();
}
function _updateMapZones(){
  // 구역 있으면 지도 표시
  var wrap = document.getElementById('post-map-wrap');
  if(wrap){
    wrap.style.display = window._zones.length ? 'block' : 'none';
    if(window._zones.length && !_map){
      _initPostMap();
      setTimeout(_doUpdateMapZones, 800);
      return;
    }
  }
  _doUpdateMapZones();
}
function _doUpdateMapZones(){
  if(!_map) return;
  (_markers||[]).forEach(function(m){m.setMap(null);});
  _markers = [];
  (window._circles||[]).forEach(function(c){c.setMap(null);});
  window._circles = [];
  window._zones.forEach(function(z){
    var pos = new kakao.maps.LatLng(z.lat, z.lng);
    var m = new kakao.maps.Marker({position:pos, map:_map});
    _markers.push(m);
    var c = new kakao.maps.Circle({center:pos,radius:600,strokeWeight:2,strokeColor:'#00d4aa',strokeOpacity:.8,fillColor:'#00d4aa',fillOpacity:.12,map:_map});
    window._circles.push(c);
  });
  if(window._zones.length){
    var last = window._zones[window._zones.length-1];
    _map.setCenter(new kakao.maps.LatLng(last.lat, last.lng));
    _map.setLevel(5);
    _map.relayout();
  }
}
function _showAddrResult(results){
  var el=document.getElementById('addr-result');
  if(!el)return;
  el.style.display='block';
  el.innerHTML=results.map(function(r,i){
    return '<div class="addr-item" onclick="_selectAddr('+i+')">'+
      '<div style="font-weight:700;font-size:13px">'+r.place_name+'</div>'+
      (r.road_address_name?'<div style="font-size:11px;color:var(--t2);margin-top:2px">'+r.road_address_name+'</div>':'')+
      '</div>';
  }).join('');
  window._addrResults=results;
}

function _selectAddr(idx){
  var r=window._addrResults[idx];
  if(!r)return;
  var el=document.getElementById('addr-result');
  if(el)el.style.display='none';

  var lat=parseFloat(r.y), lng=parseFloat(r.x);
  var name=r.place_name;

  // 지도 이동
  if(_map){
    var pos=new kakao.maps.LatLng(lat,lng);
    _map.setCenter(pos);
    _map.setLevel(4);
    // 마커 추가
    var marker=new kakao.maps.Marker({position:pos,map:_map});
    _markers.push(marker);
    // 원형 오버레이 (배송 구역 표시)
    var circle=new kakao.maps.Circle({
      center:pos, radius:500,
      strokeWeight:2,strokeColor:'#00d4aa',strokeOpacity:.8,
      fillColor:'#00d4aa',fillOpacity:.12,
      map:_map
    });
  }

  window._lastLat=lat;
  window._lastLng=lng;
}

// 공고 상세 지도 v3 — 배송구역 원 + 스타일 핀
function _showDetailMap(lat,lng,name){
  if(typeof lat!=='number'||typeof lng!=='number'||isNaN(lat)||isNaN(lng))return;
  _loadKakaoMap(function(){
    var container=document.getElementById('detail-map');
    if(!container)return;
    var ph=document.getElementById('detail-map-placeholder');
    if(ph)ph.style.display='none';
    container.style.display='block';
    var pos=new kakao.maps.LatLng(lat,lng);
    var radius=window._detailMapRadius||600;
    // 반경에 맞는 줌 레벨 자동 조정
    var lvl=radius<=350?4:radius<=600?5:6;
    window._detailMap=new kakao.maps.Map(container,{center:pos,level:lvl});
    // 배송구역 원 (투명 청색)
    window._detailCircle=new kakao.maps.Circle({
      center:pos,radius:radius,
      strokeWeight:2.5,strokeColor:'#4f78f5',strokeOpacity:.9,
      fillColor:'#4f78f5',fillOpacity:.1,
      map:window._detailMap
    });
    // 커스텀 핀 (글로우)
    var pinHtml='<div style="position:relative;display:flex;flex-direction:column;align-items:center">'+
      '<div style="width:36px;height:36px;background:linear-gradient(135deg,#4f78f5,#00d4aa);border-radius:50% 50% 50% 0;'+
        'transform:rotate(-45deg);box-shadow:0 4px 16px rgba(79,120,245,.6);border:2.5px solid rgba(255,255,255,.9)">'+
      '</div>'+
      '<div style="position:absolute;top:9px;left:9px;width:18px;height:18px;background:#fff;border-radius:50%;"></div>'+
    '</div>';
    var customOverlay=new kakao.maps.CustomOverlay({
      position:pos,content:pinHtml,yAnchor:1
    });
    customOverlay.setMap(window._detailMap);
    // 구역 이름 오버레이 (지도 위 좌상단 배지는 HTML 레이어로 처리)
    var badge=document.getElementById('zone-map-badge');
    if(badge&&name)badge.textContent=name;
    window._detailMarker=null;
  });
}

// ── 멀티스톱 내비게이션 모달 (기사 홈 "내비게이션 시작" 버튼) ─────
function _yOpenNaviModal(){
  var body=document.getElementById('modal-body');
  body.innerHTML='<div style="font-size:19px;font-weight:900;margin-bottom:4px">내비게이션 시작</div>'+
    '<div style="font-size:13px;color:var(--t2);margin-bottom:14px">운행중인 노선을 불러오는 중...</div>'+
    '<div id="navi-modal-body">'+_skRows(2)+'</div>';
  _openModal();
  _db.collection('yongcha_applies').where('driverId','==',_CU.uid)
    .where('status','==','approved').limit(5).get()
  .then(function(snap){
    var nb=document.getElementById('navi-modal-body');if(!nb)return;
    if(snap.empty){nb.innerHTML='<div style="text-align:center;padding:24px;color:var(--t2);font-size:13px">진행 중인 배차가 없어요</div>';return;}
    nb.innerHTML='';
    snap.docs.forEach(function(doc){
      var a=Object.assign({id:doc.id},doc.data());
      var zones=a.zones||[];
      // Tmap 멀티스톱 URL 조립
      // 형식: tmap://route?startX=lng&startY=lat&goalX=lng&goalY=lat&via1X=lng&via1Y=lat...
      var tmapUrl='',kakaoUrl='',hasCoord=false;
      var zWithCoord=zones.filter(function(z){return typeof z.lat==='number'&&typeof z.lng==='number';});
      if(zWithCoord.length>0){
        hasCoord=true;
        var goal=zWithCoord[zWithCoord.length-1];
        var vias=zWithCoord.slice(0,-1);
        var p='';
        if(_myGeo){p+='startX='+_myGeo.lng+'&startY='+_myGeo.lat+'&startName='+encodeURIComponent('현재 위치')+'&';}
        p+='goalX='+goal.lng+'&goalY='+goal.lat+'&goalName='+encodeURIComponent(goal.name||a.area||'목적지');
        vias.forEach(function(z,i){p+='&via'+(i+1)+'X='+z.lng+'&via'+(i+1)+'Y='+z.lat+'&via'+(i+1)+'Name='+encodeURIComponent(z.name||'');});
        tmapUrl='tmap://route?'+p;
        // Kakao는 2점(출발+도착)만 지원 — 첫 존과 마지막 존
        var kStart=_myGeo?(_myGeo.lat+','+_myGeo.lng):(zWithCoord[0].lat+','+zWithCoord[0].lng);
        kakaoUrl='kakaomap://route?sp='+kStart+'&ep='+goal.lat+','+goal.lng;
      } else {
        // 좌표 없음 — 지역명 검색
        var q=encodeURIComponent(a.area||a.region||'');
        tmapUrl=q?'tmap://search?name='+q:'';
        kakaoUrl=q?'kakaomap://search?q='+q:'';
      }
      var zoneLabels=zones.length
        ?zones.map(function(z,i){return '<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd)">'+
          '<span style="width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;flex-shrink:0">'+(i+1)+'</span>'+
          '<span style="font-size:12.5px;font-weight:700">'+(z.zipcode?z.zipcode+' ':'')+_esc(z.name||'')+'</span>'+
          (typeof z.lat==='number'?'<span style="font-size:10px;color:var(--gn);margin-left:auto">GPS</span>':'')+'</div>';}).join('')
        :'<div style="font-size:12.5px;color:var(--t2);padding:8px 0">'+_esc(a.area||a.region||'구역 미지정')+'</div>';
      var sec=document.createElement('div');sec.className='card';sec.style.marginBottom='10px';
      sec.innerHTML=
        '<div style="font-weight:800;font-size:14px;margin-bottom:10px">'+_esc(a.agencyName||'—')+'</div>'+
        zoneLabels+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">'+
        (tmapUrl?'<a href="'+_esc(tmapUrl)+'" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:48px;background:var(--acl);border:1.5px solid var(--acln);border-radius:var(--r);color:var(--ac);font-size:13px;font-weight:900;text-decoration:none">'+
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>Tmap</a>':'<span></span>')+
        (kakaoUrl?'<a href="'+_esc(kakaoUrl)+'" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:48px;background:var(--brl);border:1.5px solid var(--brln);border-radius:var(--r);color:var(--br);font-size:13px;font-weight:900;text-decoration:none">'+
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>카카오내비</a>':'<span></span>')+
        '</div>'+
        (zones.length>1&&hasCoord?'<div style="font-size:10.5px;color:var(--gn);text-align:center;margin-top:6px">'+zones.length+'개 구역 자동 경유지 세팅</div>':'');
      nb.appendChild(sec);
    });
  }).catch(function(e){
    var nb=document.getElementById('navi-modal-body');
    if(nb)nb.innerHTML='<div style="color:var(--rd);font-size:13px">'+e.message+'</div>';
  });
}

// ── 노쇼 경보 타이머 ─────────────────────────────────────────
// 배차 수락(step=1) 후 N분 내 GPS가 픽업 방향으로 이동하지 않으면 경고
var _noShowTimers={};
function _yStartNoShowTimer(applyId,pickupLat,pickupLng,waitMin){
  if(_noShowTimers[applyId])return;
  var ms=(waitMin||12)*60*1000;
  _noShowTimers[applyId]=setTimeout(function(){
    _yLoadGeo().then(function(g){
      if(!g)return;
      var d=_yHaversine(g.lat,g.lng,pickupLat,pickupLng);
      if(d>5){
        // 아직 픽업지 5km 밖 → 경고
        _yToast('현장까지 아직 멀어요! 지금 바로 출발하세요 ('+Math.round(d)+'km)','warn');
        _db.collection('yongcha_applies').doc(applyId).update({
          noShowWarned:true,noShowWarnedAt:firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function(){});
      }
      delete _noShowTimers[applyId];
    });
  },ms);
}
function _yCancelNoShowTimer(applyId){
  if(_noShowTimers[applyId]){clearTimeout(_noShowTimers[applyId]);delete _noShowTimers[applyId];}
}

// ── 전자 배송 확인서 ─────────────────────────────────────────
function _showWorkCert(applyId){
  var body=document.getElementById('modal-body');
  body.innerHTML='<div style="text-align:center;padding:32px"><div class="spinner"></div></div>';
  _openModal();
  _db.collection('yongcha_applies').doc(applyId).get().then(function(snap){
    if(!snap.exists){_yToast('배차 정보 없음');_closeModal();return;}
    var a=snap.data();
    var certNo='YC-'+applyId.slice(0,8).toUpperCase();
    var seed=0;
    for(var ci=0;ci<applyId.length&&ci<8;ci++)seed=seed*31+applyId.charCodeAt(ci);
    seed=Math.abs(seed);
    var bars=[];
    for(var bi=0;bi<50;bi++){
      seed=(seed*6364136+1442695)%2147483647;
      bars.push({w:(seed%3+1)*2,isBar:seed%4!==0});
    }
    body.innerHTML=
      '<div style="font-size:18px;font-weight:900;margin-bottom:16px;text-align:center">전자 배송 확인서</div>'+
      '<div class="card" style="background:#fff;color:#111;border-radius:var(--r-lg);margin-bottom:12px">'+
      '<div style="text-align:center;padding:12px 0 10px">'+
      '<div style="font-size:9px;color:#999;font-weight:700;letter-spacing:1px">DELIVERY CERTIFICATE</div>'+
      '<div style="font-size:18px;font-weight:900;letter-spacing:-0.5px;margin-top:4px;color:#111">'+_esc(certNo)+'</div>'+
      '</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid #eee">'+
      [['기사명',_esc(a.driverName||'—')],
       ['구역',_esc(a.area||a.region||'—')],
       ['단가',_won(a.unitPrice||0)+'원/건'],
       ['대리점',_esc(a.agencyName||'—')],
       ['상태',a.step>=3?'완료':'운행중']].map(function(r){
        return '<tr style="border-bottom:1px solid #eee"><td style="padding:9px 10px;font-weight:700;width:36%;color:#555">'+r[0]+'</td>'+
          '<td style="padding:9px 10px;color:#111">'+r[1]+'</td></tr>';
       }).join('')+
      '</table>'+
      '<div style="display:flex;gap:2px;justify-content:center;align-items:stretch;height:60px;background:#fff;padding:10px;margin-top:4px;border-radius:0 0 var(--r-lg) var(--r-lg)">'+
      bars.map(function(b){
        return '<div style="width:'+b.w+'px;'+(b.isBar?'background:#111;':'')+'border-radius:1px;flex-shrink:0"></div>';
      }).join('')+
      '</div>'+
      '</div>'+
      '<div class="cert-barcode">'+_esc(certNo)+'</div>';
  }).catch(function(e){_yToast('오류: '+e.message);_closeModal();});
}

function _showZoneOnMap(i){
  var zones = window._detailZones||[];
  var z = zones[i];
  if(!z) return;
  zones.forEach(function(_,j){
    var t = document.getElementById('ztab-'+j);
    if(!t) return;
    t.style.background = j===i ? 'var(--ac)' : 'transparent';
    t.style.color = j===i ? '#fff' : 'var(--ac)';
  });
  if(typeof z.lat==='number'&&typeof z.lng==='number'){
    _loadKakaoMap(function(){
      var pos = new kakao.maps.LatLng(z.lat, z.lng);
      if(window._detailMap){
        window._detailMap.setCenter(pos);
        window._detailMap.setLevel(5);
        if(window._detailMarker) window._detailMarker.setPosition(pos);
        if(window._detailCircle) window._detailCircle.setCenter(pos);
      } else {
        _showDetailMap(z.lat,z.lng,z.name||'');
      }
    });
  } else if(z.name||z.zipcode){
    var q=(z.zipcode||'')+' '+(z.name||'');
    _loadKakaoMap(function(){
      var gc=new kakao.maps.services.Geocoder();
      gc.addressSearch(q.trim(),function(res,status){
        if(status===kakao.maps.services.Status.OK&&res[0]){
          var lat2=parseFloat(res[0].y),lng2=parseFloat(res[0].x);
          if(window._detailMap){
            var pos=new kakao.maps.LatLng(lat2,lng2);
            window._detailMap.setCenter(pos);window._detailMap.setLevel(5);
            if(window._detailMarker)window._detailMarker.setPosition(pos);
            if(window._detailCircle)window._detailCircle.setCenter(pos);
          } else {
            _showDetailMap(lat2,lng2,z.name||q.trim());
          }
        }
      });
    });
  }
}
</script>
