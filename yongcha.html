/* 내가 올린 중복을 실제로 지운다 (숨기기가 아니라 영구 삭제).
   각 지문 그룹의 최신 1건은 남긴다. Firestore 규칙상 본인 문서만 삭제 가능. */
function _yPurgeMyDup(coll,keyFn,label,reloadFn){
  _db.collection(coll).where('agencyId','==',_CU.uid).limit(400).get().then(function(snap){
    var docs=snap.docs.map(function(d){
      return Object.assign({id:d.id,_ts:(d.data().createdAt&&d.data().createdAt.seconds)||0},d.data());
    }).sort(function(a,b){return b._ts-a._ts;});
    var seen={},kill=[];
    docs.forEach(function(d){var k=keyFn(d);if(seen[k])kill.push(d.id);else seen[k]=true;});
    if(!kill.length){_yToast('삭제할 중복이 없어요');return;}
    if(!confirm('중복 '+label+' '+kill.length+'건을 영구 삭제할까요?\n각 그룹의 최신 1건은 남습니다.'))return;
    var batch=_db.batch();
    kill.slice(0,450).forEach(function(id){batch.delete(_db.collection(coll).doc(id));});
    return batch.commit().then(function(){
      _yToast('중복 '+Math.min(kill.length,450)+'건 삭제 완료');
      if(reloadFn)reloadFn();
    });
  }).catch(function(e){_yToast('오류: '+e.message);});
}
function _yPurgeMyDupJobs(){
  _yPurgeMyDup('yongcha_jobs',_yJobKey,'공고',function(){
    _pgJobsAgency(document.getElementById('content'));
  });
}
function _yPurgeMyDupPosts(){
  _yPurgeMyDup('yongcha_posts',_yPostKey,'공고',function(){
    _pgMyPosts(document.getElementById('content'));
  });
}

var _renderPostTimer=null;
function _renderPostListDebounced(){
  clearTimeout(_renderPostTimer);
  _renderPostTimer=setTimeout(_renderPostList,30);
}

var _statsPreloaded=false;
function _preloadStats(posts){
  if(_statsPreloaded)return;
  _statsPreloaded=true;
  var keys={};
  posts.forEach(function(p){if(p.region&&p.courier)keys[(p.region||'')+'_'+(p.courier||'')]=true;});
  Object.keys(keys).forEach(function(k){
    _db.collection('yongcha_stats').doc(k).get().then(function(s){
      if(s.exists)window._yStats[k]=s.data();
    }).catch(function(){});
  });
}

function _loadFilteredPosts(){
  var list=document.getElementById('posts-list');
  if(!list)return;
  list.innerHTML=_skeletonCards(3);
  _statsPreloaded=false;
  // 위치를 먼저 확보해 두면 첫 렌더부터 "가까운 공고 우선"이 적용된다.
  if(_CU&&_CU.type==='driver'&&!_myGeo){
    _yLoadGeo().then(function(g){ if(g)_renderPostListDebounced(); });
  }
  if(_postsUnsub){_postsUnsub();_postsUnsub=null;}
  _postsUnsub=_db.collection('yongcha_posts').orderBy('createdAt','desc').limit(150)
  .onSnapshot(function(snap){
    _allPosts=[];
    snap.forEach(function(doc){_allPosts.push(Object.assign({id:doc.id},doc.data()));});
    _preloadStats(_allPosts); // stats는 최초 스냅샷에만 로드 (N+1 방지)
    _renderPostListDebounced();
  },function(e){
    var el=document.getElementById('posts-list');
    if(el)el.innerHTML='<div class="empty"><div class="empty-msg">불러오기 실패: '+e.message+'</div></div>';
  });
}

// 정렬: 거리(가까운 순) > 맞춤도 > 긴급(D-0/D-1) > 프리미엄 > 시작일 > 단가
function _sortPosts(a,b){
  if(_CU&&_CU.type==='driver'&&_myGeo){
    var da=_yPostDist(a),db2=_yPostDist(b);
    if(da!=null&&db2!=null){var ba=Math.floor(da/30),bb=Math.floor(db2/30);if(ba!==bb)return ba-bb;}
    else if(da!=null&&db2==null&&da<=30)return -1;
    else if(db2!=null&&da==null&&db2<=30)return 1;
  }
  if(_CU&&_CU.type==='driver'&&_prefs){var ms=(_yMatchScore(b)||0)-(_yMatchScore(a)||0);if(ms!==0)return ms;}
  var aD=_yDays(a.startDate),bD=_yDays(b.startDate);
  var aU=aD!==null&&aD<=1,bU=bD!==null&&bD<=1;
  if(aU!==bU)return bU?1:-1;
  if(!!b.premium!==!!a.premium)return b.premium?1:-1;
  if(aD!==bD){if(aD===null)return 1;if(bD===null)return -1;return aD-bD;}
  return (b.unitPrice||0)-(a.unitPrice||0);
}

function _renderPostList(){
  var list=document.getElementById('posts-list');
  if(!list)return;

  var priceRanges=[[0,700],[700,900],[900,1100],[1100,99999]];
  var q=(_pf.q||'').trim().toLowerCase();
  var filtered=_allPosts.filter(function(p){
    // 맞춤공고 탭 — 기사 프리퍼런스 점수 1 이상만
    if(_pf.matchTab==='matched'&&_CU&&_CU.type==='driver'&&_prefs){
      if((_yMatchScore(p)||0)<1)return false;
    }
    if(_pf.statusFilter&&_pf.statusFilter!=='all'){
      if(p.status!==_pf.statusFilter)return false;
    }
    if(q){
      var hay=[p.area,p.agencyName,p.routeNo,p.region,p.courier,p.loadingAddr,p.desc]
        .filter(Boolean).join(' ').toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    if(_pf.courier!=='전체'&&p.courier!==_pf.courier)return false;
    if(_pf.region!=='전체'&&p.region!==_pf.region)return false;
    if(_pf.urgentOnly&&!p.urgent)return false;
    if(_pf.verifiedOnly){
      var ag=_trustGrade(p.agencyRating||0,p.agencyReviewCount||0,p.agencyFakeCount||0);
      if(ag.label!=='인증'&&ag.label!=='프리미엄')return false;
    }
    if(_pf.priceRange!==''){
      var pr=priceRanges[parseInt(_pf.priceRange)];
      if(pr){var up=p.unitPrice||0;if(up<pr[0]||up>=pr[1])return false;}
    }
    return true;
  });

  filtered.sort(_sortPosts);

  // 중복 공고 접기 — 내용 기준(대리점 무관). 같은 노선을 여러 계정이 올린 경우가 대부분이라
  // agencyId 를 포함하면 하나도 접히지 않는다.
  var dd=_yDedupe(filtered,_yPostKeyContent);
  filtered=dd.items;

  var cnt=document.getElementById('pf-count');
  if(cnt)cnt.textContent='검색 결과 '+filtered.length+'건';

  if(!filtered.length){
    list.innerHTML=_emptyHtml('🔍','조건에 맞는 공고가 없어요','필터나 검색어를 바꿔보세요');
    return;
  }

  // 큰 목록은 DocumentFragment 로 한 번에 삽입 (리플로우 최소화)
  var frag=document.createDocumentFragment();
  filtered.forEach(function(d){ frag.appendChild(_makePostCard(d)); });
  list.innerHTML=_yDupNotice(dd.hidden,'공고');
  list.appendChild(frag);
}


var _prefs=null; // driver 맞춤 추천 조건 (_CU.preferences에서 로딩)

function _urgencyLabel(d){
  if(!d.urgent)return '';
  if(!d.startDate)return '긴급';
  var today=new Date();today.setHours(0,0,0,0);
  var start=new Date(d.startDate);start.setHours(0,0,0,0);
  var diff=Math.round((start-today)/(1000*60*60*24));
  if(diff<=0)return '당일 시작';
  if(diff===1)return '내일 시작';
  return '긴급';
}

function _yDays(startDate){
  if(!startDate)return null;
  var today=new Date();today.setHours(0,0,0,0);
  var s=new Date(startDate);s.setHours(0,0,0,0);
  return Math.round((s-today)/(1000*60*60*24));
}

function _yDayBadge(startDate){
  var d=_yDays(startDate);
  if(d===null)return '';
  if(d<=0)return '<span class="dday dday-0">오늘 시작</span>';
  if(d===1)return '<span class="dday dday-0">D-1 시작</span>';
  if(d<=3)return '<span class="dday dday-soon">D-'+d+'</span>';
  return '';
}

function _yMatchScore(p){
  if(!_prefs)return 0;
  var score=0;
  if(_prefs.region&&p.region&&p.region.indexOf(_prefs.region)!==-1)score++;
  else if(_prefs.region&&p.region&&_prefs.region.indexOf(p.region)!==-1)score++;
  // 공고는 vehicleType, 기사는 carType 필드다. 예전엔 p.carType 을 봐서 항상 미매칭이었다.
  if(_prefs.carType&&p.vehicleType&&_yCarNorm(p.vehicleType)===_yCarNorm(_prefs.carType))score++;
  if(_prefs.courier&&p.courier&&p.courier===_prefs.courier)score++;
  if(_prefs.minPrice&&(p.unitPrice||0)<_prefs.minPrice)return -1;
  // 희망 시간대 매칭 — pref-time 선택값과 공고 workShift 직접 비교
  if(_prefs.workShift&&p.workShift&&_prefs.workShift===p.workShift)score++;
  // 선호 근무타입 매칭 — workTypes 배열(기사)과 공고 workHours/workType 필드 비교
  var driverWt=(_prefs.workTypes&&_prefs.workTypes.length)?_prefs.workTypes:(_CU&&_CU.workTypes)||[];
  if(driverWt.length){
    var postWt=(p.workType||'')+(p.workHours||'');
    var matched=driverWt.some(function(wt){return postWt.indexOf(wt)!==-1;});
    if(matched)score++;
  }
  return score;
}

function _yMatchBadge(p){
  if(!_prefs||!_CU||_CU.type!=='driver')return '';
  var s=_yMatchScore(p);
  if(s<0)return '<span class="match-badge match-low">단가 미달</span>';
  if(s>=3)return '<span class="match-badge match-hot">내 조건 딱 맞음</span>';
  if(s>=2)return '<span class="match-badge match-ok">지역·차량 일치</span>';
  return '';
}

function _trustGrade(rating,reviewCount,fakeCount){
  if((fakeCount||0)>=3)return{label:'주의',color:'var(--rd)',bg:'var(--rdl)'};
  if(rating>=4.8&&reviewCount>=50)return{label:'프리미엄',color:'var(--pu)',bg:'var(--pul)'};
  if(rating>=4.5&&reviewCount>=20)return{label:'인증',color:'var(--ac)',bg:'var(--acl)'};
  if(reviewCount>0)return{label:'일반',color:'var(--t2)',bg:'var(--bg3)'};
  return{label:'신규',color:'var(--t3)',bg:'var(--bg3)'};
}

function _courierIcon(courier){
  // 이모지 제거 — 텍스트 약어만 반환
  var abbr={'CJ대한통운':'CJ','한진택배':'한진','롯데택배':'롯데','우체국':'우체국','로젠택배':'로젠','쿠팡로지스틱스':'쿠팡'};
  return abbr[courier]||'택배';
}
// 택배사별 좌측 컬러라인 색상 (CSS --rail 변수로 주입)
function _courierRail(courier){
  var m={'CJ대한통운':'#e31837','한진택배':'#1352a8','롯데택배':'#ef6822','우체국':'#f5c000'};
  return m[courier]||'';
}
/* ══════════════════════════════════════════════════════════
   공고 카드 — 풀폭 세로 / 3존 구조
   헤드(택배사·신뢰·상태) → 본문(구역 → 단가 앵커 → 시세게이지 → 태그 → 보장)
   → 푸터(대리점 · 찜/공유/지도/지원)
   ══════════════════════════════════════════════════════════ */
function _makePostCard(d,mini){
  var isMatched=d.status==='matched';
  var isClosed=d.status==='closed';
  var isPremium=!!d.premium;

  var state=isClosed?'is-closed':isPremium?'is-premium':isMatched?'is-matched':d.urgent?'is-urgent':'is-open';
  var card=document.createElement('article');
  card.className='pcard '+state+(mini?' pcard-mini':'');

  // 택배사별 컬러라인 — 상태 색보다 택배사 색 우선
  var rail=_courierRail(d.courier);
  if(rail)card.style.cssText='--rail:'+rail;

  var dayBadge=_yDayBadge(d.startDate);
  var urgLabel=_urgencyLabel(d);
  var matchBadge=_yMatchBadge(d);
  var grade=_trustGrade(d.agencyRating,d.agencyReviewCount,d.agencyFakeCount);
  var dayEst=(d.unitPrice&&d.volume)?Math.round(d.unitPrice*d.volume/10000):0;
  var minG=(d.workShift==='야간')?35:30;

  var stLabel=isClosed?'마감':isMatched?'운행완료':d.urgent?'긴급':'모집중';
  var stCls=isClosed?'st-closed':isMatched?'st-matched':d.urgent?'st-urgent':'st-open';

  // 지역·택배사 시세 게이지
  var stats=(window._yStats||{})[(d.region||'')+'_'+(d.courier||'')];
  var gauge='';
  if(stats&&stats.avgUnitPrice&&d.unitPrice){
    var avg=stats.avgUnitPrice;
    var pct=Math.round(d.unitPrice/avg*100);
    var col=pct<70?'var(--rd)':pct>=100?'var(--gn)':'var(--br)';
    var verdict=pct<70?'낮은 단가':pct>=100?'평균 이상':'평균 수준';
    gauge='<div class="gauge">'+
      '<div class="gauge-track"><div class="gauge-fill" style="width:'+Math.min(pct,100)+'%;background:'+col+'"></div></div>'+
      '<div class="gauge-cap"><span>'+_esc(d.region||'지역')+' · '+_esc(d.courier||'')+' 평균 '+_won(avg)+'원</span>'+
      '<b style="color:'+col+'">'+pct+'% · '+verdict+'</b></div></div>';
  }

  // 주간/야간 배지
  var shiftBadge='';
  if(d.workShift==='야간')shiftBadge='<span class="shift-badge shift-night">야간</span>';
  else if(d.workShift==='주간')shiftBadge='<span class="shift-badge shift-day">주간</span>';
  else if(d.workShift)shiftBadge='<span class="shift-badge shift-day">'+_esc(d.workShift)+'</span>';

  // 메타 태그 (이모지 제거)
  var tags=[];
  if(d.vehicleType)tags.push(_esc(d.vehicleType));
  if(d.areaAptRatio)tags.push('아파트 '+d.areaAptRatio+'%');
  if(d.areaType)tags.push(_esc(d.areaType));
  if(d.settleDay)tags.push(_esc(d.settleDay));
  if(d.startDate)tags.push(_esc(d.startDate)+(d.endDate?' ~ '+_esc(d.endDate):' ~'));
  // 상차지↔구역 거리는 위 경로 라인(.pc-route)에서 보여주므로 태그에서는 뺀다

  var subBits=[];
  if(d.routeNo)subBits.push(_esc(d.routeNo));
  if(d.region)subBits.push(_esc(d.region));

  // ── 출발지(상차지) → 목적지(배송구역) 경로 라인 + 구간 거리
  var fromTxt=d.loadingAddr||(d.region?d.region+' 상차지':'');
  var toTxt=d.area||d.region||'';
  var legKm=null;
  if(typeof d.loadingLat==='number'&&d.zones&&d.zones.length&&typeof d.zones[0].lat==='number'){
    var _ds=d.zones.map(function(z){return _yHaversine(d.loadingLat,d.loadingLng,z.lat,z.lng);});
    legKm=_ds.reduce(function(a,b){return a+b;},0)/_ds.length;
  }
  var routeHtml=(fromTxt||toTxt)?
    '<div class="pc-route">'+
      '<div class="pc-node"><div class="pc-node-lbl">출발지</div>'+
        '<div class="pc-node-val">'+_esc(fromTxt||'미지정')+'</div></div>'+
      '<div class="pc-arrow"><i></i>'+(legKm!=null?'<span>'+_yDistLabel(legKm)+'</span>':'')+'</div>'+
      '<div class="pc-node to"><div class="pc-node-lbl">배송구역</div>'+
        '<div class="pc-node-val">'+_esc(toTxt||'미지정')+'</div></div>'+
    '</div>':'';

  // 내 위치 → 상차지 거리
  var myKm=_yPostDist(d);
  var distChip=(myKm!=null)
    ? '<span class="dist-chip'+(myKm<=15?' near':'')+'">내 위치에서 '+_yDistLabel(myKm)+'</span>'
    : '';

  // 카카오맵 링크
  var mapHref='';
  if(d.zones&&d.zones.length&&d.zones[0].lat){
    mapHref='https://map.kakao.com/link/map/'+encodeURIComponent(d.zones[0].name||d.area||'')+','+d.zones[0].lat+','+d.zones[0].lng;
  } else if(d.lat&&d.lng){
    mapHref='https://map.kakao.com/link/map/'+encodeURIComponent(d.area||'')+','+d.lat+','+d.lng;
  }

  var isDriver=_CU&&_CU.type==='driver';
  var marked=!!_bookmarks[d.id];

  // 등록일시 (우측 하단 작게)
  var timeStr=d.createdAt?_ago(d.createdAt):'';

  card.innerHTML=
    (isPremium?'<div class="pc-ribbon">PREMIUM</div>':'')+
    // ── 헤드
    '<div class="pc-head">'+
      '<span class="courier-badge">'+_courierIcon(d.courier)+'</span>'+
      '<span class="trust-chip" style="font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:'+grade.bg+';color:'+grade.color+'">'+grade.label+'</span>'+
      '<span class="st '+stCls+'" style="margin-left:auto">'+stLabel+'</span>'+
    '</div>'+
    // ── 본문
    '<div class="pc-body">'+
      ((dayBadge||urgLabel||matchBadge||distChip||shiftBadge)?
      '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">'+
        shiftBadge+
        dayBadge+
        (!dayBadge&&urgLabel?'<span class="dday dday-0">'+urgLabel+'</span>':'')+
        distChip+
        matchBadge+
      '</div>':'')+
      (d.urgent?'<span class="urgent-pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>긴급</span>':'')+
      '<h3 class="pc-title">'+_esc(d.area||'구역 미지정')+'</h3>'+
      (subBits.length?'<div class="pc-sub">'+subBits.map(function(b){return '<span>'+b+'</span>';}).join('')+'</div>':'')+
      routeHtml+
      '<div class="pc-price">'+
        '<span class="pc-price-v2">'+_won(d.unitPrice)+'</span>'+
        '<span class="pc-price-unit" style="font-size:13px;font-weight:700;color:var(--t2);margin-left:2px">원 / '+_esc(d.priceType==='가구당'?'가구':'건')+'</span>'+
        (d.vatIncluded?'<span class="pc-vat">VAT'+_esc(d.vatIncluded)+'</span>':'')+
      '</div>'+
      gauge+
      (tags.length?'<div class="pc-tags">'+tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div>':'')+
      '<div class="pc-guard"><span>일 최소보장 '+minG+'만원</span>'+
        (dayEst>0?'<small>예상 '+dayEst+'만원/일</small>':'')+'</div>'+
      (d.volume?'<div class="pc-stats"><span>일 물량 <b>'+_won(d.volume)+'건</b></span>'+
        (d.workDays?'<span>근무 <b>'+_esc(d.workDays)+'</b></span>':'')+'</div>':'')+
    '</div>'+
    // ── 푸터
    '<div class="pc-foot">'+
      '<span class="pc-agency"><span class="nm">'+_esc(d.agencyName||'—')+'</span>'+
        (d.dupAgencies>1?'<span style="flex-shrink:0;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--bg3);color:var(--t2);border:1px solid var(--bd)">외 '+(d.dupAgencies-1)+'곳</span>':'')+
        (d.applicantCount?'<span style="color:var(--t3);font-weight:700;flex-shrink:0">· 지원 '+d.applicantCount+'</span>':'')+
      '</span>'+
      '<span class="pc-acts">'+
        (isDriver?'<button type="button" class="bm-btn'+(marked?' on':'')+'" id="bm-'+d.id+'" aria-label="찜" onclick="event.stopPropagation();_toggleBookmark(\''+d.id+'\')">'+(marked?'★':'☆')+'</button>':'')+
        '<button type="button" class="pc-act txt" aria-label="공유" onclick="event.stopPropagation();_sharePost(\''+d.id+'\',\''+_jsq(d.area)+'\')">공유</button>'+
        (mapHref?'<a class="pc-act txt" href="'+_esc(mapHref)+'" target="_blank" rel="noopener" aria-label="지도" onclick="event.stopPropagation()">지도</a>':'')+
        (!isClosed&&isDriver?
          '<button type="button" class="pc-apply" onclick="event.stopPropagation();_applyPost(\''+d.id+'\',\''+d.agencyId+'\',\''+_jsq(d.agencyName)+'\',this)">지원</button>':'')+
      '</span>'+
    '</div>'+
    // ── 등록일시 (우측 하단)
    (timeStr?'<div class="pc-time">'+timeStr+'</div>':'');

  card.onclick=function(){if(!isClosed)_showPostDetail(d);};
  return card;
}

/* ── 북마크(찜) ──
   이전엔 카드마다 Firestore 문서를 1건씩 읽어 150개 공고 = 150 read 였음.
   로그인 시 한 번만 전체를 읽어 캐시한다. */
var _bookmarks={};
var _bmLoaded=false;
function _yLoadBookmarks(){
  if(!_CU||_CU.type!=='driver'){_bmLoaded=true;return Promise.resolve();}
  return _db.collection('yongcha_bookmarks').where('driverId','==',_CU.uid).limit(300).get()
    .then(function(snap){
      _bookmarks={};
      snap.forEach(function(doc){var b=doc.data();if(b.postId)_bookmarks[b.postId]=true;});
      _bmLoaded=true;
    }).catch(function(){_bmLoaded=true;});
}
function _checkBookmark(postId){ // 레거시 호환 (캐시 반영만)
  var btn=document.getElementById('bm-'+postId);
  if(!btn)return;
  var on=!!_bookmarks[postId];
  btn.textContent=on?'★':'☆';
  btn.classList.toggle('on',on);
}
function _toggleBookmark(postId){
  if(!_CU||_CU.type!=='driver'){_yToast('기사 회원만 찜할 수 있어요');return;}
  var ref=_db.collection('yongcha_bookmarks').doc(_CU.uid+'_'+postId);
  var btn=document.getElementById('bm-'+postId);
  var wasOn=!!_bookmarks[postId];
  // 낙관적 UI — 응답을 기다리지 않고 즉시 반영
  _bookmarks[postId]=!wasOn;
  if(btn){btn.textContent=wasOn?'☆':'★';btn.classList.toggle('on',!wasOn);}
  var p=wasOn?ref.delete():ref.set({driverId:_CU.uid,postId:postId,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  p.then(function(){
    _yToast(wasOn?'찜 해제됐어요':'찜 목록에 추가됐어요!');
    if(_curPage==='bookmarks')_pgBookmarks(document.getElementById('content'));
  }).catch(function(e){
    // 롤백
    _bookmarks[postId]=wasOn;
    if(btn){btn.textContent=wasOn?'★':'☆';btn.classList.toggle('on',wasOn);}
    _yToast('오류: '+e.message);
  });
}

/* ── 찜한 공고 목록 ── */
function _pgBookmarks(el){
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('on');});
  el.innerHTML=
    '<div class="page-hdr"><h1 class="page-title">찜한 공고</h1>'+
    '<p class="page-sub">관심 있는 노선을 모아뒀어요</p></div>'+
    '<div id="bm-list">'+_skeletonCards(2)+'</div>';

  if(!_CU||_CU.type!=='driver'){
    document.getElementById('bm-list').innerHTML=_emptyHtml('★','기사 회원 전용이에요','노선 공고를 찜하면 여기 모여요');
    return;
  }
  _db.collection('yongcha_bookmarks').where('driverId','==',_CU.uid).limit(100).get()
  .then(function(snap){
    var ids=[];
    snap.forEach(function(doc){var b=doc.data();if(b.postId)ids.push(b.postId);});
    var list=document.getElementById('bm-list');if(!list)return;
    if(!ids.length){list.innerHTML=_emptyHtml('★','찜한 공고가 없어요','공고 카드의 ☆ 를 눌러 찜해보세요');return;}
    return Promise.all(ids.slice(0,60).map(function(id){
      return _db.collection('yongcha_posts').doc(id).get().catch(function(){return null;});
    })).then(function(docs){
      var list2=document.getElementById('bm-list');if(!list2)return;
      var posts=docs.filter(function(s){return s&&s.exists;})
        .map(function(s){return Object.assign({id:s.id},s.data());});
      if(!posts.length){list2.innerHTML=_emptyHtml('★','찜한 공고가 모두 삭제됐어요','');return;}
      posts.sort(function(a,b){return (a.status==='open'?0:1)-(b.status==='open'?0:1);});
      list2.innerHTML='';
      posts.forEach(function(p){list2.appendChild(_makePostCard(p));});
    });
  }).catch(function(e){
    var list=document.getElementById('bm-list');if(list)list.innerHTML=_errHtml(e);
  });
}

/* ── 공고 공유 (딥링크) ── */
function _sharePost(postId,area){
  var url=location.origin+'/?post='+postId;
  var text='[용차] '+(area||'노선')+' 공고';
  if(navigator.share){
    navigator.share({title:'용차 노선공고',text:text,url:url}).catch(function(){});
  } else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){_yToast('🔗 링크가 복사됐어요!');})
      .catch(function(){_yToast('링크: '+url);});
  } else {
    _yToast('링크: '+url);
  }
}

/* ── 딥링크: /?post=<id> 로 들어오면 해당 공고 상세를 자동 오픈 ── */
/// ── 소장: 정산 입금 완료 처리 ─────────────────────────────────────────
function _yMarkSettlePaid(settleId,driverId,amount){
  if(!confirm('입금 완료로 처리하시겠어요?\n기사에게 FCM 알림이 발송됩니다.'))return;
  _yGetToken().then(function(tok){
    return fetch('/api/yongcha/settlement-paid',{
      method:'POST',
      headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({settleId:settleId,driverId:driverId,amount:amount,agencyId:_CU.uid})
    });
  }).then(function(r){return r.json();}).then(function(d){
    if(d.ok){_yToast('입금 완료 처리됐어요. 기사에게 알림이 발송됩니다.');_goPage('dashboard');}
    else _yToast('처리 실패: '+(d.error||''));
  }).catch(function(e){_yToast('오류: '+e.message);});
}

// ── 소장: 정산명세서 알림톡 발송 + 팝빌 역발행 요청 ───────────────────────────
function _ySendSettleNotify(settleId,driverPhone,driverName,agencyName,driverId,totalAmount,totalCount,weekStart){
  if(!driverPhone){_yToast('기사 전화번호가 없어요. 프로필을 확인하세요.');return;}
  var btn=event&&event.currentTarget;
  if(btn){btn.disabled=true;btn.textContent='발송중...';}
  // 1) 팝빌 역발행 요청
  _yGetToken().then(function(tok){
    return fetch('/api/yongcha/popbill-issue',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
      body:JSON.stringify({workId:settleId,agencyId:_CU.uid,driverId:driverId,driverName:driverName,fare:totalAmount})
    });
  }).then(function(r){return r.json();}).then(function(d){
    if(d.ok===false&&d.error&&d.error.indexOf('사업자번호')>=0){
      _yToast('사업자번호 미등록: 프로필에서 사업자번호를 먼저 입력하세요.');
      if(btn){btn.disabled=false;btn.textContent='명세서 발송';}
      return;
    }
    // 2) 명세서 알림톡 발송 (팝빌 성공/실패 무관하게 발송)
    return fetch('/api/yongcha/settle-notify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({settleId:settleId,driverPhone:driverPhone,driverName:driverName,
        agencyId:_CU.uid,agencyName:agencyName,driverId:driverId,
        totalAmount:totalAmount,totalCount:totalCount,weekStart:weekStart})
    }).then(function(r2){return r2.json();});
  }).then(function(d2){
    if(!d2)return;
    _yToast(d2.alimtalkOk?'명세서 알림톡 발송 완료! 기사 승인을 기다리세요.':'명세서 발송됨 (SMS fallback). 기사 승인 대기중.');
    _goPage('dashboard'); // 새로고침
  }).catch(function(e){
    _yToast('오류: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='명세서 발송';}
  });
}

// ── 기사: 세금계산서 역발행 승인 처리 ──────────────────────────────────────────
function _yTaxApprove(settleId){
  var btn=document.getElementById('tax-approve-btn');
  if(btn){btn.disabled=true;btn.textContent='처리중...';}
  var corpNum=(_CU.corpNum||'').replace(/[^0-9]/g,'');
  if(!corpNum){
    _yToast('사업자번호가 없어요. 프로필에서 사업자번호를 먼저 입력하세요.');
    if(btn){btn.disabled=false;btn.textContent='세금계산서 등록 승인';}
    return;
  }
  fetch('/api/yongcha/popbill-approve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({settleId:settleId,senderCorpNum:corpNum})
  }).then(function(r){return r.json();}).then(function(d){
    if(d.ok===false)throw new Error(d.error||'승인 실패');
    _yToast('세금계산서가 홈택스에 자동 등록됐어요!');
    _pgTaxApprove(document.getElementById('content'),settleId); // 화면 갱신
  }).catch(function(e){
    _yToast('오류: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='세금계산서 등록 승인';}
  });
}

// ── 기사: 세금계산서 역발행 거부 ───────────────────────────────────────────────
function _yTaxReject(settleId){
  var corpNum=(_CU.corpNum||'').replace(/[^0-9]/g,'');
  if(!corpNum){_yToast('사업자번호가 없어요. 프로필에서 먼저 입력하세요.');return;}
  var btn=document.getElementById('tax-reject-btn');
  if(btn){btn.disabled=true;btn.textContent='처리중...';}
  fetch('/api/yongcha/popbill-reject',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({settleId:settleId,senderCorpNum:corpNum,rejectReason:'기사 앱에서 거부'})
  }).then(function(r){return r.json();}).then(function(d){
    if(d.ok===false)throw new Error(d.error||'거부 처리 실패');
    _yToast('거부했어요. 소장에게 사유를 전달하세요.');
    _pgTaxApprove(document.getElementById('content'),settleId);
  }).catch(function(e){
    _yToast('오류: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='거부';}
  });
}

function _yHandleDeepLink(){
  var qs=location.search||'';
  // ?tax=settleId — 정산명세서 세금계산서 승인 딥링크 (기사용)
  var mt=qs.match(/[?&]tax=([^&]+)/);
  if(mt){
    var sid=decodeURIComponent(mt[1]);
    history.replaceState(null,'',location.pathname);
    _pgTaxApprove(document.getElementById('content'),sid);
    return;
  }
  // ?post=postId — 공고 상세 딥링크
  var m=qs.match(/[?&]post=([^&]+)/);
  if(!m)return;
  var postId=decodeURIComponent(m[1]);
  history.replaceState(null,'',location.pathname);
  _db.collection('yongcha_posts').doc(postId).get().then(function(snap){
    if(!snap.exists){_yToast('공고를 찾을 수 없어요');return;}
    _showPostDetail(Object.assign({id:snap.id},snap.data()));
  }).catch(function(){});
}

          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>카카오맵 열기</a>';
      }
    }
  }

  // 이미 지원 여부 확인 + 슬라이드 수락 + 카운트다운 초기화
  if(isDriver){
    _db.collection('yongcha_applies')
      .where('postId','==',d.id).where('driverId','==',_CU.uid).get()
      .then(function(snap){
        var btn=document.getElementById('apply-btn');
        if(btn&&!snap.empty){btn.textContent='이미 지원함';btn.disabled=true;}
        if(!snap.empty&&d.status==='open'){
          var sw=document.getElementById('slide-wrap');
          var st=document.getElementById('slide-track');
          if(sw)sw.style.opacity='.5';
          if(st)st.textContent='이미 지원한 공고예요';
        }
      });

    if(d.status==='open'){
      // 5초 카운트다운
      var _cdSec=5;
      var _cdInterval=setInterval(function(){
        _cdSec--;
        var numEl=document.getElementById('cd-num');
        var ring=document.getElementById('cd-ring');
        if(numEl)numEl.textContent=_cdSec;
        if(ring)ring.setAttribute('stroke-dashoffset',String(Math.round(144.5*(_cdSec)/5)));
        if(_cdSec<=0){clearInterval(_cdInterval);}
      },1000);

      // 슬라이드 수락 드래그
      setTimeout(function(){
        var thumb=document.getElementById('slide-thumb');
        var wrap=document.getElementById('slide-wrap');
        if(!thumb||!wrap)return;
        var maxX=wrap.offsetWidth-54;
        var dragging=false,startX=0;
        var getX=function(e){return e.touches?e.touches[0].clientX:e.clientX;};
        var onStart=function(e){
          dragging=true;startX=getX(e)-(parseInt(thumb.style.left)||4);
          thumb.style.transition='none';e.preventDefault();
        };
        var onMove=function(e){
          if(!dragging)return;
          e.preventDefault();
          var x=Math.max(4,Math.min(getX(e)-startX,maxX));
          thumb.style.left=x+'px';
          if(x>=maxX-2){
            dragging=false;
            thumb.classList.add('done');thumb.style.left=maxX+'px';
            var track=document.getElementById('slide-track');
            if(track)track.textContent='지원 완료!';
            clearInterval(_cdInterval);
            setTimeout(function(){_applyPost(d.id,d.agencyId,_jsq(d.agencyName));},250);
          }
        };
        var onEnd=function(){
          if(!dragging)return;dragging=false;
          var cur=parseInt(thumb.style.left)||4;
          if(cur<maxX-2){thumb.style.transition='left .22s var(--ease)';thumb.style.left='4px';}
        };
        thumb.addEventListener('touchstart',onStart,{passive:false});
        wrap.addEventListener('touchmove',onMove,{passive:false});
        wrap.addEventListener('touchend',onEnd);
        thumb.addEventListener('mousedown',onStart);
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onEnd);
      },150);
    }
  }
}

/* 지원하기.
   이전 버전은 postId 만 저장하고 노선 조건(courier/area/unitPrice/startDate/
   workShift/workDays/settleDay/minGuarantee)을 저장하지 않았다. 그 결과
   ① 계약서 terms 가 전부 빈 값, ② 내 노선 화면에 노선 정보 미표시,
   ③ 일일 건수 입력이 unitPrice=0 으로 수입 0원 계산 — 이 세 가지가 모두 깨졌다.
   여기서 공고 스냅샷을 함께 저장해 해결한다. */
function _applyPost(postId,agencyId,agencyName,btnEl){
  if(!_CU||_CU.type!=='driver'){_yToast('기사 회원만 지원할 수 있어요');return;}
  //  휴식 중 지원 차단 (로컬 상태로 1차 차단, 아래에서 서버 값으로 재확인)
  if(_yIsResting()){
    _yToast(' 휴식 중에는 지원할 수 없어요'+(_CU.restUntil?' ('+_CU.restUntil+'까지)':''));
    return;
  }
  var btn=btnEl||document.getElementById('apply-btn');
  var origTxt=btn?btn.textContent:'';
  if(btn){btn.textContent='지원 중...';btn.disabled=true;}
  var fail=function(msg){
    if(btn){btn.textContent=origTxt||'🙋 지원하기';btn.disabled=false;}
    _yToast(msg);
  };

  // 캐시에 있으면 재사용, 없으면 1회 조회
  var cached=(_allPosts||[]).filter(function(p){return p.id===postId;})[0];
  var getPost=cached?Promise.resolve(cached)
    :_db.collection('yongcha_posts').doc(postId).get().then(function(s){
        return s.exists?Object.assign({id:s.id},s.data()):null;});

  getPost.then(function(p){
    //  과로 방지 — 오늘 12시간 초과면 신규 배차 차단
    return _yLoadFatigue().then(function(f){
      if(f.blocked){
        fail(' 오늘 누적 '+f.hours+'시간 — 12시간 초과로 추가 지원이 제한됩니다');
        return null;
      }
      if(f.hours>=FATIGUE_WARN_H)_yToast('오늘 '+f.hours+'시간 운행 중 — 안전에 유의하세요');
      return p;
    });
  }).then(function(p){
    if(p===null)return null;
    // 휴식 상태를 서버 값으로 재확인 (다른 기기에서 승인됐을 수 있다)
    return _db.collection('yongcha_users').doc(_CU.uid).get().then(function(us){
      var u=us.exists?us.data():{};
      _CU.resting=!!u.resting;_CU.restUntil=u.restUntil||'';_CU.restId=u.restId||'';
      if(_yIsResting()){
        fail(' 휴식 중에는 지원할 수 없어요'+(_CU.restUntil?' ('+_CU.restUntil+'까지)':''));
        return null;
      }
      return p;
    });
  }).then(function(p){
    if(p===null)return null;
    // 중복 지원 방지 (UI 뿐 아니라 실제로 막는다)
    return _db.collection('yongcha_applies')
      .where('postId','==',postId).where('driverId','==',_CU.uid).limit(1).get()
      .then(function(dup){
        if(!dup.empty){fail('이미 지원한 공고예요');return null;}
        p=p||{};
        return _db.collection('yongcha_applies').add({
          postId:postId, jobId:'',
          driverId:_CU.uid, driverName:_CU.name,
          driverPhone:_CU.phone||'', driverRegion:_CU.region||'',
          agencyId:agencyId, agencyName:agencyName,
          // ── 노선 스냅샷 (계약서·정산·내노선이 참조) ──
          courier:p.courier||'', area:p.area||'', routeNo:p.routeNo||'',
          region:p.region||'', unitPrice:p.unitPrice||0, priceType:p.priceType||'건당',
          volume:p.volume||0, workShift:p.workShift||'', workDays:p.workDays||'',
          workHours:p.workHours||'', startDate:p.startDate||'',
          settleFreq:p.settleFreq||'', settleDay:p.settleDay||'',
          minGuarantee:p.minGuarantee||0, vatIncluded:p.vatIncluded||'',
          status:'pending',
          appliedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      });
  }).then(function(ref){
    if(!ref)return;
    // 지원자 수 카운터 (카드에 표시되지만 지금까지 증가하지 않았음)
    _db.collection('yongcha_posts').doc(postId).update({
      applicantCount:firebase.firestore.FieldValue.increment(1)
    }).catch(function(){});
    if(btn){btn.textContent='지원함';btn.disabled=true;}
    _yToast('지원 완료! 대리점 승인을 기다려주세요');
    _yNotify(agencyId,'새 지원자 도착! 🚗',_CU.name+'님이 노선공고에 지원했어요','apply');
    _closeModal();
  }).catch(function(e){ fail('오류: '+e.message); });
}

/* 지원 취소 — 대리점 검토 전(pending)에만 가능 */
function _yCancelApply(applyId,postId){
  if(!confirm('지원을 취소할까요?'))return;
  _db.collection('yongcha_applies').doc(applyId).delete().then(function(){
    if(postId){
      _db.collection('yongcha_posts').doc(postId).update({
        applicantCount:firebase.firestore.FieldValue.increment(-1)
      }).catch(function(){});
    }
    _yToast('지원을 취소했어요');
    _pgMyApplies(document.getElementById('content'));
  }).catch(function(e){_yToast('오류: '+e.message);});
}

/* 상태 전환: open → closed(마감), matched → closed(완료), closed → open(재오픈)
   이전 버전은 matched 를 open 으로 되돌려 버튼 라벨('완료처리')과 동작이 어긋났다.
   운행중 노선을 완료 처리하면 배차 기사들의 완료 건수를 올려 등급에 반영한다. */
function _togglePost(id,status){
  var next=(status==='closed')?'open':'closed';
  var wasMatched=(status==='matched');
  _db.collection('yongcha_posts').doc(id).update({status:next}).then(function(){
    _yToast(next==='open'?'공고 재오픈됐어요':wasMatched?'운행 완료 처리됐어요':'공고 마감됐어요');
    if(wasMatched)_yCompleteRoutes(id);
    _pgMyPosts(document.getElementById('content'));
  }).catch(function(e){_yToast('오류: '+e.message);});
}

/* 노선 완료 → 연결 확정된 기사들의 completedRoutes +1 (신뢰등급 반영)
   지금까지 completedRoutes 를 올리는 코드가 어디에도 없어 모든 기사가
   영원히 '새내기' 등급에 머물렀다. */
function _yCompleteRoutes(postId){
  _db.collection('yongcha_applies').where('postId','==',postId).where('status','==','approved').get()
  .then(function(snap){
    snap.forEach(function(doc){
      var a=doc.data();
      if(!a.driverId||a.routeCompleted)return;   // 중복 집계 방지
      // status 는 'approved' 로 유지 — 평가/계약서 UI가 이 값을 참조한다
      doc.ref.update({routeCompleted:true,completedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(e){console.error('routeCompleted update fail',e);});
      _db.collection('yongcha_users').doc(a.driverId).update({
        completedRoutes:firebase.firestore.FieldValue.increment(1)
      }).then(function(){
        _calcTrustScore(a.driverId);
        _yNotify(a.driverId,'노선 운행 완료','완료 노선 1건이 기록됐어요. 대리점을 평가해주세요!','work');
      }).catch(function(e){console.error('completedRoutes update fail',e);});
    });
  }).catch(function(e){_yToast('완료 처리 실패: '+e.message);});
}

function _judgeApply(applyId,status,name,driverId){
  if(_CU.type==='driver'){_yToast('소장/관리자 전용 기능이에요');return;}
  _db.collection('yongcha_applies').doc(applyId).update({
    status:status,judgedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast(status==='approved'?name+'님 승인했어요!':'거절했어요');
    if(driverId){
      if(status==='approved'){
        _db.collection('yongcha_applies').doc(applyId).get().then(function(ap){
          if(!ap.exists)return;
          var a=ap.data();
          var postTitle=a.area||a.courier||'노선';
          var unitPrice=a.unitPrice||0;
          var startDate=a.startDate||'미정';
          // FCM 상세 알림
          _yNotify(driverId,' 연결 확정되었습니다!',
            _CU.name+'\n📍 노선: '+postTitle+' | 💰 건당 금액: '+unitPrice+'원/건 | 📅 시작: '+startDate,'dispatch');
          // 채팅방 자동 생성 + 첫 메시지
          _yAutoChat(driverId,name,a,postTitle,unitPrice,startDate);
          // 계약서 초안 생성
          _db.collection('yongcha_contracts').add({
            applyId:applyId,postId:a.postId||'',
            agencyId:_CU.uid,agencyName:_CU.name,
            driverId:driverId,driverName:name,
            status:'pending_sign',agencySigned:false,driverSigned:false,
            terms:{courier:a.courier||'',area:a.area||'',unitPrice:unitPrice,
                   workShift:a.workShift||'',workDays:a.workDays||'',
                   settleFreq:a.settleFreq||'',settleDay:a.settleDay||'',
                   minGuarantee:a.minGuarantee||0,startDate:startDate},
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
          }).then(function(ref){
            _db.collection('yongcha_applies').doc(applyId).update({contractId:ref.id}).catch(function(e){console.error('contractId link fail',e);});
          }).catch(function(e){_yToast('합의서 생성 실패: '+e.message);});
        }).catch(function(e){_yToast('지원 승인 저장 실패: '+e.message);});
      } else {
        _yNotify(driverId,'지원 결과 안내',_CU.name+'에서 지원 검토가 완료됐어요','apply');
      }
    }
    _closeModal();
    _pgHome(document.getElementById('content'));
  });
}

function _yAutoChat(driverId,driverName,applyData,postTitle,unitPrice,startDate){
  var ids=[_CU.uid,driverId].sort();
  var chatId=ids[0]+'__'+ids[1];
  var chatRef=_db.collection('yongcha_chats').doc(chatId);
  var names={};names[_CU.uid]=_CU.name;names[driverId]=driverName;
  var types={};types[_CU.uid]='agency';types[driverId]='driver';
  var unread={};unread[_CU.uid]=0;unread[driverId]=1;
  var phones={};phones[driverId]=applyData.driverPhone||'';phones[_CU.uid]=_CU.phone||'';
  var firstMsg=' 연결 확정되었습니다! 운행 시작 일정을 조율해주세요 😊\n📍 노선: '+postTitle+'\n💰 건당 금액: '+unitPrice+'원/건\n📅 시작일: '+startDate;
  chatRef.set({
    participants:[_CU.uid,driverId],
    participantNames:names,participantTypes:types,participantPhones:phones,
    lastMessage:firstMsg,lastAt:firebase.firestore.FieldValue.serverTimestamp(),
    unread:unread,createdAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).then(function(){
    chatRef.collection('messages').add({
      senderId:'system',senderName:'시스템',text:firstMsg,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(){});
  }).catch(function(){});
}

  var d=(document.getElementById('confirm-start-date')||{}).value;

  var batch=_db.batch();
  batch.update(_db.collection('yongcha_applies').doc(applyId),{
    startConfirmed:true,confirmedStartDate:d
  });
  if(postId){
    batch.update(_db.collection('yongcha_posts').doc(postId),{
      status:'matched',matchedDriverId:_CU.uid,matchedAt:firebase.firestore.FieldValue.serverTimestamp()

  batch.commit().then(function(){

function _yCalcDailyEst(unitPrice){
  var cnt=parseInt((document.getElementById('daily-count')||{}).value)||0;
  var est=cnt*unitPrice;
  var estEl=document.getElementById('daily-est');
  var valEl=document.getElementById('daily-est-val');
  if(estEl)estEl.style.display=cnt>0?'block':'none';
  if(valEl)valEl.textContent=est.toLocaleString()+'원';
}

function _ySaveDailyRecord(applyId,date,unitPrice){
  var cnt=parseInt((document.getElementById('daily-count')||{}).value)||0;
  if(!cnt){_yToast('건수를 입력해주세요');return;}
  var memo=(document.getElementById('daily-memo')||{}).value||'';
  // Get apply data for context
  _db.collection('yongcha_applies').doc(applyId).get().then(function(ap){
    if(!ap.exists)return;
    var a=ap.data();
    var recordId=_CU.uid+'_'+date;
    _db.collection('yongcha_daily_records').doc(recordId).set({
      applyId:applyId,postId:a.postId||'',
      driverId:_CU.uid,driverName:_CU.name,
      agencyId:a.agencyId||'',agencyName:a.agencyName||'',
      date:date,count:cnt,unitPrice:unitPrice,
      amount:cnt*unitPrice,memo:memo,status:'pending',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      _yToast('건수 저장됐어요! '+cnt+'건 / '+Number(cnt*unitPrice).toLocaleString()+'원');
      _yNotify(a.agencyId||'','📦 오늘 건수 등록',_CU.name+'님 '+date+' '+cnt+'건 등록','work');
      _closeModal();
    });
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _weekStart(){
  var now=new Date(),day=now.getDay()||7;
  var mon=new Date(now);mon.setDate(now.getDate()-day+1);mon.setHours(0,0,0,0);
  return mon.toISOString().split('T')[0];
}

function _yShowWeeklyDriver(el){
  var weekStart=_weekStart();
  el.innerHTML='<div style="font-size:14px;font-weight:800;margin-bottom:10px"> 이번 주 정산 현황</div>'+
  '<div id="weekly-driver-list">'+_skRows(2)+'</div>';
  _db.collection('yongcha_daily_records').where('driverId','==',_CU.uid).where('date','>=',weekStart)
  .get().then(function(snap){
    var list=document.getElementById('weekly-driver-list');if(!list)return;
    if(snap.empty){list.innerHTML='<div style="font-size:12px;color:var(--t2);text-align:center;padding:12px">이번 주 입력된 건수가 없어요</div>';return;}
    var totalCnt=0,totalAmt=0;
    var rows='';
    var _rDocs=snap.docs.sort(function(a,b){return a.data().date<b.data().date?-1:1;});
    _rDocs.forEach(function(doc){
      var r=doc.data();
      totalCnt+=r.count||0;totalAmt+=r.amount||0;
      rows+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--bd)">'+

        (r.status==='confirmed'?'확인됨':'대기')+'</span></div>';
    });
    list.innerHTML=
      '<div style="background:var(--gnl);border-radius:10px;padding:12px;margin-bottom:10px;text-align:center">'+
      '<div style="font-size:12px;color:var(--t2)">주간 합계</div>'+
      '<div style="font-size:22px;font-weight:900;color:var(--gn)">'+Number(totalAmt).toLocaleString()+'원</div>'+
      '<div style="font-size:12px;color:var(--t3)">총 '+totalCnt+'건</div></div>'+
      '<div>'+rows+'</div>';
  }).catch(function(){});
}

  .get().then(function(snap){
    var list=document.getElementById('weekly-agency-list');if(!list)return;
    if(snap.empty){list.innerHTML='<div style="font-size:12px;color:var(--t2);text-align:center;padding:12px">이번 주 기사 건수 데이터가 없어요</div>';return;}

      byDriver[r.driverId].cnt+=r.count||0;

    var html='';

function _signContract(contractId, role){
  var field=role==='agency'?'agencySigned':'driverSigned';
  var upd={};upd[field]=true;upd[field+'At']=firebase.firestore.FieldValue.serverTimestamp();
  _db.collection('yongcha_contracts').doc(contractId).update(upd).then(function(){
    // 양쪽 모두 서명했는지 확인
    _db.collection('yongcha_contracts').doc(contractId).get().then(function(snap){
      if(!snap.exists)return;
      var c=snap.data();
      if(c.agencySigned&&c.driverSigned){
        _db.collection('yongcha_contracts').doc(contractId).update({
          status:'signed',signedAt:firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
          _yToast('🤝 합의가 완료됐어요!');
          // 상대방에게 알림
          var otherId=role==='agency'?c.driverId:c.agencyId;
          var otherName=role==='agency'?c.driverName:c.agencyName;
          _yNotify(otherId,'합의 완료 🤝',_CU.name+'과 합의 메모가 완료됐어요!','contract');
        });
      } else {
        _yToast('확인했어요. 상대방 확인을 기다리는 중이에요.');
        var otherId=role==='agency'?c.driverId:c.agencyId;
        _yNotify(otherId,'합의서 확인 요청 📝',_CU.name+'이 합의 메모를 확인했어요. 확인해주세요!','contract');
      }
    });
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _applyPostTemplate(key){
  var t=_POST_TEMPLATES[key];
  if(!t)return;
  var courier=document.getElementById('pw-courier');
  if(courier)courier.value=t.courier||'';
  var type=document.getElementById('pw-type');
  if(type){type.value=t.type||'';
    document.querySelectorAll('#pw-type-group button').forEach(function(b){
      var on=b.textContent.trim()===t.type;
      b.style.background=on?'var(--acl)':'transparent';
      b.style.color=on?'var(--ac)':'var(--t2)';
      b.style.borderColor=on?'var(--ac)':'var(--bd)';
    });
  }
  var shift=document.getElementById('pw-shift');
  if(shift){shift.value=t.workShift||'';
    document.querySelectorAll('#pw-shift-group button').forEach(function(b){
      var on=b.textContent.trim()===t.workShift;
      b.style.background=on?'var(--acl)':'transparent';
      b.style.color=on?'var(--ac)':'var(--t2)';
      b.style.borderColor=on?'var(--ac)':'var(--bd)';
    });
  }
  var vehicle=document.getElementById('pw-vehicle');
  if(vehicle)vehicle.value=t.vehicleType||'';
  var settleDay=document.getElementById('pw-settleDay');
  if(settleDay)settleDay.value=t.settleDay||'';
  var desc=document.getElementById('pw-desc');
  if(desc)desc.value=t.desc||'';
  _yToast('템플릿 적용 완료. 단가·지역을 입력하세요.');
}

function _selType(btn, val, hiddenId){
  var grpId = btn.parentElement.id;
  document.querySelectorAll('#'+grpId+' button').forEach(function(b){
    b.style.background='transparent';
    b.style.color='var(--t2)';
    b.style.borderColor='var(--border)';
  });
  btn.style.background='var(--acl)';
  btn.style.color='var(--ac)';
  btn.style.borderColor='var(--ac)';
  var h=document.getElementById(hiddenId);
  if(h) h.value=val;
  // 가구당 금액 필드 토글
  if(hiddenId==='pw-pricetype'){
    var wrap=document.getElementById('pw-houseprice-wrap');
    if(wrap) wrap.style.display=(val==='가구당'||val==='건당+가구당')?'block':'none';
  }
  // 최소보장 표시 업데이트
  if(hiddenId==='pw-shift'){
    var g=document.getElementById('pw-guarantee-display');
    if(g) g.textContent=val==='야간'?'야간: 일 35만원 (소장 설정)':'주간: 일 30만원 (소장 설정)';
  }
}

var _selectedDays=[];
function _toggleDay(btn, day){
  var idx=_selectedDays.indexOf(day);
  if(idx>=0){
    _selectedDays.splice(idx,1);
    btn.style.background='transparent';
    btn.style.color='var(--t2)';
    btn.style.borderColor='var(--border)';
  } else {
    _selectedDays.push(day);
    btn.style.background='var(--acl)';
    btn.style.color='var(--ac)';
    btn.style.borderColor='var(--ac)';
  }
}

var _selectedExtras=[];
function _toggleExtra(btn){

    _selectedExtras.splice(idx,1);

var _isUrgent=false;
function _toggleUrgent(){
  _isUrgent=!_isUrgent;
  document.getElementById('toggle-urgent').classList.toggle('on',_isUrgent);
}
var _regionStatsTimer=null;
function _loadRegionStats(){
  clearTimeout(_regionStatsTimer);
  _regionStatsTimer=setTimeout(function(){
    var courier=(document.getElementById('pw-courier')||{}).value||'';
    var region=_CU&&_CU.region||'';
    if(!courier||!region)return;
    var statsKey=region+'_'+courier;
    _db.collection('yongcha_stats').doc(statsKey).get().then(function(snap){
      var el=document.getElementById('pw-region-stats');
      if(!el)return;
      if(!snap.exists){el.style.display='none';return;}
      var s=snap.data();
      var avg=Math.round(s.avgUnitPrice||0);
      if(!avg){el.style.display='none';return;}
      var price=parseInt((document.getElementById('pw-price')||{}).value)||0;
      var pct=price&&avg?Math.round(price/avg*100):100;
      var warn=price&&avg&&pct<70;
      el.style.display='block';
      el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between">'+
        '<span style="color:var(--t2)"> 이 지역·택배사 현재 평균</span>'+
        '<span style="font-weight:900;color:var(--br)">'+avg.toLocaleString()+'원/건</span>'+
        '</div>'+
        (s.postCount?'<div style="color:var(--t3);margin-top:2px">최근 공고 '+s.postCount+'건 기준</div>':'')+
        (warn?'<div style="color:var(--rd);font-weight:700;margin-top:4px">입력 단가가 평균의 70% 미만입니다</div>':'');
    }).catch(function(){});
  },600);
}
function _calcEst(){
  var v=parseInt((document.getElementById('pw-volume')||{}).value)||0;
  var p=parseInt((document.getElementById('pw-price')||{}).value)||0;
  var dayEst=Math.round(v*p/10000);
  var disp=document.getElementById('pw-est-display');
  var val=document.getElementById('pw-est-val');
  if(disp&&val&&dayEst>0){
    disp.style.display='block';
    var shift=(document.getElementById('pw-shift')||{}).value||'주간';
    var minG=shift==='야간'?35:30;
    var actual=Math.max(dayEst,minG);
    val.textContent='약 '+dayEst+'만원/일 (최소보장 적용시 '+actual+'만원)';
  }
}

function _submitPost(){
  var get=function(id){return(document.getElementById(id)||{}).value||'';};
  var courier=get('pw-courier'), area=get('pw-area'), volume=get('pw-volume');
  var price=get('pw-price'), areaType=get('pw-areaType'), date=get('pw-date');
  var hours=get('pw-hours'), desc=get('pw-desc'), routeNo=get('pw-routeNo');
  var postType=get('pw-type'), workShift=get('pw-shift'), vatIncluded=get('pw-vat');
  var vehicle=get('pw-vehicle'), plate=get('pw-plate'), settle=get('pw-settle');
  var settleDay=get('pw-settleDay'), endDate=get('pw-enddate');
  var priceType=get('pw-pricetype'), housePrice=get('pw-houseprice');
  var aptRatio=get('pw-apt'), loadingAddr=get('pw-loadingAddr');
  var loadingLat=parseFloat(get('pw-loadingLat'))||null;
  var loadingLng=parseFloat(get('pw-loadingLng'))||null;
  var btn=document.getElementById('submit-btn');

  if(!courier||!area||!volume||!price||!settleDay){
    _yToast('필수 항목을 입력하세요 (택배사/구역/물량/단가/정산일)');return;
  }
  if(!loadingAddr){
    _yToast('상차지 주소를 입력하세요');return;
  }

  // 허위공고 누적 제재 확인
  if(_CU.postSuspended){
    _yToast('허위공고 10건 이상 — 공고 등록이 영구 정지됐어요. 관리자에게 문의하세요.');return;
  }
  if((_CU.fakeCount||0)>=5&&_CU.postRestrictedAt){
    var restrictedDate=_CU.postRestrictedAt.toDate?_CU.postRestrictedAt.toDate():new Date(_CU.postRestrictedAt);
    var threeDaysAgo=new Date(Date.now()-3*24*60*60*1000);
    if(restrictedDate>threeDaysAgo){
      _yToast('허위공고 5건 이상 — 최근 신고 후 3일간 공고 등록이 제한됩니다');return;
    }
  }
  if((_CU.fakeCount||0)>=3){
    _yToast('주의: 허위공고 신고 3건 이상으로 "주의" 대리점으로 표시됩니다');
  }

  var minGuarantee = parseInt((document.getElementById('pw-guarantee')||{}).value||'')||0;

  // ★ 재진입 잠금 — 버튼 disabled 만으로는 엔터 연타·중복 호출을 못 막는다
  if(window._ySubmitLock){_yToast('처리 중이에요…');return;}
  window._ySubmitLock=true;
  var _unlock=function(){window._ySubmitLock=false;};

  btn.textContent='확인 중...';btn.disabled=true;

  // 중복 공고 방지: 24시간 내 동일 지문(대리점+택배사+구역+노선번호+단가+시작일)
  var cutoff=new Date(Date.now()-24*60*60*1000);
  var myKey=_yPostKey({agencyId:_CU.uid,courier:courier,area:area,routeNo:routeNo,
                       unitPrice:parseInt(price),startDate:date,workShift:workShift});
  _db.collection('yongcha_posts')
    .where('agencyId','==',_CU.uid)
    .where('courier','==',courier)
    .where('area','==',area)
    .get()
    .then(function(dupSnap){
      var hasDup=false;
      dupSnap.forEach(function(d){
        var v=d.data();
        var ct=v.createdAt;
        if(ct&&ct.toDate&&ct.toDate()>cutoff&&_yPostKey(v)===myKey) hasDup=true;
      });
      if(hasDup){
        _yToast('동일한 공고가 24시간 내 이미 등록됐어요');
        btn.textContent=' 공고 등록하기';btn.disabled=false;_unlock();
        return;
      }
      btn.textContent='등록 중...';
      return _db.collection('yongcha_posts').add({
        agencyId:_CU.uid, agencyName:_CU.name, agencyRating:_CU.rating||0,
        region:_CU.region, courier:courier, area:area, routeNo:routeNo,
        loadingAddr:loadingAddr, loadingLat:loadingLat, loadingLng:loadingLng,
        zones:window._zones||[], areaAptRatio:aptRatio?parseInt(aptRatio):null,
        postType:postType, workShift:workShift, workDays:_selectedDays.join(','),
        workHours:hours, startDate:date, endDate:endDate,
        vehicleType:vehicle, plateType:plate,
        priceType:priceType||'건당', unitPrice:parseInt(price),
        housePricePerUnit:housePrice?parseInt(housePrice):null,
        vatIncluded:vatIncluded, volume:parseInt(volume),
        minGuarantee:minGuarantee, areaType:areaType,
        settleFreq:settle, settleDay:settleDay,
        extras:_selectedExtras.join(','), desc:desc,
        urgent:_isUrgent, status:'open',
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }).then(function(){
        _yToast('공고가 등록됐어요!');
        if(_isUrgent){
          _yGetToken().then(function(tok){
            return _db.collection('yongcha_fcm_tokens').where('type','==','driver').where('region','==',_CU.region).get()
              .then(function(snap){
                snap.forEach(function(doc){
                  var t=doc.data().token;
                  if(t) fetch('/api/ctrl-notify',{method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
                    body:JSON.stringify({token:t,title:'긴급공고',body:_CU.region+' 새 긴급 노선공고가 등록됐어요!'})}).catch(function(){});
                });
              });
          }).catch(function(){});
        }
        _isUrgent=false; _selectedDays=[]; _selectedExtras=[]; window._zones=[];
        // 지역 시세 통계 업데이트
        if(_CU.region&&courier&&parseInt(price)){
          var statsKey=_CU.region+'_'+courier;
          _db.collection('yongcha_stats').doc(statsKey).get().then(function(snap){
            var s=snap.exists?snap.data():{avgUnitPrice:0,postCount:0};
            var newCount=(s.postCount||0)+1;
            var newAvg=Math.round(((s.avgUnitPrice||0)*(s.postCount||0)+parseInt(price))/newCount);
            _db.collection('yongcha_stats').doc(statsKey).set({
              region:_CU.region,courier:courier,avgUnitPrice:newAvg,postCount:newCount,
              updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            },{merge:true}).catch(function(){});
          }).catch(function(){});
        }
        _unlock();
        _goPage('my_posts');
      }).catch(function(e){
        btn.textContent=' 공고 등록하기';btn.disabled=false;_unlock();
        _yToast('오류: '+e.message);
      });
    }).catch(function(e){
      btn.textContent=' 공고 등록하기';btn.disabled=false;_unlock();
      _yToast('오류: '+e.message);
    });
}

function _pgMyApplies(el){
  if(_CU.type!=='driver'){

      '<div class="page-sub">기사 전용 기능이에요</div></div>';
    return;
  }

  '<div class="page-sub">내가 지원한 공고 목록이에요</div></div>'+
  '<div id="applies-list">'+_skRows(3)+'</div>';

  var appliesP=_db.collection('yongcha_applies').where('driverId','==',_CU.uid).get();
  var scoutsP=_db.collection('yongcha_scouts').where('driverId','==',_CU.uid).get();

  Promise.all([appliesP,scoutsP]).then(function(results){
    var apSnap=results[0], scSnap=results[1];

        var statusMap={pending:'미응답',accepted:'수락',rejected:'거절'};
        var date=s.createdAt?new Date(s.createdAt.seconds*1000).toLocaleDateString():'—';
        var card=document.createElement('div');card.className='card';
        card.style.borderColor='var(--pu)';
        card.innerHTML=
          '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
          '<div style="font-weight:800;color:var(--pu)">💌 '+_esc(s.agencyName)+'</div>'+
          '<span style="font-size:11px;color:var(--t2)">'+date+'</span></div>'+
          '<div class="n-desc" style="margin-bottom:10px">'+_esc(s.message)+'</div>'+
          (s.status==='pending'?
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          '<button onclick="_replyScout(\''+s.id+'\',true)" style="padding:8px;background:var(--gnl);color:var(--gn);border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">수락</button>'+

          );
        scDiv.appendChild(card);
      });
      list.appendChild(scDiv);
    }

      list.innerHTML='<div class="empty"><div class="empty-ico">📭</div><div class="empty-msg">지원한 공고가 없어요<br>노선 공고를 찾아보세요</div></div>';return;

  el.innerHTML=
  '<div class="page-hdr"><div class="page-title"> 내 노선</div>'+
  '<div class="page-sub">운행 중인 노선이에요</div></div>'+
  '<div id="fatigue-banner"></div>'+
  '<div id="myroutes-cal" style="margin-bottom:14px"></div>'+
  '<div id="myroutes-weekly"></div>'+
  '<div id="myroutes-list">'+_skRows(3)+'</div>';
  _yRenderFatigue(document.getElementById('fatigue-banner'));

  _yShowWeeklyDriver(document.getElementById('myroutes-weekly'));
  _renderRouteCalendar(document.getElementById('myroutes-cal'));

  _db.collection('yongcha_applies').where('driverId','==',_CU.uid).where('status','==','approved')
  .get().then(function(snap){
    var list=document.getElementById('myroutes-list');if(!list)return;
    if(snap.empty){list.innerHTML='<div class="empty"><div class="empty-ico"></div><div class="empty-msg">운행중인 노선이 없어요<br>노선 공고에 지원해보세요</div></div>';return;}
    list.innerHTML='<div style="font-size:13px;font-weight:800;color:var(--t2);margin-bottom:8px"> 운행중 노선</div>';
    var _docs=snap.docs.sort(function(a,b){return (b.data().judgedAt&&b.data().judgedAt.seconds||0)-(a.data().judgedAt&&a.data().judgedAt.seconds||0);});
    _docs.forEach(function(doc){
      var a=Object.assign({id:doc.id},doc.data());
      var step=typeof a.step==='number'?a.step:1;
      // 멀티스톱 내비 URL 조립
      var zones=a.zones||[];
      var zCoord=zones.filter(function(z){return typeof z.lat==='number'&&typeof z.lng==='number';});
      var tmapUrl='',kakaoNavUrl='';
      if(zCoord.length>0){
        var goal=zCoord[zCoord.length-1];
        var vias=zCoord.slice(0,-1);
        var tp=_myGeo?'startX='+_myGeo.lng+'&startY='+_myGeo.lat+'&startName='+encodeURIComponent('현재위치')+'&':'';
        tp+='goalX='+goal.lng+'&goalY='+goal.lat+'&goalName='+encodeURIComponent(goal.name||a.area||'목적지');
        vias.forEach(function(z,i){tp+='&via'+(i+1)+'X='+z.lng+'&via'+(i+1)+'Y='+z.lat+'&via'+(i+1)+'Name='+encodeURIComponent(z.name||'');});
        tmapUrl='tmap://route?'+tp;
        var kSp=_myGeo?(_myGeo.lat+','+_myGeo.lng):(zCoord[0].lat+','+zCoord[0].lng);
        kakaoNavUrl='kakaomap://route?sp='+kSp+'&ep='+goal.lat+','+goal.lng;
      } else if(a.area||a.region){
        var navQ=encodeURIComponent(a.area||a.region||'');
        tmapUrl='tmap://search?name='+navQ;
        kakaoNavUrl='kakaomap://search?q='+navQ;
      }
      // 노쇼 타이머 — step=1인 경우, 픽업지 좌표 있으면 12분 후 체크
      if(step===1&&zCoord.length>0&&!a.noShowWarned){
        _yStartNoShowTimer(a.id,zCoord[0].lat,zCoord[0].lng,12);
      }
      var stepLabel=['수락','현장도착','완료'];
      var stSt=['done','done','done'];
      if(step<3)stSt[2]='';if(step<2)stSt[1]='';
      var activeIdx=step<3?step:'';
      if(activeIdx!=='')stSt[activeIdx]='active';
      // step 진행도 %
      var progPct=[0,33,66,100][Math.min(step,3)];
      var card=document.createElement('div');card.className='card';
      card.style.cssText='margin-bottom:12px;border-color:'+(step===1?'var(--acln)':step===2?'var(--gnln)':'var(--bd)');
      card.innerHTML=
        // 진행 바 + step=1일 때 경과 시간 타이머
        '<div style="height:4px;border-radius:4px;background:var(--bd2);margin-bottom:'+(step===1?'8':'14')+'px;overflow:hidden">'+
          '<div style="height:100%;width:'+progPct+'%;border-radius:4px;background:'+
            (step>=3?'var(--gn)':'var(--ac)')+';transition:width .5s var(--ease)"></div>'+
        '</div>'+
        (step===1&&a.judgedAt?
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;'+
            'padding:8px 12px;background:rgba(37,99,235,.12);border:1px solid var(--acln);border-radius:10px">'+
            '<div style="font-size:11px;color:var(--t2);font-weight:700">수락 후 경과</div>'+
            '<div class="route-timer" data-ts="'+(a.judgedAt.seconds||0)+'" style="font-size:20px;font-weight:900;color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:-1px">00:00:00</div>'+
          '</div>'
        :'')+
        (step===2?
          '<div id="route-map-'+a.id+'" style="width:100%;height:160px;border-radius:12px;background:var(--bg3);margin-bottom:10px;overflow:hidden"></div>'
        :'')+
        '<div class="wstep-row">'+
        stepLabel.map(function(lbl,i){
          var cls='wstep '+(stSt[i]||'');
          var dot=stSt[i]==='done'?
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':
            (i+1);
          return '<div class="'+cls+'"><div class="wstep-dot">'+dot+'</div><div class="wstep-lbl">'+lbl+'</div></div>';
        }).join('')+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
        '<div style="font-weight:800;font-size:15px">'+_esc(a.agencyName||'—')+'</div>'+
        '<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:'+(step>=3?'var(--acl)':'var(--gnl)')+';color:'+(step>=3?'var(--ac)':'var(--gn)')+'">'+
        (step>=3?'완료':'운행중')+'</span></div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">'+
        (a.courier?'<span style="font-size:11.5px;color:var(--t2);background:var(--bg3);padding:3px 8px;border-radius:6px">'+_esc(a.courier)+'</span>':'')+
        (a.area?'<span style="font-size:11.5px;color:var(--t2);background:var(--bg3);padding:3px 8px;border-radius:6px">'+_esc(a.area)+'</span>':'')+
        (a.unitPrice?'<span style="font-size:11.5px;color:var(--br);background:var(--brl);padding:3px 8px;border-radius:6px;font-weight:800">'+_won(a.unitPrice)+'원/건</span>':'')+
        (a.confirmedStartDate?'<span style="font-size:11.5px;color:var(--t3);padding:3px 0">시작 '+_esc(a.confirmedStartDate)+'</span>':'')+
        (zCoord.length>1?'<span style="font-size:10.5px;color:var(--gn);background:var(--gnl);padding:3px 8px;border-radius:6px">'+zCoord.length+'개 구역 멀티경유</span>':'')+
        '</div>'+
        // 내비 버튼
        (tmapUrl||kakaoNavUrl?
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
        (tmapUrl?'<a href="'+_esc(tmapUrl)+'" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;background:var(--acl);border:1px solid var(--acln);border-radius:10px;color:var(--ac);font-size:12px;font-weight:800;text-decoration:none">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>Tmap 내비</a>':'<span></span>')+
        (kakaoNavUrl?'<a href="'+_esc(kakaoNavUrl)+'" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;background:var(--brl);border:1px solid var(--brln);border-radius:10px;color:var(--br);font-size:12px;font-weight:800;text-decoration:none">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>카카오내비</a>':'<span></span>')+
        '</div>'
        :'')+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
        '<button onclick="_openChatRoom(\''+a.agencyId+'\',\''+_jsq(a.agencyName)+'\',\'agency\')" style="min-height:var(--tap);background:var(--bg3);border:none;border-radius:10px;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">채팅</button>'+
        '<button onclick="_yInputDaily(\''+a.id+'\','+(a.unitPrice||0)+')" style="min-height:var(--tap);background:var(--gnl);color:var(--gn);border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">건수 입력</button>'+
        (!a.startConfirmed?'<button onclick="_yConfirmStart(\''+a.id+'\',\''+(a.postId||'')+'\')" style="min-height:var(--tap);background:var(--brl);color:var(--br);border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;grid-column:span 2">운행 시작 확정</button>':'')+
        (a.contractId?'<button onclick="_showContract(\''+a.contractId+'\')" style="min-height:var(--tap);background:var(--bg3);border:1.5px solid var(--gn);border-radius:10px;color:var(--gn);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;grid-column:span 2">합의서 보기</button>':'')+
        (step===1?'<button onclick="_yCancelNoShowTimer(\''+a.id+'\');_yArriveWork(\''+a.id+'\')" style="min-height:54px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;grid-column:span 2;box-shadow:0 8px 24px -8px rgba(37,99,235,.6)">현장 도착 확인</button>':'')+
        (step===2?'<button onclick="_yCompleteWork(\''+a.id+'\')" style="min-height:54px;background:linear-gradient(135deg,var(--gn),#059669);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;grid-column:span 2;box-shadow:0 8px 24px -8px rgba(16,185,129,.6)">완료 사진 업로드 + 정산 요청</button>':'')+
        (step>=3?'<button onclick="_showWorkCert(\''+a.id+'\')" style="min-height:var(--tap);background:var(--pul);border:1px solid var(--puln);border-radius:10px;color:var(--pu);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;grid-column:span 2">전자 확인서 보기</button>':'')+
        '</div>';
      list.appendChild(card);
      // step=2: 배송 중 미니맵 (카카오 지도 + 구역 핀)
      if(step===2&&zones.length>0){
        setTimeout(function(){
          var mapEl=document.getElementById('route-map-'+a.id);
          if(!mapEl)return;
          _loadKakaoMap(function(){
            var coords=zCoord.length>0?zCoord:null;
            var center=coords?new kakao.maps.LatLng(coords[0].lat,coords[0].lng):new kakao.maps.LatLng(35.1796,129.0756);
            if(_myGeo)center=new kakao.maps.LatLng(_myGeo.lat,_myGeo.lng);
            var rm=new kakao.maps.Map(mapEl,{center:center,level:6});
            // 현재 위치 마커
            if(_myGeo){
              new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(_myGeo.lat,_myGeo.lng),
                content:'<div style="width:14px;height:14px;border-radius:50%;background:#2563eb;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(37,99,235,.7)"></div>',
                yAnchor:0.5,xAnchor:0.5,map:rm});
            }
            // 구역 핀 연결
            var path=[];
            coords&&coords.forEach(function(z,i){
              var pos=new kakao.maps.LatLng(z.lat,z.lng);
              path.push(pos);
              new kakao.maps.CustomOverlay({position:pos,
                content:'<div style="background:#f59e0b;color:#000;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:10px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.4)">'+(i+1)+'</div>',
                yAnchor:0.5,xAnchor:0.5,map:rm});
            });
            if(path.length>1){
              new kakao.maps.Polyline({path:path,strokeWeight:2.5,strokeColor:'#f59e0b',strokeOpacity:.8,strokeStyle:'dashed',map:rm});
            }
          });
        },200);
      }
    });
    // 수락 후 경과 타이머 — 모든 카드 렌더 후 일괄 시작
    var _timerEl=list.querySelectorAll('.route-timer');
    _timerEl.forEach(function(el){
      var ts=parseInt(el.getAttribute('data-ts'),10)*1000;
      function tick(){
        var elapsed=Math.floor((Date.now()-ts)/1000);
        if(elapsed<0)elapsed=0;
        var h=Math.floor(elapsed/3600),m=Math.floor((elapsed%3600)/60),s=elapsed%60;
        el.textContent=(h?String(h).padStart(2,'0')+':':'')+(String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));
      }
      tick();
      var _t=setInterval(function(){if(!document.contains(el)){clearInterval(_t);return;}tick();},1000);
    });
  }).catch(function(e){
    var list=document.getElementById('myroutes-list');
    if(list)list.innerHTML='<div class="empty"><div class="empty-msg">'+e.message+'</div></div>';
  });
}

/* ── 운행 캘린더 ──
   이전 버전은 has-route 클래스를 어디에도 붙이지 않아 범례만 있고
   실제 운행일 표시가 전혀 되지 않았다. 이번엔 yongcha_daily_records 의
   이번 달 기록을 읽어 실제 운행일·건수·수입을 칠한다. */
function _renderRouteCalendar(el){
  if(!el||!_CU)return;
  var now=new Date();
  var year=now.getFullYear(), month=now.getMonth();
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var today=now.getDate();
  var monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var pad=function(n){return (n<10?'0':'')+n;};
  var monthStart=year+'-'+pad(month+1)+'-01';
  var monthEnd=year+'-'+pad(month+1)+'-'+pad(daysInMonth);

  var draw=function(records){
    var byDay={},totalCnt=0,totalAmt=0,workDays=0;
    Object.keys(records).forEach(function(date){
      var r=records[date];
      var day=parseInt(date.split('-')[2],10);
      byDay[day]=r;totalCnt+=r.count||0;totalAmt+=r.amount||0;workDays++;
    });
    el.innerHTML=
      '<div class="card" style="background:linear-gradient(150deg,var(--bg2),#0a2030);border-color:var(--acln)">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<div style="font-size:16px;font-weight:900;letter-spacing:-.5px">📅 '+year+'년 '+monthNames[month]+'</div>'+
      '<div style="font-size:12px;color:rgba(255,255,255,.7);font-weight:700">운행 '+workDays+'일</div>'+
      '</div>'+
      '<div class="cal-grid">'+
      ['일','월','화','수','목','금','토'].map(function(d){return '<div class="cal-hdr">'+d+'</div>';}).join('')+
      (function(){
        var cells='';
        for(var i=0;i<firstDay;i++) cells+='<div class="cal-day"></div>';
        for(var d=1;d<=daysInMonth;d++){
          var r=byDay[d];
          var cls='cal-day'+(d===today?' today':'')+(r?' has-route':'');
          var t=r?(' title="'+r.count+'건 · '+_won(r.amount)+'원"'):'';
          cells+='<div class="'+cls+'"'+t+(r?' onclick="_yToast(\''+d+'일 · '+r.count+'건 · '+_won(r.amount)+'원\')"':'')+'>'+d+'</div>';
        }
        return cells;
      })()+
      '</div>'+
      (workDays?
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">'+
        '<div style="background:var(--bg3);border-radius:var(--r);padding:12px;text-align:center">'+
        '<div style="font-size:20px;font-weight:900;color:var(--tx);font-variant-numeric:tabular-nums">'+_won(totalCnt)+'</div>'+
        '<div style="font-size:11px;color:var(--t2);font-weight:700;margin-top:3px">이번 달 건수</div></div>'+
        '<div style="background:var(--gnl);border:1px solid var(--gnln);border-radius:var(--r);padding:12px;text-align:center">'+
        '<div style="font-size:20px;font-weight:900;color:var(--gn);font-variant-numeric:tabular-nums">'+_won(totalAmt)+'</div>'+
        '<div style="font-size:11px;color:var(--t2);font-weight:700;margin-top:3px">이번 달 수입(원)</div></div>'+
      '</div>':'')+
      '<div style="display:flex;align-items:center;gap:14px;margin-top:12px;font-size:11.5px;color:var(--t2);font-weight:600">'+
      '<span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:50%;background:var(--ac);display:block"></i>오늘</span>'+
      '<span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:50%;background:var(--gn);display:block"></i>운행일 (탭하면 상세)</span>'+
      '</div>'+
      '</div>';
  };

  draw({}); // 즉시 뼈대부터 그린다
  _db.collection('yongcha_daily_records').where('driverId','==',_CU.uid)
    .where('date','>=',monthStart).where('date','<=',monthEnd).get()
    .then(function(snap){
      var recs={};
      snap.forEach(function(doc){
        var r=doc.data();
        if(!r.date)return;
        if(!recs[r.date])recs[r.date]={count:0,amount:0};
        recs[r.date].count+=r.count||0;
        recs[r.date].amount+=r.amount||0;
      });
      draw(recs);
    }).catch(function(){});
}

/* ══════════════════════════════════════════════════════════
   실수령액 계산기 (신규)
   경쟁 앱들은 '단가 × 건수' 총액만 보여주지만, 기사가 실제로 궁금한 건
   유류비·보험·차량할부·통신비를 뺀 손에 쥐는 돈이다.
   ══════════════════════════════════════════════════════════ */
var _CALC_KEY='yongcha_calc_v1';
function _yOpenCalc(prefill){
  var saved={};
  try{saved=JSON.parse(localStorage.getItem(_CALC_KEY)||'{}');}catch(e){}
  var v=function(k,dflt){return (prefill&&prefill[k]!=null?prefill[k]:(saved[k]!=null?saved[k]:dflt));};

  var body=document.getElementById('modal-body');
  body.innerHTML=

    '<div style="font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.6">단가와 물량만 넣으면 유류비·보험·할부까지 뺀<br>실제로 손에 쥐는 금액을 계산해요.</div>'+

    '<div class="form-section" style="margin-bottom:18px">'+
    '<div class="form-section-title">수입</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      '<div class="inp-wrap" style="margin-bottom:0"><label class="inp-lbl">건당 금액(원)</label>'+

      '<div class="inp-wrap" style="margin-bottom:0"><label class="inp-lbl">일 물량(건)</label>'+
      '<input class="inp" id="cal-vol" type="number" inputmode="numeric" value="'+_esc(v('vol',150))+'" oninput="_yCalcRun()"></div>'+
    '</div>'+
    '<div class="inp-wrap" style="margin-top:12px;margin-bottom:0"><label class="inp-lbl">월 근무일수</label>'+
    '<input class="inp" id="cal-days" type="number" inputmode="numeric" value="'+_esc(v('days',26))+'" oninput="_yCalcRun()"></div>'+
    '</div>'+

    '<div class="form-section" style="margin-bottom:18px">'+
    '<div class="form-section-title">월 고정 지출</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      '<div class="inp-wrap" style="margin-bottom:0"><label class="inp-lbl">유류비</label>'+
      '<input class="inp" id="cal-fuel" type="number" inputmode="numeric" value="'+_esc(v('fuel',700000))+'" oninput="_yCalcRun()"></div>'+
      '<div class="inp-wrap" style="margin-bottom:0"><label class="inp-lbl">차량 할부/리스</label>'+
      '<input class="inp" id="cal-lease" type="number" inputmode="numeric" value="'+_esc(v('lease',600000))+'" oninput="_yCalcRun()"></div>'+

function _yCalcRun(){
  var g=function(id){return parseInt((document.getElementById(id)||{}).value)||0;};
  var price=g('cal-price'), vol=g('cal-vol'), days=g('cal-days');
  var fuel=g('cal-fuel'), lease=g('cal-lease'), ins=g('cal-ins'), etc=g('cal-etc');
  var taxEl=document.getElementById('cal-tax');
  var useTax=taxEl&&taxEl.classList.contains('on');

  var gross=price*vol*days;
  var tax=useTax?Math.round(gross*0.033):0;
  var cost=fuel+lease+ins+etc;
  var net=gross-tax-cost;
  var perDay=days>0?Math.round(net/days):0;
  var perHour=days>0?Math.round(net/days/10):0; // 1일 10시간 가정

  try{
    localStorage.setItem(_CALC_KEY,JSON.stringify({price:price,vol:vol,days:days,
      fuel:fuel,lease:lease,ins:ins,etc:etc,tax:useTax}));
  }catch(e){}

  var out=document.getElementById('cal-out');
  if(!out)return;
  out.innerHTML=
    '<div class="calc-row"><span>월 총 매출</span><b>'+_won(gross)+'원</b></div>'+
    (useTax?'<div class="calc-row"><span>원천징수 3.3%</span><b style="color:var(--rd)">−'+_won(tax)+'원</b></div>':'')+
    '<div class="calc-row"><span>유류비</span><b style="color:var(--rd)">−'+_won(fuel)+'원</b></div>'+
    '<div class="calc-row"><span>차량 할부/리스</span><b style="color:var(--rd)">−'+_won(lease)+'원</b></div>'+
    '<div class="calc-row"><span>보험료</span><b style="color:var(--rd)">−'+_won(ins)+'원</b></div>'+
    '<div class="calc-row"><span>기타</span><b style="color:var(--rd)">−'+_won(etc)+'원</b></div>'+
    '<div class="calc-total"><span>월 실수령액</span><b>'+_won(net)+'원</b></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">'+
      '<div style="background:var(--bg3);border-radius:var(--r);padding:12px;text-align:center">'+
      '<div style="font-size:17px;font-weight:900;font-variant-numeric:tabular-nums">'+_won(perDay)+'원</div>'+
      '<div style="font-size:11px;color:var(--t2);font-weight:700;margin-top:3px">일 실수령</div></div>'+
      '<div style="background:var(--bg3);border-radius:var(--r);padding:12px;text-align:center">'+
      '<div style="font-size:17px;font-weight:900;font-variant-numeric:tabular-nums">'+_won(perHour)+'원</div>'+
      '<div style="font-size:11px;color:var(--t2);font-weight:700;margin-top:3px">시급 환산(10h)</div></div>'+
    '</div>'+
    (net<=0?'<div style="margin-top:12px;padding:12px;border-radius:var(--r);background:var(--rdl);border:1px solid var(--rdln);color:var(--rd);font-size:12.5px;font-weight:800">고정 지출이 매출을 넘습니다. 조건을 다시 확인하세요.</div>':'');
}

  }).catch(function(){});

function _yCleanTestAccounts(){
  _db.collection('yongcha_users').get().then(function(snap){
    var toDelete=[];
    snap.forEach(function(doc){var em=(doc.data().email||'');if(em.endsWith('@ytest.io')||em.endsWith('@yongcha.app'))toDelete.push(doc.id);});
    if(!toDelete.length){_yToast('삭제할 테스트 계정이 없어요');return;}
    var batch=_db.batch();
    toDelete.forEach(function(id){batch.delete(_db.collection('yongcha_users').doc(id));});
    batch.commit().then(function(){
      _yToast('테스트 계정 '+toDelete.length+'개 삭제 완료');
      _yCountTestAccounts();
    }).catch(function(e){_yToast('오류: '+e.message);});
  });
}

/* 예전 구현은 area 문자열에서만 'Playwright' 를 찾았다.
      실제 테스트 데이터는 area 가 '해운대구 좌동 일대' 같은 정상값이라 한 건도 못 잡았고,
      그래서 16건이 계속 목록에 남아 있었다.
      → 소유 계정(@ytest.io / 이름에 테스트·Playwright)으로 판별하고,
        routeNo 의 PW 마커와 제목 마커까지 함께 본다. */
function _yTestOwnerIds(){
  return _db.collection('yongcha_users').limit(500).get().then(function(snap){
    var ids={};
    snap.forEach(function(d){
      var u=d.data(),em=(u.email||'').toLowerCase(),nm=(u.name||'');
      if(em.indexOf('@ytest.io')!==-1||em.indexOf('@yongcha.app')!==-1||em.indexOf('playwright')!==-1||
         nm.indexOf('Playwright')!==-1||nm.indexOf('테스트')!==-1)ids[d.id]=1;
    });
    return ids;
  });
}
function _yIsTestDoc(v,ownerIds){
  if(ownerIds[v.agencyId]||ownerIds[v.driverId])return true;
  var hay=[v.area,v.routeNo,v.jobTitle,v.agencyName,v.desc].filter(Boolean).join(' ');
  return /playwright|테스트|-PW\d|PW\d{2}/i.test(hay);
}
function _yScanTestDocs(){
  return _yTestOwnerIds().then(function(ids){
    return Promise.all([
      _db.collection('yongcha_posts').limit(500).get(),
      _db.collection('yongcha_jobs').limit(500).get()
    ]).then(function(r){
      var posts=r[0].docs.filter(function(d){return _yIsTestDoc(d.data(),ids);}).map(function(d){return d.id;});
      var jobs =r[1].docs.filter(function(d){return _yIsTestDoc(d.data(),ids);}).map(function(d){return d.id;});
      return {posts:posts,jobs:jobs,accounts:Object.keys(ids).length};
    });
  });
}

function _yCountPlaywrightPosts(){
  var el=document.getElementById('cleanup-pw-info');
  if(el)el.textContent='검사 중…';
  _yScanTestDocs().then(function(r){
    if(el)el.textContent='테스트 공고 '+r.posts.length+'건 · 테스트 모집공고 '+r.jobs.length+'건 (계정 '+r.accounts+'개 기준)';
  }).catch(function(e){ if(el)el.textContent='검사 실패: '+e.message; });
}

function _yCleanPlaywrightPosts(){
  _yScanTestDocs().then(function(r){
    var total=r.posts.length+r.jobs.length;
    if(!total){_yToast('삭제할 테스트 데이터가 없어요');return;}
    if(!confirm('테스트 공고 '+r.posts.length+'건, 테스트 모집공고 '+r.jobs.length+'건을 삭제할까요?'))return;
    var batch=_db.batch();
    r.posts.slice(0,225).forEach(function(id){batch.delete(_db.collection('yongcha_posts').doc(id));});
    r.jobs.slice(0,225).forEach(function(id){batch.delete(_db.collection('yongcha_jobs').doc(id));});
    return batch.commit().then(function(){
      _yToast('테스트 데이터 '+Math.min(total,450)+'건 삭제 완료');
      _yCountPlaywrightPosts();
    });
  }).catch(function(e){_yToast('오류: '+e.message);});
}

/* 예전 구현은 (구역+대리점)만 비교해서, 같은 구역의 서로 다른 노선 공고까지
      중복으로 지워버렸다. 지금은 _yPostKey / _yJobKey 지문(노선번호·단가·시작일 포함)으로
      실제로 동일한 것만 대상으로 삼는다. */
function _yScanDup(coll,keyFn){
  return _db.collection(coll).get().then(function(snap){
    var docs=snap.docs.map(function(d){return Object.assign({id:d.id,_ts:(d.data().createdAt&&d.data().createdAt.seconds)||0},d.data());})
      .sort(function(a,b){return b._ts-a._ts;});   // 최신 우선 → 오래된 중복을 지운다
    var seen={},toDelete=[];
    docs.forEach(function(d){
      var k=keyFn(d);
      if(seen[k])toDelete.push(d.id); else seen[k]=true;
    });
    return toDelete;
  });
}

function _yCountDupPosts(){
  var el=document.getElementById('cleanup-dup-info');
  if(el)el.textContent='중복 검사 중…';
  Promise.all([_yScanDup('yongcha_posts',_yPostKey),_yScanDup('yongcha_jobs',_yJobKey)])
  .then(function(r){
    if(el)el.textContent='중복 공고 '+r[0].length+'건 · 중복 모집공고 '+r[1].length+'건 (삭제 대상)';
  }).catch(function(e){ if(el)el.textContent='검사 실패: '+e.message; });
}

function _yCleanDupPosts(){
  Promise.all([_yScanDup('yongcha_posts',_yPostKey),_yScanDup('yongcha_jobs',_yJobKey)])
  .then(function(r){
    var posts=r[0],jobs=r[1];
    if(!posts.length&&!jobs.length){_yToast('중복 항목이 없어요');return;}
    if(!confirm('중복 공고 '+posts.length+'건, 중복 모집공고 '+jobs.length+'건을 삭제할까요?\n각 그룹의 최신 1건은 남습니다.'))return;
    var batch=_db.batch(),n=0;
    posts.slice(0,225).forEach(function(id){batch.delete(_db.collection('yongcha_posts').doc(id));n++;});
    jobs.slice(0,225).forEach(function(id){batch.delete(_db.collection('yongcha_jobs').doc(id));n++;});
    return batch.commit().then(function(){
      _yToast('중복 '+n+'건 삭제 완료');
      _yCountDupPosts();
    });
  }).catch(function(e){_yToast('오류: '+e.message);});
}

function _sendScout(driverId, driverName){
  var msg=(document.getElementById('scout-msg')||{}).value||'';
  if(!msg.trim()){_yToast('메시지를 입력해주세요');return;}
  _db.collection('yongcha_scouts').add({
    agencyId:_CU.uid,agencyName:_CU.name,
    driverId:driverId,driverName:driverName,
    message:msg,status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast('스카웃 제안을 보냈어요!');
    _yNotify(driverId,'스카웃 제안 💌',_CU.name+'에서 스카웃 제안이 왔어요! 확인해보세요','scout');
    _closeModal();
  }).catch(function(e){_yToast('오류: '+e.message);});
}

  _db.collection('yongcha_scouts').doc(scoutId).update({
    status:accept?'accepted':'rejected',
    repliedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    _yToast(accept?'스카웃 제안을 수락했어요!':'스카웃 제안을 거절했어요');
