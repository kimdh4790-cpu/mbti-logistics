<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FILO — 담기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Malgun Gothic',sans-serif;background:#0a0e1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#141826;border:1px solid rgba(201,168,76,.2);border-radius:24px;padding:28px 20px;max-width:360px;width:100%;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px}
.brand-filo{font-size:11px;font-weight:800;color:#00CFFF;letter-spacing:2px}
.brand-dine{font-size:11px;font-weight:800;color:#00E890;letter-spacing:2px}
.brand-dot{color:rgba(201,168,76,.7);font-size:9px}
.icon{font-size:56px;margin-bottom:12px}
.name{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.price{font-size:18px;font-weight:700;color:#C9A84C;margin-bottom:20px}
.qty-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:20px}
.qty-btn{width:40px;height:40px;border-radius:50%;border:2px solid rgba(201,168,76,.4);background:rgba(201,168,76,.08);color:#C9A84C;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-btn:active{background:rgba(201,168,76,.2)}
.qty-num{font-size:26px;font-weight:900;color:#fff;min-width:36px}
.cart-preview{background:rgba(0,207,255,.06);border:1px solid rgba(0,207,255,.15);border-radius:12px;padding:12px 14px;margin-bottom:16px;text-align:left}
.cart-preview-title{font-size:11px;color:#38bdf8;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.cart-item{font-size:13px;color:#e2e8f0;padding:4px 0;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.cart-item:last-child{border-bottom:none}
.cart-total{font-size:14px;font-weight:800;color:#C9A84C;margin-top:8px;text-align:right}
.msg{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:18px;line-height:1.6}
.btn-add{width:100%;padding:15px;background:#C9A84C;color:#0a0e1a;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;margin-bottom:12px;transition:.15s;letter-spacing:.5px}
.btn-add:active{transform:scale(.97);background:#b8943c}
.btn-add:disabled{background:rgba(201,168,76,.4);color:rgba(10,14,26,.5)}
.action-row{display:none;gap:8px;margin-bottom:10px}
.action-row.show{display:flex}
.btn-takeout{flex:1;padding:14px 8px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;line-height:1.3}
.btn-takeout:active{background:#6d28d9}
.btn-dine{flex:1;padding:14px 8px;background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;line-height:1.3}
.btn-dine:active{background:rgba(34,197,94,.25)}
.btn-more{width:100%;padding:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.btn-more:active{background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">
    <span class="brand-filo">FILO</span>
    <span class="brand-dot">✦</span>
    <span class="brand-dine">DINE</span>
  </div>

  <div class="icon" id="menu-icon">🥐</div>
  <div class="name" id="menu-name">로딩 중...</div>
  <div class="price" id="menu-price"></div>

  <div class="qty-row">
    <button class="qty-btn" onclick="changeQty(-1)">−</button>
    <span class="qty-num" id="qty-num">1</span>
    <button class="qty-btn" onclick="changeQty(1)">+</button>
  </div>

  <div class="cart-preview" id="cart-preview" style="display:none">
    <div class="cart-preview-title">담은 항목</div>
    <div id="cart-items"></div>
    <div class="cart-total" id="cart-total"></div>
  </div>

  <div class="msg" id="msg">수량을 선택하고 담기를 눌러주세요</div>
  <button class="btn-add" id="btn-add" onclick="addToCart()">담기</button>

  <!-- 담기 완료 후 표시되는 주문 방식 선택 -->
  <div class="action-row" id="action-row">
    <button class="btn-takeout" onclick="goTakeout()">포장 주문<br><span style="font-size:11px;font-weight:500;opacity:.8">결제 후 픽업 알림</span></button>
    <button class="btn-dine" onclick="goDineIn()">테이블 주문<br><span style="font-size:11px;font-weight:500;opacity:.8">자리에서 주문</span></button>
  </div>

  <button class="btn-more" id="btn-more" onclick="goBack()" style="display:none">← 다른 메뉴 더 담기</button>
</div>

<script>
var _did = '', _menuId = '', _menuName = '', _menuPrice = 0, _menuEmoji = '🥐', _qty = 1;
var STORAGE_KEY = '';

function getParam(k){
  return new URLSearchParams(location.search).get(k) || '';
}

function fmt(n){ return Number(n).toLocaleString(); }

function changeQty(d){
  _qty = Math.max(1, _qty + d);
  document.getElementById('qty-num').textContent = _qty;
}

function loadCart(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e){ return []; }
}

function saveCart(cart){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
}

function renderCartPreview(){
  var cart = loadCart();
  var preview = document.getElementById('cart-preview');
  var itemsEl = document.getElementById('cart-items');
  var totalEl = document.getElementById('cart-total');
  if(!cart.length){ preview.style.display='none'; return; }
  preview.style.display = 'block';
  itemsEl.innerHTML = cart.map(function(i){
    return '<div class="cart-item"><span>'+i.emoji+' '+i.name+'</span><span>'+i.qty+'개 · ₩'+fmt(i.price*i.qty)+'</span></div>';
  }).join('');
  var total = cart.reduce(function(s,i){ return s+i.price*i.qty; }, 0);
  if(totalEl) totalEl.textContent = '합계 ₩'+fmt(total);
}

function addToCart(){
  var cart = loadCart();
  var existing = cart.find(function(i){ return i.name === _menuName; });
  if(existing){
    existing.qty += _qty;
  } else {
    cart.push({ name:_menuName, price:_menuPrice, qty:_qty, emoji:_menuEmoji, menuId:_menuId });
  }
  saveCart(cart);

  var btn = document.getElementById('btn-add');
  btn.textContent = '담겼어요!';
  btn.disabled = true;

  document.getElementById('msg').innerHTML =
    '<span style="color:#22c55e;font-weight:700">'+_menuEmoji+' '+_menuName+' '+_qty+'개</span> 담겼어요!';

  renderCartPreview();

  // 담기 완료 → 주문 방식 선택 버튼 표시
  setTimeout(function(){
    btn.style.display = 'none';
    document.getElementById('action-row').classList.add('show');
    document.getElementById('btn-more').style.display = 'block';
    document.getElementById('msg').innerHTML = '주문 방식을 선택해주세요';
  }, 800);
}

function goTakeout(){
  // 포장: order.html takeout 모드
  location.href = 'https://filo.ai.kr/order?d='+_did+'&takeout=1';
}

function goDineIn(){
  // 테이블: 안내만 표시 (테이블 QR 스캔하도록)
  document.getElementById('action-row').classList.remove('show');
  document.getElementById('btn-more').style.display = 'none';
  document.getElementById('msg').innerHTML =
    '<span style="color:#22c55e;font-weight:700">테이블 QR을 스캔해주세요</span><br>담은 항목이 자동으로 장바구니에 추가돼요';
  document.getElementById('btn-add').style.display = 'none';

  var backBtn = document.createElement('button');
  backBtn.className = 'btn-more';
  backBtn.style.marginTop = '12px';
  backBtn.textContent = '← 다른 메뉴 더 담기';
  backBtn.onclick = goBack;
  document.getElementById('card').appendChild(backBtn);
}

function goBack(){
  history.back();
}

window.onload = function(){
  _did       = getParam('d');
  _menuId    = getParam('m');
  _menuName  = decodeURIComponent(getParam('n') || '빵');
  _menuPrice = parseInt(getParam('p') || '0', 10);
  _menuEmoji = decodeURIComponent(getParam('e') || '🥐');
  STORAGE_KEY = 'filo_bakery_cart_' + _did;

  document.getElementById('menu-name').textContent = _menuName;
  document.getElementById('menu-price').textContent = _menuPrice ? '₩' + fmt(_menuPrice) : '';
  document.getElementById('menu-icon').textContent = _menuEmoji;
  document.title = 'FILO — ' + _menuName;

  renderCartPreview();

  // 이미 담긴 항목이 있으면 바로 선택 버튼 표시
  var cart = loadCart();
  if(cart.length){
    document.getElementById('action-row').classList.add('show');
    document.getElementById('btn-more').style.display = 'block';
    document.getElementById('msg').innerHTML = '추가로 담거나 주문 방식을 선택해주세요';
    var btn = document.getElementById('btn-add');
    btn.textContent = '추가 담기';
  }
};
</script>
</body>
</html>
