<style>
  :root {
    --pink:  #F472B6;
    --gold:  #FBBF24;
    --green: #86EFAC;
    --dark:  #0D1117;
    --card:  #161B22;
    --border:#30363D;
    --text:  #F0F6FC;
    --muted: #8B949E;
    --white: #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: var(--dark);
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .slide.active { opacity: 1; }

  /* ── Slide 1: Hook ── */
  #s1 { background: var(--dark); }
  #s1 .sparkle { font-size: 72px; margin-bottom: 32px; }
  #s1 .brand { font-size: 80px; font-weight: 900; letter-spacing: -2px;
    background: linear-gradient(135deg, var(--pink) 0%, #A78BFA 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #s1 .tagline { font-size: 40px; font-weight: 600; color: var(--muted);
    margin-top: 20px; text-align: center; line-height: 1.4; max-width: 800px; }
  #s1 .hook { font-size: 52px; font-weight: 900; color: var(--white);
    margin-top: 48px; text-align: center; line-height: 1.3; max-width: 860px; }
  #s1 .hook em { color: var(--pink); font-style: normal; }
  #s1 .sub { font-size: 34px; color: var(--muted); margin-top: 24px; text-align: center; }

  /* ── Slide 2: UI Demo ── */
  #s2 { background: #0D1117; padding: 60px; }
  .ui-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 52px;
    width: 900px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .ui-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px;
  }
  .ui-brand { font-size: 36px; font-weight: 800; }
  .ui-brand .star { color: var(--pink); }
  .ui-pro { font-size: 22px; color: var(--muted); background: rgba(244,114,182,0.12);
    border: 1px solid rgba(244,114,182,0.3); border-radius: 20px; padding: 6px 18px; }
  .ui-badge { font-size: 22px; color: var(--pink);
    background: rgba(244,114,182,0.1); border-radius: 8px; padding: 8px 18px;
    margin-bottom: 28px; display: inline-flex; align-items: center; gap: 8px; }
  .ui-tone-row { display: flex; gap: 20px; margin-bottom: 28px; }
  .ui-select {
    flex: 1; background: #21262D; border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 24px; font-size: 26px; color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  .ui-btn-main {
    width: 100%; padding: 28px; border-radius: 14px;
    background: linear-gradient(135deg, var(--pink) 0%, #C026D3 100%);
    font-size: 32px; font-weight: 800; color: white;
    text-align: center; margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(244,114,182,0.4);
  }
  .ui-btn-row { display: flex; gap: 16px; margin-bottom: 20px; }
  .ui-btn-sec {
    flex: 1; padding: 22px; border-radius: 12px;
    border: 1.5px solid var(--border); font-size: 24px; color: var(--text);
    text-align: center; background: transparent;
  }
  .ui-btn-sec.active { border-color: var(--green); color: var(--green); }
  .ui-todo { background: rgba(251,191,36,0.1); border-left: 3px solid var(--gold);
    border-radius: 8px; padding: 16px 20px; font-size: 22px; color: var(--gold);
    display: flex; align-items: center; gap: 10px; }

  /* ── Slide 3: Languages ── */
  #s3 { background: var(--dark); gap: 0; padding: 80px 60px; }
  #s3 .section-title { font-size: 48px; font-weight: 900; text-align: center; margin-bottom: 20px; }
  #s3 .section-title span { color: var(--pink); }
  #s3 .subtitle { font-size: 30px; color: var(--muted); text-align: center; margin-bottom: 64px; }
  .lang-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; width: 960px; }
  .lang-pill {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 28px 16px;
    text-align: center; transition: border-color 0.3s;
  }
  .lang-pill .flag { font-size: 48px; margin-bottom: 12px; }
  .lang-pill .code { font-size: 28px; font-weight: 700; color: var(--white); }
  .lang-pill .name { font-size: 20px; color: var(--muted); margin-top: 4px; }
  .lang-pill.hi { border-color: var(--pink); background: rgba(244,114,182,0.08); }

  /* ── Slide 4: 3 Answers Compare ── */
  #s4 { background: var(--dark); padding: 80px 60px; }
  #s4 .section-title { font-size: 52px; font-weight: 900; margin-bottom: 12px; text-align: center; }
  #s4 .section-title span { color: var(--pink); }
  #s4 .section-sub { font-size: 30px; color: var(--muted); margin-bottom: 56px; text-align: center; }
  .answer-cards { display: flex; flex-direction: column; gap: 24px; width: 900px; }
  .answer-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 28px 32px;
  }
  .answer-card.best { border-color: var(--pink); background: rgba(244,114,182,0.06); }
  .answer-card .ac-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .ac-num { font-size: 22px; font-weight: 700; color: var(--muted); width: 36px; height: 36px;
    border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; }
  .ac-tone { font-size: 22px; color: var(--muted); }
  .ac-best { font-size: 20px; color: var(--pink); background: rgba(244,114,182,0.15);
    border-radius: 20px; padding: 4px 14px; margin-left: auto; }
  .ac-body { font-size: 22px; color: #8B949E; line-height: 1.6; }
  .ac-body strong { color: var(--text); }

  /* ── Slide 5: Smart Features ── */
  #s5 { background: var(--dark); padding: 80px 60px; }
  #s5 .section-title { font-size: 52px; font-weight: 900; margin-bottom: 64px; text-align: center; }
  #s5 .section-title span { color: var(--pink); }
  .feature-list { display: flex; flex-direction: column; gap: 28px; width: 880px; }
  .feature-item {
    display: flex; align-items: flex-start; gap: 28px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px;
  }
  .feature-icon { font-size: 44px; flex-shrink: 0; }
  .feature-text .ft-title { font-size: 30px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
  .feature-text .ft-desc { font-size: 24px; color: var(--muted); line-height: 1.5; }

  /* ── Slide 6: CTA ── */
  #s6 {
    background: radial-gradient(ellipse at 50% 40%, rgba(244,114,182,0.25) 0%, var(--dark) 70%);
  }
  #s6 .cta-brand { font-size: 96px; font-weight: 900;
    background: linear-gradient(135deg, var(--pink) 0%, #A78BFA 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 24px; }
  #s6 .cta-headline { font-size: 52px; font-weight: 800; color: var(--white);
    text-align: center; line-height: 1.3; max-width: 800px; margin-bottom: 20px; }
  #s6 .cta-sub { font-size: 32px; color: var(--muted); text-align: center; margin-bottom: 60px; }
  #s6 .cta-btn {
    background: linear-gradient(135deg, var(--pink) 0%, #C026D3 100%);
    color: white; font-size: 36px; font-weight: 800;
    padding: 28px 80px; border-radius: 60px;
    box-shadow: 0 12px 40px rgba(244,114,182,0.45);
    margin-bottom: 40px;

  #s6 .cta-pro { font-size: 28px; color: var(--muted); display: flex; gap: 40px; }

  /* ── Animated dots ── */
  .dots {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; z-index: 100;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--border); transition: background 0.3s, transform 0.3s;
  }
  .dot.on { background: var(--pink); transform: scale(1.3); }
</style>
</head>

const LANG_ORDER = ['EN','KR','JP','ZH','ES','DE','PT','AR','IT','FR','VN','NL','PL','TR'];
// AR pill data (no TTS, but shown in grid)
const AR_PILL = {flag:'🇸🇦', code:'AR', name:'العربية'};

/* ── Init ─────────────────────────────────────── */
(function() {
  const params = new URLSearchParams(location.search);
  const langCode = (params.get('lang') || 'EN').toUpperCase();
  const variant = (params.get('variant') || 'A').toUpperCase();
  const isB = variant === 'B';

  const t = LANGS[langCode] || LANGS['EN'];

  document.documentElement.lang = langCode.toLowerCase();

  function set(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  // Slide 1
  set('t-tagline', isB ? t.taglineB : t.taglineA);
  set('t-hook', isB ? t.hookB : t.hookA);
  set('t-sub', isB ? t.subB : t.subA);

  // Slide 2
  set('t-s2-header', t.s2Header);
  set('t-s2-pro', t.s2Pro);
  set('t-s2-badge', t.s2Badge);
  set('t-s2-tone', t.s2Tone);
  set('t-s2-lang-sel', t.s2LangSel);
  set('t-s2-btn-main', t.s2BtnMain);
  set('t-s2-compare', t.s2Compare);
  set('t-s2-smart', t.s2Smart);
  set('t-s2-summary', t.s2Summary);
  set('t-s2-todo', t.s2Todo);

  // Slide 3 – language grid
  set('t-s3-title', t.s3Title);
  set('t-s3-sub', t.s3Sub);
  const grid = document.getElementById('lang-grid');
  if (grid) {
    grid.innerHTML = LANG_ORDER.map(code => {
      const info = code === 'AR' ? AR_PILL : LANGS[code];
      const hiClass = (code === langCode) ? ' hi' : '';
      return `<div class="lang-pill${hiClass}"><div class="flag">${info.flag}</div><div class="code">${info.code}</div><div class="name">${info.name}</div></div>`;
    }).join('');
  }

  // Slide 4
  set('t-s4-title', t.s4Title);
  set('t-s4-sub', t.s4Sub);
  set('t-s4-tone1', t.s4Tone1);
  set('t-s4-body1', t.s4Body1);
  set('t-s4-tone2', t.s4Tone2);
  set('t-s4-body2', t.s4Body2);
  set('t-s4-tone3', t.s4Tone3);
  set('t-s4-body3', t.s4Body3);
  set('t-s4-rec', t.s4Rec);

  // Slide 5
  set('t-s5-title', t.s5Title);
  set('t-f1-title', t.f1T); set('t-f1-desc', t.f1D);
  set('t-f2-title', t.f2T); set('t-f2-desc', t.f2D);
  set('t-f3-title', t.f3T); set('t-f3-desc', t.f3D);
  set('t-f4-title', t.f4T); set('t-f4-desc', t.f4D);

  // Slide 6
  set('t-cta-headline', isB ? t.ctaHeadlineB : t.ctaHeadlineA);
  set('t-cta-sub', t.ctaSub);
  set('t-cta-btn', isB ? t.ctaBtnB : t.ctaBtnA);
  set('t-cta-pro', t.ctaPro);
})();

/* ── Slideshow ─────────────────────────────────────── */
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
let cur = 0;
const SLIDE_DURATION = 10000;

function goTo(n) {
  slides[cur].classList.remove('active');
  dots[cur].classList.remove('on');
  cur = (n + slides.length) % slides.length;
  slides[cur].classList.add('active');
  dots[cur].classList.add('on');
}

let timer = setInterval(() => goTo(cur + 1), SLIDE_DURATION);

dots.forEach((d, i) => d.addEventListener('click', () => {
  clearInterval(timer);
  goTo(i);
  timer = setInterval(() => goTo(cur + 1), SLIDE_DURATION);
}));
</script>
